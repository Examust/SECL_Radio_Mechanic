no sound reaches a known-good speaker, the most likely faulty section is:\",\"sh\":\"डिटेक्टर आउटपुट पर ऑडियो है, पर ज्ञात-सही स्पीकर से ध्वनि नहीं आती। संभावित दोष क्षेत्र है:\",\"oe\":[\"RF antenna only\",\"AF amplifier/output path\",\"Local oscillator necessarily\",\"Mixer necessarily\"],\"oh\":[\"\",\"AF प्रवर्धक या आउटपुट पथ\",\"\",\"\"],\"a\":1,\"ee\":\"Presence of recovered audio proves the RF, conversion, IF and detector chain has worked to that point; diagnose AF gain, coupling, output device, wiring and speaker matching.\",\"eh\":\"डिटेक्टर तक ऑडियो होने से दोष उसके बाद के AF/आउटपुट पथ में है।\"},{\"n\":83,\"d\":\"E\",\"se\":\"The basic function of a transmitting antenna is to:\",\"sh\":\"प्रेषण एंटीना का मूल कार्य है:\",\"oe\":[\"Store DC permanently\",\"Detect audio at IF\",\"Rectify mains voltage\",\"Convert guided RF energy into electromagnetic waves\"],\"oh\":[\"\",\"\",\"\",\"निर्देशित RF ऊर्जा को विद्युतचुंबकीय तरंगों में बदलना\"],\"a\":3,\"ee\":\"A receiving antenna performs the reciprocal conversion—from incident electromagnetic waves to terminal RF voltage/current.\",\"eh\":\"ग्रहण एंटीना विपरीत रूपांतरण कर आने वाली तरंग को RF वोल्टेज/धारा में बदलता है।\"},{\"n\":84,\"d\":\"E\",\"se\":\"The approximate total electrical length of a half-wave dipole is:\",\"sh\":\"अर्ध-तरंग द्विध्रुव की लगभग कुल विद्युत लंबाई है:\",\"oe\":[\"(\\\\lambda/8)\",\"(\\\\lambda/2)\",\"(\\\\lambda)\",\"(2\\\\lambda)\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"A centre-fed half-wave dipole has two arms, each approximately (\\\\lambda/4); practical physical length is slightly shorter because of end effects.\",\"eh\":\"इसके दो भुजाएँ लगभग (\\\\lambda/4) होती हैं और वास्तविक लंबाई थोड़ी कम रखी जाती है।\"},{\"n\":85,\"d\":\"E\",\"se\":\"Antenna polarisation is normally defined by the orientation of the radiated:\",\"sh\":\"एंटीना ध्रुवण सामान्यतः विकिरित किस क्षेत्र की दिशा से परिभाषित होता है?\",\"oe\":[\"Gravitational field\",\"Electric field\",\"DC resistance\",\"Audio current\"],\"oh\":[\"\",\"विद्युत क्षेत्र\",\"\",\"\"],\"a\":1,\"ee\":\"A vertical electric field means vertical polarisation. Transmit and receive polarisations should normally match to avoid polarisation loss.\",\"eh\":\"विद्युत क्षेत्र ऊर्ध्व हो तो ध्रुवण ऊर्ध्व है; प्रेषण और ग्रहण ध्रुवण मिलना चाहिए।\"},{\"n\":86,\"d\":\"E\",\"se\":\"An ideal omnidirectional vertical antenna has, in the horizontal plane, a pattern that is approximately:\",\"sh\":\"आदर्श सर्वदिश ऊर्ध्व एंटीना का क्षैतिज तल में प्रतिरूप लगभग है:\",\"oe\":[\"One narrow beam only\",\"Two isolated points\",\"Circular\",\"Zero in all directions\"],\"oh\":[\"\",\"\",\"वृत्ताकार\",\"\"],\"a\":2,\"ee\":\"Omnidirectional means approximately equal radiation around the azimuth, not equal radiation in every three-dimensional direction.\",\"eh\":\"सर्वदिश का अर्थ अज़ीमुथ में लगभग समान विकिरण है, सभी 3D दिशाओं में नहीं।\"},{\"n\":87,\"d\":\"E\",\"se\":\"A coaxial cable consists principally of:\",\"sh\":\"समाक्ष केबल मुख्यतः बनी होती है:\",\"oe\":[\"Two bare parallel wires only\",\"A single wire without insulation\",\"A centre conductor, dielectric and concentric outer shield\",\"An optical fibre only\"],\"oh\":[\"\",\"\",\"केंद्रीय चालक, डाइइलेक्ट्रिक और समकेंद्रीय बाहरी शील्ड\",\"\"],\"a\":2,\"ee\":\"The outer conductor provides the return path and shielding, helping confine fields and reduce pickup/radiation when correctly terminated.\",\"eh\":\"बाहरी चालक वापसी पथ और शील्डिंग देता है।\"},{\"n\":88,\"d\":\"M\",\"se\":\"Each arm of a centre-fed half-wave dipole is approximately:\",\"sh\":\"केंद्र-फेड अर्ध-तरंग द्विध्रुव की प्रत्येक भुजा लगभग है:\",\"oe\":[\"(\\\\lambda)\",\"(\\\\lambda/2)\",\"(\\\\lambda/8)\",\"(\\\\lambda/4)\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Two quarter-wave arms form the approximately half-wave total length.\",\"eh\":\"दो लगभग चौथाई-तरंग भुजाएँ मिलकर अर्ध-तरंग द्विध्रुव बनाती हैं।\"},{\"n\":89,\"d\":\"M\",\"se\":\"Ignoring end effects, the total half-wave dipole length for 100 MHz is:\",\"sh\":\"अंत प्रभाव उपेक्षित करने पर 100 MHz के लिए अर्ध-तरंग द्विध्रुव की कुल लंबाई है:\",\"oe\":[\"1.5 m\",\"3 m\",\"0.75 m\",\"15 m\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"(\\\\lambda=300/f<sub>MHz</sub>=3\\\\) m, so (\\\\lambda/2=1.5\\\\) m. A practical resonant dipole is shortened slightly and trimmed.\",\"eh\":\"तरंगदैर्घ्य 3 m, अतः आधा 1.5 m है।\"},{\"n\":90,\"d\":\"M\",\"se\":\"In a Yagi-Uda antenna, the element connected to the feedline is the:\",\"sh\":\"यागी-उदा एंटीना में फीडलाइन से जुड़ा तत्व है:\",\"oe\":[\"Reflector\",\"First director\",\"Driven element\",\"Mast only\"],\"oh\":[\"\",\"\",\"चालित तत्व\",\"\"],\"a\":2,\"ee\":\"The driven element is energised directly; reflector and directors are parasitic elements excited by coupling.\",\"eh\":\"चालित तत्व सीधे फीड होता है, परावर्तक और निर्देशक परजीवी तत्व हैं।\"},{\"n\":91,\"d\":\"M\",\"se\":\"Relative to the driven element of a typical Yagi, the reflector is usually:\",\"sh\":\"सामान्य यागी में चालित तत्व की तुलना में परावर्तक प्रायः:\",\"oe\":[\"Shorter and in front\",\"Exactly zero length\",\"Slightly longer and behind\",\"Connected as the feedline centre conductor\"],\"oh\":[\"\",\"\",\"थोड़ा लंबा और पीछे\",\"\"],\"a\":2,\"ee\":\"The reflector is commonly a little longer and placed behind the driven element, helping reinforce forward radiation and reduce back radiation.\",\"eh\":\"परावर्तक थोड़ा लंबा होकर चालित तत्व के पीछे रहता है।\"},{\"n\":92,\"d\":\"M\",\"se\":\"Directors in a typical Yagi are usually:\",\"sh\":\"सामान्य यागी के निर्देशक प्रायः होते हैं:\",\"oe\":[\"Longer than the reflector and behind it\",\"Connected to DC earth only\",\"Unrelated to beam direction\",\"Slightly shorter and placed toward the forward beam\"],\"oh\":[\"\",\"\",\"\",\"थोड़े छोटे और अग्र बीम दिशा में\"],\"a\":3,\"ee\":\"One or more shorter directors are placed in front of the driven element to increase forward directivity/gain.\",\"eh\":\"छोटे निर्देशक चालित तत्व के आगे रखकर अग्र दिशिकता बढ़ाते हैं।\"},{\"n\":93,\"d\":\"M\",\"se\":\"Antenna gain does not create extra transmitter power; it represents:\",\"sh\":\"एंटीना लाभ अतिरिक्त प्रेषित्र शक्ति नहीं बनाता; यह दर्शाता है:\",\"oe\":[\"Battery capacity\",\"Audio voltage gain\",\"Concentration of radiation relative to a reference antenna\",\"Feedline DC resistance only\"],\"oh\":[\"\",\"\",\"संदर्भ एंटीना की तुलना में विकिरण का दिशात्मक संकेंद्रण\",\"\"],\"a\":2,\"ee\":\"Gain combines directivity and efficiency. More field in preferred directions is obtained at the expense of other directions and losses.\",\"eh\":\"लाभ दिशिकता और दक्षता का परिणाम है; ऊर्जा चुनी दिशाओं में केंद्रित होती है।\"},{\"n\":94,\"d\":\"M\",\"se\":\"The characteristic impedance (Z<sub>0</sub>) of a uniform line is the:\",\"sh\":\"समान संचरण लाइन की अभिलाक्षणिक प्रतिबाधा (Z<sub>0</sub>) है:\",\"oe\":[\"Voltage-to-current ratio of a single travelling wave\",\"DC resistance of the load only\",\"Antenna gain in ohms\",\"Audio transformer ratio\"],\"oh\":[\"एकल गतिशील तरंग का वोल्टेज-धारा अनुपात\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"(Z<sub>0</sub>) is set by line geometry and materials; for an infinitely long or matched line, its input appears as (Z<sub>0</sub>). It is not simply conductor DC resistance.\",\"eh\":\"(Z<sub>0</sub>) रचना और पदार्थ से तय होता है, केवल DC प्रतिरोध नहीं।\"},{\"n\":95,\"d\":\"M\",\"se\":\"When a transmission line is terminated in (Z<sub>L</sub>=Z<sub>0</sub>):\",\"sh\":\"जब संचरण लाइन का समापन (Z<sub>L</sub>=Z<sub>0</sub>) में हो:\",\"oe\":[\"Reflection is maximum\",\"Ideally no wave is reflected from the load\",\"VSWR becomes infinite\",\"All forward power is returned\"],\"oh\":[\"\",\"आदर्शतः भार से कोई तरंग परावर्तित नहीं होती\",\"\",\"\"],\"a\":1,\"ee\":\"Matching makes reflection coefficient zero and VSWR 1:1. A balun may additionally be needed when connecting balanced and unbalanced structures.\",\"eh\":\"मिलान पर परावर्तन गुणांक शून्य और VSWR 1:1 होता है; संतुलित-असंतुलित जोड़ पर balun चाहिए हो सकता है।\"},{\"n\":96,\"d\":\"H\",\"se\":\"A 50 Ω line is terminated by a purely resistive 100 Ω load. The voltage reflection coefficient is:\",\"sh\":\"50 Ω लाइन का समापन शुद्ध 100 Ω भार में है। वोल्टेज परावर्तन गुणांक है:\",\"oe\":[\"0\",\"(+1/3)\",\"(-1/3)\",\"(+2)\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"(Γ=(Z<sub>L</sub>-Z<sub>0</sub>)/(Z<sub>L</sub>+Z<sub>0</sub>)=(100-50)/(100+50)=1/3). Positive sign means no 180° voltage reversal at the load.\",\"eh\":\"सूत्र से (Γ=+1/3) मिलता है।\"},{\"n\":97,\"d\":\"H\",\"se\":\"If (|Γ|=1/3), the VSWR is:\",\"sh\":\"यदि (|Γ|=1/3), तो VSWR है:\",\"oe\":[\"1:1\",\"1.33:1\",\"3:1\",\"2:1\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"(VSWR=(1+|Γ|)/(1-|Γ|)=(4/3)/(2/3)=2).\",\"eh\":\"परावर्तन गुणांक से VSWR 2:1 मिलता है।\"},{\"n\":98,\"d\":\"H\",\"se\":\"An ideal VSWR of 1:1 indicates:\",\"sh\":\"आदर्श VSWR 1:1 दर्शाता है:\",\"oe\":[\"Total reflection\",\"An open circuit only\",\"A short circuit only\",\"Perfect impedance matching\"],\"oh\":[\"\",\"\",\"\",\"पूर्ण प्रतिबाधा मिलान\"],\"a\":3,\"ee\":\"With (|Γ|=0), voltage maxima and minima are equal and all incident power is accepted by the load (ignoring line loss).\",\"eh\":\"(|Γ|=0) पर स्थायी तरंग नहीं और आदर्श मिलान होता है।\"},{\"n\":99,\"d\":\"H\",\"se\":\"Which statement about return loss is correct?\",\"sh\":\"रिटर्न लॉस के बारे में सही कथन है:\",\"oe\":[\"0 dB always means perfect match\",\"A larger positive return-loss value means a better match\",\"It equals transmitter DC power\",\"It is independent of reflection coefficient\"],\"oh\":[\"\",\"बड़ा धनात्मक रिटर्न-लॉस मान बेहतर मिलान दर्शाता है\",\"\",\"\"],\"a\":1,\"ee\":\"(RL=-20\\\\log<sub>10</sub>|Γ|). Smaller reflection gives a larger return-loss number; an ideal zero reflection tends toward infinite return loss.\",\"eh\":\"कम परावर्तन पर रिटर्न लॉस का धनात्मक मान बड़ा होता है।\"},{\"n\":100,\"d\":\"H\",\"se\":\"A 50 Ω line is connected to a purely resistive 75 Ω load. The resulting (|Γ|) and VSWR are:\",\"sh\":\"50 Ω लाइन को शुद्ध 75 Ω भार से जोड़ने पर (|Γ|) और VSWR हैं:\",\"oe\":[\"0 and 1:1\",\"0.5 and 3:1\",\"0.333 and 2:1\",\"0.2 and 1.5:1\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"(|Γ|=(75-50)/(75+50)=25/125=0.2); (VSWR=1.2/0.8=1.5).\",\"eh\":\"परावर्तन गुणांक 0.2 और VSWR 1.5:1 है।\"}]},{\"id\":\"s04\",\"num\":4,\"name\":\"Batteries, Switchboards, Telecom Lines, Soldering, PCB and Fault Finding\",\"q\":[{\"n\":1,\"d\":\"E\",\"se\":\"A cell intended for one-time use is:\",\"sh\":\"एक बार उपयोग हेतु बना सेल है:\",\"oe\":[\"Primary cell\",\"Secondary cell\",\"Storage battery\",\"Accumulator\"],\"oh\":[\"प्राथमिक सेल\",\"द्वितीयक सेल\",\"संचायक बैटरी\",\"एक्यूम्युलेटर\"],\"a\":0,\"ee\":\"Primary cells are not designed for normal recharging.\",\"eh\":\"प्राथमिक सेल सामान्य पुनःचार्ज हेतु नहीं होते।\"},{\"n\":2,\"d\":\"E\",\"se\":\"A rechargeable cell is classified as:\",\"sh\":\"पुनःचार्ज होने वाला सेल कहलाता है:\",\"oe\":[\"Primary cell\",\"Dry resistor\",\"Fuse cell\",\"Secondary cell\"],\"oh\":[\"प्राथमिक सेल\",\"शुष्क प्रतिरोधक\",\"फ्यूज सेल\",\"द्वितीयक सेल\"],\"a\":3,\"ee\":\"Secondary cells can undergo repeated charge-discharge cycles within limits.\",\"eh\":\"द्वितीयक सेल सीमा के भीतर बार-बार चार्ज-डिस्चार्ज किए जा सकते हैं।\"},{\"n\":3,\"d\":\"E\",\"se\":\"Nominal voltage of one lead-acid cell is approximately:\",\"sh\":\"एक लेड-एसिड सेल का नाममात्र वोल्टेज लगभग है:\",\"oe\":[\"1.2 V / 1.2 V\",\"2 V / 2 V\",\"6 V / 6 V\",\"12 V / 12 V\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Six approximately 2 V cells form a nominal 12 V battery.\",\"eh\":\"छह लगभग 2 V सेल मिलकर 12 V बैटरी बनाते हैं।\"},{\"n\":4,\"d\":\"E\",\"se\":\"The charged positive plate of a lead-acid cell is mainly:\",\"sh\":\"चार्ज लेड-एसिड सेल की धनात्मक प्लेट मुख्यतः है:\",\"oe\":[\"Sponge lead\",\"Lead dioxide (PbO₂)\",\"Copper\",\"Zinc\"],\"oh\":[\"स्पंज लेड\",\"लेड डाइऑक्साइड (PbO₂)\",\"ताँबा\",\"जस्ता\"],\"a\":1,\"ee\":\"The positive active material is PbO₂; the negative is sponge lead.\",\"eh\":\"धनात्मक पदार्थ PbO₂ और ऋणात्मक स्पंज लेड है।\"},{\"n\":5,\"d\":\"E\",\"se\":\"The charged negative plate of a lead-acid cell is mainly:\",\"sh\":\"चार्ज लेड-एसिड सेल की ऋणात्मक प्लेट मुख्यतः है:\",\"oe\":[\"Lead dioxide\",\"Carbon\",\"Nickel oxide\",\"Sponge lead (Pb)\"],\"oh\":[\"लेड डाइऑक्साइड\",\"कार्बन\",\"निकेल ऑक्साइड\",\"स्पंज लेड (Pb)\"],\"a\":3,\"ee\":\"Sponge lead is the negative active material in a charged cell.\",\"eh\":\"चार्ज सेल में स्पंज लेड ऋणात्मक सक्रिय पदार्थ है।\"},{\"n\":6,\"d\":\"E\",\"se\":\"Electrolyte in a flooded lead-acid battery is:\",\"sh\":\"फ्लडेड लेड-एसिड बैटरी का इलेक्ट्रोलाइट है:\",\"oe\":[\"Dilute sulphuric acid\",\"Distilled water only\",\"Salt water\",\"Kerosene\"],\"oh\":[\"पतला सल्फ्यूरिक अम्ल\",\"केवल आसुत जल\",\"नमक जल\",\"मिट्टी का तेल\"],\"a\":0,\"ee\":\"Sulphuric acid and water form the conducting electrolyte.\",\"eh\":\"सल्फ्यूरिक अम्ल और जल चालक इलेक्ट्रोलाइट बनाते हैं।\"},{\"n\":7,\"d\":\"E\",\"se\":\"A separator between battery plates must:\",\"sh\":\"बैटरी प्लेटों के बीच सेपरेटर को:\",\"oe\":[\"Short both plates\",\"Block all ions\",\"Generate charging current\",\"Prevent electronic contact but permit ionic movement\"],\"oh\":[\"दोनों प्लेट शॉर्ट करे\",\"सभी आयन रोके\",\"चार्जिंग धारा बनाए\",\"सीधा संपर्क रोके पर आयन चलने दे\"],\"a\":3,\"ee\":\"It prevents a plate short while allowing electrochemical action.\",\"eh\":\"यह प्लेट शॉर्ट रोकते हुए विद्युत-रासायनिक क्रिया होने देता है।\"},{\"n\":8,\"d\":\"E\",\"se\":\"A nominal 12 V lead-acid battery normally contains:\",\"sh\":\"नाममात्र 12 V लेड-एसिड बैटरी में सामान्यतः होते हैं:\",\"oe\":[\"Six series cells\",\"Two cells\",\"Four cells\",\"Twelve parallel cells\"],\"oh\":[\"छह श्रेणी सेल\",\"दो सेल\",\"चार सेल\",\"बारह समानांतर सेल\"],\"a\":0,\"ee\":\"Six 2 V cells in series give about 12 V nominal.\",\"eh\":\"छह 2 V सेल श्रेणी में लगभग 12 V देते हैं।\"},{\"n\":9,\"d\":\"E\",\"se\":\"Battery capacity is commonly rated in:\",\"sh\":\"बैटरी क्षमता सामान्यतः किसमें रेट होती है:\",\"oe\":[\"Ohms\",\"Hertz\",\"Ampere-hours (Ah)\",\"Webers\"],\"oh\":[\"ओम\",\"हर्ट्ज़\",\"एम्पियर-घंटा (Ah)\",\"वेबर\"],\"a\":2,\"ee\":\"Ah indicates the charge a battery can deliver under specified conditions.\",\"eh\":\"Ah निर्दिष्ट दशाओं में उपलब्ध आवेश दर्शाता है।\"},{\"n\":10,\"d\":\"E\",\"se\":\"Connecting identical batteries in series mainly raises:\",\"sh\":\"समान बैटरियाँ श्रेणी में जोड़ने से मुख्यतः बढ़ता है:\",\"oe\":[\"Ah capacity\",\"Plate area\",\"Voltage\",\"Electrolyte density automatically\"],\"oh\":[\"Ah क्षमता\",\"प्लेट क्षेत्र\",\"वोल्टेज\",\"इलेक्ट्रोलाइट घनत्व स्वतः\"],\"a\":2,\"ee\":\"Series voltages add; Ah remains that of one identical string.\",\"eh\":\"श्रेणी में वोल्टेज जुड़ते हैं, Ah एक स्ट्रिंग जितना रहता है।\"},{\"n\":11,\"d\":\"M\",\"se\":\"Connecting identical batteries in parallel mainly raises:\",\"sh\":\"समान बैटरियाँ समानांतर जोड़ने से मुख्यतः बढ़ता है:\",\"oe\":[\"Nominal voltage\",\"Cell voltage chemistry\",\"Specific gravity\",\"Ah capacity\"],\"oh\":[\"नाममात्र वोल्टेज\",\"सेल रसायन वोल्टेज\",\"विशिष्ट घनत्व\",\"Ah क्षमता\"],\"a\":3,\"ee\":\"Parallel capacity adds while nominal voltage stays unchanged.\",\"eh\":\"समानांतर में क्षमता जुड़ती है, वोल्टेज वही रहता है।\"},{\"n\":12,\"d\":\"M\",\"se\":\"Three 12 V, 100 Ah batteries in series form:\",\"sh\":\"तीन 12 V, 100 Ah बैटरियाँ श्रेणी में बनाती हैं:\",\"oe\":[\"12 V, 300 Ah / 12 V, 300 Ah\",\"36 V, 100 Ah / 36 V, 100 Ah\",\"36 V, 300 Ah / 36 V, 300 Ah\",\"4 V, 100 Ah / 4 V, 100 Ah\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Voltage adds to 36 V; series-string capacity remains 100 Ah.\",\"eh\":\"वोल्टेज 36 V होता है, क्षमता 100 Ah रहती है।\"},{\"n\":13,\"d\":\"M\",\"se\":\"Three 12 V, 100 Ah batteries in parallel form:\",\"sh\":\"तीन 12 V, 100 Ah बैटरियाँ समानांतर में बनाती हैं:\",\"oe\":[\"12 V, 300 Ah / 12 V, 300 Ah\",\"36 V, 100 Ah / 36 V, 100 Ah\",\"12 V, 100 Ah / 12 V, 100 Ah\",\"36 V, 300 Ah / 36 V, 300 Ah\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Parallel Ah values add and voltage remains 12 V.\",\"eh\":\"समानांतर में Ah जुड़ता और वोल्टेज 12 V रहता है।\"},{\"n\":14,\"d\":\"M\",\"se\":\"A hydrometer measures electrolyte:\",\"sh\":\"हाइड्रोमीटर इलेक्ट्रोलाइट का क्या मापता है:\",\"oe\":[\"Terminal voltage\",\"Specific gravity\",\"Current\",\"Insulation resistance\"],\"oh\":[\"टर्मिनल वोल्टेज\",\"विशिष्ट घनत्व\",\"धारा\",\"इन्सुलेशन प्रतिरोध\"],\"a\":1,\"ee\":\"Specific gravity helps assess charge condition of serviceable flooded cells, with temperature correction where required.\",\"eh\":\"विशिष्ट घनत्व फ्लडेड सेल की चार्ज दशा बताता है; आवश्यक हो तो ताप सुधार करें।\"},{\"n\":15,\"d\":\"M\",\"se\":\"In a healthy flooded lead-acid cell, specific gravity is generally:\",\"sh\":\"स्वस्थ फ्लडेड लेड-एसिड सेल में विशिष्ट घनत्व सामान्यतः:\",\"oe\":[\"Always zero\",\"Higher when charged than discharged\",\"Lower when charged\",\"Independent of charge\"],\"oh\":[\"सदैव शून्य\",\"चार्ज अवस्था में डिस्चार्ज से अधिक\",\"चार्ज पर कम\",\"चार्ज से स्वतंत्र\"],\"a\":1,\"ee\":\"Discharge consumes sulphuric acid and lowers electrolyte specific gravity.\",\"eh\":\"डिस्चार्ज में अम्ल खर्च होने से विशिष्ट घनत्व घटता है।\"},{\"n\":16,\"d\":\"M\",\"se\":\"For routine topping-up of a serviceable flooded battery, normally add:\",\"sh\":\"फ्लडेड बैटरी की सामान्य टॉपिंग-अप में जोड़ें:\",\"oe\":[\"Concentrated acid routinely\",\"Tap water\",\"Salt solution\",\"Manufacturer-specified distilled/deionised water\"],\"oh\":[\"नियमित सांद्र अम्ल\",\"नल का जल\",\"नमक घोल\",\"निर्माता-निर्दिष्ट आसुत/विआयनीकृत जल\"],\"a\":3,\"ee\":\"Water is lost mainly through gassing; routine acid addition can damage balance.\",\"eh\":\"मुख्यतः जल घटता है; नियमित अम्ल जोड़ना संतुलन बिगाड़ सकता है।\"},{\"n\":17,\"d\":\"M\",\"se\":\"When preparing dilute acid, the safe rule is:\",\"sh\":\"पतला अम्ल बनाते समय सुरक्षित नियम है:\",\"oe\":[\"Add water to concentrated acid\",\"Use a metal container\",\"Add acid gradually to water\",\"Mix beside sparks\"],\"oh\":[\"सांद्र अम्ल में जल डालें\",\"धातु पात्र लें\",\"अम्ल को धीरे-धीरे जल में डालें\",\"चिंगारी के पास मिलाएँ\"],\"a\":2,\"ee\":\"Adding water to concentrated acid can cause violent heating and splashing.\",\"eh\":\"सांद्र अम्ल में जल डालने से तीव्र ऊष्मा और छींटे हो सकते हैं।\"},{\"n\":18,\"d\":\"M\",\"se\":\"Battery charging areas require ventilation chiefly because charging may release:\",\"sh\":\"बैटरी चार्जिंग क्षेत्र में वेंटिलेशन मुख्यतः किस गैस-जोखिम के कारण चाहिए:\",\"oe\":[\"Only nitrogen\",\"Steam only\",\"Carbon dioxide only\",\"Hydrogen that can form an explosive mixture\"],\"oh\":[\"केवल नाइट्रोजन\",\"केवल भाप\",\"केवल CO₂\",\"विस्फोटक मिश्रण बना सकने वाली हाइड्रोजन\"],\"a\":3,\"ee\":\"Hydrogen can accumulate during gassing; remove ignition sources and ventilate.\",\"eh\":\"गैसिंग में हाइड्रोजन जमा हो सकती है; वेंटिलेशन और चिंगारी निषेध जरूरी है।\"},{\"n\":19,\"d\":\"M\",\"se\":\"Near a charging lead-acid battery, the correct practice is:\",\"sh\":\"चार्ज होती लेड-एसिड बैटरी के पास सही व्यवहार है:\",\"oe\":[\"Keep flames, smoking and sparks away\",\"Short-test with a screwdriver\",\"Disconnect under heavy current\",\"Wear metal jewellery\"],\"oh\":[\"लौ, धूम्रपान और चिंगारी दूर रखें\",\"पेचकस से शॉर्ट जाँच\",\"भारी धारा में डिस्कनेक्ट\",\"धातु आभूषण पहनें\"],\"a\":0,\"ee\":\"A spark can ignite accumulated hydrogen.\",\"eh\":\"चिंगारी संचित हाइड्रोजन को प्रज्वलित कर सकती है।\"},{\"n\":20,\"d\":\"M\",\"se\":\"Corroded battery terminals commonly cause:\",\"sh\":\"क्षरित बैटरी टर्मिनल सामान्यतः उत्पन्न करते हैं:\",\"oe\":[\"High contact resistance and voltage drop\",\"Extra capacity\",\"Perfect charging\",\"Lower internal temperature always\"],\"oh\":[\"उच्च संपर्क प्रतिरोध और वोल्टेज ड्रॉप\",\"अधिक क्षमता\",\"पूर्ण चार्जिंग\",\"सदैव कम ताप\"],\"a\":0,\"ee\":\"Corrosion weakens the connection, causing heating and load-voltage loss.\",\"eh\":\"क्षरण संपर्क खराब कर ताप और भार पर वोल्टेज हानि बढ़ाता है।\"},{\"n\":21,\"d\":\"M\",\"se\":\"Lead-acid sulphation is promoted by:\",\"sh\":\"लेड-एसिड सल्फेशन किससे बढ़ता है:\",\"oe\":[\"Correct float service\",\"Prolonged undercharged or discharged storage\",\"Clean terminals\",\"Proper recharge\"],\"oh\":[\"सही फ्लोट सेवा\",\"लंबे समय अधचार्ज/डिस्चार्ज भंडारण\",\"स्वच्छ टर्मिनल\",\"सही पुनःचार्ज\"],\"a\":1,\"ee\":\"Hard lead-sulphate crystals reduce active area and capacity.\",\"eh\":\"कठोर लेड-सल्फेट क्रिस्टल सक्रिय क्षेत्र और क्षमता घटाते हैं।\"},{\"n\":22,\"d\":\"M\",\"se\":\"Excessive overcharging of a flooded battery tends to cause:\",\"sh\":\"फ्लडेड बैटरी की अत्यधिक ओवरचार्जिंग से होता है:\",\"oe\":[\"Permanent capacity increase\",\"No chemical action\",\"Gassing, water loss and heating\",\"Lower terminal voltage only\"],\"oh\":[\"स्थायी क्षमता वृद्धि\",\"कोई रासायनिक क्रिया नहीं\",\"गैसिंग, जल हानि और ताप\",\"केवल कम वोल्टेज\"],\"a\":2,\"ee\":\"Excess current after full charge decomposes water and accelerates damage.\",\"eh\":\"पूर्ण चार्ज के बाद अधिक धारा जल अपघटन और क्षति बढ़ाती है।\"},{\"n\":23,\"d\":\"M\",\"se\":\"A trickle or maintenance charge is intended mainly to:\",\"sh\":\"ट्रिकल/मेंटेनेंस चार्ज का मुख्य उद्देश्य है:\",\"oe\":[\"Rapidly boil electrolyte\",\"Reverse polarity\",\"Compensate self-discharge at a low rate\",\"Short the cells\"],\"oh\":[\"इलेक्ट्रोलाइट उबालना\",\"ध्रुवता उलटना\",\"कम दर पर स्व-डिस्चार्ज की पूर्ति\",\"सेल शॉर्ट करना\"],\"a\":2,\"ee\":\"A correctly controlled low charge maintains readiness without high-rate overcharge.\",\"eh\":\"नियंत्रित कम चार्ज बैटरी को तैयार रखता है।\"},{\"n\":24,\"d\":\"H\",\"se\":\"A battery supplies 20 A for 5 h. Ideal delivered capacity is:\",\"sh\":\"बैटरी 20 A धारा 5 h देती है। आदर्श प्रदत्त क्षमता है:\",\"oe\":[\"4 Ah / 4 Ah\",\"100 Ah / 100 Ah\",\"25 Ah / 25 Ah\",\"400 Ah / 400 Ah\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Capacity (Q=It=20\\\\times5=100\\\\) Ah.\",\"eh\":\"क्षमता (Q=It=100\\\\) Ah है।\"},{\"n\":25,\"d\":\"H\",\"se\":\"Ignoring rate effects, a 100 Ah battery supplying 10 A lasts about:\",\"sh\":\"दर प्रभाव उपेक्षित कर 100 Ah बैटरी 10 A पर लगभग चलेगी:\",\"oe\":[\"1 h / 1 h\",\"5 h / 5 h\",\"100 h / 100 h\",\"10 h / 10 h\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Ideal time (t=Q/I=100/10=10\\\\) h; real capacity depends on rate, age and temperature.\",\"eh\":\"आदर्श समय 10 h है; वास्तविक मान दर, आयु और ताप पर निर्भर है।\"},{\"n\":26,\"d\":\"H\",\"se\":\"Nominal stored energy of a 12 V, 100 Ah battery is approximately:\",\"sh\":\"12 V, 100 Ah बैटरी की नाममात्र ऊर्जा लगभग है:\",\"oe\":[\"1.2 kWh / 1.2 kWh\",\"0.12 kWh / 0.12 kWh\",\"12 kWh / 12 kWh\",\"120 kWh / 120 kWh\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Energy (\\\\approx V\\\\times Ah=1200\\\\) Wh = 1.2 kWh.\",\"eh\":\"ऊर्जा लगभग 1200 Wh अर्थात 1.2 kWh है।\"},{\"n\":27,\"d\":\"H\",\"se\":\"Four identical 12 V, 100 Ah batteries arranged as two series pairs in parallel give:\",\"sh\":\"चार 12 V, 100 Ah बैटरियाँ, दो-दो श्रेणी जोड़े समानांतर में, देती हैं:\",\"oe\":[\"48 V, 100 Ah / 48 V, 100 Ah\",\"12 V, 400 Ah / 12 V, 400 Ah\",\"24 V, 100 Ah / 24 V, 100 Ah\",\"24 V, 200 Ah / 24 V, 200 Ah\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Each series string is 24 V, 100 Ah; two strings in parallel give 24 V, 200 Ah.\",\"eh\":\"हर स्ट्रिंग 24 V, 100 Ah; दो समानांतर स्ट्रिंग 24 V, 200 Ah।\"},{\"n\":28,\"d\":\"H\",\"se\":\"Large voltage sag and heating under load most directly indicate:\",\"sh\":\"भार पर बड़ा वोल्टेज सैग और ताप मुख्यतः दर्शाते हैं:\",\"oe\":[\"High internal/contact resistance\",\"Infinite Ah capacity\",\"Perfect terminals\",\"Zero load current\"],\"oh\":[\"उच्च आंतरिक/संपर्क प्रतिरोध\",\"अनंत Ah क्षमता\",\"पूर्ण टर्मिनल\",\"शून्य भार धारा\"],\"a\":0,\"ee\":\"Resistance causes (I R) drop and (I^2R) heating.\",\"eh\":\"प्रतिरोध (IR) ड्रॉप और (I^2R) ताप उत्पन्न करता है।\"},{\"n\":29,\"d\":\"H\",\"se\":\"A conventional hydrometer should not be used on:\",\"sh\":\"परंपरागत हाइड्रोमीटर का उपयोग किस पर नहीं करना चाहिए:\",\"oe\":[\"Serviceable flooded cell\",\"A sealed battery without accessible electrolyte\",\"Open test jar\",\"Hydrometer calibration fluid\"],\"oh\":[\"सेवा योग्य फ्लडेड सेल\",\"बिना पहुँच वाले सीलबंद बैटरी पर\",\"खुला परीक्षण पात्र\",\"कैलिब्रेशन द्रव\"],\"a\":1,\"ee\":\"Sealed batteries must be assessed by approved voltage, conductance or load methods—not opened.\",\"eh\":\"सीलबंद बैटरी न खोलें; अनुमोदित वोल्टेज/कंडक्टेंस/लोड परीक्षण करें।\"},{\"n\":30,\"d\":\"H\",\"se\":\"An equalising charge should be applied:\",\"sh\":\"इक्वलाइजिंग चार्ज कब देना चाहिए:\",\"oe\":[\"To every sealed battery weekly\",\"Without monitoring temperature\",\"At unlimited current\",\"Only when specified for that flooded battery by the manufacturer\"],\"oh\":[\"हर सीलबंद बैटरी को साप्ताहिक\",\"बिना ताप निगरानी\",\"असीमित धारा पर\",\"केवल निर्माता द्वारा उस फ्लडेड बैटरी हेतु निर्दिष्ट होने पर\"],\"a\":3,\"ee\":\"Equalisation is controlled overcharge and can damage sealed or unsuitable batteries.\",\"eh\":\"इक्वलाइजेशन नियंत्रित ओवरचार्ज है; गलत बैटरी को क्षति पहुँचा सकता है।\"},{\"n\":31,\"d\":\"E\",\"se\":\"A subscriber line connects a telephone mainly to:\",\"sh\":\"सब्सक्राइबर लाइन टेलीफोन को मुख्यतः जोड़ती है:\",\"oe\":[\"Battery plates\",\"Loudspeaker cone\",\"Local exchange/switchboard\",\"Antenna director\"],\"oh\":[\"बैटरी प्लेट\",\"स्पीकर कोन\",\"स्थानीय एक्सचेंज/स्विचबोर्ड\",\"एंटीना निर्देशक\"],\"a\":2,\"ee\":\"It provides the local speech/signalling path.\",\"eh\":\"यह स्थानीय वाणी और संकेत पथ देता है।\"},{\"n\":32,\"d\":\"E\",\"se\":\"A traditional telephone local loop normally uses:\",\"sh\":\"पारंपरिक टेलीफोन लोकल लूप सामान्यतः उपयोग करता है:\",\"oe\":[\"One earth wire only\",\"A two-wire pair\",\"Three-phase cable\",\"Coax shield only\"],\"oh\":[\"केवल एक अर्थ तार\",\"दो-तार जोड़ी\",\"त्रि-फेज केबल\",\"केवल कोएक्स शील्ड\"],\"a\":1,\"ee\":\"A metallic pair carries speech, DC supervision and ringing in classic systems.\",\"eh\":\"पारंपरिक प्रणाली में जोड़ी वाणी, DC पर्यवेक्षण और रिंगिंग वहन करती है।\"},{\"n\":33,\"d\":\"E\",\"se\":\"The ringing circuit primarily:\",\"sh\":\"रिंगिंग परिपथ मुख्यतः:\",\"oe\":[\"Amplifies RF\",\"Alerts the called subscriber\",\"Charges the exchange battery only\",\"Measures insulation\"],\"oh\":[\"RF प्रवर्धित करता है\",\"कॉल किए ग्राहक को सचेत करता है\",\"केवल बैटरी चार्ज\",\"इन्सुलेशन मापता है\"],\"a\":1,\"ee\":\"Ringing operates the bell/ringer before the call is answered.\",\"eh\":\"उत्तर से पहले रिंगिंग घंटी चलाती है।\"},{\"n\":34,\"d\":\"E\",\"se\":\"The speech circuit carries:\",\"sh\":\"वाक् परिपथ वहन करता है:\",\"oe\":[\"Only mains power\",\"Battery acid\",\"Voice-frequency conversation\",\"Antenna current\"],\"oh\":[\"केवल मेन्स\",\"बैटरी अम्ल\",\"वाणी-आवृत्ति वार्तालाप\",\"एंटीना धारा\"],\"a\":2,\"ee\":\"It provides the transmit/receive audio path.\",\"eh\":\"यह प्रेषण और ग्रहण ऑडियो पथ देता है।\"},{\"n\":35,\"d\":\"E\",\"se\":\"A manual switchboard operator chiefly:\",\"sh\":\"मैनुअल स्विचबोर्ड ऑपरेटर मुख्यतः:\",\"oe\":[\"Repairs battery plates\",\"Modulates RF\",\"Interconnects calling and called lines\",\"Measures specific gravity\"],\"oh\":[\"बैटरी प्लेट ठीक करता है\",\"RF मॉड्यूलेट करता है\",\"कॉलिंग और कॉल्ड लाइन जोड़ता है\",\"विशिष्ट घनत्व मापता है\"],\"a\":2,\"ee\":\"Cords/keys or switching contacts establish and clear connections.\",\"eh\":\"कॉर्ड/की या संपर्क कॉल जोड़ते और हटाते हैं।\"},{\"n\":36,\"d\":\"E\",\"se\":\"Cord circuits and keys on a small switchboard are used to:\",\"sh\":\"छोटे स्विचबोर्ड में कॉर्ड और की का उपयोग:\",\"oe\":[\"Increase battery Ah\",\"Establish, supervise and clear calls\",\"Tune an antenna\",\"Desolder ICs\"],\"oh\":[\"बैटरी Ah बढ़ाने\",\"कॉल जोड़ने, देखने और हटाने हेतु\",\"एंटीना ट्यून करने\",\"IC डी-सोल्डर करने\"],\"a\":1,\"ee\":\"They control the connection and operator functions.\",\"eh\":\"वे कनेक्शन और ऑपरेटर कार्य नियंत्रित करते हैं।\"},{\"n\":37,\"d\":\"M\",\"se\":\"An open line fault means:\",\"sh\":\"ओपन लाइन दोष का अर्थ:\",\"oe\":[\"The conductor path is broken\",\"Pair conductors touch\",\"Conductor touches earth\",\"Insulation is perfect\"],\"oh\":[\"चालक पथ टूटा है\",\"जोड़ी तार छूते हैं\",\"चालक अर्थ से जुड़ा\",\"इन्सुलेशन पूर्ण\"],\"a\":0,\"ee\":\"An open gives loss of continuity and effectively very high end-to-end resistance.\",\"eh\":\"ओपन में सततता समाप्त और सिरा-से-सिरा प्रतिरोध बहुत अधिक होता है।\"},{\"n\":38,\"d\":\"M\",\"se\":\"A short-circuit fault between a disconnected pair gives:\",\"sh\":\"डिस्कनेक्ट जोड़ी में शॉर्ट दोष देता है:\",\"oe\":[\"Infinite resistance\",\"Correct insulation\",\"Normal ringing\",\"Very low resistance between conductors\"],\"oh\":[\"अनंत प्रतिरोध\",\"सही इन्सुलेशन\",\"सामान्य रिंगिंग\",\"तारों के बीच बहुत कम प्रतिरोध\"],\"a\":3,\"ee\":\"The conductors are unintentionally connected.\",\"eh\":\"दोनों चालक अनचाहे जुड़ जाते हैं।\"},{\"n\":39,\"d\":\"M\",\"se\":\"An earth fault occurs when:\",\"sh\":\"अर्थ दोष कब होता है:\",\"oe\":[\"Both ends are open\",\"Battery is full\",\"A line conductor contacts earth/ground\",\"Ringer operates\"],\"oh\":[\"दोनों सिरे खुले\",\"बैटरी पूर्ण\",\"लाइन चालक अर्थ/भूमि से जुड़ता है\",\"रिंगर चलता है\"],\"a\":2,\"ee\":\"It lowers conductor-to-earth insulation resistance.\",\"eh\":\"यह चालक-से-अर्थ इन्सुलेशन प्रतिरोध घटाता है।\"},{\"n\":40,\"d\":\"M\",\"se\":\"Continuity testing of a line pair should normally be done:\",\"sh\":\"लाइन जोड़ी की सततता जाँच सामान्यतः:\",\"oe\":[\"With the circuit isolated/de-energised\",\"Across live mains\",\"With ohmmeter on voltage source\",\"By shorting the battery\"],\"oh\":[\"परिपथ पृथक और डी-एनर्जाइज्ड करके\",\"जीवित मेन्स पर\",\"ओममीटर को वोल्टेज स्रोत पर\",\"बैटरी शॉर्ट करके\"],\"a\":0,\"ee\":\"Ohmmeter/continuity modes inject their own test current and must not be put on live voltage.\",\"eh\":\"ओम/सततता मोड अपनी धारा देते हैं; जीवित वोल्टेज पर न लगाएँ।\"},{\"n\":41,\"d\":\"M\",\"se\":\"A healthy disconnected pair should show conductor-to-earth insulation that is:\",\"sh\":\"स्वस्थ डिस्कनेक्ट जोड़ी का चालक-से-अर्थ इन्सुलेशन होना चाहिए:\",\"oe\":[\"Near zero\",\"Exactly one ohm\",\"High\",\"A short\"],\"oh\":[\"लगभग शून्य\",\"ठीक एक ओम\",\"उच्च\",\"शॉर्ट\"],\"a\":2,\"ee\":\"High insulation limits leakage to ground.\",\"eh\":\"उच्च इन्सुलेशन अर्थ लीकेज रोकता है।\"},{\"n\":42,\"d\":\"M\",\"se\":\"A tone generator and inductive probe help:\",\"sh\":\"टोन जनरेटर और इंडक्टिव प्रोब मदद करते हैं:\",\"oe\":[\"Charge cells\",\"Measure acid\",\"Align FM IF\",\"Identify/trace a cable pair\"],\"oh\":[\"सेल चार्ज\",\"अम्ल माप\",\"FM IF संरेखित\",\"केबल जोड़ी पहचानने/ट्रेस करने में\"],\"a\":3,\"ee\":\"A known tone is applied and followed without direct continuity at every point.\",\"eh\":\"ज्ञात टोन लगाकर पथ खोजा जाता है।\"},{\"n\":43,\"d\":\"M\",\"se\":\"A field telephone is intended for:\",\"sh\":\"फील्ड टेलीफोन का उद्देश्य:\",\"oe\":[\"Broadcast RF only\",\"Battery hydrometry\",\"Rapid local voice communication over a field line\",\"PCB etching\"],\"oh\":[\"केवल प्रसारण RF\",\"बैटरी हाइड्रोमेट्री\",\"फील्ड लाइन पर त्वरित स्थानीय वाणी संचार\",\"PCB एचिंग\"],\"a\":2,\"ee\":\"It provides rugged point-to-point communication where fixed exchange service may be absent.\",\"eh\":\"जहाँ स्थायी एक्सचेंज न हो वहाँ मजबूत बिंदु-से-बिंदु संचार देता है।\"},{\"n\":44,\"d\":\"M\",\"se\":\"Sidetone is:\",\"sh\":\"साइडटोन है:\",\"oe\":[\"A controlled amount of one's own voice heard in the receiver\",\"RF image\",\"Battery hum\",\"Line earth fault\"],\"oh\":[\"रिसीवर में सुनाई देने वाली अपनी आवाज़ का नियंत्रित भाग\",\"RF प्रतिबिंब\",\"बैटरी हम\",\"लाइन अर्थ दोष\"],\"a\":0,\"ee\":\"It reassures the user and discourages shouting; too much or too little suggests imbalance/fault.\",\"eh\":\"यह उपयोगकर्ता को प्रतिक्रिया देता है; असामान्य मात्रा असंतुलन दर्शा सकती है।\"},{\"n\":45,\"d\":\"M\",\"se\":\"A telephone hybrid chiefly interfaces:\",\"sh\":\"टेलीफोन हाइब्रिड मुख्यतः इंटरफेस करता है:\",\"oe\":[\"Battery and hydrometer\",\"Two-wire line and separate transmit/receive paths\",\"RF and antenna\",\"Fuse and earth\"],\"oh\":[\"बैटरी और हाइड्रोमीटर\",\"दो-तार लाइन और अलग प्रेषण/ग्रहण पथ\",\"RF और एंटीना\",\"फ्यूज और अर्थ\"],\"a\":1,\"ee\":\"It performs 2-wire/4-wire conversion and balancing.\",\"eh\":\"यह 2-तार/4-तार रूपांतरण और संतुलन करता है।\"},{\"n\":46,\"d\":\"H\",\"se\":\"A disconnected line shows OL end-to-end and no ringing. Most likely fault is:\",\"sh\":\"डिस्कनेक्ट लाइन सिरा-से-सिरा OL और रिंगिंग नहीं देती। संभावित दोष:\",\"oe\":[\"Pair short\",\"Earth fault\",\"Open conductor\",\"Correct line\"],\"oh\":[\"जोड़ी शॉर्ट\",\"अर्थ दोष\",\"खुला चालक\",\"सही लाइन\"],\"a\":2,\"ee\":\"OL plus loss of service is the signature of an open path.\",\"eh\":\"OL और सेवा हानि खुला पथ दर्शाते हैं।\"},{\"n\":47,\"d\":\"H\",\"se\":\"With both ends isolated, near-zero resistance between the pair indicates:\",\"sh\":\"दोनों सिरे पृथक होने पर जोड़ी के बीच लगभग शून्य प्रतिरोध:\",\"oe\":[\"Short between conductors\",\"Open\",\"Good insulation\",\"High-resistance joint\"],\"oh\":[\"चालकों के बीच शॉर्ट\",\"ओपन\",\"सही इन्सुलेशन\",\"उच्च-प्रतिरोध जोड़\"],\"a\":0,\"ee\":\"A short makes the two conductors electrically common.\",\"eh\":\"शॉर्ट दोनों चालकों को विद्युत रूप से एक कर देता है।\"},{\"n\":48,\"d\":\"H\",\"se\":\"One isolated conductor reads low resistance to earth. This indicates:\",\"sh\":\"एक पृथक चालक अर्थ से कम प्रतिरोध दिखाता है। यह है:\",\"oe\":[\"Open only\",\"Earth fault\",\"Perfect insulation\",\"Normal speech path\"],\"oh\":[\"केवल ओपन\",\"अर्थ दोष\",\"पूर्ण इन्सुलेशन\",\"सामान्य वाणी पथ\"],\"a\":1,\"ee\":\"Low conductor-to-earth resistance identifies insulation breakdown to ground.\",\"eh\":\"कम चालक-अर्थ प्रतिरोध भूमि की ओर इन्सुलेशन विफलता है।\"},{\"n\":49,\"d\":\"H\",\"se\":\"The half-split method locates a cable fault by:\",\"sh\":\"हाफ-स्प्लिट विधि केबल दोष खोजती है:\",\"oe\":[\"Replacing the full cable first\",\"Increasing voltage blindly\",\"Testing near the midpoint and repeatedly halving the suspect section\",\"Shorting all pairs\"],\"oh\":[\"पहले पूरी केबल बदलकर\",\"अंधाधुंध वोल्टेज बढ़ाकर\",\"मध्य पर जाँच कर संदिग्ध भाग बार-बार आधा करके\",\"सभी जोड़ियाँ शॉर्ट करके\"],\"a\":2,\"ee\":\"Binary division quickly narrows a long route.\",\"eh\":\"क्रमिक आधा-विभाजन लंबा पथ शीघ्र संकरा करता है।\"},{\"n\":50,\"d\":\"H\",\"se\":\"For an intermittent pair fault, the best controlled test is to:\",\"sh\":\"रुक-रुक कर आने वाले जोड़ी दोष में सही नियंत्रित परीक्षण:\",\"oe\":[\"Monitor continuity/insulation while gently flexing sections and connectors\",\"Apply mains\",\"Bridge the fuse\",\"Ignore records\"],\"oh\":[\"खंड/कनेक्टर हल्के हिलाते हुए सततता/इन्सुलेशन देखें\",\"मेन्स लगाएँ\",\"फ्यूज बायपास करें\",\"अभिलेख न रखें\"],\"a\":0,\"ee\":\"Controlled movement can reproduce a loose joint without destructive stress.\",\"eh\":\"नियंत्रित हिलाने से ढीला जोड़ सुरक्षित रूप से पुनः प्रकट हो सकता है।\"},{\"n\":51,\"d\":\"E\",\"se\":\"Solder is used chiefly to:\",\"sh\":\"सोल्डर का मुख्य उपयोग:\",\"oe\":[\"Make a conductive mechanical/electrical joint\",\"Insulate every conductor\",\"Increase battery acid\",\"Generate RF\"],\"oh\":[\"चालक यांत्रिक/विद्युत जोड़ बनाना\",\"हर चालक इन्सुलेट\",\"बैटरी अम्ल बढ़ाना\",\"RF बनाना\"],\"a\":0,\"ee\":\"Molten solder wets prepared metal surfaces and solidifies into a joint.\",\"eh\":\"पिघला सोल्डर तैयार धातु सतहों को भिगोकर जोड़ बनाता है।\"},{\"n\":52,\"d\":\"E\",\"se\":\"Flux primarily:\",\"sh\":\"फ्लक्स मुख्यतः:\",\"oe\":[\"Acts as insulation permanently\",\"Raises supply voltage\",\"Removes/prevents oxides and improves wetting\",\"Replaces solder\"],\"oh\":[\"स्थायी इन्सुलेशन\",\"वोल्टेज बढ़ाता है\",\"ऑक्साइड हटाकर वेटिंग सुधारता है\",\"सोल्डर बदलता है\"],\"a\":2,\"ee\":\"Clean oxide-free surfaces allow solder to flow and bond.\",\"eh\":\"ऑक्साइड-मुक्त सतह पर सोल्डर सही बहता और जुड़ता है।\"},{\"n\":53,\"d\":\"E\",\"se\":\"A soldering-iron tip is tinned to:\",\"sh\":\"सोल्डरिंग आयरन टिप टिन करने का उद्देश्य:\",\"oe\":[\"Make it magnetic\",\"Improve heat transfer and protect the tip\",\"Cool it completely\",\"Increase PCB voltage\"],\"oh\":[\"चुंबकीय बनाना\",\"ऊष्मा स्थानांतरण सुधारना और टिप बचाना\",\"पूरी तरह ठंडा\",\"PCB वोल्टेज बढ़ाना\"],\"a\":1,\"ee\":\"A thin solder coating prevents oxidation and conducts heat efficiently.\",\"eh\":\"पतली सोल्डर परत ऑक्सीकरण रोककर ऊष्मा देती है।\"},{\"n\":54,\"d\":\"E\",\"se\":\"A good through-hole solder joint is normally:\",\"sh\":\"अच्छा थ्रू-होल सोल्डर जोड़ सामान्यतः:\",\"oe\":[\"A loose ball\",\"A bridge to adjacent pads\",\"Cracked around lead\",\"Properly wetted, smooth and filleted\"],\"oh\":[\"ढीली गोली\",\"पास पैड से ब्रिज\",\"लीड के चारों ओर दरार\",\"सही वेटेड, चिकना और फिलेटयुक्त\"],\"a\":3,\"ee\":\"Appearance varies by alloy, but wetting and full sound connection matter more than shine alone.\",\"eh\":\"मिश्रधातु से चमक बदल सकती है; सही वेटिंग और मजबूत संपर्क जरूरी है।\"},{\"n\":55,\"d\":\"E\",\"se\":\"A dry/cold joint usually results from:\",\"sh\":\"सूखा/कोल्ड जोड़ सामान्यतः बनता है:\",\"oe\":[\"Poor heating, contamination or movement during solidification\",\"Correct wetting\",\"Proper cleaning\",\"Adequate dwell\"],\"oh\":[\"कम ताप, गंदगी या जमते समय हिलने से\",\"सही वेटिंग\",\"सही सफाई\",\"पर्याप्त समय\"],\"a\":0,\"ee\":\"It has unreliable electrical/mechanical contact and may become intermittent.\",\"eh\":\"यह अविश्वसनीय संपर्क बनाकर रुक-रुक दोष दे सकता है।\"},{\"n\":56,\"d\":\"E\",\"se\":\"A desoldering pump removes:\",\"sh\":\"डी-सोल्डरिंग पंप हटाता है:\",\"oe\":[\"PCB substrate\",\"Component markings\",\"Molten solder by suction\",\"Flux fumes only\"],\"oh\":[\"PCB आधार\",\"घटक चिन्ह\",\"सक्शन से पिघला सोल्डर\",\"केवल धुआँ\"],\"a\":2,\"ee\":\"Heat the joint, trigger suction, then remove the part without forcing pads.\",\"eh\":\"जोड़ गरम कर सक्शन लें; पैड पर बल न दें।\"},{\"n\":57,\"d\":\"M\",\"se\":\"Desoldering wick works mainly by:\",\"sh\":\"डी-सोल्डरिंग विक मुख्यतः काम करती है:\",\"oe\":[\"Capillary action in braided copper\",\"Magnetic attraction\",\"Battery electrolysis\",\"RF radiation\"],\"oh\":[\"ताँबे की जाली में केशिका क्रिया\",\"चुंबकीय आकर्षण\",\"बैटरी विद्युत-अपघटन\",\"RF विकिरण\"],\"a\":0,\"ee\":\"Fluxed braid draws molten solder into its strands.\",\"eh\":\"फ्लक्सयुक्त जाली पिघला सोल्डर सोखती है।\"},{\"n\":58,\"d\":\"M\",\"se\":\"Excessive iron temperature or dwell time may:\",\"sh\":\"अत्यधिक आयरन ताप/समय से:\",\"oe\":[\"Increase PCB strength\",\"Lift pads, damage tracks/components\",\"Correct every dry joint\",\"Improve IC rating\"],\"oh\":[\"PCB शक्ति बढ़ना\",\"पैड उठना, ट्रैक/घटक क्षति\",\"हर सूखा जोड़ ठीक\",\"IC रेटिंग बढ़ना\"],\"a\":1,\"ee\":\"Use the correct tip, temperature and minimum effective contact time.\",\"eh\":\"सही टिप, ताप और न्यूनतम प्रभावी समय रखें।\"},{\"n\":59,\"d\":\"M\",\"se\":\"Before handling a MOSFET or CMOS PCB, use:\",\"sh\":\"MOSFET/CMOS PCB संभालने से पहले उपयोग करें:\",\"oe\":[\"A charged plastic sheet\",\"An open flame\",\"A megger on gates\",\"ESD-safe grounding and handling\"],\"oh\":[\"चार्ज प्लास्टिक\",\"खुली लौ\",\"गेट पर मेगर\",\"ESD-सुरक्षित ग्राउंडिंग/हैंडलिंग\"],\"a\":3,\"ee\":\"Static discharge can puncture thin device insulation even without visible damage.\",\"eh\":\"स्थिर विद्युत बिना दृश्य चिन्ह के पतला इन्सुलेशन नष्ट कर सकती है।\"},{\"n\":60,\"d\":\"M\",\"se\":\"Correct hand-soldering sequence is:\",\"sh\":\"सही हाथ-सोल्डरिंग क्रम है:\",\"oe\":[\"Melt a large blob on tip only\",\"Clean/tin, heat joint, feed solder to joint, remove solder then iron\",\"Cool joint before heating\",\"Move lead while solidifying\"],\"oh\":[\"केवल टिप पर बड़ा गोला\",\"साफ/टिन, जोड़ गरम, जोड़ पर सोल्डर, पहले सोल्डर फिर आयरन हटाएँ\",\"गरम करने से पहले ठंडा\",\"जमते समय लीड हिलाएँ\"],\"a\":1,\"ee\":\"Feeding solder to the heated joint proves both surfaces are hot enough for wetting.\",\"eh\":\"गरम जोड़ पर सोल्डर देने से दोनों सतह सही ताप पर वेट होती हैं।\"},{\"n\":61,\"d\":\"M\",\"se\":\"Solder should normally be fed to:\",\"sh\":\"सोल्डर सामान्यतः कहाँ देना चाहिए:\",\"oe\":[\"Unheated component body\",\"PCB edge only\",\"The heated joint, not merely the iron tip\",\"ESD strap\"],\"oh\":[\"ठंडे घटक शरीर पर\",\"केवल PCB किनारे\",\"गरम जोड़ पर, केवल टिप पर नहीं\",\"ESD स्ट्रैप\"],\"a\":2,\"ee\":\"Tip solder may aid heat transfer, but the joint must melt and accept solder.\",\"eh\":\"टिप का सोल्डर ऊष्मा मदद करता है, पर जोड़ स्वयं सोल्डर स्वीकार करे।\"},{\"n\":62,\"d\":\"M\",\"se\":\"Before soldering a diode/electrolytic capacitor, verify:\",\"sh\":\"डायोड/इलेक्ट्रोलाइटिक कैपेसिटर सोल्डर करने से पहले जाँचें:\",\"oe\":[\"Only colour of PCB\",\"Battery SG\",\"Speaker volume\",\"Polarity and orientation\"],\"oh\":[\"केवल PCB रंग\",\"बैटरी SG\",\"स्पीकर ध्वनि\",\"ध्रुवता और दिशा\"],\"a\":3,\"ee\":\"Reversed polarised components can malfunction or fail dangerously.\",\"eh\":\"उलटी ध्रुवता से खराबी या खतरनाक विफलता हो सकती है।\"},{\"n\":63,\"d\":\"M\",\"se\":\"Cable strain relief prevents:\",\"sh\":\"केबल स्ट्रेन रिलीफ रोकता है:\",\"oe\":[\"Signal flow\",\"Mechanical pull reaching terminals/joints\",\"All flexibility\",\"Correct crimping\"],\"oh\":[\"संकेत प्रवाह\",\"यांत्रिक खिंचाव का टर्मिनल/जोड़ तक पहुँचना\",\"सभी लचीलापन\",\"सही क्रिम्पिंग\"],\"a\":1,\"ee\":\"It transfers cable force to the connector body or clamp.\",\"eh\":\"यह खिंचाव को कनेक्टर बॉडी/क्लैंप में लेता है।\"},{\"n\":64,\"d\":\"M\",\"se\":\"A correct crimp should be made with:\",\"sh\":\"सही क्रिम्प किससे बनता है:\",\"oe\":[\"Pliers of any size\",\"The specified terminal and calibrated/profiled tool\",\"Solder blob only\",\"Hammer\"],\"oh\":[\"कोई भी प्लायर\",\"निर्दिष्ट टर्मिनल और सही प्रोफाइल टूल\",\"केवल सोल्डर गोला\",\"हथौड़ा\"],\"a\":1,\"ee\":\"Correct compression forms a strong low-resistance, gas-resistant connection.\",\"eh\":\"सही दबाव मजबूत कम-प्रतिरोध संपर्क बनाता है।\"},{\"n\":65,\"d\":\"M\",\"se\":\"A broken PCB track is first confirmed by:\",\"sh\":\"टूटा PCB ट्रैक पहले किससे पुष्टि करें:\",\"oe\":[\"Cold continuity testing on an isolated board\",\"Applying mains blindly\",\"Shorting adjacent pads\",\"Heating every IC\"],\"oh\":[\"पृथक बोर्ड पर कोल्ड सततता परीक्षण\",\"अंधाधुंध मेन्स\",\"पास पैड शॉर्ट\",\"हर IC गरम\"],\"a\":0,\"ee\":\"De-energised continuity checks establish whether the copper path is open.\",\"eh\":\"डी-एनर्जाइज्ड सततता जाँच ताँबे का पथ खुला है या नहीं बताती है।\"},{\"n\":66,\"d\":\"H\",\"se\":\"A lifted PCB pad is most often caused by:\",\"sh\":\"उठा PCB पैड प्रायः किससे होता है:\",\"oe\":[\"Correct temperature\",\"ESD mat\",\"Flux cleaning only\",\"Excess heat and/or mechanical force\"],\"oh\":[\"सही ताप\",\"ESD मैट\",\"केवल फ्लक्स सफाई\",\"अधिक ताप और/या यांत्रिक बल\"],\"a\":3,\"ee\":\"Overheating weakens adhesive; pulling before solder is molten tears the pad.\",\"eh\":\"अधिक ताप चिपकाव कमजोर और अधपिघले जोड़ पर खिंचाव पैड उखाड़ता है।\"},{\"n\":67,\"d\":\"H\",\"se\":\"A solder bridge between adjacent IC pins causes:\",\"sh\":\"पास IC पिनों के बीच सोल्डर ब्रिज से:\",\"oe\":[\"An open circuit always\",\"Higher insulation\",\"Correct logic\",\"An unintended short circuit\"],\"oh\":[\"सदैव ओपन\",\"अधिक इन्सुलेशन\",\"सही लॉजिक\",\"अनचाहा शॉर्ट सर्किट\"],\"a\":3,\"ee\":\"Inspect under magnification and remove excess solder with flux and wick.\",\"eh\":\"आवर्धन में जाँचकर फ्लक्स और विक से अतिरिक्त सोल्डर हटाएँ।\"},{\"n\":68,\"d\":\"H\",\"se\":\"A sound broken-track repair uses:\",\"sh\":\"मजबूत टूटे-ट्रैक मरम्मत में:\",\"oe\":[\"A loose wire crossing pads\",\"Only glue without conductor\",\"A secured insulated jumper of adequate current rating\",\"A fuse bypass\"],\"oh\":[\"ढीला तार\",\"बिना चालक केवल गोंद\",\"उचित धारा रेटिंग का सुरक्षित इन्सुलेटेड जम्पर\",\"फ्यूज बायपास\"],\"a\":2,\"ee\":\"Restore electrical continuity and mechanical security, then inspect and test.\",\"eh\":\"विद्युत सततता और यांत्रिक मजबूती बहाल कर जाँचें।\"},{\"n\":69,\"d\":\"H\",\"se\":\"Lead-free solder generally requires:\",\"sh\":\"लेड-फ्री सोल्डर सामान्यतः चाहता है:\",\"oe\":[\"Unlimited temperature\",\"A suitable alloy profile and often higher working temperature\",\"No flux ever\",\"Water cooling while molten\"],\"oh\":[\"असीम
