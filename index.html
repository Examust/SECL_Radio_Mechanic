जुड़ा हुआ है, जिससे एक बंद निरंतर लूप (Closed continuous loop) बनता है। यह भौतिक लेआउट क्या है:\",\"oe\":[\"Star topology\",\"Bus topology\",\"Ring topology\",\"Mesh topology\"],\"oh\":[\"स्टार टोपोलॉजी (Star topology)\",\"बस टोपोलॉजी (Bus topology)\",\"रिंग टोपोलॉजी (Ring topology)\",\"मेश टोपोलॉजी (Mesh topology)\"],\"a\":2,\"ee\":\"In a Ring topology, data travels from node to node in a circle (often utilizing a token-passing mechanism like Token Ring).\",\"eh\":\"\"},{\"n\":15,\"d\":\"\",\"se\":\"In a DC power supply system, the 'ripple factor' is a direct measurement of:\",\"sh\":\"DC पावर सप्लाई सिस्टम में, 'रिपल फैक्टर' (Ripple factor) किसका सीधा माप है?\",\"oe\":[\"The efficiency of the step-down transformer\",\"The residual AC voltage component left in the DC output after rectification\",\"The exact load current drawn by the device\",\"The temperature of the heatsink\"],\"oh\":[\"स्टेप-डाउन ट्रांसफार्मर की दक्षता\",\"रेक्टिफिकेशन (Rectification) के बाद DC आउटपुट में बचा हुआ अवशिष्ट AC वोल्टेज घटक\",\"डिवाइस द्वारा खींचा गया सटीक लोड करंट\",\"हीटसिंक का तापमान\"],\"a\":1,\"ee\":\"A lower ripple factor indicates a &quot;smoother&quot; and higher-quality DC output.\",\"eh\":\"\"},{\"n\":16,\"d\":\"\",\"se\":\"Which of the following is the defining characteristic of a 'Directional' antenna (like a Yagi or Parabolic dish)?\",\"sh\":\"निम्नलिखित में से कौन सी एक 'दिशात्मक' एंटीना (Directional antenna जैसे यागी या पैराबोलिक डिश) की परिभाषित विशेषता है?\",\"oe\":[\"It radiates RF energy equally in a 360-degree circle\",\"It concentrates RF energy in a specific, narrow direction, significantly increasing gain\",\"It deliberately reduces the transmission range\",\"It only works for receiving signals, not transmitting\"],\"oh\":[\"यह सभी 360-डिग्री दिशाओं में समान रूप से RF ऊर्जा विकीर्ण (radiate) करता है\",\"यह RF ऊर्जा को एक विशिष्ट, संकीर्ण दिशा में केंद्रित करता है, जिससे गेन (Gain) में काफी वृद्धि होती है\",\"यह जानबूझकर ट्रांसमिशन रेंज को कम कर देता है\",\"यह केवल सिग्नल प्राप्त करने के लिए काम करता है, ट्रांसमिट करने के लिए नहीं\"],\"a\":1,\"ee\":\"By focusing the beam, directional antennas can shoot signals over very long distances (point-to-point links).\",\"eh\":\"\"},{\"n\":17,\"d\":\"\",\"se\":\"What is the primary purpose of a 'patch cord' in an optical fibre network?\",\"sh\":\"ऑप्टिकल फाइबर नेटवर्क में 'पैच कॉर्ड' (Patch cord) का प्राथमिक उद्देश्य क्या है?\",\"oe\":[\"To permanently fuse two underground fibres together\",\"To provide a short, flexible connection between active telecom equipment and the fibre patch panel\",\"To electrically amplify a weak optical signal\",\"To convert single-mode light into multimode light\"],\"oh\":[\"दो भूमिगत फाइबर को स्थायी रूप से फ्यूज (सप्लाई) करना\",\"सक्रिय टेलीकॉम उपकरणों और फाइबर पैच पैनल के बीच एक छोटा, लचीला (flexible) कनेक्शन प्रदान करना\",\"कमजोर ऑप्टिकल सिग्नल को विद्युत रूप से बढ़ाना\",\"सिंगल-मोड लाइट को मल्टीमोड लाइट में बदलना\"],\"a\":1,\"ee\":\"Patch cords (jumpers) are pre-connectorized short cables used for routing and cross-connections inside server racks.\",\"eh\":\"\"},{\"n\":18,\"d\":\"\",\"se\":\"What is the maximum theoretical data transfer rate of a USB 2.0 (High-Speed) interface?\",\"sh\":\"USB 2.0 (हाई-स्पीड) इंटरफ़ेस की अधिकतम सैद्धांतिक डेटा ट्रांसफर दर (Data transfer rate) क्या है?\",\"oe\":[\"12 Mbps\",\"480 Mbps\",\"5 Gbps\",\"10 Gbps\"],\"oh\":[\"12 Mbps\",\"480 Mbps\",\"5 Gbps\",\"10 Gbps\"],\"a\":1,\"ee\":\"USB 1.1 operates at 12 Mbps, USB 2.0 at 480 Mbps, and USB 3.0 jumps to 5 Gbps.\",\"eh\":\"\"},{\"n\":19,\"d\":\"\",\"se\":\"In a Li-ion Battery Management System (BMS), the critical function of 'Cell Balancing' ensures that:\",\"sh\":\"Li-ion बैटरी मैनेजमेंट सिस्टम (BMS) में, 'सेल बैलेंसिंग' (Cell Balancing) का महत्वपूर्ण कार्य यह सुनिश्चित करता है कि:\",\"oe\":[\"The physical weight of the battery is distributed evenly\",\"All individual cells are maintained at the same State of Charge (SOC) to prevent catastrophic overcharging of weaker cells\",\"The DC current is converted to AC\",\"The battery operates at extreme sub-zero temperatures\"],\"oh\":[\"बैटरी का भौतिक वजन समान रूप से वितरित हो\",\"कमजोर सेल की विनाशकारी ओवरचार्जिंग को रोकने के लिए सभी अलग-अलग सेल समान 'स्टेट ऑफ चार्ज' (SOC) पर बनाए रखे जाएं\",\"DC करंट AC में बदल जाए\",\"बैटरी अत्यधिक उप-शून्य (sub-zero) तापमान पर काम करे\"],\"a\":1,\"ee\":\"Without balancing, a single degraded cell could overcharge and catch fire while the rest of the pack is still charging.\",\"eh\":\"\"},{\"n\":20,\"d\":\"\",\"se\":\"In microwave transmission, which of the following is technically a physical transmission line, but NOT classified as a hollow 'waveguide'?\",\"sh\":\"माइक्रोवेव ट्रांसमिशन में, निम्नलिखित में से कौन तकनीकी रूप से एक भौतिक ट्रांसमिशन लाइन है, लेकिन एक खोखले 'वेवगाइड' (Hollow waveguide) के रूप में वर्गीकृत नहीं है?\",\"oe\":[\"Rectangular waveguide\",\"Circular waveguide\",\"Coaxial cable\",\"Elliptical waveguide\"],\"oh\":[\"आयताकार वेवगाइड (Rectangular waveguide)\",\"वृत्ताकार वेवगाइड (Circular waveguide)\",\"समाक्षीय केबल (Coaxial cable)\",\"अण्डाकार वेवगाइड (Elliptical waveguide)\"],\"a\":2,\"ee\":\"A coaxial cable relies on an inner central conductor and an outer shield. True waveguides are simply hollow conductive metal pipes.\",\"eh\":\"\"},{\"n\":21,\"d\":\"\",\"se\":\"Image-based: On a computer motherboard, the longest expansion slot is labeled 'PCIe x16'. This slot is almost exclusively utilized for installing:\",\"sh\":\"\",\"oe\":[\"A dedicated Graphics Card (GPU)\",\"System RAM modules\",\"A SATA Hard drive\",\"The BIOS chip\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Peripheral Component Interconnect Express (PCIe) x16 provides 16 data lanes, offering the massive bandwidth required by GPUs.\",\"eh\":\"\"},{\"n\":22,\"d\":\"\",\"se\":\"What is the function of a 'circulator' in advanced microwave and RF radar systems?\",\"sh\":\"\",\"oe\":[\"To allow microwave signals to flow in only one sequential direction (e.g., Port 1 to 2, but not 2 to 1)\",\"To physically split one signal into four equal parts\",\"To amplify weak signals\",\"To generate the carrier frequency\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"A circulator is a non-reciprocal component used extensively to allow a transmitter and receiver to share the same antenna.\",\"eh\":\"\"},{\"n\":23,\"d\":\"\",\"se\":\"In optical fibre theory, the 'cutoff wavelength' is defined as the specific wavelength above which:\",\"sh\":\"\",\"oe\":[\"The fibre operates strictly as a Single-Mode fibre, allowing only one path of light\",\"The fibre operates strictly as a Multimode fibre\",\"The glass completely absorbs the light\",\"The dispersion becomes infinitely large\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"If light below the cutoff wavelength is injected, the single-mode fibre will briefly act like a multimode fibre, causing signal distortion.\",\"eh\":\"\"},{\"n\":24,\"d\":\"\",\"se\":\"Which of the following is a mandatory standard safety practice when handling exposed, highly sensitive telecom circuit boards?\",\"sh\":\"\",\"oe\":[\"Working rapidly on a fully carpeted floor\",\"Wearing a grounded anti-static wrist strap to prevent Electrostatic Discharge (ESD)\",\"Using highly magnetized screwdrivers\",\"Touching the copper traces to check for heat\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Humans can build up thousands of volts of static electricity, which can instantly fry a microprocessor upon touch.\",\"eh\":\"\"},{\"n\":25,\"d\":\"\",\"se\":\"For a standard, non-gaming computer monitor or CCTV display screen, the baseline flicker-free refresh rate is typically:\",\"sh\":\"\",\"oe\":[\"24 Hz\",\"30 Hz\",\"60 Hz\",\"144 Hz\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"60 Hertz (updating the image 60 times per second) has been the global baseline standard for smooth LCD/LED monitors for decades.\",\"eh\":\"\"},{\"n\":26,\"d\":\"\",\"se\":\"In Unshielded Twisted Pair (UTP) networking cables, the fundamental physical purpose of twisting the wire pairs is to:\",\"sh\":\"\",\"oe\":[\"Increase the physical tensile strength of the cable\",\"Cancel out Electromagnetic Interference (EMI) and prevent crosstalk between adjacent pairs\",\"Slow down the signal to match the speed of the switch\",\"Reduce the amount of copper needed\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"The twists ensure that any external magnetic noise induces equal but opposite currents in the two wires, naturally canceling the noise out.\",\"eh\":\"\"},{\"n\":27,\"d\":\"\",\"se\":\"Which of the following is the most ubiquitous Wireless Personal Area Network (WPAN) technology used for short-range device pairing?\",\"sh\":\"\",\"oe\":[\"Wi-Fi (802.11)\",\"Bluetooth (802.15.1)\",\"LoRa\",\"WiMAX\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"WPANs cover a very small personal space (typically 10 meters). Bluetooth is the universal standard for this.\",\"eh\":\"\"},{\"n\":28,\"d\":\"\",\"se\":\"On modern monitors and NVRs, what does the acronym 'HDMI' stand for?\",\"sh\":\"\",\"oe\":[\"High-Definition Multimedia Interface\",\"High-Density Media Input\",\"High-Speed Digital Media Interface\",\"Hybrid Data Media Interface\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"HDMI is a proprietary audio/video interface for transmitting uncompressed video and compressed/uncompressed digital audio.\",\"eh\":\"\"},{\"n\":29,\"d\":\"\",\"se\":\"In cellular mobile networks, the critical process known as 'Handoff' or 'Handover' refers to:\",\"sh\":\"\",\"oe\":[\"Switching an active call seamlessly from one base station's coverage cell to another as the user moves\",\"Transferring data from a phone to a PC via cable\",\"Upgrading a phone's firmware over the air\",\"Switching a phone from Wi-Fi to mobile data\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"The core network coordinates handovers to ensure calls do not drop while driving along a highway.\",\"eh\":\"\"},{\"n\":30,\"d\":\"\",\"se\":\"Image-based: Look at a standard USB 2.0 Type-A connector (the flat rectangular plug). How many metal contact pins does it internally contain?\",\"sh\":\"\",\"oe\":[\"4 pins\",\"5 pins\",\"9 pins\",\"24 pins\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"USB 2.0 features exactly 4 pins: VBUS (5V Power), Data Negative (D-), Data Positive (D+), and Ground (GND).\",\"eh\":\"\"},{\"n\":31,\"d\":\"\",\"se\":\"What is the supreme operational advantage of running Optical Fibre over Copper wire when connecting remote boom barriers or distant outdoor CCTV poles?\",\"sh\":\"\",\"oe\":[\"Fibre requires much thicker, heavier conduits\",\"Fibre is completely immune to devastating lightning strikes and massive ground-loop currents\",\"Fibre cable can carry 230V AC power internally\",\"Fibre is much cheaper to terminate\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Because glass does not conduct electricity, outdoor fibre links will not carry a lightning surge back into the central server room.\",\"eh\":\"\"},{\"n\":32,\"d\":\"\",\"se\":\"When turning the dial on a digital multimeter to the 'Hz' setting, the technician is preparing to measure:\",\"sh\":\"\",\"oe\":[\"Resistance in Ohms\",\"Frequency in cycles per second\",\"DC Voltage\",\"Current duty cycle\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Hz stands for Hertz, the universal unit of frequency.\",\"eh\":\"\"},{\"n\":33,\"d\":\"\",\"se\":\"The term 'Orthogonal' used in advanced QAM (Quadrature Amplitude Modulation) radio transmission indicates that the two carrier waves are:\",\"sh\":\"\",\"oe\":[\"Exactly in phase with each other\",\"Out of phase by exactly 90 degrees\",\"Operating on completely different frequency bands\",\"Traveling in opposite physical directions\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"The In-phase (I) and Quadrature (Q) components are shifted by 90°, allowing them to be modulated independently without interfering with each other.\",\"eh\":\"\"},{\"n\":34,\"d\":\"\",\"se\":\"What is the specific function of the 'Rectifier' module inside an Online Double-Conversion UPS system?\",\"sh\":\"\",\"oe\":[\"To convert battery DC back into AC for the server load\",\"To convert incoming raw AC mains into DC to simultaneously charge the batteries and feed the inverter\",\"To bypass the UPS during a fault\",\"To filter out harmonic audio noise\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"In an Online UPS, the AC grid power never directly touches the load. It is rectified to DC first.\",\"eh\":\"\"},{\"n\":35,\"d\":\"\",\"se\":\"To boost a weak optical signal without converting it back to electricity, long-haul DWDM fibre systems rely heavily on which type of optical amplifier?\",\"sh\":\"\",\"oe\":[\"EDFA (Erbium-Doped Fibre Amplifier)\",\"Avalanche Photodiode (APD)\",\"Transimpedance Amplifier\",\"Digital Signal Processor (DSP)\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"An EDFA uses a short length of erbium-doped fibre and a &quot;pump laser&quot; to directly amplify light signals (typically around the 1550 nm window).\",\"eh\":\"\"},{\"n\":36,\"d\":\"\",\"se\":\"Modern CCTV NVRs employ algorithmic 'Motion Detection'. How does the CPU primarily detect this motion?\",\"sh\":\"\",\"oe\":[\"By utilizing an internal radar sensor\",\"By rapidly comparing the difference in pixels between sequential video frames\",\"By detecting the physical heat of humans on the camera body\",\"By utilizing GPS tracking\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Software motion detection looks for groups of pixels that change color/brightness from one frame to the next.\",\"eh\":\"\"},{\"n\":37,\"d\":\"\",\"se\":\"In classic RS-232 serial communication, what voltage levels are specified to represent binary logic states?\",\"sh\":\"\",\"oe\":[\"0V for logic 0, and +5V for logic 1\",\"+3V to +15V for logic 0, and -3V to -15V for logic 1\",\"0V for logic 0, and +3.3V for logic 1\",\"Exactly +12V and -12V only\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"RS-232 uses large, bipolar voltage swings to ensure the signal can survive long cable runs in noisy environments.\",\"eh\":\"\"},{\"n\":38,\"d\":\"\",\"se\":\"The directional 'Gain' of an RF antenna is universally measured and expressed in which unit?\",\"sh\":\"\",\"oe\":[\"Watts (W)\",\"Decibel-milliwatts (dBm)\",\"Decibels relative to an isotropic radiator (dBi)\",\"Ohms (Ω)\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"dBi measures how much an antenna focuses its energy compared to a theoretical antenna that radiates equally in a perfect sphere.\",\"eh\":\"\"},{\"n\":39,\"d\":\"\",\"se\":\"Image-based: A diagram breaks down an Ethernet frame into Header, Payload, and Trailer. In which section is the Destination MAC Address located?\",\"sh\":\"\",\"oe\":[\"The Payload\",\"The Header\",\"The Trailer (FCS)\",\"The Preamble\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Network switches read the first part of the frame (the Header) to quickly determine where to send the packet.\",\"eh\":\"\"},{\"n\":40,\"d\":\"\",\"se\":\"If a desktop PC uses a high-end 500W SMPS (Power Supply Unit), what does the 500W rating imply?\",\"sh\":\"\",\"oe\":[\"It continuously draws exactly 500W from the wall socket at all times\",\"500W is its maximum safe output capacity; it will only draw as much power as the PC components demand at that moment\",\"It outputs a constant 500 Volts\",\"It consumes 500W even when the computer is turned off\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"A 500W PSU powering an idle computer might only draw 50W from the wall.\",\"eh\":\"\"},{\"n\":41,\"d\":\"\",\"se\":\"In commercial fire alarm systems, the sensor device that detects smoke by sensing light scattered by smoke particles inside a chamber is called a:\",\"sh\":\"\",\"oe\":[\"Ionisation smoke detector\",\"Photoelectric (Optical) smoke detector\",\"Rate-of-Rise heat detector\",\"Ultraviolet flame detector\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Photoelectric detectors are excellent at detecting smoldering, smoky fires typical of burning cables/PVC.\",\"eh\":\"\"},{\"n\":42,\"d\":\"\",\"se\":\"In digital communication circuitry, what is the primary purpose of a PLL (Phase-Locked Loop)?\",\"sh\":\"\",\"oe\":[\"To generate, synchronize, or recover a clock frequency with absolute phase precision\",\"To physically amplify microwave signals\",\"To demodulate AM radio signals\",\"To step down AC voltage\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"A PLL is a feedback system that ensures an internal oscillator stays perfectly locked to an external reference signal.\",\"eh\":\"\"},{\"n\":43,\"d\":\"\",\"se\":\"Which of the following items is NOT considered part of the passive 'Structured Cabling' infrastructure in a telecom room?\",\"sh\":\"\",\"oe\":[\"Patch panels\",\"Horizontal UTP cabling\",\"Main Distribution Frame (MDF)\",\"Network Core Switch\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Switches and routers are &quot;Active&quot; equipment. Structured cabling refers only to the passive wiring, jacks, and panels.\",\"eh\":\"\"},{\"n\":44,\"d\":\"\",\"se\":\"In a cellular GSM architecture, the HLR (Home Location Register) acts as the central database storing:\",\"sh\":\"\",\"oe\":[\"Only temporary visitor logs\",\"Permanent subscriber identities, billing statuses, and allowed service profiles (SIM data)\",\"Physical cell tower coordinates\",\"SMS text message contents\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"The HLR is the core database. When you travel, the HLR sends a copy of your profile to the local VLR (Visitor Location Register).\",\"eh\":\"\"},{\"n\":45,\"d\":\"\",\"se\":\"In highly advanced multi-core optical fibres, the physical distance between the centers of two adjacent cores is termed the:\",\"sh\":\"\",\"oe\":[\"Pitch\",\"Core-cladding ratio\",\"Numerical aperture spread\",\"Cutoff boundary\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"The pitch must be carefully engineered to prevent signals from leaking (crosstalk) from one core into another.\",\"eh\":\"\"},{\"n\":46,\"d\":\"\",\"se\":\"Which sophisticated instrument uses the principle of TDR (Time Domain Reflectometry) to locate shorts, opens, and exact cable lengths in copper networks?\",\"sh\":\"\",\"oe\":[\"Digital Multimeter\",\"Cable Fault Locator / TDR Meter\",\"Megger\",\"Tong Tester\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"A TDR sends an electrical pulse down a copper cable and measures the time it takes for the echo to return from a fault. (OTDR does this for light/fibre).\",\"eh\":\"\"},{\"n\":47,\"d\":\"\",\"se\":\"The IEEE 802.3at networking standard, commonly marketed as 'PoE+', guarantees up to how much DC power at the switch port?\",\"sh\":\"\",\"oe\":[\"Up to 15.4W\",\"Up to 30.0W\",\"Up to 60.0W\",\"Up to 100.0W\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Standard PoE (802.3af) delivers 15.4W. PoE+ (802.3at) steps up to 30W to power heavier devices like PTZ cameras.\",\"eh\":\"\"},{\"n\":48,\"d\":\"\",\"se\":\"Upon powering on a computer, the critical BIOS (Basic Input/Output System) code is loaded from which hardware component?\",\"sh\":\"\",\"oe\":[\"The mechanical Hard Drive\",\"A non-volatile ROM / Flash memory chip permanently affixed to the motherboard\",\"The CPU's L1 Cache\",\"The system RAM\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"The BIOS must be stored in non-volatile memory so it is immediately available the millisecond the PC receives power.\",\"eh\":\"\"},{\"n\":49,\"d\":\"\",\"se\":\"What is the fundamental function of an 'EMI / Noise Filter' placed at the AC inlet of an SMPS?\",\"sh\":\"\",\"oe\":[\"To smooth out the 50Hz DC ripple\",\"To suppress high-frequency electromagnetic noise, preventing it from entering the supply or escaping back into the power grid\",\"To act as a main circuit breaker\",\"To lower the voltage to 12V\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Switching power supplies generate massive high-frequency noise; filters ensure they comply with FCC/CE emission standards.\",\"eh\":\"\"},{\"n\":50,\"d\":\"\",\"se\":\"Image-based: A diagram shows a metal, cylindrical connector featuring a slotted bayonet locking mechanism, pushed on and twisted a quarter-turn. This is undeniably a:\",\"sh\":\"\",\"oe\":[\"RJ-45 Connector\",\"BNC Connector\",\"LC Fibre Connector\",\"USB Type-C Connector\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"The Bayonet Neill–Concelman (BNC) connector is the global standard for rapid termination of RF and analog video coaxial cables.\",\"eh\":\"\"},{\"n\":51,\"d\":\"\",\"se\":\"In the context of internet browsing, what exactly is a 'Cookie'?\",\"sh\":\"\",\"oe\":[\"A small text file stored on the user's device by a web browser to track sessions and preferences\",\"A highly destructive Trojan virus\",\"A hardware firewall appliance\",\"A protocol for encrypting emails\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Cookies remember your login state, shopping cart contents, and site preferences.\",\"eh\":\"\"},{\"n\":52,\"d\":\"\",\"se\":\"Because light travels slightly slower through glass than in a vacuum, the approximate propagation delay of light traveling through 1 kilometre of optical fibre is:\",\"sh\":\"\",\"oe\":[\"~ 1 microsecond (1 µs)\",\"~ 5 microseconds (5 µs)\",\"~ 100 microseconds (100 µs)\",\"~ 1 millisecond (1 ms)\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Light travels at ~200,000 km/s in glass (refractive index ~1.5). Time = Distance/Speed = 1 / 200,000 = 0.000005 seconds = 5 µs.\",\"eh\":\"\"},{\"n\":53,\"d\":\"\",\"se\":\"Which of the following is a recognized 'Spread Spectrum' modulation technique designed to resist interference, widely utilized in early Wi-Fi and Bluetooth?\",\"sh\":\"\",\"oe\":[\"DSSS (Direct Sequence Spread Spectrum)\",\"FHSS (Frequency Hopping Spread Spectrum)\",\"Both A and B\",\"QAM\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"FHSS rapidly switches frequencies (used in Bluetooth). DSSS spreads the signal across a wider band (used in 802.11b Wi-Fi).\",\"eh\":\"\"},{\"n\":54,\"d\":\"\",\"se\":\"In professional Day/Night CCTV cameras, what is the mechanical purpose of the 'IR Cut-Filter'?\",\"sh\":\"\",\"oe\":[\"It blocks invisible Infrared light during the day to ensure accurate colour representation, and physically swings away at night to allow IR night-vision\",\"It cuts the power to the camera if it overheats\",\"It filters out audio noise on the microphone\",\"It increases the megapixel resolution\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Without an IR cut-filter in sunlight, green leaves look white/pink and black clothes look grey due to natural IR pollution.\",\"eh\":\"\"},{\"n\":55,\"d\":\"\",\"se\":\"A standard 25W to 60W soldering iron operated at 230V AC will typically have a heating element resistance in the range of:\",\"sh\":\"\",\"oe\":[\"1 to 10 Ω\",\"50 to 100 Ω\",\"500 to 2000 Ω\",\"Over 100,000 Ω\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Using Power = Voltage² / Resistance. For a 60W iron: 230² / 60 = ~880 Ohms. For a 25W iron: 230² / 25 = ~2116 Ohms.\",\"eh\":\"\"},{\"n\":56,\"d\":\"\",\"se\":\"In radio frequency (RF) transceiver design, the process of 'Mixing' is utilized to:\",\"sh\":\"\",\"oe\":[\"Convert a signal from one frequency to another (up-conversion or down-conversion) by combining it with a local oscillator\",\"Amplify a very weak signal to a strong one\",\"Filter out low-frequency noise\",\"Modulate digital bits into an analog wave\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Mixers are the heart of heterodyne receivers, shifting high RF frequencies down to manageable Intermediate Frequencies (IF).\",\"eh\":\"\"},{\"n\":57,\"d\":\"\",\"se\":\"What is the protective purpose of placing an RC 'Snubber Circuit' across the contacts of a mechanical relay?\",\"sh\":\"\",\"oe\":[\"To dramatically increase the switching speed of the relay\",\"To suppress extreme high-voltage spikes and prevent destructive sparking (arcing) when breaking an inductive load\",\"To reduce the AC mains voltage to 12V\",\"To act as a backup battery\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Without a snubber, the back-EMF from a motor/coil will arc across the relay contacts, welding them shut or destroying them over time.\",\"eh\":\"\"},{\"n\":58,\"d\":\"\",\"se\":\"Which of the following is formatted correctly as a physical MAC address?\",\"sh\":\"\",\"oe\":[\"192.168.1.254\",\"00:1A:2B:3C:4D:5E\",\"2001:0db8:85a3::8a2e:0370\",\"255.255.255.0\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"A MAC address is a 48-bit identifier represented as six groups of two hexadecimal digits, separated by hyphens or colons.\",\"eh\":\"\"},{\"n\":59,\"d\":\"\",\"se\":\"For an optical fibre to successfully guide light via Total Internal Reflection, the glass cladding must have a Refractive Index that is:\",\"sh\":\"\",\"oe\":[\"Significantly greater than the core\",\"Slightly less than the core\",\"Exactly equal to the core\",\"Completely zero\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Light stays trapped in the core only if the surrounding cladding has a lower optical density (lower refractive index).\",\"eh\":\"\"},{\"n\":60,\"d\":\"\",\"se\":\"The speed or 'Data Rate' of a digital telecommunication channel is standardly measured in:\",\"sh\":\"\",\"oe\":[\"Bits per second (bps)\",\"Hertz (Hz)\",\"Baud rate only\",\"Ohms (Ω)\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"While bandwidth is measured in Hertz, the actual digital throughput is universally measured in bits per second (Kbps, Mbps, Gbps).\",\"eh\":\"\"},{\"n\":61,\"d\":\"\",\"se\":\"The sum of three consecutive odd numbers is exactly 51. What is the value of the largest number in this group?\",\"sh\":\"लगातार तीन विषम संख्याओं (consecutive odd numbers) का योग ठीक 51 है। इस समूह में सबसे बड़ी संख्या का मान क्या है?\",\"oe\":[\"15\",\"17\",\"19\",\"21\"],\"oh\":[\"15\",\"17\",\"19\",\"21\"],\"a\":2,\"ee\":\"Let the numbers be x, x+2, and x+4. (x) + (x+2) + (x+4) = 51. 3x + 6 = 51. 3x = 45. x = 15. The numbers are 15, 17, 19.\",\"eh\":\"संख्याएं x, x+2, और x+4 हैं। 3x + 6 = 51. x = 15. सबसे बड़ी संख्या 15+4=19 है।\"},{\"n\":62,\"d\":\"\",\"se\":\"Identify the next term in the progression: 1, 9, 25, 49, 81, ?\",\"sh\":\"प्रगति (Progression) में अगले पद (term) को पहचानें: 1, 9, 25, 49, 81, ?\",\"oe\":[\"100\",\"121\",\"144\",\"169\"],\"oh\":[\"100\",\"121\",\"144\",\"169\"],\"a\":1,\"ee\":\"The series consists of the squares of odd numbers: 1², 3², 5², 7², 9². The next odd number is 11. 11² = 121.\",\"eh\":\"1², 3², 5², 7², 9²। अगला विषम वर्ग 11² = 121 है।\"},{\"n\":63,\"d\":\"\",\"se\":\"If in a simple number cipher A = 1, B = 2, C = 3 ... Z = 26, what is the numerical sum value of the word 'CAT'?\",\"sh\":\"यदि एक साधारण अक्षर-संख्या कोड में A = 1, B = 2, C = 3 ... Z = 26 है, तो शब्द 'CAT' का संख्यात्मक योग (sum) क्या होगा?\",\"oe\":[\"20\",\"21\",\"22\",\"24\"],\"oh\":[\"20\",\"21\",\"22\",\"24\"],\"a\":3,\"ee\":\"C = 3, A = 1, T = 20. Sum = 3 + 1 + 20 = 24.\",\"eh\":\"\"},{\"n\":64,\"d\":\"\",\"se\":\"Calculate the following: What is 20% of 20% of the number 200?\",\"sh\":\"निम्नलिखित की गणना करें: संख्या 200 के 20% का 20% क्या है?\",\"oe\":[\"4\",\"8\",\"10\",\"20\"],\"oh\":[\"4\",\"8\",\"10\",\"20\"],\"a\":1,\"ee\":\"First, 20% of 200 = 40. Next, 20% of 40 = 8. (Alternatively: 0.2 × 0.2 × 200 = 8).\",\"eh\":\"\"},{\"n\":65,\"d\":\"\",\"se\":\"At exactly 4:30 PM, what is the interior angle formed between the hour hand and the minute hand of an analog clock?\",\"sh\":\"ठीक शाम 4:30 बजे, एनालॉग घड़ी की घंटे की सूई और मिनट की सूई के बीच बनने वाला आंतरिक कोण (Interior angle) क्या होता है?\",\"oe\":[\"45°\",\"55°\",\"60°\",\"75°\"],\"oh\":[\"45°\",\"55°\",\"60°\",\"75°\"],\"a\":0,\"ee\":\"Use the formula: |(30 × H) - (5.5 × M)|. |(30 × 4) - (5.5 × 30)| = |120 - 165| = 45°.\",\"eh\":\"\"},{\"n\":67,\"d\":\"\",\"se\":\"Find the missing term in the Fibonacci-style series: 3, 5, 8, 13, 21, ?\",\"sh\":\"फाइबोनैचि-शैली की श्रृंखला में लुप्त पद ज्ञात करें: 3, 5, 8, 13, 21, ?\",\"oe\":[\"30\",\"31\",\"32\",\"34\"],\"oh\":[\"30\",\"31\",\"32\",\"34\"],\"a\":3,\"ee\":\"Each number is the sum of the two preceding numbers. 13 + 21 = 34.\",\"eh\":\"\"},{\"n\":68,\"d\":\"\",\"se\":\"If 2x + 3 = 11, what is the mathematical value of (x² - 1)?\",\"sh\":\"यदि 2x + 3 = 11 है, तो (x² - 1) का गणितीय मान क्या है?\",\"oe\":[\"12\",\"13\",\"14\",\"15\"],\"oh\":[\"12\",\"13\",\"14\",\"15\"],\"a\":3,\"ee\":\"2x = 11 - 3 = 8. x = 4. Therefore, (4²) - 1 = 16 - 1 = 15.\",\"eh\":\"2x = 8. x = 4. 4² - 1 = 15.\"},{\"n\":69,\"d\":\"\",\"se\":\"In a classroom of exactly 40 students, 60% of the class are boys. How many girls are in the class?\",\"sh\":\"ठीक 40 छात्रों की एक कक्षा में, 60% लड़के हैं। कक्षा में कितनी लड़कियाँ हैं?\",\"oe\":[\"12\",\"14\",\"16\",\"18\"],\"oh\":[\"12\",\"14\",\"16\",\"18\"],\"a\":2,\"ee\":\"Boys = 60% of 40 = 24. Girls = Total - Boys = 40 - 24 = 16. (Or, 40% of 40 = 16).\",\"eh\":\"\"},{\"n\":70,\"d\":\"\",\"se\":\"Complete the logic analogy: 'Book' is to 'Reading' as 'Knife' is to '_____'.\",\"sh\":\"तर्क सादृश्य (Analogy) पूरा करें: 'किताब' (Book) का संबंध 'पढ़ने' से है, वैसे ही 'चाकू' (Knife) का संबंध '_____' से है।\",\"oe\":[\"Cutting\",\"Eating\",\"Sharpening\",\"Cooking\"],\"oh\":[\"काटने (Cutting)\",\"खाने\",\"तेज करने\",\"पकाने\"],\"a\":0,\"ee\":\"The primary intended function of a book is reading; the primary intended function of a knife is cutting.\",\"eh\":\"\"},{\"n\":71,\"d\":\"\",\"se\":\"The arithmetic average of 4 different numbers is 20. If one of those numbers is explicitly known to be 30, what is the average of the remaining three numbers?\",\"sh\":\"4 अलग-अलग संख्याओं का अंकगणितीय औसत (Average) 20 है। यदि यह स्पष्ट रूप से ज्ञात है कि उनमें से एक संख्या 30 है, तो शेष तीन संख्याओं का औसत क्या है?\",\"oe\":[\"10.00\",\"16.67\",\"18.33\",\"20.00\"],\"oh\":[\"10.00\",\"16.67\",\"18.33\",\"20.00\"],\"a\":1,\"ee\":\"Total sum of 4 numbers = 4 × 20 = 80. Subtract the known number (80 - 30) = 50. Average of remaining 3 = 50 / 3 = 16.666...\",\"eh\":\"\"},{\"n\":72,\"d\":\"\",\"se\":\"What is 25% of the number 200?\",\"sh\":\"संख्या 200 का 25% क्या है?\",\"oe\":[\"25\",\"40\",\"50\",\"100\"],\"oh\":[\"25\",\"40\",\"50\",\"100\"],\"a\":2,\"ee\":\"25% is exactly one-quarter (1/4). 200 / 4 = 50.\",\"eh\":\"\"},{\"n\":73,\"d\":\"\",\"se\":\"Which of the following numbers is mathematically a 'Prime Number'?\",\"sh\":\"निम्नलिखित में से कौन सी संख्या गणितीय रूप से 'अभाज्य संख्या' (Prime Number) है?\",\"oe\":[\"87\",\"91\",\"97\",\"99\"],\"oh\":[\"87\",\"91\",\"97\",\"99\"],\"a\":2,\"ee\":\"87 is divisible by 3. 91 is divisible by 7 and 13. 99 is divisible by 3 and 9. 97 is only divisible by 1 and itself.\",\"eh\":\"\"},{\"n\":74,\"d\":\"\",\"se\":\"If the total area of a square is 144 cm², what is the exact length of its diagonal?\",\"sh\":\"यदि एक वर्ग (Square) का कुल क्षेत्रफल 144 सेमी² है, तो इसके विकर्ण (Diagonal) की सटीक लंबाई क्या है?\",\"oe\":[\"10 cm\",\"12√2 cm\",\"14 cm\",\"16√2 cm\"],\"oh\":[\"10 cm\",\"12√2 cm\",\"14 cm\",\"16√2 cm\"],\"a\":1,\"ee\":\"Side of square = √144 = 12 cm. The diagonal of a square formula is (Side × √2). Therefore, 12√2 cm.\",\"eh\":\"\"},{\"n\":75,\"d\":\"\",\"se\":\"Calculate the Highest Common Factor (HCF) of the numbers 36 and 48.\",\"sh\":\"संख्याओं 36 और 48 के महत्तम समापवर्तक (HCF) की गणना करें।\",\"oe\":[\"6\",\"8\",\"12\",\"16\"],\"oh\":[\"6\",\"8\",\"12\",\"16\"],\"a\":2,\"ee\":\"The factors of 36 are 1, 2, 3, 4, 6, 9, 12, 18, 36. The factors of 48 are 1, 2, 3, 4, 6, 8, 12, 16, 24, 48. The highest common is 12.\",\"eh\":\"\"},{\"n\":76,\"d\":\"\",\"se\":\"A freight train 150 meters long crosses a stationary telegraph pole in exactly 10 seconds. What is the speed of the train in km/h?\",\"sh\":\"एक मालगाड़ी जिसकी लंबाई 150 मीटर है, एक स्थिर टेलीग्राफ पोल को ठीक 10 सेकंड में पार करती है। किमी/घंटा (km/h) में ट्रेन की गति क्या है?\",\"oe\":[\"48 km/h\",\"54 km/h\",\"60 km/h\",\"72 km/h\"],\"oh\":[\"48 km/h\",\"54 km/h\",\"60 km/h\",\"72 km/h\"],\"a\":1,\"ee\":\"Speed in m/s = Distance / Time = 150 / 10 = 15 m/s. Convert to km/h by multiplying by (18/5). 15 × (18/5) = 54 km/h.\",\"eh\":\"\"},{\"n\":77,\"d\":\"\",\"se\":\"Identify the next letter in the logical series: B, D, G, K, P, ?\",\"sh\":\"तार्किक श्रृंखला (Logical series) में अगले अक्षर को पहचानें: B, D, G, K, P, ?\",\"oe\":[\"T\",\"U\",\"V\",\"W\"],\"oh\":[\"T\",\"U\",\"V\",\"W\"],\"a\":2,\"ee\":\"The gap increases by 1 each time. B(+2)-&gt;D(+3)-&gt;G(+4)-&gt;K(+5)-&gt;P(+6)-&gt;V. (Letter 16 + 6 = Letter 22, which is V).\",\"eh\":\"\"},{\"n\":78,\"d\":\"\",\"se\":\"A mechanic sells a faulty tool for ₹450, suffering a 10% loss on his initial investment. What was the original Cost Price (CP)?\",\"sh\":\"एक मैकेनिक 10% के नुकसान (loss) पर ₹450 में एक दोषपूर्ण उपकरण बेचता है। उसका मूल लागत मूल्य (CP) क्या था?\",\"oe\":[\"₹400\",\"₹480\",\"₹500\",\"₹550\"],\"oh\":[\"₹400\",\"₹480\",\"₹500\",\"₹550\"],\"a\":2,\"ee\":\"Selling Price = 90% of Cost Price. 450 = 0.90 × CP. CP = 450 / 0.90 = ₹500.\",\"eh\":\"\"},{\"n\":79,\"d\":\"\",\"se\":\"How many total calendar days are there in a standard Leap Year?\",\"sh\":\"एक मानक लीप वर्ष (Leap Year) में कुल कितने कैलेंडर दिन होते हैं?\",\"oe\":[\"364\",\"365\",\"366\",\"367\"],\"oh\":[\"364\",\"365\",\"366\",\"367\"],\"a\":2,\"ee\":\"A leap year contains an extra day (February 29th), totaling 366 days.\",\"eh\":\"\"},{\"n\":80,\"d\":\"\",\"se\":\"According to fundamental trigonometric identities, what is the calculated value of (sin² 45° + cos² 45°)?\",\"sh\":\"मौलिक त्रिकोणमितीय सर्वसमिकाओं (Trigonometric identities) के अनुसार, (sin² 45° + cos² 45°) का परिकलित मान क्या है?\",\"oe\":[\"0\",\"0.5\",\"1\",\"2\"],\"oh\":[\"0\",\"0.5\",\"1\",\"2\"],\"a\":2,\"ee\":\"The Pythagorean trigonometric identity dictates that sin²θ + cos²θ = 1 for any angle θ.\",\"eh\":\"\"},{\"n\":81,\"d\":\"\",\"se\":\"For outstanding efforts in environmental conservation, mine reclamation, and massive Miyawaki-style afforestation, SECL has been previously recognized under which national initiative?\",\"sh\":\"पर्यावरण संरक्षण, खदान सुधार (mine reclamation), और बड़े पैमाने पर मियावाकी-शैली (Miyawaki) वनीकरण में उत्कृष्ट प्रयासों के लिए, SECL को पहले किस राष्ट्रीय पहल के तहत मान्यता दी गई है?\",\"oe\":[\"Make in India Award\",\"Swachh Bharat Mission (Cleanliness and Environment initiatives)\",\"Skill India\",\"Digital India\"],\"oh\":[\"मेक इन इंडिया अवार्ड\",\"स्वच्छ भारत मिशन (स्वच्छता और पर्यावरण पहल)\",\"स्किल इंडिया\",\"डिजिटल इंडिया\"],\"a\":1,\"ee\":\"SECL has won prestigious awards under Swachhata Pakhwada and Swachh Bharat for turning degraded mining land into eco-parks.\",\"eh\":\"\"},{\"n\":82,\"d\":\"\",\"se\":\"The spectacular 'Kanger Valley National Park', known for its dense forests, limestone caves, and waterfalls, is located in which district of Chhattisgarh?\",\"sh\":\"घने जंगलों, चूना पत्थर की गुफाओं और झरनों के लिए प्रसिद्ध शानदार 'कांगेर घाटी राष्ट्रीय उद्यान' (Kanger Valley National Park), छत्तीसगढ़ के किस जिले में स्थित है?\",\"oe\":[\"Bastar\",\"Raipur\",\"Bilaspur\",\"Durg\"],\"oh\":[\"बस्तर (Bastar)\",\"रायपुर\",\"बिलासपुर\",\"दुर्ग\"],\"a\":0,\"ee\":\"Kanger Ghati is a biosphere reserve situated roughly 30 km from Jagdalpur in the Bastar district.\",\"eh\":\"\"},{\"n\":83,\"d\":\"\",\"se\":\"The central headquarters of the Ministry of Coal, Government of India, is physically located in:\",\"sh\":\"भारत सरकार के कोयला मंत्रालय (Ministry of Coal) का केंद्रीय मुख्यालय भौतिक रूप से कहाँ स्थित है?\",\"oe\":[\"Kolkata\",\"New Delhi (Shastri Bhawan)\",\"Mumbai\",\"Ranchi\"],\"oh\":[\"कोलकाता\",\"नई दिल्ली (शास्त्री भवन)\",\"मुंबई\",\"रांची\"],\"a\":1,\"ee\":\"The administrative control of the coal sector sits in New Delhi. (Note: CIL headquarters is in Kolkata).\",\"eh\":\"\"},{\"n\":84,\"d\":\"\",\"se\":\"Which of the following majestic animals is recognized as the official State Animal of Chhattisgarh?\",\"sh\":\"निम्नलिखित में से किस राजसी जानवर को छत्तीसगढ़ के आधिकारिक राज्य पशु के रूप में मान्यता प्राप्त है?\",\"oe\":[\"Royal Bengal Tiger\",\"Indian Elephant\",\"Wild Water Buffalo (Van Bhaisa)\",\"Indian Leopard\"],\"oh\":[\"रॉयल बंगाल टाइगर\",\"भारतीय हाथी\",\"जंगली जल भैंस (वन भैंसा / Wild Water Buffalo)\",\"भारतीय तेंदुआ\"],\"a\":2,\"ee\":\"The highly endangered Wild Water Buffalo is the state animal and is fiercely protected in sanctuaries like Udanti.\",\"eh\":\"\"},{\"n\":85,\"d\":\"\",\"se\":\"'Mahanadi Coalfields Limited' (MCL), currently the highest coal-producing subsidiary of CIL, operates its massive mines primarily in which state?\",\"sh\":\"'महानदी कोलफील्ड्स लिमिटेड' (MCL), जो वर्तमान में CIL की सबसे अधिक कोयला उत्पादक सहायक कंपनी है, मुख्य रूप से किस राज्य में अपनी विशाल खदानों का संचालन करती है?\",\"oe\":[\"Odisha\",\"Chhattisgarh\",\"Jharkhand\",\"West Bengal\"],\"oh\":[\"ओडिशा\",\"छत्तीसगढ़\",\"झारखंड\",\"पश्चिम बंगाल\"],\"a\":0,\"ee\":\"MCL commands the colossal Talcher and Ib Valley coalfields in Odisha.\",\"eh\":\"\"},{\"n\":86,\"d\":\"\",\"se\":\"In the Indian judicial system, what is the primary focus of the 'National Green Tribunal' (NGT)?\",\"sh\":\"भारतीय न्याय प्रणाली में, 'राष्ट्रीय हरित अधिकरण' (National Green Tribunal - NGT) का प्राथमिक ध्यान क्या है?\",\"oe\":[\"Regulating and taxing corporate green energy initiatives\",\"Swift disposal of civil cases relating to environment protection, pollution control, and conservation of forests\",\"Employee union rights in coal mines\",\"Agricultural loan waivers\"],\"oh\":[\"कॉर्पोरेट हरित ऊर्जा पहलों को विनियमित करना और कर लगाना\",\"पर्यावरण संरक्षण, प्रदूषण नियंत्रण और वनों के संरक्षण से संबंधित नागरिक मामलों का त्वरित निपटान\",\"कोयला खदानों में कर्मचारी संघ के अधिकार\",\"कृषि ऋण माफी\"],\"a\":1,\"ee\":\"The NGT acts as a specialized environmental court. Mining companies like SECL work closely to adhere to NGT clearances.\",\"eh\":\"\"},{\"n\":87,\"d\":\"\",\"se\":\"The prehistoric 'Bhimbetka rock shelters', a UNESCO World Heritage site featuring ancient cave paintings, are located in which state?\",\"sh\":\"प्रागैतिहासिक 'भीमबेटका रॉक शेल्टर', एक यूनेस्को विश्व धरोहर स्थल जिसमें प्राचीन गुफा चित्र हैं, किस राज्य में स्थित है?\",\"oe\":[\"Madhya Pradesh\",\"Chhattisgarh\",\"Uttar Pradesh\",\"Rajasthan\"],\"oh\":[\"मध्य प्रदेश\",\"छत्तीसगढ़\",\"उत्तर प्रदेश\",\"राजस्थान\"],\"a\":0,\"ee\":\"Situated near Bhopal, Bhimbetka exhibits the earliest traces of human life on the Indian subcontinent.\",\"eh\":\"\"},{\"n\":88,\"d\":\"\",\"se\":\"As part of its modern expansion strategies, SECL recently commenced operations at the 'Pelma' opencast mine under the highly publicized MDO (Mine Developer and Operator) mode. This mine is located in which district?\",\"sh\":\"अपनी आधुनिक विस्तार रणनीतियों के हिस्से के रूप में, SECL ने हाल ही में अत्यधिक प्रचारित MDO (माइन डेवलपर और ऑपरेटर) मोड के तहत 'पेलमा' (Pelma) ओपनकास्ट खदान में परिचालन शुरू किया है। यह खदान किस जिले में स्थित है?\",\"oe\":[\"Korba\",\"Raigarh\",\"Bilaspur\",\"Surguja\"],\"oh\":[\"कोरबा\",\"रायगढ़\",\"बिलासपुर\",\"सरगुजा\"],\"a\":1,\"ee\":\"Pelma is SECL's first opencast mine in Chhattisgarh to produce coal under the MDO model, located in the Mand-Raigarh coalfield.\",\"eh\":\"\"},{\"n\":89,\"d\":\"\",\"se\":\"The flagship central government initiative 'Pradhan Mantri Ujjwala Yojana' (PMUY) was launched specifically to provide:\",\"sh\":\"केंद्र सरकार की प्रमुख पहल 'प्रधानमंत्री उज्ज्वला योजना' (PMUY) विशेष रूप से क्या प्रदान करने के लिए शुरू की गई थी?\",\"oe\":[\"Free LPG (Liquefied Petroleum Gas) connections to women of BPL families\",\"Free solar panels to rural farmers\",\"Subsidized housing for miners\",\"Free higher education for the girl child\"],\"oh\":[\"BPL परिवारों की महिलाओं को मुफ्त LPG (तरलीकृत पेट्रोलियम गैस) कनेक्शन\",\"ग्रामीण किसानों को मुफ्त सोलर पैनल\",\"खनिकों के लिए सब्सिडी वाले आवास\",\"बालिकाओं के लिए मुफ्त उच्च शिक्षा\"],\"a\":0,\"ee\":\"The scheme aims to replace unclean cooking fuels (like coal and wood) with clean LPG, improving health and the environment.\",\"eh\":\"\"},{\"n\":90,\"d\":\"\",\"se\":\"What is the official administrative capital of India?\",\"sh\":\"भारत की आधिकारिक प्रशासनिक राजधानी क्या है?\",\"oe\":[\"Delhi\",\"New Delhi\",\"Mumbai\",\"Kolkata\"],\"oh\":[\"दिल्ली\",\"नई दिल्ली (New Delhi)\",\"मुंबई\",\"कोलकाता\"],\"a\":1,\"ee\":\"While 'Delhi' refers to the broader National Capital Territory, 'New Delhi' is the specific municipality that serves as the nation's capital.\",\"eh\":\"\"},{\"n\":91,\"d\":\"\",\"se\":\"To elevate itself into the ranks of global energy giants, Coal India Limited (CIL)—the parent company of SECL—was granted which prestigious corporate status by the Government of India in 2011?\",\"sh\":\"वैश्विक ऊर्जा दिग्गजों की श्रेणी में खुद को स्थापित करने के लिए, कोल इंडिया लिमिटेड (CIL) - जो SECL की मूल कंपनी है - को 2011 में भारत सरकार द्वारा कौन सा प्रतिष्ठित कॉर्पोरेट दर्जा प्रदान किया गया था?\",\"oe\":[\"Miniratna\",\"Navratna\",\"Maharatna\",\"Unicorn\"],\"oh\":[\"मिनीरत्न\",\"नवरत्न\",\"महारत्न (Maharatna)\",\"यूनिकॉर्न\"],\"a\":2,\"ee\":\"The Maharatna status grants the CIL Board enhanced financial autonomy to make massive investment and joint-venture decisions.\",\"eh\":\"\"},{\"n\":92,\"d\":\"\",\"se\":\"The 'Rajiv Gandhi Kisan Nyay Yojana', a major direct benefit transfer scheme intended to boost crop production and farmer income, was launched by the government of which state?\",\"sh\":\"'राजीव गांधी किसान न्याय योजना', जो फसल उत्पादन और किसानों की आय को बढ़ावा देने के उद्देश्य से एक प्रमुख प्रत्यक्ष लाभ हस्तांतरण योजना है, किस राज्य की सरकार द्वारा शुरू की गई थी?\",\"oe\":[\"Chhattisgarh\",\"Madhya Pradesh\",\"Uttar Pradesh\",\"Bihar\"],\"oh\":[\"छत्तीसगढ़\",\"मध्य प्रदेश\",\"उत्तर प्रदेश\",\"बिहार\"],\"a\":0,\"ee\":\"This is a cornerstone agricultural policy of the Chhattisgarh state government.\",\"eh\":\"\"},{\"n\":93,\"d\":\"\",\"se\":\"Including its specialized planning arm (CMPDI), the Coal India Limited (CIL) corporate umbrella is composed of how many wholly-owned Indian subsidiaries?\",\"sh\":\"अपनी विशेष योजना शाखा (CMPDI) सहित, कोल इंडिया लिमिटेड (CIL) के कॉर्पोरेट छतरी के तहत कुल कितनी पूर्ण स्वामित्व वाली भारतीय सहायक कंपनियां (Subsidiaries) हैं?\",\"oe\":[\"6\",\"7\",\"8\",\"10\"],\"oh\":[\"6\",\"7\",\"8\",\"10\"],\"a\":2,\"ee\":\"CIL operates 7 coal-producing subsidiaries (ECL, BCCL, CCL, NCL, WCL, SECL, MCL) and 1 planning subsidiary (CMPDI).\",\"eh\":\"\"},{\"n\":94,\"d\":\"\",\"se\":\"Due to its geographical placement right at the center of the country, which state is universally nicknamed the 'Heart of India'?\",\"sh\":\"देश के ठीक मध्य में अपनी भौगोलिक स्थिति के कारण, किस राज्य को सार्वभौमिक रूप से 'भारत का हृदय' (Heart of India) उपनाम दिया गया है?\",\"oe\":[\"Madhya Pradesh\",\"Chhattisgarh\",\"Uttar Pradesh\",\"Maharashtra\"],\"oh\":[\"मध्य प्रदेश\",\"छत्तीसगढ़\",\"उत्तर प्रदेश\",\"महाराष्ट्र\"],\"a\":0,\"ee\":\"Madhya Pradesh's central location and rich cultural/wildlife heritage earn it this title.\",\"eh\":\"\"},{\"n\":95,\"d\":\"\",\"se\":\"To bring massive reforms, transparency in auctions, and allow private players into commercial mining, the Government of India passed the 'Coal Mines (Special Provisions) Act' in which year?\",\"sh\":\"भारी सुधार लाने, नीलामियों में पारदर्शिता लाने और वाणिज्यिक खनन (Commercial mining) में निजी खिलाड़ियों को अनुमति देने के लिए, भारत सरकार ने 'कोयला खान (विशेष प्रावधान) अधिनियम' (Coal Mines Special Provisions Act) किस वर्ष पारित किया?\",\"oe\":[\"2010\",\"2015\",\"2018\",\"2020\"],\"oh\":[\"2010\",\"2015\",\"2018\",\"2020\"],\"a\":1,\"ee\":\"The 2015 Act was enacted following the Supreme Court's cancellation of over 200 previous coal block allocations.\",\"eh\":\"\"},{\"n\":96,\"d\":\"\",\"se\":\"The mighty 'Indravati' river, known for the spectacular Chitrakote falls in Bastar, is a major tributary of which larger river system?\",\"sh\":\"शक्तिशाली 'इंद्रावती' नदी, जो बस्तर में शानदार चित्रकोट जलप्रपात के लिए जानी जाती है, किस बड़ी नदी प्रणाली की एक प्रमुख सहायक नदी है?\",\"oe\":[\"Godavari\",\"Mahanadi\",\"Narmada\",\"Ganga\"],\"oh\":[\"गोदावरी (Godavari)\",\"महानदी\",\"नर्मदा\",\"गंगा\"],\"a\":0,\"ee\":\"Indravati flows westward through Chhattisgarh before merging into the Godavari River at the border of Maharashtra, Chhattisgarh, and Telangana.\",\"eh\":\"\"},{\"n\":97,\"d\":\"\",\"se\":\"Historically, the very first commercial coal mining operation within the present-day boundaries of Chhattisgarh commenced at:\",\"sh\":\"ऐतिहासिक रूप से, छत्तीसगढ़ की वर्तमान सीमाओं के भीतर पहला वाणिज्यिक कोयला खनन कार्य कहाँ शुरू हुआ था?\",\"oe\":[\"Chirimiri (Koriya District)\",\"Korba\",\"Raigarh\",\"Bilaspur\"],\"oh\":[\"चिरमिरी (कोरिया जिला)\",\"कोरबा\",\"रायगढ़\",\"बिलासपुर\"],\"a\":0,\"ee\":\"Tata Iron and Steel Company (TISCO) began prospecting here in the early 20th century, and full-scale mining commenced around 1928.\",\"eh\":\"\"},{\"n\":98,\"d\":\"\",\"se\":\"The nationwide 'Swachh Bharat Mission' (Clean India Mission), heavily participated in by PSUs like SECL, was officially launched on October 2nd of which year?\",\"sh\":\"राष्ट्रव्यापी 'स्वच्छ भारत मिशन' (Clean India Mission), जिसमें SECL जैसे PSUs ने भारी भाग लिया, आधिकारिक तौर पर किस वर्ष के 2 अक्टूबर को शुरू किया गया था?\",\"oe\":[\"2012\",\"2014\",\"2016\",\"2018\"],\"oh\":[\"2012\",\"2014\",\"2016\",\"2018\"],\"a\":1,\"ee\":\"It was launched by the Prime Minister in 2014 to achieve an &quot;open-defecation free&quot; India.\",\"eh\":\"\"},{\"n\":99,\"d\":\"\",\"se\":\"Operating out of Ranchi, the specialized CIL subsidiary tasked with geological exploration, engineering design, and environmental planning is abbreviated as 'CMPDI'. What is its full form?\",\"sh\":\"रांची से संचालित, भूवैज्ञानिक अन्वेषण, इंजीनियरिंग डिजाइन और पर्यावरण नियोजन का काम सौंपने वाली विशेष CIL सहायक कंपनी को 'CMPDI' के रूप में संक्षिप्त किया गया है। इसका पूर्ण रूप क्या है?\",\"oe\":[\"Central Mine Planning and Design Institute\",\"Coal Mine Planning and Development Institute\",\"Central Mining Project Development Institute\",\"Coal Management and Planning Design Institute\"],\"oh\":[\"Central Mine Planning and Design Institute\",\"Coal Mine Planning and Development Institute\",\"Central Mining Project Development Institute\",\"Coal Management and Planning Design Institute\"],\"a\":0,\"ee\":\"CMPDI is the brain-trust of Coal India, designing the massive pits that subsidiaries like SECL excavate.\",\"eh\":\"\"},{\"n\":100,\"d\":\"\",\"se\":\"Coal India Limited (CIL), the largest state-owned coal mining corporation in the world, was formally established in which historic year?\",\"sh\":\"दुनिया की सबसे बड़ी राज्य के स्वामित्व वाली कोयला खनन निगम, कोल इंडिया लिमिटेड (CIL) की औपचारिक स्थापना किस ऐतिहासिक वर्ष में हुई थी?\",\"oe\":[\"1971\",\"1973\",\"1975\",\"1985\"],\"oh\":[\"1971\",\"1973\",\"1975\",\"1985\"],\"a\":2,\"ee\":\"CIL was formed on November 1, 1975, to bring all the nationalized private coal mines under a single, organized corporate umbrella.\",\"eh\":\"\"}],\"sub\":\"99 questions · 59 bilingual\"}]");

const TRI=[["never","t1"],["recall","t2"],["blunder","t3"]];
const wrongKeys=s=>s.q.filter(q=>P.ans[qk(s,q)]!=null&&P.ans[qk(s,q)]!==q.a);

function stat(s){
  let a=0,r=0,w=0,l=0;
  for(const q of s.q){const k=qk(s,q),v=P.ans[k];
    if(v!=null){a++;if(v===q.a)r++;else{w++;if(P.tri[k])l++;}}}
  return {n:s.q.length,a,r,w,l,
    /* complete means every question attempted and every miss accounted for */
    done:a===s.q.length&&l===w,pct:Math.round(a/s.q.length*100)};
}
function counts(scope){
  const c={never:0,recall:0,blunder:0};
  for(const k in P.tri){ if(scope&&k.indexOf(scope+"#")!==0) continue;
    if(c[P.tri[k]]!=null)c[P.tri[k]]++; }
  return c;
}
function cd(){const ms=new Date(LAUNCH+"T00:00:00")-new Date();
  return ms<=0?null:{d:Math.floor(ms/864e5),h:Math.floor(ms/36e5)%24,m:Math.floor(ms/6e4)%60};}

}

/* ---------- the paper ---------- */
let TICK=null;
function start(s,mode){
  const seed={};for(const q of s.q){const v=P.ans[qk(s,q)];if(v!=null)seed[q.n]=v;}
  const i=mode==="drill"?s.q.findIndex(q=>P.ans[qk(s,q)]==null):0;
  go({view:"run",sub:s,run:{s,mode,i:i<0?0:i,ans:seed,review:false,
    left:mode==="paper"?Math.round(s.q.length*1.2)*60:null}});
}
function clock(run){
  clearInterval(TICK);
  if(run.mode!=="paper"||run.review) return;
  TICK=setInterval(()=>{
    if(!S.run||S.run!==run||run.review){clearInterval(TICK);return;}
    run.left--;const c=$("clk");
    if(c){c.textContent=Math.floor(run.left/60)+":"+String(run.left%60).padStart(2,"0");
      c.className="clk"+(run.left<=60?" crit":run.left<=300?" warn":"");}
    if(run.left<=0){clearInterval(TICK);run.review=true;run.i=0;toast(T("timeUp"),4500);draw();}
  },1000);
}
function score(run){
  const qs=run.s.q;let right=0,wrong=0,blank=0;
  for(const q of qs){const v=run.ans[q.n];
    if(v==null)blank++;else if(v===q.a)right++;else wrong++;}
  const att=right+wrong,acc=att?right/att:0;
  const lc={never:0,recall:0,blunder:0};
  for(const q of qs){const t=P.tri[qk(run.s,q)];if(t&&lc[t]!=null)lc[t]++;}
  const pen=(lc.never/qs.length)*45+(lc.recall/qs.length)*22+(lc.blunder/qs.length)*15+(blank/qs.length)*12;
  return {right,wrong,blank,n:qs.length,acc:Math.round(acc*1000)/10,lc,
    readiness:Math.max(0,Math.round(acc*100-pen))};
}
function vRun(a){
  const run=S.run,qs=run.s.q,q=qs[run.i];
  if(!q) return vReport(a,run);
  if(run.mode==="paper"&&run.review){
    const un=qs.filter(x=>run.ans[x.n]!=null&&run.ans[x.n]!==x.a&&!P.tri[qk(run.s,x)]).length;
    const h=el("div","card");h.style.padding="14px 16px";
    h.innerHTML='<div class="eb">'+T("review")+'</div><p class="mu" style="margin:6px 0 0;font-size:12.5px">'+
      T("reviewW")+(un?" \u00b7 <b>"+un+"</b>":"")+"</p>";
    a.appendChild(h);
  }
  const sealed=run.mode==="paper"&&!run.review, given=run.ans[q.n];
  const c=el("div","card");
  c.innerHTML='<div class="qn"><span>Q'+q.n+" / "+qs.length+"</span>"+
    (q.d?'<span class="df">'+q.d+"</span>":"")+'<span class="sp"></span>'+
    (sealed?'<span class="clk" id="clk">--:--</span>':"")+"</div>"+
    '<div class="stem">'+bi(q.se,q.sh)+"</div>";
  const ul=el("ul","opts");
  q.oe.forEach((o,i)=>{
    const cls=sealed?(given===i?"sel":""):(given!=null?(i===q.a?"ok":i===given?"bad":""):"");
    const li=el("li",cls);
    const b=el("button",null,'<span class="lt">'+"ABCD"[i]+'</span><span class="tx">'+
      bi(o,q.oh[i])+"</span>");
    b.onclick=()=>{
      if(given!=null&&!sealed) return;
      run.ans[q.n]=i;P.ans[qk(run.s,q)]=i;save();
      if(sealed&&run.i+1<qs.length) run.i++;
      draw();};
    li.appendChild(b);ul.appendChild(li);});
  c.appendChild(ul);
  if(sealed){
    const nav=el("div","row");nav.style.marginTop="14px";
    const pv=el("button","btn gh");pv.textContent="\u2039";
    pv.onclick=()=>{run.i=Math.max(0,run.i-1);draw();};
    const nx=el("button","btn gh");nx.textContent=T("next");
    nx.onclick=()=>{run.i=Math.min(qs.length-1,run.i+1);draw();};
    const sb=el("button","btn");sb.textContent=T("submit");
    sb.onclick=()=>{clearInterval(TICK);run.review=true;run.i=0;draw();};
    nav.appendChild(pv);nav.appendChild(nx);nav.appendChild(sb);c.appendChild(nav);
    c.insertAdjacentHTML("beforeend",'<p class="note">'+T("attempted")+" "+
      Object.keys(run.ans).length+" / "+qs.length+"</p>");
    a.appendChild(c);setTimeout(()=>clock(run),0);return;
  }
  if(given==null){a.appendChild(c);a.appendChild(backBtn());return;}
  const right=given===q.a;
  c.appendChild(el("div","vd "+(right?"y":"n"),
    right?"\u2713 "+T("correct"):"\u2715 "+T("wrong")+" \u00b7 "+T("ansIs")+" "+"ABCD"[q.a]));
  if(q.ee) c.appendChild(el("div","exp",'<div class="eb" style="margin-bottom:6px">'+T("expl")+
    "</div>"+bi(q.ee,q.eh)));
  /* Labels belong to a miss. Getting it right needs no explanation of why
     you got it wrong, and asking for one trains a meaningless reflex. */
  const key=qk(run.s,q);
  if(!right){
    const lc=counts(run.s.id), tri=el("div","tri");
    TRI.forEach(([k,cls])=>{
      const b=el("button",cls,"<span><b>"+T(k)+"</b><small>"+T(k+"H")+
        '</small></span><span class="ct">'+lc[k]+"</span>");
      b.setAttribute("aria-pressed",String(P.tri[key]===k));
      b.onclick=()=>{P.tri[key]=k;save();draw();};
      tri.appendChild(b);});
    c.appendChild(tri);
  }
  a.appendChild(c);
  $("dock").hidden=false;
  const d=$("dockIn");d.textContent="";
  d.appendChild(el("span","pg",(run.i+1)+"/"+qs.length));
  const nx=el("button","btn");
  nx.textContent=run.i+1>=qs.length?T("finish"):T("next");
  if(!right&&!P.tri[key]){nx.disabled=true;
    d.appendChild(el("span","pg","\u00b7 "+T("mustLabel")));}
  nx.onclick=()=>{run.i++;draw();};
  d.appendChild(nx);
}
const backBtn=()=>{const b=el("button","btn gh");b.textContent="\u2039 "+T("back");
  b.onclick=()=>go({view:"subject",run:null});return b;};
function vReport(a,run){
  const r=score(run);
  if(!run.filed){run.filed=1;
    P.reports.unshift({id:run.s.id,name:run.s.name,mode:run.mode,ts:Date.now(),
      right:r.right,n:r.n,readiness:r.readiness,lc:r.lc});
    P.reports=P.reports.slice(0,60);save();}
  const c=el("div","card");
  c.innerHTML='<div class="eb">'+esc(run.s.name)+"</div><h1>"+r.right+" / "+r.n+"</h1>"+
    '<div class="stats"><div><div class="v">'+r.right+'</div><div class="l">'+T("marks")+"</div></div>"+
    '<div><div class="v" style="color:'+(r.readiness>=65?"var(--green)":r.readiness>=45?
      "var(--amber)":"var(--red)")+'">'+r.readiness+'%</div><div class="l">'+T("readiness")+"</div></div>"+
    '<div><div class="v">'+r.acc+'%</div><div class="l">'+T("acc")+"</div></div></div>"+
    "<h2>"+T("where")+'</h2><div class="stats">'+TRI.map(([k])=>
      '<div><div class="v">'+r.lc[k]+'</div><div class="l">'+T(k)+"</div></div>").join("")+"</div>";
  a.appendChild(c);a.appendChild(backBtn());
}

function vGate(a){
  const c=el("div","card");
  c.innerHTML='<div class="eb">Restricted</div><h1>Admin</h1>'+
    '<input class="inp" id="au" placeholder="id" autocapitalize="off" style="margin-bottom:9px">'+
    '<input class="inp" id="ap" type="password" placeholder="password">';
  const b=el("button","btn");b.textContent="Enter";b.style.marginTop="11px";
  b.onclick=()=>{
    if(c.querySelector("#au").value.trim()==="ankii"&&c.querySelector("#ap").value==="ankriti")
      {S.admin=true;go({view:"admin"});} else toast("Wrong id or password");};
  c.appendChild(b);
  c.insertAdjacentHTML("beforeend",'<p class="note">This gate is client-side. It hides the screen; '+
    "it is not a security boundary.</p>");
  a.appendChild(c);
}
function vAdmin(a){
  const h=el("div","card");
  h.innerHTML='<div class="eb">Admin</div><h1>Register and papers</h1>'+
    '<div class="stats"><div><div class="v">'+USERS.length+'</div><div class="l">Registered</div></div>'+
    '<div><div class="v">'+HP.length+'</div><div class="l">HP papers</div></div>'+
    '<div><div class="v">'+SUBJECTS.length+'</div><div class="l">Subjects</div></div></div>'+
    "<table><thead><tr><th>Name</th><th>Email</th><th>Device</th></tr></thead><tbody>"+
    USERS.map(u=>"<tr><td>"+esc(u.n)+"</td><td>"+esc(u.e)+"</td><td>"+
      (store.get("bind:"+u.e,null)?"bound":"free")+"</td></tr>").join("")+"</tbody></table>";
  a.appendChild(h);
  /* Adding a person: the file has no server, so a new login must be baked
     into the build. This produces the exact users.json to paste, hashed
     here so a mobile number never travels or gets stored in the clear. */
  const ad=el("div","card");
  ad.innerHTML="<h2>Add a person</h2>"+
    '<p class="mu" style="font-size:13px">Their email becomes the username, their mobile '+
    "number becomes the password. This generates the new <code>users.json</code> \u2014 "+
    "replace the file, rebuild, redeploy.</p>"+
    '<input class="inp" id="nn" placeholder="Full name" style="margin-bottom:9px">'+
    '<input class="inp" id="ne" type="email" inputmode="email" autocapitalize="off" '+
    'placeholder="Email" style="margin-bottom:9px">'+
    '<input class="inp" id="nm" type="tel" inputmode="numeric" placeholder="Mobile number">';
  const gen=el("button","btn");gen.textContent="Generate";gen.style.marginTop="10px";
  const outBox=el("div");outBox.style.marginTop="12px";
  gen.onclick=async()=>{
    const n=ad.querySelector("#nn").value.trim();
    const e=ad.querySelector("#ne").value.trim().toLowerCase();
    const m=ad.querySelector("#nm").value.replace(/\D/g,"").slice(-10);
    if(!n||!e.includes("@")||m.length!==10){toast("Name, a real email and a 10-digit mobile");return;}
    if(USERS.some(u=>u.e===e)){toast("That email is already on the register");return;}
    gen.disabled=true;
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(m),"PBKDF2",false,["deriveBits"]);
    const bits=await crypto.subtle.deriveBits(
      {name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},key,256);
    gen.disabled=false;
    const entry={n,e,s:hex(salt.buffer),h:hex(bits)};
    const all=JSON.stringify(USERS.concat([entry]));
    outBox.innerHTML='<div class="eb" style="margin-bottom:6px">New users.json</div>'+
      '<textarea class="inp" id="uj" rows="5" readonly style="font-size:11.5px;'+
      'font-family:ui-monospace,monospace">'+esc(all)+"</textarea>";
    const cp=el("button","btn gh");cp.textContent="Copy";cp.style.marginTop="9px";
    cp.onclick=()=>{const t=outBox.querySelector("#uj");t.select();
      navigator.clipboard?navigator.clipboard.writeText(all).then(()=>toast("Copied"))
        :document.execCommand("copy")&&toast("Copied");};
    const dl=el("button","btn gh");dl.textContent="Download users.json";dl.style.marginTop="8px";
    dl.onclick=()=>{const a2=document.createElement("a");
      a2.href=URL.createObjectURL(new Blob([all],{type:"application/json"}));
      a2.download="users.json";a2.click();setTimeout(()=>URL.revokeObjectURL(a2.href),4000);};
    outBox.appendChild(cp);outBox.appendChild(dl);
    outBox.insertAdjacentHTML("beforeend",
      '<p class="note">Replace <code>users.json</code> with this, run <code>python3 build.py</code>, '+
      "and push. Until you redeploy, this person cannot sign in anywhere.</p>");
  };
  ad.appendChild(gen);ad.appendChild(outBox);a.appendChild(ad);

  const p=el("div","card");
  p.innerHTML="<h2>Add a high probability paper</h2>"+
    '<p class="mu" style="font-size:13px">Paste markdown in the subject-file format: '+
    "<code>### Q1</code>, options A to D, <b>Answer:</b>, <b>Explanation:</b>.</p>"+
    '<input class="inp" id="pt" placeholder="Paper title" style="margin-bottom:9px">'+
    '<textarea class="inp" id="pm" rows="6" placeholder="### Q1&#10;Stem\u2026"></textarea>';
  const pb=el("button","btn");pb.textContent="Parse and add";pb.style.marginTop="10px";
  pb.onclick=()=>{
    const qs=parseMd(p.querySelector("#pm").value);
    if(!qs.length){toast("No questions found \u2014 check the format");return;}
    HP.push({id:"hpx"+Date.now(),title:p.querySelector("#pt").value.trim()||
      ("High probability paper "+(HP.length+1)),q:qs});
    store.set("hp",HP);toast(qs.length+" questions added");
    p.querySelector("#pm").value="";p.querySelector("#pt").value="";draw();};
  p.appendChild(pb);a.appendChild(p);
  const bk=el("button","btn gh");bk.textContent="\u2039 Back";
  bk.onclick=()=>{location.hash="";go({view:S.user?"home":"login"});};
  a.appendChild(bk);
}
/* admin paste runs through the same shape the build script uses */
function parseMd(md){
  const out=[];
  String(md).replace(/\r\n/g,"\n").split(/\n(?=#{2,4}\s*Q\s*\.?\d)/).forEach(blk=>{
    const h=/^#{2,4}\s*Q\s*\.?(\d+)\s*(?:\[([^\]]*)\])?/.exec(blk);
    if(!h) return;
    const rest=blk.slice(h[0].length);
    const opts=[...rest.matchAll(/^\s*[-*]?\s*\**([A-D])\.\s*(.+?)\s*$/gm)].map(m=>m[2].trim());
    if(opts.length<2) return;
    const first=/^\s*[-*]?\s*\**A\.\s/m.exec(rest);
    let stem=(first?rest.slice(0,first.index):"").replace(/\s*\n\s*/g," / ")
      .replace(/^[\s/]+|[\s/]+$/g,"").replace(/\s{2,}/g," ");
    const am=/\*\*Answer[^:]*:\s*\**\s*([A-D])/.exec(rest);
    if(!am) return;
    const ex=/\*\*Explanation[^:]*:\*\*\s*([\s\S]*?)(?=\n\s*\n|$)/.exec(rest);
    const cut=t=>{const i=t.search(/\s+\/\s+/);
      return i>0&&/[\u0900-\u097F]/.test(t.slice(i))?[esc(t.slice(0,i)),esc(t.slice(i).replace(/^\s*\/\s*/,""))]
        :[esc(t),""];};
    const [se,sh]=cut(stem), [ee,eh]=cut(ex?ex[1].replace(/\s*\n\s*/g," ").trim():"");
    const oe=[],oh=[];opts.forEach(o=>{const [x,y]=cut(o);oe.push(x);oh.push(y);});
    out.push({n:+h[1],d:(h[2]||"")[0]||"",se,sh,oe,oh,a:"ABCD".indexOf(am[1]),ee,eh});
  });
  return out;
}
/* ---------- boot ---------- */
$("bLang").onclick=()=>{L=L==="en"?"hi":"en";localStorage.setItem("secl-lang",L);draw();};
$("bOut").onclick=()=>{S.user=null;$("who").textContent="SECL Telecom / Radio Mechanic 2026";
  go({view:"login"});};
function route(){
  if(location.hash.replace("#","")==="ankii") go({view:S.admin?"admin":"adminGate"});
  else if(S.view==="admin"||S.view==="adminGate") go({view:S.user?"home":"login"});
}
window.addEventListener("hashchange",route);
HP=HP_BUILTIN.concat(store.get("hp",[]));
route();
if(S.view!=="adminGate"&&S.view!=="admin") draw();
setInterval(()=>{if(S.view==="home")draw();},60000);

</script>
