\"The average (arithmetic mean) of five numbers is 20. If one number is removed, the average of the remaining four numbers drops to 18. What was the value of the removed number?\",\"sh\":\"\",\"oe\":[\"22\",\"24\",\"26\",\"28\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Total sum of 5 numbers = 5 × 20 = 100. Total sum of 4 numbers = 4 × 18 = 72. Removed number = 100 - 72 = 28.\",\"eh\":\"\"},{\"n\":76,\"d\":\"\",\"se\":\"What is the calculated value of the expression (2³ × 3²)?\",\"sh\":\"\",\"oe\":[\"48\",\"64\",\"72\",\"96\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"2³ is 8, and 3² is 9. Therefore, 8 × 9 = 72.\",\"eh\":\"\"},{\"n\":77,\"d\":\"\",\"se\":\"If the ratio A:B is 2:3, and the ratio B:C is 4:5, what is the combined ratio A:C?\",\"sh\":\"\",\"oe\":[\"8:15\",\"8:12\",\"12:15\",\"4:5\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Multiply the ratios to bridge B. (A/B) × (B/C) = (2/3) × (4/5) = 8/15.\",\"eh\":\"\"},{\"n\":78,\"d\":\"\",\"se\":\"How many prime numbers exist between 1 and 20?\",\"sh\":\"\",\"oe\":[\"6\",\"7\",\"8\",\"9\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"The prime numbers are 2, 3, 5, 7, 11, 13, 17, and 19. (Note: 1 is not a prime number).\",\"eh\":\"\"},{\"n\":79,\"d\":\"\",\"se\":\"What is the next logical term in the alphanumeric series: AZ, BY, CX, DW, ?\",\"sh\":\"\",\"oe\":[\"EV\",\"EU\",\"FU\",\"FV\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"The first letter moves forward alphabetically (A, B, C, D, E), and the second letter moves backward (Z, Y, X, W, V).\",\"eh\":\"\"},{\"n\":80,\"d\":\"\",\"se\":\"If an analog wall clock reads exactly 3:45, what is the interior angle between the hour and minute hands?\",\"sh\":\"\",\"oe\":[\"112.5°\",\"127.5°\",\"135.0°\",\"157.5°\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Formula: |(30 × H) - (5.5 × M)|. |(30 × 3) - (5.5 × 45)| = |90 - 247.5| = 157.5°.\",\"eh\":\"\"},{\"n\":81,\"d\":\"\",\"se\":\"Which of the following is the largest opencast coal mine under SECL (and currently the largest in Asia by production capacity)?\",\"sh\":\"निम्नलिखित में से कौन सी SECL (और वर्तमान में उत्पादन क्षमता के हिसाब से एशिया में) के तहत सबसे बड़ी 'ओपनकास्ट' कोयला खदान (Opencast coal mine) है?\",\"oe\":[\"Korba\",\"Gevra\",\"Dipka\",\"Kusmunda\"],\"oh\":[\"कोरबा\",\"गेवरा (Gevra)\",\"दीपका\",\"कुसमुंडा\"],\"a\":1,\"ee\":\"The Gevra Opencast Project in Chhattisgarh is the flagship mega-mine of SECL and Asia's largest open-pit coal mine.\",\"eh\":\"गेवरा ओपनकास्ट प्रोजेक्ट एशिया की सबसे बड़ी ओपन-पिट कोयला खदान है।\"},{\"n\":82,\"d\":\"\",\"se\":\"The highly crucial Mahanadi River originates from the Sihawa mountains located in which state?\",\"sh\":\"अति महत्वपूर्ण महानदी किस राज्य में स्थित सिहावा (Sihawa) पर्वत से निकलती है?\",\"oe\":[\"Chhattisgarh\",\"Madhya Pradesh\",\"Odisha\",\"Jharkhand\"],\"oh\":[\"छत्तीसगढ़\",\"मध्य प्रदेश\",\"ओडिशा\",\"झारखंड\"],\"a\":0,\"ee\":\"The Mahanadi river originates in the Dhamtari district of Chhattisgarh before flowing eastward into Odisha.\",\"eh\":\"महानदी छत्तीसगढ़ के धमतरी जिले से निकलती है।\"},{\"n\":83,\"d\":\"\",\"se\":\"The dynamic and highly energetic 'Panthi' dance is a traditional folk dance associated with which state?\",\"sh\":\"गतिशील और अत्यधिक ऊर्जावान 'पंथी' (Panthi) नृत्य किस राज्य से जुड़ा एक पारंपरिक लोक नृत्य है?\",\"oe\":[\"Madhya Pradesh\",\"Chhattisgarh\",\"Odisha\",\"Jharkhand\"],\"oh\":[\"मध्य प्रदेश\",\"छत्तीसगढ़\",\"ओडिशा\",\"झारखंड\"],\"a\":1,\"ee\":\"Panthi is a prominent dance form of the Satnami community in Chhattisgarh.\",\"eh\":\"पंथी छत्तीसगढ़ के सतनामी समुदाय का एक प्रमुख नृत्य है।\"},{\"n\":84,\"d\":\"\",\"se\":\"The famous Kanha National Park (Kanha Tiger Reserve) is situated in which state?\",\"sh\":\"प्रसिद्ध कान्हा राष्ट्रीय उद्यान (कान्हा टाइगर रिजर्व) किस राज्य में स्थित है?\",\"oe\":[\"Chhattisgarh\",\"Madhya Pradesh\",\"Odisha\",\"Maharashtra\"],\"oh\":[\"छत्तीसगढ़\",\"मध्य प्रदेश\",\"ओडिशा\",\"महाराष्ट्र\"],\"a\":1,\"ee\":\"Kanha is one of the largest and most famous tiger reserves in India, located in MP.\",\"eh\":\"\"},{\"n\":85,\"d\":\"\",\"se\":\"The corporate headquarters of Western Coalfields Limited (WCL) is situated in:\",\"sh\":\"वेस्टर्न कोलफील्ड्स लिमिटेड (WCL) का कॉर्पोरेट मुख्यालय कहाँ स्थित है?\",\"oe\":[\"Nagpur\",\"Bilaspur\",\"Ranchi\",\"Kolkata\"],\"oh\":[\"नागपुर\",\"बिलासपुर\",\"रांची\",\"कोलकाता\"],\"a\":0,\"ee\":\"WCL operates mines in Maharashtra and Madhya Pradesh, with its HQ located in Nagpur, Maharashtra.\",\"eh\":\"\"},{\"n\":86,\"d\":\"\",\"se\":\"Which district of Chhattisgarh is renowned for the ancient 'Sirpur' archaeological and heritage site?\",\"sh\":\"छत्तीसगढ़ का कौन सा जिला प्राचीन 'सिरपुर' पुरातात्विक और विरासत स्थल के लिए प्रसिद्ध है?\",\"oe\":[\"Raipur\",\"Mahasamund\",\"Bilaspur\",\"Durg\"],\"oh\":[\"रायपुर\",\"महासमुंद\",\"बिलासपुर\",\"दुर्ग\"],\"a\":1,\"ee\":\"Sirpur, situated on the banks of the Mahanadi, is in the Mahasamund district and is rich in Buddhist, Hindu, and Jain monuments.\",\"eh\":\"\"},{\"n\":87,\"d\":\"\",\"se\":\"The coal mining sector in India was fundamentally nationalized through an Act passed in which year?\",\"sh\":\"भारत में कोयला खनन क्षेत्र का मौलिक रूप से राष्ट्रीयकरण (Nationalisation) किस वर्ष पारित अधिनियम के माध्यम से किया गया था?\",\"oe\":[\"1971\",\"1973\",\"1975\",\"1980\"],\"oh\":[\"1971\",\"1973\",\"1975\",\"1980\"],\"a\":1,\"ee\":\"The Coal Mines (Nationalisation) Act was enacted in 1973, placing private non-coking coal mines under government control.\",\"eh\":\"\"},{\"n\":88,\"d\":\"\",\"se\":\"As of recent administrative updates in Chhattisgarh, what is the total number of districts in the state?\",\"sh\":\"छत्तीसगढ़ में हालिया प्रशासनिक अपडेट के अनुसार, राज्य में जिलों की कुल संख्या कितनी है?\",\"oe\":[\"28\",\"30\",\"33\",\"36\"],\"oh\":[\"28\",\"30\",\"33\",\"36\"],\"a\":2,\"ee\":\"Through the creation of 5 new districts in late 2022, Chhattisgarh's total district count stands at 33.\",\"eh\":\"\"},{\"n\":89,\"d\":\"\",\"se\":\"The magnificent 'Chitrakote Waterfall', often called the Niagara Falls of India, is located in which district?\",\"sh\":\"शानदार 'चित्रकोट जलप्रपात' (Chitrakote Waterfall), जिसे अक्सर भारत का नियाग्रा फॉल्स कहा जाता है, किस जिले में स्थित है?\",\"oe\":[\"Bastar\",\"Raipur\",\"Kanker\",\"Dantewada\"],\"oh\":[\"बस्तर\",\"रायपुर\",\"कांकेर\",\"दंतेवाड़ा\"],\"a\":0,\"ee\":\"The Chitrakote falls on the Indravati River are located in the Bastar district, near Jagdalpur.\",\"eh\":\"\"},{\"n\":90,\"d\":\"\",\"se\":\"The Singareni Collieries Company Limited (SCCL), another major government-owned coal miner, operates primarily in which state?\",\"sh\":\"एक अन्य प्रमुख सरकारी स्वामित्व वाली कोयला खनिक, सिंगरेनी कोलियरीज कंपनी लिमिटेड (SCCL), मुख्य रूप से किस राज्य में काम करती है?\",\"oe\":[\"Telangana\",\"Andhra Pradesh\",\"Chhattisgarh\",\"Maharashtra\"],\"oh\":[\"तेलंगाना\",\"आंध्र प्रदेश\",\"छत्तीसगढ़\",\"महाराष्ट्र\"],\"a\":0,\"ee\":\"SCCL is jointly owned by the Government of Telangana and the Government of India.\",\"eh\":\"\"},{\"n\":91,\"d\":\"\",\"se\":\"Which of the following is historically recognized as the oldest commercial coalfield in India?\",\"sh\":\"निम्नलिखित में से किसे ऐतिहासिक रूप से भारत के सबसे पुराने वाणिज्यिक कोयला क्षेत्र के रूप में मान्यता प्राप्त है?\",\"oe\":[\"Jharia\",\"Raniganj\",\"Korba\",\"Singrauli\"],\"oh\":[\"झरिया\",\"रानीगंज\",\"कोरबा\",\"सिंगरौली\"],\"a\":1,\"ee\":\"Commercial coal mining began at Raniganj in West Bengal in 1774 during the East India Company era.\",\"eh\":\"\"},{\"n\":92,\"d\":\"\",\"se\":\"Bhopal, the capital city of Madhya Pradesh, is famous for being situated around which major water body?\",\"sh\":\"मध्य प्रदेश की राजधानी भोपाल किस प्रमुख जल निकाय (water body) के आसपास स्थित होने के लिए प्रसिद्ध है?\",\"oe\":[\"Upper Lake and Lower Lake (Bhoj Wetland)\",\"Chilika Lake\",\"Dal Lake\",\"Narmada River Banks\"],\"oh\":[\"अपर लेक और लोअर लेक (भोज वेटलैंड)\",\"चिल्का झील\",\"डल झील\",\"नर्मदा नदी के तट\"],\"a\":0,\"ee\":\"Bhopal is known as the &quot;City of Lakes&quot; primarily due to the Bhojtal (Upper Lake) and Lower Lake.\",\"eh\":\"\"},{\"n\":93,\"d\":\"\",\"se\":\"Geologically, which Indian state holds the highest proven reserves of coal?\",\"sh\":\"भूगर्भीय दृष्टि से (Geologically), भारत के किस राज्य में कोयले का सबसे बड़ा सिद्ध भंडार (Proven reserves) है?\",\"oe\":[\"Jharkhand\",\"Odisha\",\"Chhattisgarh\",\"Madhya Pradesh\"],\"oh\":[\"झारखंड\",\"ओडिशा\",\"छत्तीसगढ़\",\"मध्य प्रदेश\"],\"a\":0,\"ee\":\"While Odisha and Chhattisgarh often lead in annual <em>production</em>, Jharkhand holds the largest proven <em>reserves</em> of coal in India.\",\"eh\":\"हालांकि ओडिशा और छत्तीसगढ़ अक्सर उत्पादन में अग्रणी होते हैं, लेकिन कोयले का सबसे बड़ा भंडार झारखंड में है।\"},{\"n\":94,\"d\":\"\",\"se\":\"The massive 'Kusmunda' opencast coal project is located in which district of Chhattisgarh?\",\"sh\":\"विशाल 'कुसमुंडा' ओपनकास्ट कोयला परियोजना छत्तीसगढ़ के किस जिले में स्थित है?\",\"oe\":[\"Korba\",\"Raigarh\",\"Bilaspur\",\"Surguja\"],\"oh\":[\"कोरबा\",\"रायगढ़\",\"बिलासपुर\",\"सरगुजा\"],\"a\":0,\"ee\":\"Kusmunda, along with Gevra and Dipka, forms the mega-mining cluster in the Korba district.\",\"eh\":\"\"},{\"n\":95,\"d\":\"\",\"se\":\"The total number of coal mines currently operated by SECL (both underground and opencast) is approximately:\",\"sh\":\"SECL द्वारा वर्तमान में संचालित कोयला खदानों (भूमिगत और ओपनकास्ट दोनों) की कुल संख्या लगभग कितनी है?\",\"oe\":[\"45\",\"67\",\"90\",\"110\"],\"oh\":[\"45\",\"67\",\"90\",\"110\"],\"a\":1,\"ee\":\"According to recent annual reports, SECL operates around 67 distinct mines (roughly 48 opencast and 19 underground).\",\"eh\":\"हाल की वार्षिक रिपोर्टों के अनुसार, SECL लगभग 67 खदानें संचालित करता है।\"},{\"n\":96,\"d\":\"\",\"se\":\"Which of the following is a famous Tiger Reserve located inside Chhattisgarh?\",\"sh\":\"निम्नलिखित में से कौन सा प्रसिद्ध टाइगर रिजर्व (Tiger Reserve) छत्तीसगढ़ के अंदर स्थित है?\",\"oe\":[\"Bandhavgarh\",\"Kanha\",\"Indravati\",\"Palamau\"],\"oh\":[\"बांधवगढ़\",\"कान्हा\",\"इंद्रावती\",\"पलामू\"],\"a\":2,\"ee\":\"Indravati National Park and Tiger Reserve is located in the Bijapur district of Chhattisgarh.\",\"eh\":\"\"},{\"n\":97,\"d\":\"\",\"se\":\"Coal India Limited (CIL) recently crossed a massive historic milestone in annual coal production. What was its approximate production in the financial year 2023-2024?\",\"sh\":\"कोल इंडिया लिमिटेड (CIL) ने हाल ही में वार्षिक कोयला उत्पादन में एक विशाल ऐतिहासिक मील का पत्थर पार किया है। वित्तीय वर्ष 2023-2024 में इसका अनुमानित उत्पादन कितना था?\",\"oe\":[\"500 MT\",\"600 MT\",\"773 MT\",\"1000 MT\"],\"oh\":[\"500 MT\",\"600 MT\",\"773 MT\",\"1000 MT\"],\"a\":2,\"ee\":\"CIL achieved a record-breaking historic milestone by producing 773.6 Million Tonnes in FY24, well over the 700 MT mark.\",\"eh\":\"CIL ने FY24 में 773.6 मिलियन टन (MT) का रिकॉर्ड उत्पादन हासिल किया।\"},{\"n\":98,\"d\":\"\",\"se\":\"The full form of NTPC, India's largest power utility which consumes vast amounts of CIL coal, is:\",\"sh\":\"भारत की सबसे बड़ी बिजली उपयोगिता NTPC (जो CIL कोयले की भारी मात्रा में खपत करती है) का पूर्ण रूप क्या है?\",\"oe\":[\"National Thermal Power Corporation\",\"Nuclear Thermal Power Corporation\",\"National Transmission Power Corporation\",\"New Thermal Power Corporation\"],\"oh\":[\"National Thermal Power Corporation\",\"Nuclear Thermal Power Corporation\",\"National Transmission Power Corporation\",\"New Thermal Power Corporation\"],\"a\":0,\"ee\":\"NTPC Limited is a central PSU under the Ministry of Power.\",\"eh\":\"\"},{\"n\":99,\"d\":\"\",\"se\":\"Which city is widely referred to as the 'Power Hub' or 'Power Capital' of Chhattisgarh?\",\"sh\":\"छत्तीसगढ़ के 'पावर हब' (Power Hub) या 'ऊर्जा राजधानी' के रूप में किस शहर को व्यापक रूप से जाना जाता है?\",\"oe\":[\"Bilaspur\",\"Korba\",\"Raipur\",\"Durg\"],\"oh\":[\"बिलासपुर\",\"कोरबा\",\"रायपुर\",\"दुर्ग\"],\"a\":1,\"ee\":\"With numerous colossal thermal power stations (NTPC, CSPGCL, BALCO) and coal mines, Korba generates thousands of megawatts of electricity.\",\"eh\":\"\"},{\"n\":100,\"d\":\"\",\"se\":\"The annual 'MoU' (Memorandum of Understanding) signed between CIL and its subsidiaries (like SECL) primarily outlines:\",\"sh\":\"CIL और उसकी सहायक कंपनियों (जैसे SECL) के बीच हस्ताक्षरित वार्षिक 'MoU' (समझौता ज्ञापन) मुख्य रूप से क्या रेखांकित करता है?\",\"oe\":[\"Operational and financial performance targets (Production targets)\",\"Only Employee welfare schemes\",\"Only Environmental clearances\",\"Only HR transfers\"],\"oh\":[\"परिचालन और वित्तीय प्रदर्शन लक्ष्य (उत्पादन लक्ष्य)\",\"केवल कर्मचारी कल्याण योजनाएं\",\"केवल पर्यावरण मंजूरी\",\"केवल HR स्थानान्तरण\"],\"a\":0,\"ee\":\"The MoU establishes strict physical production, financial, and efficiency targets that the subsidiary management is expected to achieve.\",\"eh\":\"\"}],\"sub\":\"100 questions · 45 bilingual\"},{\"id\":\"hp4\",\"num\":4,\"name\":\"High Probability Paper 4\",\"q\":[{\"n\":1,\"d\":\"\",\"se\":\"Image-based: The diagram shows a PON (Passive Optical Network) architecture with an OLT at the central office, a splitter, and multiple ONTs at subscriber premises. The splitter is a passive device that:\",\"sh\":\"चित्र-आधारित: आरेख एक PON (पैसिव ऑप्टिकल नेटवर्क) आर्किटेक्चर दिखाता है जिसमें केंद्रीय कार्यालय में एक OLT, एक स्प्लिटर, और ग्राहकों के परिसरों में ONT हैं। स्प्लिटर एक पैसिव उपकरण है जो:\",\"oe\":[\"Amplifies the optical signal electronically\",\"Divides the optical power among multiple output fibres\",\"Converts optical wavelengths to electrical signals\",\"Regenerates and cleans the signal\"],\"oh\":[\"ऑप्टिकल सिग्नल को इलेक्ट्रॉनिक रूप से एम्पलीफाई करता है\",\"ऑप्टिकल पावर (प्रकाश) को कई आउटपुट फाइबर के बीच विभाजित करता है\",\"ऑप्टिकल तरंग दैर्ध्य को विद्युत संकेतों में बदलता है\",\"सिग्नल को पुनर्जीवित (regenerate) करता है\"],\"a\":1,\"ee\":\"A passive splitter uses no electrical power; it simply splits the light beam (power) to serve multiple subscribers simultaneously.\",\"eh\":\"\"},{\"n\":2,\"d\":\"\",\"se\":\"What does WDM stand for in optical fibre communication?\",\"sh\":\"ऑप्टिकल फाइबर संचार में WDM का पूर्ण रूप क्या है?\",\"oe\":[\"Wavelength Division Multiplexing\",\"Wideband Digital Multiplexing\",\"Wireless Data Modulation\",\"Waveform Division Multiplexing\"],\"oh\":[\"Wavelength Division Multiplexing\",\"Wideband Digital Multiplexing\",\"Wireless Data Modulation\",\"Waveform Division Multiplexing\"],\"a\":0,\"ee\":\"WDM allows multiple optical carrier signals of different wavelengths (colours of light) to be transmitted simultaneously on a single fibre.\",\"eh\":\"\"},{\"n\":3,\"d\":\"\",\"se\":\"Which network protocol is used to automatically assign IP addresses to devices connecting to a LAN?\",\"sh\":\"LAN से जुड़ने वाले उपकरणों को स्वचालित रूप से IP एड्रेस असाइन (प्रदान) करने के लिए किस नेटवर्क प्रोटोकॉल का उपयोग किया जाता है?\",\"oe\":[\"DNS\",\"DHCP\",\"ARP\",\"ICMP\"],\"oh\":[\"DNS\",\"DHCP\",\"ARP\",\"ICMP\"],\"a\":1,\"ee\":\"DHCP servers dynamically assign IP addresses, subnet masks, and default gateways to devices, eliminating manual IP configuration.\",\"eh\":\"\"},{\"n\":4,\"d\":\"\",\"se\":\"The critical device that converts AC mains power to a stable DC voltage (usually -48V) for telecom equipment is called a:\",\"sh\":\"टेलीकॉम उपकरणों के लिए AC मेन्स पावर को स्थिर DC वोल्टेज (आमतौर पर -48V) में बदलने वाला महत्वपूर्ण उपकरण क्या कहलाता है?\",\"oe\":[\"Inverter\",\"Rectifier\",\"CVT\",\"Stabiliser\"],\"oh\":[\"इन्वर्टर (Inverter)\",\"रेक्टिफायर (Rectifier)\",\"CVT\",\"स्टेबलाइजर\"],\"a\":1,\"ee\":\"In telecom power plants, rectifiers convert the incoming alternating current (AC) to direct current (DC) to power the load and charge the batteries.\",\"eh\":\"\"},{\"n\":5,\"d\":\"\",\"se\":\"What is the function of an ATS (Automatic Transfer Switch) in a facility's power system?\",\"sh\":\"किसी सुविधा (Facility) के पावर सिस्टम में ATS (ऑटोमैटिक ट्रांसफर स्विच) का क्या कार्य है?\",\"oe\":[\"To automatically switch the load between the main grid and a backup generator during a power failure\",\"To continuously regulate output voltage\",\"To protect equipment against massive short circuits\",\"To convert AC to DC automatically\"],\"oh\":[\"पावर फेल होने के दौरान लोड को मुख्य ग्रिड और बैकअप जनरेटर के बीच स्वचालित रूप से स्विच करना\",\"आउटपुट वोल्टेज को लगातार नियंत्रित करना\",\"बड़े शॉर्ट सर्किट से उपकरणों की रक्षा करना\",\"स्वचालित रूप से AC को DC में बदलना\"],\"a\":0,\"ee\":\"The ATS detects grid failure, signals the generator to start, and transfers the load seamlessly to the backup supply.\",\"eh\":\"\"},{\"n\":6,\"d\":\"\",\"se\":\"In a corporate video conferencing system, what is the role of an MCU (Multipoint Control Unit)?\",\"sh\":\"कॉर्पोरेट वीडियो कॉन्फ्रेंसिंग सिस्टम में, MCU (मल्टीपॉइंट कंट्रोल यूनिट) की क्या भूमिका है?\",\"oe\":[\"To bridge and connect three or more audiovisual endpoints into a single conference\",\"To physically compress the video feed at the camera\",\"To encrypt LAN data\",\"To measure bandwidth consumption\"],\"oh\":[\"तीन या अधिक ऑडियोविजुअल एंडपॉइंट्स (endpoints) को एक ही कॉन्फ्रेंस में जोड़ना (bridge करना)\",\"कैमरे पर वीडियो फ़ीड को भौतिक रूप से संपीड़ित (compress) करना\",\"LAN डेटा को एन्क्रिप्ट करना\",\"बैंडविड्थ की खपत को मापना\"],\"a\":0,\"ee\":\"An MCU mixes and manages audio/video streams from multiple participants so everyone can see and hear each other.\",\"eh\":\"\"},{\"n\":7,\"d\":\"\",\"se\":\"What is the typical network bitrate requirement for streaming a 1080p (HD) CCTV camera using H.264 compression at 30 fps?\",\"sh\":\"H.264 कम्प्रेशन का उपयोग करके 30 fps पर 1080p (HD) CCTV कैमरे की स्ट्रीमिंग के लिए विशिष्ट नेटवर्क बिटरेट आवश्यकता क्या है?\",\"oe\":[\"1 to 2 Mbps\",\"4 to 6 Mbps\",\"15 to 20 Mbps\",\"50 to 100 Mbps\"],\"oh\":[\"1 से 2 Mbps\",\"4 से 6 Mbps\",\"15 से 20 Mbps\",\"50 से 100 Mbps\"],\"a\":1,\"ee\":\"A standard 1080p stream with H.264 compression requires approximately 4-6 Mbps. (H.265 reduces this by about half).\",\"eh\":\"\"},{\"n\":8,\"d\":\"\",\"se\":\"Which of the following routing protocols is an Interior Gateway Protocol (IGP) that relies strictly on &quot;hop count&quot; as its routing metric?\",\"sh\":\"निम्नलिखित में से कौन सा राउटिंग प्रोटोकॉल एक इंटीरियर गेटवे प्रोटोकॉल (IGP) है जो अपने राउटिंग मीट्रिक के रूप में केवल &quot;हॉप काउंट&quot; (Hop count) पर निर्भर करता है?\",\"oe\":[\"OSPF\",\"BGP\",\"RIP\",\"EIGRP\"],\"oh\":[\"OSPF\",\"BGP\",\"RIP\",\"EIGRP\"],\"a\":2,\"ee\":\"RIP is a distance-vector protocol that uses hop count (max 15 hops) to determine the best path to a destination network.\",\"eh\":\"\"},{\"n\":9,\"d\":\"\",\"se\":\"Image-based: A graph displays the capacity curve of a Li-ion battery over thousands of charge/discharge cycles. The &quot;End of Life&quot; (EOL) for a telecom/industrial lithium battery is typically declared when its capacity drops to:\",\"sh\":\"चित्र-आधारित: एक ग्राफ कई हज़ार चार्ज/डिस्चार्ज चक्रों (cycles) में Li-ion बैटरी की क्षमता (capacity) वक्र को प्रदर्शित करता है। टेलीकॉम/औद्योगिक लिथियम बैटरी के लिए &quot;एंड ऑफ लाइफ&quot; (EOL) आमतौर पर तब घोषित किया जाता है जब इसकी क्षमता गिरकर रह जाती है:\",\"oe\":[\"95% of its original capacity\",\"80% of its original capacity\",\"50% of its original capacity\",\"0% (complete failure)\"],\"oh\":[\"मूल क्षमता का 95%\",\"मूल क्षमता का 80%\",\"मूल क्षमता का 50%\",\"0% (पूर्ण विफलता)\"],\"a\":1,\"ee\":\"Industry standards consider a lithium battery at the end of its reliable service life when it can only hold 80% of its factory-rated capacity.\",\"eh\":\"\"},{\"n\":10,\"d\":\"\",\"se\":\"Which IoT protocol is designed specifically for Low-Power Wide-Area Networks (LPWAN), capable of long-range communication (up to 10+ km) in sub-GHz bands?\",\"sh\":\"कौन सा IoT प्रोटोकॉल विशेष रूप से कम-शक्ति वाले विस्तृत-क्षेत्र नेटवर्क (LPWAN) के लिए डिज़ाइन किया गया है, जो उप-गीगाहर्ट्ज़ (sub-GHz) बैंड में लंबी दूरी के संचार (10+ किमी तक) में सक्षम है?\",\"oe\":[\"ZigBee\",\"Bluetooth Low Energy (BLE)\",\"LoRaWAN\",\"Wi-Fi HaLow\"],\"oh\":[\"ZigBee\",\"Bluetooth Low Energy (BLE)\",\"LoRaWAN\",\"Wi-Fi HaLow\"],\"a\":2,\"ee\":\"LoRaWAN provides exceptional range with very low power consumption, making it ideal for battery-operated sensors in large mining areas.\",\"eh\":\"\"},{\"n\":11,\"d\":\"\",\"se\":\"What is the raw over-the-air data rate of the ZigBee protocol (IEEE 802.15.4) operating in the 2.4 GHz band?\",\"sh\":\"2.4 GHz बैंड में काम करने वाले ZigBee प्रोटोकॉल (IEEE 802.15.4) का रॉ ओवर-द-एयर डेटा रेट (Data rate) क्या है?\",\"oe\":[\"250 kbps\",\"1 Mbps\",\"10 Mbps\",\"54 Mbps\"],\"oh\":[\"250 kbps\",\"1 Mbps\",\"10 Mbps\",\"54 Mbps\"],\"a\":0,\"ee\":\"ZigBee is designed for low data rate, low power control networks, maxing out at 250 kbps in the 2.4 GHz spectrum.\",\"eh\":\"\"},{\"n\":12,\"d\":\"\",\"se\":\"A resistor has four colour bands: Brown, Black, Red, Gold. What is its exact resistance value?\",\"sh\":\"एक रेसिस्टर (Resistor) में चार कलर बैंड हैं: भूरा, काला, लाल, सुनहरा (Brown, Black, Red, Gold)। इसका सटीक प्रतिरोध मान क्या है?\",\"oe\":[\"1 kΩ ± 5%\",\"10 kΩ ± 5%\",\"100 Ω ± 5%\",\"1 Ω ± 5%\"],\"oh\":[\"1 kΩ ± 5%\",\"10 kΩ ± 5%\",\"100 Ω ± 5%\",\"1 Ω ± 5%\"],\"a\":0,\"ee\":\"Brown = 1, Black = 0. Multiplier Red = 100. (10 × 100 = 1000 Ω, or 1 kΩ). Gold indicates a 5% tolerance.\",\"eh\":\"भूरा = 1, काला = 0. गुणक लाल = 100. (10 × 100 = 1000 Ω, या 1 kΩ). सुनहरा 5% सहनशीलता (tolerance) को दर्शाता है।\"},{\"n\":13,\"d\":\"\",\"se\":\"In server hardware, what is the main advantage of utilizing RAID 5 over RAID 1?\",\"sh\":\"सर्वर हार्डवेयर में, RAID 1 की तुलना में RAID 5 का उपयोग करने का मुख्य लाभ क्या है?\",\"oe\":[\"RAID 5 offers higher read performance and better storage efficiency by using parity across multiple disks\",\"RAID 5 provides 100% complete mirroring\",\"RAID 5 requires only two hard drives\",\"RAID 5 requires no parity calculations\"],\"oh\":[\"RAID 5 कई डिस्क में पैरिटी (parity) का उपयोग करके उच्च रीड प्रदर्शन और बेहतर स्टोरेज दक्षता प्रदान करता है\",\"RAID 5 100% पूर्ण मिररिंग प्रदान करता है\",\"RAID 5 में केवल दो हार्ड ड्राइव की आवश्यकता होती है\",\"RAID 5 में पैरिटी गणना की आवश्यकता नहीं होती है\"],\"a\":0,\"ee\":\"RAID 1 mirrors data (50% storage loss). RAID 5 stripes data with parity across 3 or more disks, losing only 1 disk's worth of total capacity to redundancy.\",\"eh\":\"\"},{\"n\":14,\"d\":\"\",\"se\":\"Storage Calculation: A 4-Megapixel CCTV camera generates a constant bitrate of 6 Mbps. Approximately how much storage space is required to retain 30 days of continuous recording for this single camera?\",\"sh\":\"स्टोरेज गणना: एक 4-मेगापिक्सेल CCTV कैमरा 6 Mbps का निरंतर बिटरेट उत्पन्न करता है। इस एक कैमरे के लिए 30 दिनों की निरंतर रिकॉर्डिंग को बनाए रखने के लिए लगभग कितने स्टोरेज स्पेस की आवश्यकता होगी?\",\"oe\":[\"~ 1.0 TB\",\"~ 2.0 TB\",\"~ 4.0 TB\",\"~ 6.0 TB\"],\"oh\":[\"~ 1.0 TB\",\"~ 2.0 TB\",\"~ 4.0 TB\",\"~ 6.0 TB\"],\"a\":1,\"ee\":\"6 Megabits per sec (Mbps) = 0.75 Megabytes per sec (MB/s). 0.75 MB/s × 3600s = 2,700 MB/hr = 2.7 GB/hr. 2.7 GB/hr × 24 hrs = 64.8 GB/day. 64.8 GB/day × 30 days = 1944 GB, which is approximately 1.94 TB.\",\"eh\":\"6 Mbps = 0.75 MB/s. 1 घंटे में 2.7 GB. 1 दिन में 64.8 GB. 30 दिनों में = 1944 GB (लगभग 1.94 TB)।\"},{\"n\":15,\"d\":\"\",\"se\":\"What is the primary function of a network Firewall?\",\"sh\":\"नेटवर्क फ़ायरवॉल (Firewall) का प्राथमिक कार्य क्या है?\",\"oe\":[\"To filter incoming and outgoing network traffic based on predetermined security rules\",\"To physically route packets between different ISP networks\",\"To dynamically assign IP addresses\",\"To resolve DNS queries securely\"],\"oh\":[\"पूर्व-निर्धारित सुरक्षा नियमों के आधार पर आने वाले और बाहर जाने वाले नेटवर्क ट्रैफ़िक को फ़िल्टर करना\",\"विभिन्न ISP नेटवर्क के बीच पैकेट को भौतिक रूप से रूट करना\",\"गतिशील रूप से IP पते निर्दिष्ट करना\",\"DNS प्रश्नों को सुरक्षित रूप से हल करना\"],\"a\":0,\"ee\":\"Firewalls establish a barrier between trusted internal networks and untrusted external networks (like the internet).\",\"eh\":\"\"},{\"n\":16,\"d\":\"\",\"se\":\"In computer CPU architecture, which type of cache memory is the smallest, fastest, and located closest to the processing core?\",\"sh\":\"कंप्यूटर CPU आर्किटेक्चर में, किस प्रकार की कैश मेमोरी (Cache memory) सबसे छोटी, सबसे तेज़ और प्रोसेसिंग कोर के सबसे करीब स्थित होती है?\",\"oe\":[\"L1 cache\",\"L2 cache\",\"L3 cache\",\"System RAM\"],\"oh\":[\"L1 cache\",\"L2 cache\",\"L3 cache\",\"System RAM\"],\"a\":0,\"ee\":\"Level 1 (L1) cache operates at the speed of the processor core, making it the fastest but lowest capacity memory in the hierarchy.\",\"eh\":\"\"},{\"n\":17,\"d\":\"\",\"se\":\"In CCTV technology, what does the camera feature WDR stand for?\",\"sh\":\"CCTV तकनीक में, कैमरे की विशेषता WDR का क्या अर्थ है?\",\"oe\":[\"Wide Dynamic Range\",\"Wireless Data Rate\",\"Waveform Digital Recording\",\"Wideband Data Receiver\"],\"oh\":[\"Wide Dynamic Range\",\"Wireless Data Rate\",\"Waveform Digital Recording\",\"Wideband Data Receiver\"],\"a\":0,\"ee\":\"WDR digitally balances the light in a scene to ensure clear images even when there are both very bright and very dark areas (e.g., looking out a window).\",\"eh\":\"\"},{\"n\":18,\"d\":\"\",\"se\":\"What is the designated unlicensed ISM frequency band for LoRaWAN operations in India?\",\"sh\":\"भारत में LoRaWAN संचालन के लिए निर्दिष्ट बिना लाइसेंस वाला ISM फ़्रीक्वेंसी बैंड कौन सा है?\",\"oe\":[\"865 - 867 MHz\",\"902 - 928 MHz\",\"433 MHz\",\"5.15 GHz\"],\"oh\":[\"865 - 867 MHz\",\"902 - 928 MHz\",\"433 MHz\",\"5.15 GHz\"],\"a\":0,\"ee\":\"The Government of India allows license-free operation of LPWAN devices in the 865-867 MHz spectrum.\",\"eh\":\"\"},{\"n\":19,\"d\":\"\",\"se\":\"Which electronic test instrument is used primarily to visualize the exact waveform, amplitude, and frequency of electrical signals over time?\",\"sh\":\"समय के साथ विद्युत संकेतों के सटीक तरंग रूप (waveform), आयाम (amplitude) और आवृत्ति (frequency) की कल्पना (Visualize) करने के लिए मुख्य रूप से किस इलेक्ट्रॉनिक परीक्षण उपकरण का उपयोग किया जाता है?\",\"oe\":[\"Spectrum Analyser\",\"Oscilloscope\",\"Multimeter\",\"Earth Tester\"],\"oh\":[\"स्पेक्ट्रम एनालाइजर (Spectrum Analyser)\",\"ऑसिलोस्कोप (Oscilloscope)\",\"मल्टीमीटर\",\"अर्थ टेस्टर\"],\"a\":1,\"ee\":\"An oscilloscope displays an X-Y graph of electrical voltage (Y-axis) over time (X-axis).\",\"eh\":\"\"},{\"n\":20,\"d\":\"\",\"se\":\"In professional video conferencing, what is the purpose of 'Acoustic Echo Cancellation' (AEC)?\",\"sh\":\"पेशेवर वीडियो कॉन्फ्रेंसिंग में, 'अकौस्टिक इको कैंसलेशन' (AEC) का उद्देश्य क्या है?\",\"oe\":[\"To remove ambient background noise like fans or ACs\",\"To prevent a remote speaker's voice from looping out of the local speaker and back into the local microphone\",\"To compress the audio file size\",\"To encrypt the audio stream\"],\"oh\":[\"पंखे या AC जैसे परिवेशी पृष्ठभूमि शोर को दूर करने के लिए\",\"दूर बैठे वक्ता की आवाज़ को स्थानीय स्पीकर से बाहर निकलने और वापस स्थानीय माइक्रोफ़ोन में लूप होने (गूंजने) से रोकने के लिए\",\"ऑडियो फ़ाइल आकार को संपीड़ित करने के लिए\",\"ऑडियो स्ट्रीम को एन्क्रिप्ट करने के लिए\"],\"a\":1,\"ee\":\"AEC actively subtracts the incoming audio from the microphone input, preventing annoying echoes during calls.\",\"eh\":\"\"},{\"n\":21,\"d\":\"\",\"se\":\"Image-based: A circuit diagram shows four diodes arranged in a diamond configuration connected to an AC transformer. This rectifier topology is known as a:\",\"sh\":\"चित्र-आधारित: एक सर्किट आरेख एक AC ट्रांसफार्मर से जुड़े डायमंड (Diamond) कॉन्फ़िगरेशन में व्यवस्थित चार डायोड दिखाता है। इस रेक्टिफायर टोपोलॉजी को किस रूप में जाना जाता है:\",\"oe\":[\"Half-wave rectifier\",\"Full-wave centre-tap rectifier\",\"Full-wave bridge rectifier\",\"Voltage multiplier\"],\"oh\":[\"हाफ-वेव रेक्टिफायर\",\"फुल-वेव सेंटर-टैप रेक्टिफायर\",\"फुल-वेव ब्रिज रेक्टिफायर\",\"वोल्टेज मल्टीप्लायर\"],\"a\":2,\"ee\":\"A bridge rectifier utilizes four diodes to convert the entire AC waveform to DC without needing a specialized centre-tapped transformer.\",\"eh\":\"\"},{\"n\":22,\"d\":\"\",\"se\":\"To maximize the overall lifespan (cycle life) of a deep-cycle lead-acid battery, the Depth of Discharge (DOD) per cycle should generally not exceed:\",\"sh\":\"डीप-साइकिल लेड-एसिड बैटरी के समग्र जीवनकाल (चक्र जीवन/Cycle life) को अधिकतम करने के लिए, प्रति चक्र डिस्चार्ज की गहराई (DOD) आमतौर पर किससे अधिक नहीं होनी चाहिए?\",\"oe\":[\"100%\",\"80%\",\"50%\",\"10%\"],\"oh\":[\"100%\",\"80%\",\"50%\",\"10%\"],\"a\":2,\"ee\":\"Repeatedly draining a lead-acid battery below 50% DOD drastically degrades the lead plates and shortens its lifespan.\",\"eh\":\"\"},{\"n\":23,\"d\":\"\",\"se\":\"Which instrument is required to measure the absolute optical light power (in dBm or milliwatts) at the end of a fibre optic link?\",\"sh\":\"फाइबर ऑप्टिक लिंक के अंत में पूर्ण ऑप्टिकल लाइट पावर (dBm या मिलिवाट में) मापने के लिए किस उपकरण की आवश्यकता होती है?\",\"oe\":[\"OTDR\",\"Optical Power Meter (OPM)\",\"Visual Fault Locator\",\"Splicing Machine\"],\"oh\":[\"OTDR\",\"ऑप्टिकल पावर मीटर (OPM)\",\"विजुअल फॉल्ट लोकेटर (VFL)\",\"स्प्लिसिंग मशीन\"],\"a\":1,\"ee\":\"Used in conjunction with a light source, an OPM directly measures the strength of the optical signal arriving at the receiver.\",\"eh\":\"\"},{\"n\":24,\"d\":\"\",\"se\":\"In the TCP/IP protocol suite, which protocol handles network diagnostics and error reporting, such as the `ping` command?\",\"sh\":\"TCP/IP प्रोटोकॉल सूट में, कौन सा प्रोटोकॉल नेटवर्क डायग्नोस्टिक्स और त्रुटि रिपोर्टिंग (जैसे 'पिंग' कमांड) को संभालता है?\",\"oe\":[\"ICMP (Internet Control Message Protocol)\",\"ARP\",\"RARP\",\"IGMP\"],\"oh\":[\"ICMP (Internet Control Message Protocol)\",\"ARP\",\"RARP\",\"IGMP\"],\"a\":0,\"ee\":\"ICMP handles network-level control messages, including the Echo Requests and Replies used by `ping`.\",\"eh\":\"\"},{\"n\":25,\"d\":\"\",\"se\":\"What is the typical illumination sensitivity of a high-quality &quot;Starlight&quot; CCTV camera used for low-light environments?\",\"sh\":\"कम रोशनी वाले वातावरण के लिए उपयोग किए जाने वाले उच्च गुणवत्ता वाले &quot;स्टारलाइट&quot; (Starlight) CCTV कैमरे की विशिष्ट रोशनी संवेदनशीलता (Sensitivity) क्या है?\",\"oe\":[\"10 to 20 lux\",\"0.01 to 0.001 lux\",\"100 lux\",\"500 lux\"],\"oh\":[\"10 से 20 लक्स\",\"0.01 से 0.001 लक्स\",\"100 लक्स\",\"500 लक्स\"],\"a\":1,\"ee\":\"Starlight sensors are highly sensitive, capable of producing colour images in near-total darkness (0.001 lux).\",\"eh\":\"\"},{\"n\":26,\"d\":\"\",\"se\":\"Which type of legacy fibre optic connector utilizes a spring-loaded bayonet (twist-lock) coupling mechanism?\",\"sh\":\"\",\"oe\":[\"SC\",\"ST (Straight Tip)\",\"LC\",\"MTRJ\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"ST connectors lock with a quarter-turn twist, much like a BNC coaxial connector.\",\"eh\":\"\"},{\"n\":27,\"d\":\"\",\"se\":\"In computer hardware, what is the performance benefit of 'dual-channel' memory architecture?\",\"sh\":\"\",\"oe\":[\"It allows the installation of two separate CPUs\",\"It allows two memory modules to be accessed simultaneously, effectively doubling the memory bandwidth\",\"It stores a perfect backup of the operating system\",\"It halves the RAM power consumption\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Dual-channel motherboards open a 128-bit data path instead of a 64-bit path when identical RAM sticks are used.\",\"eh\":\"\"},{\"n\":28,\"d\":\"\",\"se\":\"What is the core function of a VFL (Visual Fault Locator) when troubleshooting optical fibre?\",\"sh\":\"\",\"oe\":[\"To measure the exact dB loss of a splice\",\"To emit a powerful, visible red laser that glows brightly at the site of cracks, micro-bends, or bad splices\",\"To clean the fibre end-faces\",\"To measure the refractive index of the glass\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"The red light leaks through the plastic jacket at the point of damage, providing instant visual troubleshooting over short distances.\",\"eh\":\"\"},{\"n\":29,\"d\":\"\",\"se\":\"Which of the following is a recognized security configuration implemented on Wi-Fi routers?\",\"sh\":\"\",\"oe\":[\"WPA2 / WPA3 Encryption\",\"MAC Address Filtering\",\"SSID Hiding\",\"All of the above\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"These are the three standard pillars of securing a local wireless access point.\",\"eh\":\"\"},{\"n\":30,\"d\":\"\",\"se\":\"The term 'bitrate', heavily utilized in video encoding and network streaming, is universally measured in:\",\"sh\":\"\",\"oe\":[\"Mbps (Megabits per second)\",\"MBps (Megabytes per second)\",\"FPS (Frames per second)\",\"GHz (Gigahertz)\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Network speeds and video streaming rates are almost exclusively measured in bits (lowercase 'b'), not bytes.\",\"eh\":\"\"},{\"n\":31,\"d\":\"\",\"se\":\"Image-based: An oscilloscope screen displays a sinusoidal AC waveform. How does a technician manually measure the Peak-to-Peak voltage using the grid?\",\"sh\":\"\",\"oe\":[\"By counting the vertical divisions from the zero-line to the highest positive peak\",\"By counting the total vertical divisions from the absolute highest positive peak to the lowest negative peak\",\"By counting the horizontal divisions of one full cycle\",\"By observing the phase shift against a reference\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Peak-to-peak voltage (Vp-p) is the total vertical distance (amplitude) from the crest of the wave to the trough.\",\"eh\":\"\"},{\"n\":32,\"d\":\"\",\"se\":\"Which of the following is a highly efficient video CODEC standard widely used in modern 4K CCTV and streaming?\",\"sh\":\"\",\"oe\":[\"H.264 (AVC)\",\"H.265 (HEVC)\",\"VP9\",\"All of the above\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"H.264, H.265, and VP9 are the industry-standard algorithms used to compress massive raw video files.\",\"eh\":\"\"},{\"n\":33,\"d\":\"\",\"se\":\"As per the Indian Standard (IS 732) for electrical wiring, what is the mandatory colour of the Neutral wire in a 3-Phase AC system?\",\"sh\":\"\",\"oe\":[\"Red\",\"Black\",\"Blue\",\"Green\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"In India, the three phases are Red, Yellow, and Blue (RYB). The Neutral wire is Black, and Earth is Green.\",\"eh\":\"\"},{\"n\":34,\"d\":\"\",\"se\":\"Which of the following is a prime example of 'Non-Volatile' computer memory?\",\"sh\":\"\",\"oe\":[\"System RAM\",\"CPU L2 Cache\",\"Solid State Drive (SSD)\",\"CPU Registers\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Non-volatile memory retains its stored data even when the power is completely shut off (like an SSD or ROM).\",\"eh\":\"\"},{\"n\":35,\"d\":\"\",\"se\":\"For a seamless 720p (HD) video conferencing call, what is the generally recommended minimum upload/download bandwidth?\",\"sh\":\"\",\"oe\":[\"128 kbps\",\"1.0 to 1.5 Mbps\",\"5.0 Mbps\",\"25 Mbps\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Using modern H.264 compression, an HD video call consumes roughly 1 to 1.5 Mbps of sustained bandwidth.\",\"eh\":\"\"},{\"n\":36,\"d\":\"\",\"se\":\"When comparing fibre splicing techniques, what is the main disadvantage of a Mechanical Splice versus a Fusion Splice?\",\"sh\":\"\",\"oe\":[\"Mechanical splices are significantly more expensive to perform\",\"Mechanical splices have higher insertion loss and suffer from higher back-reflectance\",\"Mechanical splices require heavy, automated machines\",\"Mechanical splices destroy the fibre cladding\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Because the glass ends are not physically melted together (only aligned with gel), light reflects off the microscopic gap.\",\"eh\":\"\"},{\"n\":37,\"d\":\"\",\"se\":\"In CCTV camera optics, which parameter mechanically dictates the amount of light that enters the lens and hits the image sensor?\",\"sh\":\"\",\"oe\":[\"Lens Aperture (F-stop)\",\"Shutter Speed\",\"Digital ISO\",\"Focal Length\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"The aperture is the physical opening in the lens. A lower F-stop number (e.g., f/1.4) means a wider opening, allowing more light.\",\"eh\":\"\"},{\"n\":38,\"d\":\"\",\"se\":\"In satellite communications via Geostationary Earth Orbit (GEO), what is the typical unavoidable round-trip signal latency?\",\"sh\":\"\",\"oe\":[\"~ 10 ms\",\"~ 50 ms\",\"~ 150 ms\",\"~ 500 ms\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Radio waves must travel ~36,000 km up and back down twice. The pure physics of this distance results in roughly 500-600 ms of latency.\",\"eh\":\"\"},{\"n\":39,\"d\":\"\",\"se\":\"In Multimode optical fibres, what phenomenon causes signal distortion because light rays taking different paths (modes) arrive at the receiver at slightly different times?\",\"sh\":\"\",\"oe\":[\"Chromatic dispersion\",\"Modal dispersion\",\"Polarisation mode dispersion\",\"Rayleigh scattering\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Modal dispersion severely limits the bandwidth and distance of multimode fibre, which is why single-mode fibre is used for long distances.\",\"eh\":\"\"},{\"n\":40,\"d\":\"\",\"se\":\"What is the specific life-saving purpose of an RCCB (Residual Current Circuit Breaker)?\",\"sh\":\"\",\"oe\":[\"To protect wiring against extreme thermal overloads\",\"To instantly disconnect the circuit when it detects earth leakage current, preventing electrocution\",\"To protect equipment against phase-to-phase short circuits\",\"To regulate incoming voltage spikes\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"If current leaks through a person to the ground, the RCCB senses the imbalance between Live and Neutral and trips within milliseconds.\",\"eh\":\"\"},{\"n\":41,\"d\":\"\",\"se\":\"Image-based: A diagram shows the open internals of a mechanical Hard Disk Drive (HDD). The delicate arm structure that swings across the spinning platter to read/write data is called the:\",\"sh\":\"\",\"oe\":[\"Spindle motor\",\"Read/Write head actuator\",\"Solid-state controller\",\"SATA interface\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"The actuator arm holds the microscopic read/write heads that magnetically alter the data on the platters.\",\"eh\":\"\"},{\"n\":42,\"d\":\"\",\"se\":\"In IoT architecture, what does the concept of 'Edge Computing' refer to?\",\"sh\":\"\",\"oe\":[\"Sending all raw sensor data directly to a centralized cloud server\",\"Processing and analyzing data locally on or near the IoT device itself to reduce network latency and bandwidth usage\",\"Storing data on magnetic tapes\",\"Using only wireless edge routers\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Edge computing allows a camera or sensor to make local decisions (like object detection) without waiting for cloud processing.\",\"eh\":\"\"},{\"n\":43,\"d\":\"\",\"se\":\"Which IEEE standard defines Power over Ethernet (PoE++) capable of delivering up to 60W or 100W of DC power over a standard network cable?\",\"sh\":\"\",\"oe\":[\"IEEE 802.3af (PoE)\",\"IEEE 802.3at (PoE+)\",\"IEEE 802.3bt (PoE++)\",\"IEEE 802.11ax (Wi-Fi 6)\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"802.3bt uses all four pairs in a CAT-6 cable to deliver high power for devices like PTZ cameras and bright LED lighting.\",\"eh\":\"\"},{\"n\":44,\"d\":\"\",\"se\":\"What is the typical nominal capacity of a high-quality, rechargeable AA size Ni-MH (Nickel-Metal Hydride) battery?\",\"sh\":\"\",\"oe\":[\"500 mAh\",\"1000 mAh\",\"2000 to 2500 mAh\",\"5000 mAh\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Standard AA Ni-MH batteries utilized in handheld radios and electronics typically range from 2000 to 2800 mAh.\",\"eh\":\"\"},{\"n\":45,\"d\":\"\",\"se\":\"When calculating an optical fibre link budget, 'Receiver Sensitivity' is defined as:\",\"sh\":\"\",\"oe\":[\"The minimum optical power required at the detector to achieve an acceptable Bit Error Rate (BER)\",\"The absolute maximum optical power the receiver can handle before burning out\",\"The specific wavelength the receiver operates on\",\"The signal-to-noise ratio of the laser\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"If the incoming light falls below the receiver sensitivity (e.g., -28 dBm), the link will fail or suffer severe data loss.\",\"eh\":\"\"},{\"n\":46,\"d\":\"\",\"se\":\"In structured enterprise cabling, what is the primary function of a 'Patch Panel' mounted in a server rack?\",\"sh\":\"\",\"oe\":[\"To electronically amplify network signals\",\"To provide a fixed, organized termination point for bulk cables running through walls, allowing easy changes via short patch cords\",\"To automatically assign IP addresses\",\"To convert electrical signals to fibre optic\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Patch panels keep the fragile, solid-core permanent cables safe from movement while allowing flexible connections to network switches.\",\"eh\":\"\"},{\"n\":47,\"d\":\"\",\"se\":\"Which of the following is a primary characteristic that distinguishes a 'Managed' Ethernet switch from an unmanaged one?\",\"sh\":\"\",\"oe\":[\"It is purely plug-and-play\",\"It allows network administrators to configure VLANs, QoS, and monitor SNMP traffic\",\"It operates strictly on Wi-Fi\",\"It does not require a power supply\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Managed switches offer operating systems (like Cisco IOS) for deep configuration and security control.\",\"eh\":\"\"},{\"n\":48,\"d\":\"\",\"se\":\"In telecommunications, what is the fundamental operating principle of TDM (Time Division Multiplexing)?\",\"sh\":\"\",\"oe\":[\"Combining multiple signals by giving each signal its own specific time slot in a rapidly repeating sequence\",\"Combining multiple signals by using entirely different light wavelengths\",\"Encrypting analog signals into digital code\",\"Amplifying multiple signals simultaneously\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"TDM allocates sequential micro-timeslots to different channels over a single physical wire.\",\"eh\":\"\"},{\"n\":49,\"d\":\"\",\"se\":\"What is the standard voltage drop across a standard Silicon p-n junction diode when it is forward-biased?\",\"sh\":\"\",\"oe\":[\"0.2 V\",\"0.7 V\",\"1.2 V\",\"2.1 V\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"A standard silicon diode requires approximately 0.7 Volts to overcome its depletion region and conduct current. (Germanium is ~0.3V).\",\"eh\":\"\"},{\"n\":50,\"d\":\"\",\"se\":\"In computer systems terminology, what does a 'bottleneck' refer to?\",\"sh\":\"\",\"oe\":[\"A cybersecurity vulnerability\",\"The slowest component in a system that restricts the overall performance of faster components\",\"A type of network malware\",\"The main power connector on a motherboard\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"For example, pairing a blazing-fast CPU with an old, slow mechanical hard drive creates a data bottleneck.\",\"eh\":\"\"},{\"n\":51,\"d\":\"\",\"se\":\"Which of the following is an obsolete coaxial Ethernet standard characterized by a maximum segment length of 185 meters?\",\"sh\":\"\",\"oe\":[\"10Base-T\",\"10Base-2 (Thinnet)\",\"100Base-TX\",\"1000Base-SX\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"10Base-2 used RG-58 coaxial cable in a bus topology. The &quot;2&quot; roughly denoted its nearly 200m limit (actually 185m).\",\"eh\":\"\"},{\"n\":52,\"d\":\"\",\"se\":\"Battery Charging: If a telecom battery has a capacity of 100 Ah, charging it at a '2C' rate means applying a charge current of:\",\"sh\":\"\",\"oe\":[\"2 Amperes\",\"50 Amperes\",\"100 Amperes\",\"200 Amperes\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"The C-rate is a measure of the rate relative to capacity. 1C for a 100Ah battery is 100A. A 2C rate is 2 × 100 = 200 Amperes.\",\"eh\":\"\"},{\"n\":53,\"d\":\"\",\"se\":\"Image-based: The diagram depicts a network where every endpoint device is connected individually to a central switch. If one cable fails, only that device goes offline. This physical layout is a:\",\"sh\":\"\",\"oe\":[\"Bus topology\",\"Ring topology\",\"Star topology\",\"Mesh topology\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Star topology is the universal standard for modern Ethernet LANs, offering excellent fault tolerance compared to Ring or Bus.\",\"eh\":\"\"},{\"n\":54,\"d\":\"\",\"se\":\"Which two physical techniques are utilized in twisted-pair cables (like CAT-6) to mitigate Electromagnetic Interference (EMI) and crosstalk?\",\"sh\":\"\",\"oe\":[\"High voltage and low current\",\"Thick PVC jackets and water-blocking gel\",\"Differential signalling and tight twisting of the wire pairs\",\"Fibre cladding and index matching gel\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Twisting the pairs ensures that external magnetic fields induce equal and opposite currents, canceling out the interference.\",\"eh\":\"\"},{\"n\":55,\"d\":\"\",\"se\":\"What is the specific function of a 'Serial-to-Ethernet' device server?\",\"sh\":\"\",\"oe\":[\"To connect legacy industrial equipment (using RS-232/RS-485) directly to modern IP networks\",\"To convert parallel printer cables to serial\",\"To amplify weak Ethernet signals\",\"To convert 230V AC to RS-485\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"These converters allow older automation gear to be managed remotely over TCP/IP LANs.\",\"eh\":\"\"},{\"n\":56,\"d\":\"\",\"se\":\"In the cybersecurity realm, what defines an 'Application-Layer Firewall' (or Proxy Firewall)?\",\"sh\":\"\",\"oe\":[\"It only checks source and destination IP addresses\",\"It deeply inspects traffic up to OSI Layer 7, understanding specific protocols like HTTP and FTP\",\"It operates purely on MAC addresses\",\"It only works on offline computers\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Proxy firewalls can block specific commands within an application (e.g., allowing web browsing but blocking file downloads).\",\"eh\":\"\"},{\"n\":57,\"d\":\"\",\"se\":\"What is the laser wavelength typically emitted by a Visual Fault Locator (VFL)?\",\"sh\":\"\",\"oe\":[\"650 nm\",\"850 nm\",\"1310 nm\",\"1550 nm\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"650 nm falls squarely in the visible red spectrum of human vision. (850, 1310, and 1550 nm are infrared and invisible).\",\"eh\":\"\"},{\"n\":58,\"d\":\"\",\"se\":\"What is the standard video resolution denoted by the term '4K UHD' in consumer CCTV systems?\",\"sh\":\"\",\"oe\":[\"1920 × 1080\",\"3840 × 2160\",\"4096 × 2160\",\"7680 × 4320\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Consumer/CCTV 4K Ultra High Definition contains roughly 8.3 million pixels (3840x2160). 4096x2160 is Cinema 4K.\",\"eh\":\"\"},{\"n\":59,\"d\":\"\",\"se\":\"In electrical power protection, what is the primary role of a TVSS (Transient Voltage Surge Suppressor)?\",\"sh\":\"\",\"oe\":[\"To clamp massive voltage spikes (like lightning transients) and shunt them to ground\",\"To disconnect the mains power immediately when overloaded\",\"To measure exact surge current waveforms\",\"To supply backup battery power\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"TVSS (or Surge Arresters) utilize components like MOVs to absorb extreme voltage spikes without interrupting power.\",\"eh\":\"\"},{\"n\":60,\"d\":\"\",\"se\":\"The process of applying a protective tagging device to a telecom main breaker to ensure no one powers it on while a technician is repairing the line is known as:\",\"sh\":\"\",\"oe\":[\"Daisy Chaining\",\"Lockout / Tagout (LOTO)\",\"Earth Faulting\",\"Hot Swapping\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"LOTO is a critical industrial safety procedure that physically locks out energy sources to protect maintenance workers.\",\"eh\":\"\"},{\"n\":61,\"d\":\"\",\"se\":\"The ratio of two numbers is 5:7, and their total sum is 144. What is the value of the larger number?\",\"sh\":\"दो संख्याओं का अनुपात 5:7 है, और उनका कुल योग 144 है। बड़ी संख्या का मान क्या है?\",\"oe\":[\"60\",\"72\",\"84\",\"96\"],\"oh\":[\"60\",\"72\",\"84\",\"96\"],\"a\":2,\"ee\":\"5x + 7x = 144 → 12x = 144 → x = 12. The larger number is 7x = 7 × 12 = 84.\",\"eh\":\"5x + 7x = 144 → 12x = 144 → x = 12. बड़ी संख्या 7x = 7 × 12 = 84 है।\"},{\"n\":62,\"d\":\"\",\"se\":\"Find the next logical number in the series: 2, 5, 11, 23, 47, ?\",\"sh\":\"श्रृंखला में अगली तार्किक संख्या ज्ञात कीजिए: 2, 5, 11, 23, 47, ?\",\"oe\":[\"71\",\"81\",\"91\",\"95\"],\"oh\":[\"71\",\"81\",\"91\",\"95\"],\"a\":3,\"ee\":\"The pattern multiplies the previous number by 2, then adds 1. (47 × 2) + 1 = 94 + 1 = 95.\",\"eh\":\"पैटर्न पिछली संख्या को 2 से गुणा करता है, फिर 1 जोड़ता है। (47 × 2) + 1 = 94 + 1 = 95.\"},{\"n\":63,\"d\":\"\",\"se\":\"A baseline number is first increased by 20%, and the resulting number is then decreased by 20%. What is the net overall change?\",\"sh\":\"एक आधार संख्या में पहले 20% की वृद्धि की जाती है, और परिणामी संख्या में 20% की कमी की जाती है। शुद्ध समग्र परिवर्तन (Net change) क्या है?\",\"oe\":[\"0% (No change)\",\"4% increase\",\"4% decrease\",\"2% decrease\"],\"oh\":[\"0% (कोई परिवर्तन नहीं)\",\"4% वृद्धि\",\"4% कमी\",\"2% कमी\"],\"a\":2,\"ee\":\"Let the number be 100. 100 + 20% = 120. 20% of 120 is 24. 120 - 24 = 96. (100 to 96 is a 4% decrease).\",\"eh\":\"\"},{\"n\":64,\"d\":\"\",\"se\":\"The sum of the squares of two consecutive positive integers is 145. What are the two integers?\",\"sh\":\"दो लगातार धनात्मक पूर्णांकों (consecutive positive integers) के वर्गों (squares) का योग 145 है। वे दो पूर्णांक क्या हैं?\",\"oe\":[\"8 and 9\",\"9 and 10\",\"10 and 11\",\"11 and 12\"],\"oh\":[\"8 और 9\",\"9 और 10\",\"10 और 11\",\"11 और 12\"],\"a\":0,\"ee\":\"8² + 9² = 64 + 81 = 145.\",\"eh\":\"8² + 9² = 64 + 81 = 145.\"},{\"n\":65,\"d\":\"\",\"se\":\"In a specific code language, the word 'JANUARY' is written as 'KBOVBSZ'. Following the exact same logic, how is the word 'FEBRUARY' coded?\",\"sh\":\"एक विशिष्ट कोड भाषा में, 'JANUARY' शब्द को 'KBOVBSZ' लिखा जाता है। बिल्कुल उसी तर्क का पालन करते हुए, 'FEBRUARY' शब्द को कैसे कोडित किया जाएगा?\",\"oe\":[\"GFCSVBSZ\",\"GFCVBSZ\",\"GFCSVBZS\",\"GFCSCBSZ\"],\"oh\":[\"GFCSVBSZ\",\"GFCVBSZ\",\"GFCSVBZS\",\"GFCSCBSZ\"],\"a\":0,\"ee\":\"Each letter is shifted exactly one letter forward in the alphabet (+1). F→G, E→F, B→C, R→S, U→V, A→B, R→S, Y→Z.\",\"eh\":\"प्रत्येक अक्षर वर्णमाला में ठीक एक अक्षर आगे बढ़ जाता है (+1). (U+1 = V).\"},{\"n\":66,\"d\":\"\",\"se\":\"What is the mathematical square root of 2025?\",\"sh\":\"2025 का गणितीय वर्गमूल (square root) क्या है?\",\"oe\":[\"35\",\"40\",\"45\",\"55\"],\"oh\":[\"35\",\"40\",\"45\",\"55\"],\"a\":2,\"ee\":\"40² is 1600. 50² is 2500. 45 × 45 = 2025.\",\"eh\":\"\"},{\"n\":67,\"d\":\"\",\"se\":\"The total perimeter of a rectangle is 80 cm, and its length is 25 cm. What is its breadth?\",\"sh\":\"एक आयत (rectangle) का कुल परिमाप 80 सेमी है, और इसकी लंबाई 25 सेमी है। इसकी चौड़ाई क्या है?\",\"oe\":[\"10 cm\",\"15 cm\",\"20 cm\",\"25 cm\"],\"oh\":[\"10 सेमी\",\"15 सेमी\",\"20 सेमी\",\"25 सेमी\"],\"a\":1,\"ee\":\"Perimeter = 2 × (Length + Breadth). 80 = 2 × (25 + B). 40 = 25 + B. Breadth = 15 cm.\",\"eh\":\"\"},{\"n\":68,\"d\":\"\",\"se\":\"Calculate the median of the following data set: 12, 15, 18, 22, 26, 30, 35\",\"sh\":\"निम्नलिखित डेटा सेट की माध्यिका (Median) की गणना करें: 12, 15, 18, 22, 26, 30, 35\",\"oe\":[\"18\",\"22\",\"26\",\"30\"],\"oh\":[\"18\",\"22\",\"26\",\"30\"],\"a\":1,\"ee\":\"The data set contains 7 numbers, already in ascending order. The middle (4th) number is 22.\",\"eh\":\"\"},{\"n\":69,\"d\":\"\",\"se\":\"A technician buys an old multimeter for ₹400, repairs it, and sells it for ₹500. What is his profit percentage?\",\"sh\":\"एक तकनीशियन ₹400 में एक पुराना मल्टीमीटर खरीदता है, उसकी मरम्मत करता है, और उसे ₹500 में बेचता है। उसका लाभ प्रतिशत (profit percentage) क्या है?\",\"oe\":[\"20%\",\"25%\",\"30%\",\"40%\"],\"oh\":[\"20%\",\"25%\",\"30%\",\"40%\"],\"a\":1,\"ee\":\"Profit = 500 - 400 = 100. Profit % = (Profit / Cost Price) × 100 = (100 / 400) × 100 = 25%.\",\"eh\":\"लाभ = 100. लाभ % = (100 / 400) × 100 = 25%.\"},{\"n\":70,\"d\":\"\",\"se\":\"Find the missing letter in the progression: A, C, F, J, O, ?\",\"sh\":\"प्रगति (progression) में लुप्त अक्षर ज्ञात कीजिए: A, C, F, J, O, ?\",\"oe\":[\"S\",\"T\",\"U\",\"V\"],\"oh\":[\"S\",\"T\",\"U\",\"V\"],\"a\":2,\"ee\":\"The gap between letters increases sequentially: +2 (C), +3 (F), +4 (J), +5 (O). The next gap is +6. O(15) + 6 = 21 (U).\",\"eh\":\"अक्षरों के बीच का अंतर क्रमिक रूप से बढ़ता है: +2 (C), +3 (F), +4 (J), +5 (O)। अगला अंतर +6 होगा। O(15) + 6 = 21 (U).\"},{\"n\":71,\"d\":\"\",\"se\":\"Solve the basic linear equation: If 3x – 7 = 14, what is the value of x?\",\"sh\":\"रैखिक समीकरण (Linear equation) को हल करें: यदि 3x - 7 = 14 है, तो x का मान क्या है?\",\"oe\":[\"3\",\"5\",\"7\",\"9\"],\"oh\":[\"3\",\"5\",\"7\",\"9\"],\"a\":2,\"ee\":\"3x = 14 + 7 = 21. x = 21 / 3 = 7.\",\"eh\":\"\"},{\"n\":72,\"d\":\"\",\"se\":\"A standard six-sided die is rolled once. What is the probability of rolling a number strictly less than 3?\",\"sh\":\"एक मानक छह-तरफा पासा (Die) एक बार फेंका जाता है। 3 से कम (strictly less than 3) संख्या आने की प्रायिकता (Probability) क्या है?\",\"oe\":[\"1/6\",\"1/3\",\"1/2\",\"2/3\"],\"oh\":[\"1/6\",\"1/3\",\"1/2\",\"2/3\"],\"a\":1,\"ee\":\"The favorable outcomes are rolling a 1 or a 2 (two outcomes). 2 / 6 simplifies to 1/3.\",\"eh\":\"3 से कम संख्याएँ 1 और 2 हैं। (2/6 = 1/3).\"},{\"n\":73,\"d\":\"\",\"se\":\"Identify the missing number in the following mathematical series: 1, 4, 9, 16, 25, ?\",\"sh\":\"निम्नलिखित गणितीय श्रृंखला में लुप्त संख्या पहचानें: 1, 4, 9, 16, 25, ?\",\"oe\":[\"30\",\"35\",\"36\",\"40\"],\"oh\":[\"30\",\"35\",\"36\",\"40\"],\"a\":2,\"ee\":\"The series represents the squares of consecutive integers: 1², 2², 3², 4², 5². The next is 6² = 36.\",\"eh\":\"यह लगातार पूर्णांकों के वर्गों की एक श्रृंखला है: 1², 2², 3², 4², 5²। अगला 6² = 36 है।\"},{\"n\":74,\"d\":\"\",\"se\":\"The simple interest accrued on a principal sum is ₹600 after 3 years at a rate of 5% per annum. What was the principal sum?\",\"sh\":\"5% प्रति वर्ष की दर से 3 वर्षों के बाद किसी मूलधन पर अर्जित साधारण ब्याज ₹600 है। मूलधन क्या था?\",\"oe\":[\"₹3000\",\"₹3500\",\"₹4000\",\"₹4500\"],\"oh\":[\"₹3000\",\"₹3500\",\"₹4000\",\"₹4500\"],\"a\":2,\"ee\":\"Principal = (SI × 100) / (Rate × Time) = (600 × 100) / (5 × 3) = 60000 / 15 = ₹4000.\",\"eh\":\"\"},{\"n\":75,\"d\":\"\",\"se\":\"In a team of 6 engineers, there are 3 males and 3 females. If a two-person safety committee is formed at random, what is the probability that both selected are females?\",\"sh\":\"6 इंजीनियरों की एक टीम में 3 पुरुष और 3 महिलाएं हैं। यदि यादृच्छिक रूप से (at random) 2-व्यक्तियों की सुरक्षा समिति बनाई जाती है, तो इसकी क्या प्रायिकता है कि चुने गए दोनों सदस्य महिलाएं होंगी?\",\"oe\":[\"1/5\",\"1/4\",\"1/3\",\"1/2\"],\"oh\":[\"1/5\",\"1/4\",\"1/3\",\"1/2\"],\"a\":0,\"ee\":\"Total possible pairs = 6C2 = 15. Pairs of only females = 3C2 = 3. Probability = 3/15 = 1/5.\",\"eh\":\"\"},{\"n\":76,\"d\":\"\",\"se\":\"A company vehicle travels at a steady speed of 72 km/h. What is this speed expressed in meters per second (m/s)?\",\"sh\":\"कंपनी का एक वाहन 72 किमी/घंटा की स्थिर गति से यात्रा करता है। मीटर प्रति सेकंड (m/s) में यह गति क्या है?\",\"oe\":[\"10 m/s\",\"15 m/s\",\"20 m/s\",\"25 m/s\"],\"oh\":[\"10 m/s\",\"15 m/s\",\"20 m/s\",\"25 m/s\"],\"a\":2,\"ee\":\"Multiply km/h by (5/18) to get m/s. 72 × (5/18) = 4 × 5 = 20 m/s.\",\"eh\":\"\"},{\"n\":77,\"d\":\"\",\"se\":\"What is the Highest Common Factor (HCF) of the numbers 24 and 36?\",\"sh\":\"24 और 36 संख्याओं का महत्तम समापवर्तक (HCF) क्या है?\",\"oe\":[\"6\",\"8\",\"12\",\"18\"],\"oh\":[\"6\",\"8\",\"12\",\"18\"],\"a\":2,\"ee\":\"24 = 2 × 12. 36 = 3 × 12. The highest number that divides both evenly is 12.\",\"eh\":\"\"},{\"n\":78,\"d\":\"\",\"se\":\"If a candidate scores exactly 75% on an exam that has a maximum total of 200 marks, how many marks did the candidate obtain?\",\"sh\":\"यदि कोई उम्मीदवार 200 अंकों की कुल परीक्षा में ठीक 75% अंक प्राप्त करता है, तो उम्मीदवार ने कितने अंक प्राप्त किए?\",\"oe\":[\"120\",\"130\",\"140\",\"150\"],\"oh\":[\"120\",\"130\",\"140\",\"150\"],\"a\":3,\"ee\":\"75% of 200 = 0.75 × 200 = 150.\",\"eh\":\"\"},{\"n\":79,\"d\":\"\",\"se\":\"Logical Reasoning: Which of the following items does NOT belong in the group: Apple, Mango, Orange, Potato, Banana?\",\"sh\":\"तार्किक तर्क (Logical Reasoning): निम्नलिखित में से कौन सा आइटम समूह से संबंधित नहीं है: सेब, आम, संतरा, आलू, केला?\",\"oe\":[\"Apple\",\"Mango\",\"Orange\",\"Potato\"],\"oh\":[\"सेब (Apple)\",\"आम (Mango)\",\"संतरा (Orange)\",\"आलू (Potato)\"],\"a\":3,\"ee\":\"A potato is a root vegetable, whereas all the other options are fruits.\",\"eh\":\"\"},{\"n\":80,\"d\":\"\",\"se\":\"What is the exact angle formed between the hour hand and the minute hand of an analog clock at exactly 6:00?\",\"sh\":\"एनालॉग घड़ी के ठीक 6:00 बजने पर घंटे की सूई और मिनट की सूई के बीच बनने वाला सटीक कोण (Angle) क्या होता है?\",\"oe\":[\"90°\",\"120°\",\"150°\",\"180°\"],\"oh\":[\"90°\",\"120°\",\"150°\",\"180°\"],\"a\":3,\"ee\":\"At 6:00, the minute hand points directly at 12 and the hour hand directly at 6, forming a straight line (180 degrees).\",\"eh\":\"\"},{\"n\":81,\"d\":\"\",\"se\":\"For real-time monitoring and anti-theft tracking of coal transportation, SECL has increasingly adopted which of the following technologies on its transport trucks?\",\"sh\":\"कोयला परिवहन की रीयल-टाइम ट्रैकिंग (Real-time tracking) और चोरी-रोधी निगरानी के लिए, SECL ने अपने परिवहन ट्रकों पर निम्नलिखित में से किस तकनीक को तेजी से अपनाया है?\",\"oe\":[\"GPS-based Vehicle Tracking Systems (VTS)\",\"RFID tags for automated weighbridges\",\"Both A and B\",\"Neither\"],\"oh\":[\"GPS-आधारित वाहन ट्रैकिंग सिस्टम (VTS)\",\"स्वचालित वेटब्रिज (weighbridges) के लिए RFID टैग\",\"A और B दोनों\",\"कोई नहीं\"],\"a\":2,\"ee\":\"SECL leverages both GPS for route tracking and RFID for automated, tamper-proof weight data acquisition.\",\"eh\":\"\"},{\"n\":82,\"d\":\"\",\"se\":\"The Pathakhera coalfield and Sarni coal mine are prominent mining areas located in which district of Madhya Pradesh?\",\"sh\":\"प्रमुख खनन क्षेत्र, पाथाखेड़ा कोयला क्षेत्र (Pathakhera coalfield) और सारणी कोयला खदान (Sarni coal mine), मध्य प्रदेश के किस जिले में स्थित हैं?\",\"oe\":[\"Betul\",\"Chhindwara\",\"Shahdol\",\"Umaria\"],\"oh\":[\"बैतूल (Betul)\",\"छिंदवाड़ा\",\"शहडोल\",\"उमरिया\"],\"a\":0,\"ee\":\"Pathakhera and Sarni fall geographically within the Betul district of MP.\",\"eh\":\"\"},{\"n\":83,\"d\":\"\",\"se\":\"Which of the following is a flagship scheme launched by the Government of Chhattisgarh specifically aimed at providing direct financial assistance to farmers?\",\"sh\":\"निम्नलिखित में से कौन सी छत्तीसगढ़ सरकार द्वारा शुरू की गई एक प्रमुख योजना है जिसका उद्देश्य विशेष रूप से किसानों को प्रत्यक्ष वित्तीय सहायता प्रदान करना है?\",\"oe\":[\"Rajiv Gandhi Kisan Nyay Yojana\",\"PM Kisan Samman Nidhi\",\"Krishak Durghatna Bima Yojana\",\"Godhan Nyay Yojana (cattle focus)\"],\"oh\":[\"राजीव गांधी किसान न्याय योजना\",\"पीएम किसान सम्मान निधि\",\"कृषक दुर्घटना बीमा योजना\",\"गोधन न्याय योजना\"],\"a\":0,\"ee\":\"This is a highly publicized state-specific income support scheme for farmers in Chhattisgarh.\",\"eh\":\"\"},{\"n\":84,\"d\":\"\",\"se\":\"Which mega-mine operated by SECL is currently undergoing environmental clearance expansions to scale up to 70 MTPA, which will make it the largest single coal mine in the world?\",\"sh\":\"पर्यावरण मंजूरी के विस्तार (expansion) के दौर से गुजर रही SECL की कौन सी मेगा-खदान 70 MTPA की क्षमता तक पहुंचने वाली है, जो इसे दुनिया की सबसे बड़ी एकल कोयला खदान बना देगी?\",\"oe\":[\"Dipka\",\"Gevra\",\"Kusmunda\",\"Pelma\"],\"oh\":[\"दीपका\",\"गेवरा (Gevra)\",\"कुसमुंडा\",\"पेलमा\"],\"a\":1,\"ee\":\"SECL is actively expanding the Gevra Opencast Project to 70 Million Tonnes Per Annum (MTPA) capacity.\",\"eh\":\"\"},{\"n\":85,\"d\":\"\",\"se\":\"Which of the following world-renowned tiger reserves and wildlife sanctuaries is located in Madhya Pradesh?\",\"sh\":\"विश्व प्रसिद्ध टाइगर रिज़र्व और वन्यजीव अभ्यारण्यों में से कौन सा मध्य प्रदेश में स्थित है?\",\"oe\":[\"Kanha Tiger Reserve\",\"Bandhavgarh National Park\",\"Panna National Park\",\"All of the above\"],\"oh\":[\"कान्हा टाइगर रिजर्व\",\"बांधवगढ़ राष्ट्रीय उद्यान\",\"पन्ना राष्ट्रीय उद्यान\",\"उपरोक्त सभी\"],\"a\":3,\"ee\":\"Madhya Pradesh is famously known as the 'Tiger State of India' due to hosting all these prominent reserves.\",\"eh\":\"\"},{\"n\":86,\"d\":\"\",\"se\":\"The corporate headquarters of Central Coalfields Limited (CCL), another major subsidiary of CIL, is located in:\",\"sh\":\"CIL की एक अन्य प्रमुख सहायक कंपनी सेंट्रल कोलफील्ड्स लिमिटेड (CCL) का कॉर्पोरेट मुख्यालय कहाँ स्थित है?\",\"oe\":[\"Ranchi\",\"Dhanbad\",\"Kolkata\",\"Patna\"],\"oh\":[\"रांची (Ranchi)\",\"धनबाद\",\"कोलकाता\",\"पटना\"],\"a\":0,\"ee\":\"CCL operates heavily in Jharkhand, with its headquarters situated in the state capital, Ranchi.\",\"eh\":\"\"},{\"n\":87,\"d\":\"\",\"se\":\"The 'International Day of Yoga', proposed by India and recognized globally, is celebrated annually on:\",\"sh\":\"'अंतर्राष्ट्रीय योग दिवस' प्रतिवर्ष कब मनाया जाता है?\",\"oe\":[\"21 June\",\"21 May\",\"21 July\",\"21 August\"],\"oh\":[\"21 जून\",\"21 मई\",\"21 जुलाई\",\"21 अगस्त\"],\"a\":0,\"ee\":\"June 21 was chosen as it is the summer solstice, the longest day of the year in the Northern Hemisphere.\",\"eh\":\"\"},{\"n\":88,\"d\":\"\",\"se\":\"As part of its modernization drive, SECL has aggressively pushed 'Digital Mine' and ERP projects across which of its mega opencast mines?\",\"sh\":\"अपने आधुनिकीकरण अभियान के हिस्से के रूप में, SECL ने अपनी किन मेगा ओपनकास्ट खदानों में 'डिजिटल माइन' (Digital Mine) और ERP परियोजनाओं को आक्रामक रूप से आगे बढ़ाया है?\",\"oe\":[\"Gevra\",\"Kusmunda\",\"Dipka\",\"All of the above\"],\"oh\":[\"गेवरा\",\"कुसमुंडा\",\"दीपका\",\"उपरोक्त सभी\"],\"a\":3,\"ee\":\"SECL's &quot;Big Three&quot; mega mines (Gevra, Dipka, Kusmunda) are the focal points of digital transformation and fleet management systems.\",\"eh\":\"\"},{\"n\":89,\"d\":\"\",\"se\":\"Which of the following major thermal power generating plants is owned and operated by the Chhattisgarh State Power Generation Company (CSPGCL)?\",\"sh\":\"निम्नलिखित में से कौन सा प्रमुख थर्मल पावर उत्पादन संयंत्र छत्तीसगढ़ स्टेट पावर जनरेशन कंपनी (CSPGCL) के स्वामित्व और संचालन में है?\",\"oe\":[\"Sipat Super Thermal Power Station\",\"Hasdeo Thermal Power Station (Korba)\",\"Vindhyachal Super Thermal Power Station\",\"Sasan Ultra Mega Power Project\"],\"oh\":[\"सीपत सुपर थर्मल पावर स्टेशन\",\"हसदेव थर्मल पावर स्टेशन (कोरबा)\",\"विंध्याचल सुपर थर्मल पावर स्टेशन\",\"सासन अल्ट्रा मेगा पावर प्रोजेक्ट\"],\"a\":1,\"ee\":\"Hasdeo TPS is a state-owned (CSPGCL) plant. Sipat and Vindhyachal are NTPC owned; Sasan is Reliance Power.\",\"eh\":\"\"},{\"n\":90,\"d\":\"\",\"se\":\"Logistically, what approximate percentage of total coal dispatched in India is transported by the Indian Railways network?\",\"sh\":\"लॉजिस्टिक रूप से, भारत में भेजे जाने वाले कुल कोयले का लगभग कितना प्रतिशत भारतीय रेलवे (Indian Railways) नेटवर्क द्वारा ले जाया जाता है?\",\"oe\":[\"~ 30%\",\"~ 50%\",\"~ 70%\",\"~ 90%\"],\"oh\":[\"~ 30%\",\"~ 50%\",\"~ 70%\",\"~ 90%\"],\"a\":2,\"ee\":\"The Indian Railways is the backbone of coal logistics, historically transporting roughly 60% to 70% of CIL's domestic coal.\",\"eh\":\"\"},{\"n\":91,\"d\":\"\",\"se\":\"The highly revered 'Danteshwari Temple', one of the 52 Shakti Peethas, is located in which district of Chhattisgarh?\",\"sh\":\"अत्यधिक पूजनीय 'दंतेश्वरी मंदिर', जो 52 शक्तिपीठों में से एक है, छत्तीसगढ़ के किस जिले में स्थित है?\",\"oe\":[\"Dantewada\",\"Bastar\",\"Kanker\",\"Sukma\"],\"oh\":[\"दंतेवाड़ा\",\"बस्तर\",\"कांकेर\",\"सुकमा\"],\"a\":0,\"ee\":\"The town and district of Dantewada are named after the presiding deity of this famous 14th-century temple.\",\"eh\":\"\"},{\"n\":92,\"d\":\"\",\"se\":\"Historically, one of the earliest established and oldest commercial coalfields in the territory of Chhattisgarh is:\",\"sh\":\"ऐतिहासिक रूप से, छत्तीसगढ़ के क्षेत्र में स्थापित सबसे शुरुआती और सबसे पुराने वाणिज्यिक कोयला क्षेत्रों में से एक है:\",\"oe\":[\"Korba\",\"Raigarh\",\"Chirimiri\",\"Bilaspur\"],\"oh\":[\"कोरबा\",\"रायगढ़\",\"चिरमिरी (Chirimiri)\",\"बिलासपुर\"],\"a\":2,\"ee\":\"Commercial coal mining in Chirimiri (Koriya district) dates back to the late 1920s, making it one of the state's oldest fields.\",\"eh\":\"कोरिया जिले में चिरमिरी में वाणिज्यिक कोयला खनन 1920 के दशक के अंत में शुरू हुआ था।\"},{\"n\":93,\"d\":\"\",\"se\":\"Geographically, which of the following states is NOT recognized as a major contributor to India's bituminous/sub-bituminous coal reserves?\",\"sh\":\"भौगोलिक दृष्टि से, निम्नलिखित में से किस राज्य को भारत के बिटुमिनस/सब-बिटुमिनस कोयला भंडार में प्रमुख योगदानकर्ता के रूप में मान्यता प्राप्त नहीं है?\",\"oe\":[\"Chhattisgarh\",\"Madhya Pradesh\",\"Gujarat\",\"Odisha\"],\"oh\":[\"छत्तीसगढ़\",\"मध्य प्रदेश\",\"गुजरात\",\"ओडिशा\"],\"a\":2,\"ee\":\"While Gujarat possesses deposits of Lignite (brown coal), it lacks the high-grade bituminous coal reserves found in the eastern/central states.\",\"eh\":\"जबकि गुजरात में लिग्नाइट (भूरा कोयला) के भंडार हैं, इसमें पूर्वी/मध्य राज्यों में पाए जाने वाले उच्च श्रेणी के बिटुमिनस कोयले के भंडार का अभाव है।\"},{\"n\":94,\"d\":\"\",\"se\":\"The 'Central Mine Planning &amp; Design Institute' (CMPDI), tasked with exploration and mine planning, is a subsidiary of:\",\"sh\":\"'सेंट्रल माइन प्लानिंग एंड डिजाइन इंस्टीट्यूट' (CMPDI), जिसे अन्वेषण और खदान योजना का काम सौंपा गया है, किसकी एक सहायक कंपनी है:\",\"oe\":[\"Coal India Limited (CIL)\",\"NTPC\",\"SAIL\",\"Ministry of Environment\"],\"oh\":[\"कोल इंडिया लिमिटेड (CIL)\",\"NTPC\",\"SAIL\",\"पर्यावरण मंत्रालय\"],\"a\":0,\"ee\":\"CMPDI is the primary consulting and planning subsidiary within the Coal India corporate umbrella.\",\"eh\":\"\"},{\"n\":95,\"d\":\"\",\"se\":\"In terms of annual coal production volume, the absolute largest single opencast coal mine in India is:\",\"sh\":\"वार्षिक कोयला उत्पादन मात्रा के संदर्भ में, भारत में सबसे बड़ी एकल ओपनकास्ट कोयला खदान कौन सी है?\",\"oe\":[\"Gevra (SECL)\",\"Kusmunda (SECL)\",\"Nigahi (NCL)\",\"Jayant (NCL)\"],\"oh\":[\"गेवरा (SECL)\",\"कुसमुंडा (SECL)\",\"निगाही (NCL)\",\"जयंत (NCL)\"],\"a\":0,\"ee\":\"Producing over 50 MT annually, Gevra is unrivaled in scale within India and Asia.\",\"eh\":\"\"},{\"n\":96,\"d\":\"\",\"se\":\"The famous 'Kailash Caves', renowned for their spectacular stalactite and stalagmite formations, are located within the Kanger Valley National Park in:\",\"sh\":\"शानदार स्टैलेक्टाइट और स्टैलेग्माइट संरचनाओं के लिए प्रसिद्ध 'कैलाश गुफाएं' (Kailash Caves) कांगेर घाटी राष्ट्रीय उद्यान के भीतर कहाँ स्थित हैं:\",\"oe\":[\"Bastar\",\"Raipur\",\"Bilaspur\",\"Durg\"],\"oh\":[\"बस्तर\",\"रायपुर\",\"बिलासपुर\",\"दुर्ग\"],\"a\":0,\"ee\":\"Discovered in the 1990s, these limestone caves are a major tourist attraction in the Bastar district near Jagdalpur.\",\"eh\":\"\"},{\"n\":97,\"d\":\"\",\"se\":\"Geographically, what is the name of the highest mountain peak in the state of Chhattisgarh?\",\"sh\":\"भौगोलिक दृष्टि से छत्तीसगढ़ राज्य की सबसे ऊँची पर्वत चोटी का क्या नाम है?\",\"oe\":[\"Bailadila Peak\",\"Gaurlata Peak\",\"Mainpat\",\"Dongargarh\"],\"oh\":[\"बैलाडीला चोटी\",\"गौरलाटा चोटी (Gaurlata Peak)\",\"मैनपाट\",\"डोंगरगढ़\"],\"a\":1,\"ee\":\"Located in the Samri Pat region of Balrampur district, Gaurlata is the highest point in Chhattisgarh (approx. 1,225 meters).\",\"eh\":\"बलरामपुर जिले में स्थित गौरलाटा छत्तीसगढ़ का सबसे ऊँचा बिंदु (लगभग 1,225 मीटर) है।\"},{\"n\":98,\"d\":\"\",\"se\":\"As a corporate entity, the highest-ranking executive heading the South Eastern Coalfields Limited (SECL) holds the designation of:\",\"sh\":\"एक कॉर्पोरेट इकाई के रूप में, साउथ ईस्टर्न कोलफील्ड्स लिमिटेड (SECL) के प्रमुख सर्वोच्च पदस्थ कार्यकारी का पदनाम क्या होता है?\",\"oe\":[\"Chairman-cum-Managing Director (CMD)\",\"Chief Executive Officer (CEO)\",\"President of Operations\",\"General Manager (GM)\"],\"oh\":[\"अध्यक्ष-सह-प्रबंध निदेशक (CMD)\",\"मुख्य कार्यकारी अधिकारी (CEO)\",\"ऑपरेशन्स प्रेसिडेंट\",\"महाप्रबंधक (GM)\"],\"a\":0,\"ee\":\"All major PSU subsidiaries under CIL are headed by a Board of Directors led by a CMD.\",\"eh\":\"\"},{\"n\":99,\"d\":\"\",\"se\":\"Which of the following major Indian rivers does NOT flow through the state of Chhattisgarh?\",\"sh\":\"निम्नलिखित में से कौन सी प्रमुख भारतीय नदी छत्तीसगढ़ राज्य से होकर नहीं बहती है?\",\"oe\":[\"Mahanadi\",\"Indravati\",\"Ganga\",\"Hasdeo\"],\"oh\":[\"महानदी\",\"इंद्रावती\",\"गंगा (Ganga)\",\"हसदेव\"],\"a\":2,\"ee\":\"The main trunk of the Ganga River flows through northern states (UP, Bihar, Bengal) and does not pass through Chhattisgarh.\",\"eh\":\"\"},{\"n\":100,\"d\":\"\",\"se\":\"Introduced by the Ministry of Coal, the 'National Coal Index' (NCI) is primarily utilized for:\",\"sh\":\"कोयला मंत्रालय द्वारा शुरू किया गया 'नेशनल कोल इंडेक्स' (NCI) मुख्य रूप से किस लिए उपयोग किया जाता है:\",\"oe\":[\"Determining the pricing and revenue-sharing mechanisms for commercial coal auctions\",\"Tracking the daily production tonnage of CIL\",\"Monitoring environmental emissions from power plants\",\"Assessing the safety rankings of underground mines\"],\"oh\":[\"वाणिज्यिक कोयला नीलामियों (Commercial coal auctions) के लिए मूल्य निर्धारण और राजस्व-साझाकरण तंत्र का निर्धारण करने के लिए\",\"CIL के दैनिक उत्पादन टन भार को ट्रैक करने के लिए\",\"बिजली संयंत्रों से पर्यावरणीय उत्सर्जन की निगरानी करने के लिए\",\"भूमिगत खदानों की सुरक्षा रैंकिंग का आकलन करने के लिए\"],\"a\":0,\"ee\":\"The NCI is a price index reflecting the change in the price level of coal, used as a benchmark for commercial mine auctions.\",\"eh\":\"\"}],\"sub\":\"100 questions · 65 bilingual\"},{\"id\":\"hp5\",\"num\":5,\"name\":\"High Probability Paper 5\",\"q\":[{\"n\":1,\"d\":\"\",\"se\":\"Image-based: A diagram shows the radiation pattern of an antenna. The coverage looks like a 3D doughnut (omnidirectional in the horizontal plane but limited vertically). This type of antenna is commonly used for:\",\"sh\":\"चित्र-आधारित: एक आरेख (diagram) एंटीना के विकिरण पैटर्न (radiation pattern) को दिखाता है। इसका कवरेज 3D डोनट (doughnut) जैसा दिखता है (क्षैतिज तल में सभी दिशाओं में समान)। इस प्रकार के एंटीना का उपयोग आमतौर पर किसके लिए किया जाता है:\",\"oe\":[\"Point-to-point long-haul microwave links\",\"Wi-Fi access points and mobile base stations\",\"Satellite TV reception (DTH)\",\"Deep-space radar systems\"],\"oh\":[\"पॉइंट-टू-पॉइंट लॉन्ग-हॉल माइक्रोवेव लिंक\",\"वाई-फाई एक्सेस पॉइंट (Wi-Fi AP) और मोबाइल बेस स्टेशन\",\"सैटेलाइट टीवी रिसेप्शन (DTH)\",\"डीप-स्पेस रडार सिस्टम\"],\"a\":1,\"ee\":\"A standard dipole antenna produces a doughnut-shaped radiation pattern, broadcasting equally in all horizontal directions (omnidirectional) to serve local users.\",\"eh\":\"एक मानक डाइपोल एंटीना क्षैतिज रूप से 360-डिग्री (omnidirectional) कवरेज देता है, जो वाई-फाई के लिए आदर्श है।\"},{\"n\":2,\"d\":\"\",\"se\":\"Which layer of the OSI model is strictly responsible for data compression, encryption (e.g., SSL/TLS), and syntax conversion?\",\"sh\":\"OSI मॉडल की कौन सी लेयर (Layer) डेटा कम्प्रेशन, एन्क्रिप्शन (जैसे SSL/TLS) और सिंटैक्स रूपांतरण के लिए सख्ती से जिम्मेदार है?\",\"oe\":[\"Session layer\",\"Presentation layer\",\"Application layer\",\"Transport layer\"],\"oh\":[\"सेशन लेयर (Session layer)\",\"प्रेजेंटेशन लेयर (Presentation layer)\",\"एप्लीकेशन लेयर\",\"ट्रांसपोर्ट लेयर\"],\"a\":1,\"ee\":\"Layer 6 (Presentation) formats the data for the application, handling tasks like JPEG/MPEG compression and encryption/decryption.\",\"eh\":\"\"},{\"n\":3,\"d\":\"\",\"se\":\"In legacy telephone exchanges, the ubiquitous term 'POTS' stands for:\",\"sh\":\"लीगेसी (पुराने) टेलीफोन एक्सचेंजों में, 'POTS' शब्द का अर्थ क्या है?\",\"oe\":[\"Plain Old Telephone Service\",\"Primary Optical Transmission System\",\"Packet Over Time Slot\",\"Private Operator Telephone System\"],\"oh\":[\"Plain Old Telephone Service\",\"Primary Optical Transmission System\",\"Packet Over Time Slot\",\"Private Operator Telephone System\"],\"a\":0,\"ee\":\"POTS refers to the traditional, analog voice-grade telephone service delivered over copper twisted-pair wires.\",\"eh\":\"\"},{\"n\":4,\"d\":\"\",\"se\":\"What is the primary architectural advantage of using RAID 10 (RAID 1+0) over RAID 5 in a server?\",\"sh\":\"सर्वर में RAID 5 की तुलना में RAID 10 (RAID 1+0) का उपयोग करने का प्राथमिक ढांचागत लाभ क्या है?\",\"oe\":[\"It provides 100% total storage capacity utilization\",\"It offers better fault tolerance during rebuilds and significantly higher write performance\",\"It requires only two hard disks to implement\",\"It uses parity bits instead of mirroring\"],\"oh\":[\"यह 100% कुल भंडारण क्षमता प्रदान करता है\",\"यह पुनर्निर्माण (rebuilds) के दौरान बेहतर फॉल्ट टॉलरेंस (fault tolerance) और काफी तेज राइट (write) परफॉरमेंस देता है\",\"इसे लागू करने के लिए केवल दो हार्ड डिस्क की आवश्यकता होती है\",\"यह मिररिंग के बजाय पैरिटी (parity) बिट्स का उपयोग करता है\"],\"a\":1,\"ee\":\"RAID 10 combines mirroring and striping without the heavy CPU parity calculations of RAID 5, making write speeds much faster and disk rebuilds safer.\",\"eh\":\"\"},{\"n\":5,\"d\":\"\",\"se\":\"A digital signal architecture that uses distinct voltage levels (typically 0V and 5V) to represent binary data (0 and 1) is called:\",\"sh\":\"एक डिजिटल सिग्नल आर्किटेक्चर जो बाइनरी डेटा (0 और 1) का प्रतिनिधित्व करने के लिए अलग-अलग वोल्टेज स्तरों (आमतौर पर 0V और 5V) का उपयोग करता है, उसे क्या कहा जाता है:\",\"oe\":[\"Analog continuous signal\",\"TTL (Transistor-Transistor Logic)\",\"RS-232 serial logic\",\"PWM (Pulse Width Modulation)\"],\"oh\":[\"एनालॉग कंटीन्यूअस सिग्नल\",\"TTL (Transistor-Transistor Logic)\",\"RS-232 सीरियल लॉजिक\",\"PWM (Pulse Width Modulation)\"],\"a\":1,\"ee\":\"In standard 5V TTL logic circuits, 0V to 0.8V represents Logic 0, and 2V to 5V represents Logic 1.\",\"eh\":\"\"},{\"n\":6,\"d\":\"\",\"se\":\"In modern satellite communication in India, the frequency band used heavily by banking VSAT networks and DTH services is the:\",\"sh\":\"भारत में आधुनिक उपग्रह संचार (Satellite communication) में, बैंकिंग VSAT नेटवर्क और DTH सेवाओं द्वारा किस आवृत्ति बैंड (Frequency band) का सबसे अधिक उपयोग किया जाता है?\",\"oe\":[\"C-band\",\"Ku-band (12–18 GHz)\",\"Ka-band\",\"L-band\"],\"oh\":[\"C-बैंड\",\"Ku-बैंड (12–18 GHz)\",\"Ka-बैंड\",\"L-बैंड\"],\"a\":1,\"ee\":\"While C-band was historically used to avoid rain fade, modern Indian VSATs (via GSATs) overwhelmingly use the higher-frequency Ku-band for smaller antennas and higher bandwidth.\",\"eh\":\"आधुनिक GSAT उपग्रह छोटे एंटेना के लिए उच्च-आवृत्ति वाले Ku-बैंड का उपयोग करते हैं।\"},{\"n\":7,\"d\":\"\",\"se\":\"Which type of fire extinguisher is strictly recommended for server rooms and electrical fires (Class C/E)?\",\"sh\":\"सर्वर रूम और बिजली की आग (Class C/E) के लिए किस प्रकार के अग्निशामक यंत्र (Fire extinguisher) की सख्ती से सिफारिश की जाती है?\",\"oe\":[\"Water extinguisher\",\"CO₂ (Carbon Dioxide) extinguisher\",\"Foam extinguisher\",\"Wet Chemical extinguisher\"],\"oh\":[\"वाटर एक्सटिंग्विशर (पानी)\",\"CO₂ (कार्बन डाइऑक्साइड) एक्सटिंग्विशर\",\"फोम (Foam) एक्सटिंग्विशर\",\"वेट केमिकल एक्सटिंग्विशर\"],\"a\":1,\"ee\":\"CO₂ displaces oxygen to smother the fire and, crucially, leaves no sticky or wet residue that would destroy sensitive telecom electronics.\",\"eh\":\"CO₂ आग को बुझा देता है और कोई भी चिपचिपा या गीला अवशेष (residue) नहीं छोड़ता है जो इलेक्ट्रॉनिक्स को नष्ट कर दे।\"},{\"n\":8,\"d\":\"\",\"se\":\"What is the primary function of the 'Session layer' (Layer 5) in the OSI model?\",\"sh\":\"OSI मॉडल में 'सेशन लेयर' (Layer 5) का प्राथमिक कार्य क्या है?\",\"oe\":[\"To establish, manage, synchronize, and terminate communication dialogues between applications\",\"To physically route packets via IP addresses\",\"To provide hardware MAC addressing\",\"To convert data formats into binary\"],\"oh\":[\"एप्लिकेशन के बीच संचार संवाद (dialogues) स्थापित करना, प्रबंधित करना, सिंक्रनाइज़ करना और समाप्त करना\",\"IP पते के माध्यम से पैकेट को भौतिक रूप से रूट करना\",\"हार्डवेयर MAC एड्रेसिंग प्रदान करना\",\"डेटा स्वरूपों को बाइनरी में बदलना\"],\"a\":0,\"ee\":\"It controls the &quot;sessions&quot; or connections between computers, managing when and how long they communicate.\",\"eh\":\"\"},{\"n\":9,\"d\":\"\",\"se\":\"The legacy connector used heavily for VGA video output on older servers and computers is a:\",\"sh\":\"पुराने सर्वर और कंप्यूटर पर VGA वीडियो आउटपुट के लिए भारी रूप से उपयोग किया जाने वाला लिगेसी कनेक्टर (Legacy connector) है:\",\"oe\":[\"15-pin D-sub connector (DE-15)\",\"9-pin D-sub (DB-9)\",\"RJ-45\",\"DisplayPort\"],\"oh\":[\"15-पिन डी-सब कनेक्टर (DE-15)\",\"9-पिन डी-सब (DB-9)\",\"RJ-45\",\"डिस्प्लेपोर्ट (DisplayPort)\"],\"a\":0,\"ee\":\"The standard VGA connector has 15 pins arranged in three staggered rows.\",\"eh\":\"\"},{\"n\":10,\"d\":\"\",\"se\":\"In a CCTV camera specification, adjusting the 'focal length' of the lens directly determines the:\",\"sh\":\"CCTV कैमरे के स्पेसिफिकेशन में, लेंस की 'फोकल लेंथ' (Focal length) को एडजस्ट करने से सीधे क्या तय होता है?\",\"oe\":[\"Field of View (Angle of View)\",\"Sensor resolution in megapixels\",\"Video frame rate\",\"Infrared night vision range\"],\"oh\":[\"फील्ड ऑफ व्यू (Field of View / देखने का कोण)\",\"मेगापिक्सल में सेंसर रिज़ॉल्यूशन\",\"वीडियो फ्रेम दर (FPS)\",\"इन्फ्रारेड नाइट विजन रेंज\"],\"a\":0,\"ee\":\"A shorter focal length (e.g., 2.8mm) gives a wide-angle view, while a longer focal length (e.g., 12mm) acts as a telephoto lens for a narrow, zoomed-in view.\",\"eh\":\"छोटी फोकल लेंथ (जैसे 2.8mm) चौड़ा कोण (wide angle) देती है, जबकि लंबी फोकल लेंथ संकीर्ण ज़ूम (telephoto) देती है।\"},{\"n\":11,\"d\":\"\",\"se\":\"Which of the following is a highly efficient 'Digital' phase-modulation technique used heavily in satellite and Wi-Fi communications?\",\"sh\":\"निम्नलिखित में से कौन सी एक अत्यधिक कुशल 'डिजिटल' चरण-मॉडुलन (Phase-modulation) तकनीक है जिसका उपयोग उपग्रह और वाई-फाई संचार में भारी रूप से किया जाता है?\",\"oe\":[\"AM (Amplitude Modulation)\",\"FM (Frequency Modulation)\",\"QPSK (Quadrature Phase Shift Keying)\",\"VSB (Vestigial Sideband)\"],\"oh\":[\"AM (Amplitude Modulation)\",\"FM (Frequency Modulation)\",\"QPSK (Quadrature Phase Shift Keying)\",\"VSB (Vestigial Sideband)\"],\"a\":2,\"ee\":\"QPSK alters the phase of the carrier wave to encode two bits of digital data per symbol.\",\"eh\":\"\"},{\"n\":12,\"d\":\"\",\"se\":\"What is the standard characteristic impedance of the coaxial cable (like RG-59) used for analog CCTV and cable TV?\",\"sh\":\"एनालॉग CCTV और केबल टीवी के लिए उपयोग किए जाने वाले समाक्षीय केबल (Coaxial cable जैसे RG-59) की मानक विशेषता प्रतिबाधा (Impedance) क्या है?\",\"oe\":[\"50 Ω\",\"75 Ω\",\"100 Ω\",\"600 Ω\"],\"oh\":[\"50 Ω\",\"75 Ω\",\"100 Ω\",\"600 Ω\"],\"a\":1,\"ee\":\"75 Ohm cables are optimized for video and audio signal transmission with minimal loss. (50 Ohm is used for 2-way RF radio/antennas).\",\"eh\":\"\"},{\"n\":13,\"d\":\"\",\"se\":\"The legacy digital telecommunication standard 'ISDN' stands for:\",\"sh\":\"लिगेसी डिजिटल टेलीकम्युनिकेशन स्टैंडर्ड 'ISDN' का मतलब है:\",\"oe\":[\"Integrated Services Digital Network\",\"Internet System Data Network\",\"Integrated System Digital Node\",\"Internal Service Data Network\"],\"oh\":[\"Integrated Services Digital Network\",\"Internet System Data Network\",\"Integrated System Digital Node\",\"Internal Service Data Network\"],\"a\":0,\"ee\":\"ISDN was an early standard for transmitting voice, video, and data digitally over traditional copper telephone wires.\",\"eh\":\"\"},{\"n\":14,\"d\":\"\",\"se\":\"Image-based: A network topology diagram shows every computer connected to exactly two other computers, forming a closed continuous loop. This physical layout is a:\",\"sh\":\"चित्र-आधारित: एक नेटवर्क टोपोलॉजी आरेख में प्रत्येक कंप्यूटर ठीक दो अन्य कंप्यूटरों से
