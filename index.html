ाभ क्या है?\",\"oe\":[\"It is cheaper to manufacture\",\"It safely runs inductive loads and sensitive electronics without noise\",\"It is smaller in physical size\",\"It bypasses the battery entirely\"],\"oh\":[\"यह सस्ता होता है\",\"यह इंडक्टिव लोड (मोटर) और संवेदनशील इलेक्ट्रॉनिक्स को बिना शोर के सुरक्षित रूप से चलाता है\",\"इसका भौतिक आकार छोटा होता है\",\"यह बैटरी को बायपास कर देता है\"],\"a\":1,\"ee\":\"Pure sine wave output replicates grid power perfectly, preventing overheating or humming in motors, compressors, and sensitive telecom equipment.\",\"eh\":\"\"},{\"n\":11,\"d\":\"\",\"se\":\"In a GSM mobile network, what is the primary function of the BTS (Base Transceiver Station)?\",\"sh\":\"GSM मोबाइल नेटवर्क में, BTS (Base Transceiver Station) का प्राथमिक कार्य क्या है?\",\"oe\":[\"Core switching and routing calls\",\"Handling radio communication with mobile handsets\",\"Authenticating user SIM cards\",\"Managing billing data\"],\"oh\":[\"कोर स्विचिंग और कॉल रूटिंग\",\"मोबाइल हैंडसेट के साथ रेडियो संचार (Radio communication) संभालना\",\"सिम कार्ड को प्रमाणित करना\",\"बिलिंग डेटा प्रबंधित करना\"],\"a\":1,\"ee\":\"The BTS contains the antennas and radio equipment that communicate directly with mobile devices over the air interface.\",\"eh\":\"\"},{\"n\":12,\"d\":\"\",\"se\":\"Which type of battery has the lowest self-discharge rate when not in use?\",\"sh\":\"उपयोग में न होने पर किस प्रकार की बैटरी की सेल्फ-डिस्चार्ज दर (Self-discharge rate) सबसे कम होती है?\",\"oe\":[\"Lead-Acid\",\"Nickel-Cadmium (Ni-Cd)\",\"Nickel-Metal Hydride (Ni-MH)\",\"Lithium-Ion (Li-ion)\"],\"oh\":[\"लेड-एसिड\",\"निकल-कैडमियम (Ni-Cd)\",\"निकल-मेटल हाइड्राइड (Ni-MH)\",\"लिथियम-आयन (Li-ion)\"],\"a\":3,\"ee\":\"Li-ion batteries have a very low self-discharge rate (approx. 2-3% per month) compared to Ni-Cd (15-20%) or Ni-MH (up to 30%).\",\"eh\":\"\"},{\"n\":13,\"d\":\"\",\"se\":\"Image-based: A diagram shows IP cameras connected via a single CAT-6 cable to a network switch. The cameras do not have a separate power adapter. What technology is being used?\",\"sh\":\"चित्र-आधारित: चित्र में IP कैमरे एक CAT-6 केबल के माध्यम से नेटवर्क स्विच से जुड़े हैं। कैमरों में अलग से पावर अडैप्टर नहीं है। यहाँ किस तकनीक का उपयोग हो रहा है?\",\"oe\":[\"Power on Ethernet\",\"Power over Ethernet (PoE)\",\"Protocol over Ethernet\",\"Port on Ethernet\"],\"oh\":[\"Power on Ethernet\",\"Power over Ethernet (PoE)\",\"Protocol over Ethernet\",\"Port on Ethernet\"],\"a\":1,\"ee\":\"PoE allows a single Ethernet cable to provide both data connection and electrical power to devices like IP cameras and Wireless Access Points.\",\"eh\":\"PoE एक ही ईथरनेट केबल पर डेटा और बिजली (Power) दोनों प्रदान करता है।\"},{\"n\":14,\"d\":\"\",\"se\":\"What is the function of a punch-down tool (Krone tool) in telecom wiring?\",\"sh\":\"टेलीकॉम वायरिंग में पंच-डाउन टूल (क्रोन टूल) का क्या कार्य है?\",\"oe\":[\"To cut and insert wires into insulation-displacement connectors (IDC)\",\"To test cable continuity\",\"To strip outer cable insulation\",\"To crimp RJ-11 connectors\"],\"oh\":[\"IDC ब्लॉक में तारों को काटना और इन्सर्ट (Insert) करना\",\"केबल निरंतरता (continuity) का परीक्षण करना\",\"केबल इन्सुलेशन छीलना\",\"कनेक्टर को क्रिम्प करना\"],\"a\":0,\"ee\":\"The tool pushes the wire into IDC blocks (like Krone or 110 blocks) to make a connection and automatically trims the excess wire.\",\"eh\":\"\"},{\"n\":15,\"d\":\"\",\"se\":\"What is the standard nominal voltage for a single Nickel-Cadmium (Ni-Cd) battery cell?\",\"sh\":\"एक निकल-कैडमियम (Ni-Cd) बैटरी सेल का मानक नाममात्र वोल्टेज (Nominal voltage) क्या होता है?\",\"oe\":[\"1.2 V\",\"1.5 V\",\"2.1 V\",\"3.6 V\"],\"oh\":[\"1.2 V\",\"1.5 V\",\"2.1 V\",\"3.6 V\"],\"a\":0,\"ee\":\"Ni-Cd and Ni-MH cells have a nominal voltage of 1.2V. Alkaline cells are 1.5V, Lead-acid cells are 2.0V-2.1V, and Li-ion cells are 3.6V-3.7V.\",\"eh\":\"\"},{\"n\":16,\"d\":\"\",\"se\":\"Which type of fibre optic connector is most commonly used in high-density data centres because of its small form factor?\",\"sh\":\"उच्च घनत्व (High-density) वाले डेटा केंद्रों में छोटे आकार के कारण किस फाइबर ऑप्टिक कनेक्टर का सबसे अधिक उपयोग किया जाता है?\",\"oe\":[\"SC\",\"ST\",\"LC\",\"FC\"],\"oh\":[\"SC\",\"ST\",\"LC\",\"FC\"],\"a\":2,\"ee\":\"LC (Lucent Connector) has a 1.25 mm ferrule, exactly half the size of SC connectors, allowing double the port density on patch panels.\",\"eh\":\"LC कनेक्टर में SC (2.5 मिमी) की तुलना में आधा (1.25 मिमी) फेरूल होता है।\"},{\"n\":17,\"d\":\"\",\"se\":\"In computer architecture, what does BIOS stand for?\",\"sh\":\"कंप्यूटर आर्किटेक्चर में, BIOS का पूर्ण रूप क्या है?\",\"oe\":[\"Basic Input Output System\",\"Binary Input Output System\",\"Basic Integrated Operating System\",\"Built-in Operating System\"],\"oh\":[\"Basic Input Output System\",\"Binary Input Output System\",\"Basic Integrated Operating System\",\"Built-in Operating System\"],\"a\":0,\"ee\":\"BIOS is the firmware that initializes hardware during the booting process and provides runtime services for operating systems.\",\"eh\":\"\"},{\"n\":18,\"d\":\"\",\"se\":\"The protection device that automatically trips when it detects a leakage current to earth is called:\",\"sh\":\"वह सुरक्षा उपकरण कौन सा है जो पृथ्वी (Earth) में लीकेज करंट का पता लगने पर स्वचालित रूप से ट्रिप हो जाता है?\",\"oe\":[\"MCB\",\"MCCB\",\"RCCB\",\"HRC\"],\"oh\":[\"MCB\",\"MCCB\",\"RCCB (Residual Current Circuit Breaker)\",\"HRC\"],\"a\":2,\"ee\":\"RCCB monitors the imbalance between live and neutral currents. If a leakage to earth occurs, it trips to prevent electric shock.\",\"eh\":\"\"},{\"n\":19,\"d\":\"\",\"se\":\"What is the typical acceptable attenuation (loss) of a proper fusion splice in optical fibre?\",\"sh\":\"ऑप्टिकल फाइबर में एक उचित फ्यूजन स्प्लिस (Fusion splice) का स्वीकार्य क्षीणन (Attenuation/Loss) आम तौर पर कितना होता है?\",\"oe\":[\"Less than 0.01 dB\",\"Less than 0.1 dB\",\"Less than 0.5 dB\",\"Less than 1.0 dB\"],\"oh\":[\"0.01 dB से कम\",\"0.1 dB से कम\",\"0.5 dB से कम\",\"1.0 dB से कम\"],\"a\":1,\"ee\":\"A high-quality fusion splice typically yields an insertion loss of 0.01 dB to 0.05 dB, well below the standard 0.1 dB threshold.\",\"eh\":\"\"},{\"n\":20,\"d\":\"\",\"se\":\"Which of the following is considered an input device?\",\"sh\":\"इनमें से किसे इनपुट डिवाइस (Input device) माना जाता है?\",\"oe\":[\"Monitor\",\"Printer\",\"Keyboard\",\"Speaker\"],\"oh\":[\"मॉनिटर\",\"प्रिंटर\",\"कीबोर्ड\",\"स्पीकर\"],\"a\":2,\"ee\":\"Keyboards send data into the computer system. Monitors, printers, and speakers are output devices.\",\"eh\":\"\"},{\"n\":21,\"d\":\"\",\"se\":\"Image-based: An SMPS block diagram shows: Rectifier → Filter → [Block X] → High-frequency transformer → Rectifier → Filter. What is the function of [Block X]?\",\"sh\":\"चित्र-आधारित: SMPS ब्लॉक आरेख में: रेक्टिफायर → फ़िल्टर → [ब्लॉक X] → हाई-फ्रीक्वेंसी ट्रांसफार्मर → रेक्टिफायर → फ़िल्टर। [ब्लॉक X] का कार्य क्या है?\",\"oe\":[\"Output Rectifier\",\"Inverter / High-Frequency Switching\",\"Linear Regulator\",\"Step-down transformer\"],\"oh\":[\"आउटपुट रेक्टिफायर\",\"इन्वर्टर / हाई-फ्रीक्वेंसी स्विचिंग\",\"लीनियर रेगुलेटर\",\"स्टेप-डाउन ट्रांसफार्मर\"],\"a\":1,\"ee\":\"The switching transistor (MOSFET) acts as an inverter, converting the filtered DC back into high-frequency AC to feed the transformer.\",\"eh\":\"\"},{\"n\":22,\"d\":\"\",\"se\":\"What is the typical maximum AC current that can be measured directly by an industrial Tong Tester (Clamp Meter)?\",\"sh\":\"एक औद्योगिक टोंग टेस्टर (Clamp Meter) द्वारा सीधे मापा जा सकने वाला सामान्य अधिकतम AC करंट कितना होता है?\",\"oe\":[\"10 A\",\"100 A\",\"1000 A\",\"5000 A\"],\"oh\":[\"10 A\",\"100 A\",\"1000 A\",\"5000 A\"],\"a\":2,\"ee\":\"Standard industrial clamp meters can safely measure AC currents up to 1000 Amperes without breaking the circuit.\",\"eh\":\"\"},{\"n\":23,\"d\":\"\",\"se\":\"In enterprise telecom, what does the abbreviation 'PABX' originally stand for?\",\"sh\":\"एंटरप्राइज़ टेलीकॉम में, 'PABX' का पूर्ण रूप क्या है?\",\"oe\":[\"Private Automatic Branch Exchange\",\"Public Automatic Branch Exchange\",\"Private Analog Branch Exchange\",\"Public Analog Branch Exchange\"],\"oh\":[\"Private Automatic Branch Exchange\",\"Public Automatic Branch Exchange\",\"Private Analog Branch Exchange\",\"Public Analog Branch Exchange\"],\"a\":0,\"ee\":\"An EPABX (Electronic Private Automatic Branch Exchange) is a private telephone network used within a company or organization.\",\"eh\":\"\"},{\"n\":24,\"d\":\"\",\"se\":\"Which type of telecom cable is known as 'Jelly-filled cable' and why?\",\"sh\":\"किस प्रकार के केबल को 'जेली-फिल्ड केबल' कहा जाता है और क्यों?\",\"oe\":[\"Coaxial cable filled with jelly to reduce RF interference\",\"Underground telephone cable filled with petroleum jelly to prevent water ingress\",\"Fibre optic cable filled with gel to prevent bending\",\"Power cable filled with insulating jelly to handle high heat\"],\"oh\":[\"RF हस्तक्षेप कम करने के लिए जेली भरा कोएक्सियल केबल\",\"पानी के प्रवेश (Water ingress) को रोकने के लिए पेट्रोलियम जेली भरा अंडरग्राउंड टेलीफोन केबल\",\"झुकने से बचाने के लिए जेल भरा फाइबर ऑप्टिक केबल\",\"इंसुलेटिंग जेली भरा पावर केबल\"],\"a\":1,\"ee\":\"The jelly acts as a water-blocking compound, preventing moisture from corroding the copper conductors if the cable sheath is damaged.\",\"eh\":\"\"},{\"n\":25,\"d\":\"\",\"se\":\"What is the function of a diode in a power supply circuit?\",\"sh\":\"बिजली आपूर्ति (Power supply) सर्किट में डायोड (Diode) का क्या कार्य है?\",\"oe\":[\"To amplify voltage\",\"To rectify AC to DC\",\"To filter high frequencies\",\"To store charge\"],\"oh\":[\"वोल्टेज बढ़ाना\",\"AC को DC में रेक्टिफाई (Rectify) करना\",\"उच्च आवृत्तियों को फ़िल्टर करना\",\"चार्ज स्टोर करना\"],\"a\":1,\"ee\":\"Diodes allow electrical current to flow in only one direction, effectively rectifying Alternating Current (AC) into Direct Current (DC).\",\"eh\":\"\"},{\"n\":26,\"d\":\"\",\"se\":\"Which of the following is an example of biometric authentication used in access control?\",\"sh\":\"\",\"oe\":[\"Password\",\"RFID Smart card\",\"Fingerprint scanning\",\"Security PIN\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Biometrics relies on unique physical characteristics (fingerprints, retina, facial recognition) to verify identity.\",\"eh\":\"\"},{\"n\":27,\"d\":\"\",\"se\":\"In optical fibre communication, what is the typical loss encountered in a mechanical splice?\",\"sh\":\"\",\"oe\":[\"0.01 dB\",\"0.1 dB\",\"0.3 to 0.5 dB\",\"1.0 to 1.5 dB\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Mechanical splices simply align the fibres using index-matching gel, resulting in slightly higher loss (0.3 dB+) compared to fusion splicing (&lt;0.1 dB).\",\"eh\":\"\"},{\"n\":28,\"d\":\"\",\"se\":\"What is the purpose of a Constant Voltage Transformer (CVT)?\",\"sh\":\"\",\"oe\":[\"To step up voltage for long transmission\",\"To provide a stable, constant output voltage despite input AC fluctuations\",\"To convert AC to DC\",\"To measure high voltages\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"CVTs use the principle of ferroresonance to maintain a highly regulated output voltage, protecting sensitive telecom gear.\",\"eh\":\"\"},{\"n\":29,\"d\":\"\",\"se\":\"Image-based: A diagram shows an earth pit with a GI pipe surrounded by alternate layers of charcoal and salt. What is the purpose of adding these layers?\",\"sh\":\"\",\"oe\":[\"To increase the mechanical strength of the pit\",\"To reduce soil resistivity and retain moisture\",\"To prevent corrosion of the GI pipe\",\"To insulate the electrode from the ground\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Salt and charcoal form a highly conductive environment around the electrode, ensuring the earth resistance remains low in all seasons.\",\"eh\":\"\"},{\"n\":30,\"d\":\"\",\"se\":\"Which of the following wireless communication standards is widely used for short-range (&lt;100m) LAN and peripheral connectivity?\",\"sh\":\"\",\"oe\":[\"GSM\",\"Wi-Fi\",\"Bluetooth\",\"Both B and C\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Wi-Fi (WLAN) and Bluetooth (WPAN) are short-range RF standards. GSM is a Wide Area Network (WAN) standard.\",\"eh\":\"\"},{\"n\":31,\"d\":\"\",\"se\":\"In a computer system, which memory is volatile (loses data when power is turned off)?\",\"sh\":\"\",\"oe\":[\"ROM\",\"Hard Disk Drive (HDD)\",\"RAM\",\"Solid State Drive (SSD)\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Random Access Memory (RAM) requires constant power to hold data. ROM and storage drives are non-volatile.\",\"eh\":\"\"},{\"n\":32,\"d\":\"\",\"se\":\"What are the typical output voltages provided by a standard computer ATX power supply (SMPS)?\",\"sh\":\"\",\"oe\":[\"+5V, +12V, -12V, +3.3V\",\"+5V and +12V only\",\"+24V only\",\"230V AC\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"ATX supplies output multiple low DC voltages to power the motherboard, processor, and peripheral drives.\",\"eh\":\"\"},{\"n\":33,\"d\":\"\",\"se\":\"Which instrument/setting is used to test if a copper cable has a break in it (testing continuity)?\",\"sh\":\"\",\"oe\":[\"Multimeter (in continuity/buzzer mode)\",\"Megger\",\"Tong Tester\",\"Voltmeter\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"The continuity mode checks for a complete electrical path and typically emits an audible beep if resistance is very low.\",\"eh\":\"\"},{\"n\":34,\"d\":\"\",\"se\":\"In a CCTV system, what is the primary advantage of IP cameras over traditional analog cameras?\",\"sh\":\"\",\"oe\":[\"They are much cheaper to purchase\",\"They offer higher resolutions and direct network connectivity\",\"They require no power source\",\"They use coaxial cables instead of UTP\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"IP cameras transmit digital video over Ethernet, allowing for megapixel resolutions, PoE, and easy integration into IT networks.\",\"eh\":\"\"},{\"n\":35,\"d\":\"\",\"se\":\"The process of permanently joining two optical fibres end-to-end using an electric arc is called:\",\"sh\":\"\",\"oe\":[\"Mechanical Splicing\",\"Fusion Splicing\",\"Connectorisation\",\"Crimping\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Fusion splicing uses an electric arc to melt and fuse the glass cores together seamlessly.\",\"eh\":\"\"},{\"n\":36,\"d\":\"\",\"se\":\"Which of the following is NOT a type of electronic display technology?\",\"sh\":\"\",\"oe\":[\"LED\",\"LCD\",\"CRT\",\"MOSFET\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"A MOSFET is a type of semiconductor transistor used for switching/amplification, not a visual display component.\",\"eh\":\"\"},{\"n\":37,\"d\":\"\",\"se\":\"What is the primary purpose of a Lightning Arrestor in a telecom tower?\",\"sh\":\"\",\"oe\":[\"To attract lightning to a safe point\",\"To protect equipment by providing a low-impedance path to ground for voltage surges\",\"To measure the intensity of lightning strikes\",\"To generate backup electricity\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"It safely diverts extreme surge currents directly to the earth pit, bypassing the sensitive telecom equipment.\",\"eh\":\"\"},{\"n\":38,\"d\":\"\",\"se\":\"In a mobile communication system, the handover process between two BTSs (Base Transceiver Stations) within the same area is managed by the:\",\"sh\":\"\",\"oe\":[\"MS (Mobile Station)\",\"MSC (Mobile Switching Centre)\",\"BSC (Base Station Controller)\",\"HLR (Home Location Register)\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"The BSC controls radio resources and handles handovers between the multiple BTSs connected to it.\",\"eh\":\"\"},{\"n\":39,\"d\":\"\",\"se\":\"Image-based: A diagram shows a straight-through Ethernet cable. If one end is terminated using the T568B standard, the other end must be terminated using:\",\"sh\":\"\",\"oe\":[\"T568B\",\"T568A\",\"RJ-11\",\"Crossover standard\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"A straight-through cable has identical wiring standards on both ends (Pin 1 to Pin 1, Pin 2 to Pin 2, etc.).\",\"eh\":\"\"},{\"n\":40,\"d\":\"\",\"se\":\"Which rechargeable battery chemistry provides a nominal voltage of 3.6 V to 3.7 V per cell?\",\"sh\":\"\",\"oe\":[\"Lead-Acid\",\"Nickel-Cadmium\",\"Lithium-Ion (Li-ion)\",\"Nickel-Metal Hydride\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Standard Li-ion cells operate at ~3.7V. Lead-acid is ~2.1V, and Ni-Cd is ~1.2V.\",\"eh\":\"\"},{\"n\":41,\"d\":\"\",\"se\":\"What is the function of the 'filter' stage (capacitors) in a DC power supply?\",\"sh\":\"\",\"oe\":[\"To rectify AC into DC\",\"To smooth the pulsating DC output by removing ripple voltage\",\"To step down the voltage\",\"To act as a circuit breaker\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Capacitors store charge and release it during voltage dips, smoothing the rectified wave into a flat DC line.\",\"eh\":\"\"},{\"n\":42,\"d\":\"\",\"se\":\"In IPv4 addressing, what is the default subnet mask for a Class B network?\",\"sh\":\"\",\"oe\":[\"255.0.0.0\",\"255.255.0.0\",\"255.255.255.0\",\"255.255.255.255\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Class A is /8 (255.0.0.0), Class B is /16 (255.255.0.0), and Class C is /24 (255.255.255.0).\",\"eh\":\"\"},{\"n\":43,\"d\":\"\",\"se\":\"Which tool is specifically designed to strip the insulation from a wire without nicking or cutting the inner copper conductor?\",\"sh\":\"\",\"oe\":[\"Wire stripper\",\"Plier\",\"Hacksaw\",\"Utility knife\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Wire strippers have precisely sized cutting notches that match standard wire gauges (AWG) to safely cut only the plastic sheath.\",\"eh\":\"\"},{\"n\":44,\"d\":\"\",\"se\":\"What is the standard output impedance of coaxial cables used for analog video cameras and antennas?\",\"sh\":\"\",\"oe\":[\"50 Ω\",\"75 Ω\",\"100 Ω\",\"600 Ω\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"75 Ohm coaxial cable (like RG-59 or RG-6) is standard for video and television signals. 50 Ohm is used for RF radio transmissions.\",\"eh\":\"\"},{\"n\":45,\"d\":\"\",\"se\":\"In modern computer hardware, what does SSD stand for?\",\"sh\":\"\",\"oe\":[\"Solid State Drive\",\"Super Speed Drive\",\"Static Storage Device\",\"System Storage Drive\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"An SSD is a high-speed storage device that uses flash memory with no moving mechanical parts, unlike HDDs.\",\"eh\":\"\"},{\"n\":46,\"d\":\"\",\"se\":\"What is the purpose of a 'media converter' in a telecom network?\",\"sh\":\"\",\"oe\":[\"To change IP addresses\",\"To convert network signals between different media types, such as copper to fibre optic\",\"To amplify weak Wi-Fi signals\",\"To compress video data\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Media converters bridge the gap between UTP copper networks and long-distance fibre optic runs.\",\"eh\":\"\"},{\"n\":47,\"d\":\"\",\"se\":\"Image-based: A UPS block diagram shows a &quot;Bypass Switch&quot; connecting the AC mains directly to the load. What is its purpose?\",\"sh\":\"\",\"oe\":[\"To increase the battery backup time\",\"To supply power directly from the mains in case of UPS inverter failure or for maintenance\",\"To charge the battery faster\",\"To disconnect the load completely\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"A bypass switch ensures the critical load remains powered by the raw grid if the UPS hardware fails or requires servicing.\",\"eh\":\"\"},{\"n\":48,\"d\":\"\",\"se\":\"Which of the following is a primary characteristic of an Isolation Transformer?\",\"sh\":\"\",\"oe\":[\"It provides galvanic isolation between the input and output circuits for safety and noise reduction\",\"It drastically steps up voltage\",\"It converts AC to DC\",\"It changes the AC frequency from 50Hz to 60Hz\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"It has a 1:1 turns ratio; its purpose is to electrically separate the equipment from the direct AC mains.\",\"eh\":\"\"},{\"n\":49,\"d\":\"\",\"se\":\"In an IP-based CCTV system, the central device that records video streams from the network is called an:\",\"sh\":\"\",\"oe\":[\"DVR (Digital Video Recorder)\",\"NVR (Network Video Recorder)\",\"VCR (Video Cassette Recorder)\",\"Encoder\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"NVRs record encoded digital video received over an Ethernet network from IP cameras. DVRs digitize and record raw analog video from coaxial cables.\",\"eh\":\"\"},{\"n\":50,\"d\":\"\",\"se\":\"What is the approximate frequency range of the widely used 2.4 GHz Wi-Fi band?\",\"sh\":\"\",\"oe\":[\"2.400 GHz to 2.483 GHz\",\"5.150 GHz to 5.825 GHz\",\"900 MHz\",\"60 GHz\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"The 2.4 GHz ISM band is utilized by IEEE 802.11b/g/n standards.\",\"eh\":\"\"},{\"n\":51,\"d\":\"\",\"se\":\"Which of the following is classified as a computer peripheral device?\",\"sh\":\"\",\"oe\":[\"CPU (Central Processing Unit)\",\"RAM (Random Access Memory)\",\"Printer\",\"Motherboard\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Peripherals are external devices attached to the host computer to expand its capabilities (e.g., printers, scanners, mice).\",\"eh\":\"\"},{\"n\":52,\"d\":\"\",\"se\":\"What is the function of 'solder-wick' (desoldering braid) in electronic repair?\",\"sh\":\"\",\"oe\":[\"To apply new solder to a joint\",\"To absorb and remove excess or old molten solder from a joint\",\"To clean the tip of the soldering iron\",\"To protect components from heat\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Woven copper braid, coated with flux, utilizes capillary action to pull molten solder off the circuit board.\",\"eh\":\"\"},{\"n\":53,\"d\":\"\",\"se\":\"In mobile communication, what is the full form of SIM?\",\"sh\":\"\",\"oe\":[\"Subscriber Identity Module\",\"System Identity Module\",\"Subscriber Interface Module\",\"Signal Identity Module\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"The SIM card securely stores the international mobile subscriber identity (IMSI) used to authenticate users.\",\"eh\":\"\"},{\"n\":54,\"d\":\"\",\"se\":\"Which type of cable is strictly required for ultra-high-speed data transmission over very long distances with minimal attenuation?\",\"sh\":\"\",\"oe\":[\"Coaxial cable\",\"Unshielded Twisted Pair (UTP)\",\"Optical fibre cable\",\"Shielded Twisted Pair (STP)\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Fibre optic cables use light pulses, allowing gigabit and terabit speeds over kilometers without electromagnetic interference.\",\"eh\":\"\"},{\"n\":55,\"d\":\"\",\"se\":\"What is the nominal voltage of a standard automotive (car) lead-acid battery?\",\"sh\":\"\",\"oe\":[\"6 V\",\"12 V\",\"24 V\",\"48 V\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"A standard car battery consists of six 2.1V lead-acid cells wired in series to produce roughly 12.6V when fully charged.\",\"eh\":\"\"},{\"n\":56,\"d\":\"\",\"se\":\"Image-based: In an automated boom barrier system used at SECL facility gates, which sensor is buried in the road to detect the physical presence of a vehicle?\",\"sh\":\"\",\"oe\":[\"Infrared (IR) beam sensor\",\"Ultrasonic sensor\",\"Inductive loop detector\",\"RFID reader\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"A wire loop in the pavement creates a magnetic field; when a large metal mass (vehicle) passes over it, inductance changes and triggers the gate.\",\"eh\":\"\"},{\"n\":57,\"d\":\"\",\"se\":\"In a computer network, what is the primary role of a 'Router'?\",\"sh\":\"\",\"oe\":[\"Connecting multiple devices within the same local network\",\"Forwarding data packets between different IP networks\",\"Amplifying weak electrical signals\",\"Providing Wi-Fi strictly to mobile devices\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Routers operate at Layer 3 (Network) of the OSI model, making routing decisions based on IP addresses to connect different networks (like LAN to WAN).\",\"eh\":\"\"},{\"n\":58,\"d\":\"\",\"se\":\"What is the primary function of a telecommunication battery charger?\",\"sh\":\"\",\"oe\":[\"To discharge the battery periodically\",\"To step up DC voltage to AC\",\"To convert AC to regulated DC and safely supply energy to recharge the battery bank\",\"To measure the specific gravity of the battery acid\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Telecom chargers act as both rectifiers (powering the DC load) and regulated chargers (keeping the backup batteries floated).\",\"eh\":\"\"},{\"n\":59,\"d\":\"\",\"se\":\"Which of the following is technically a measuring instrument rather than a &quot;hand tool&quot;?\",\"sh\":\"\",\"oe\":[\"Screwdriver\",\"Allen key set\",\"Multimeter\",\"Hacksaw\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"A multimeter is an electronic test instrument. Tools like screwdrivers and hacksaws are mechanical hand tools.\",\"eh\":\"\"},{\"n\":60,\"d\":\"\",\"se\":\"What is a major operational advantage of using a Li-ion battery over an older Ni-Cd battery?\",\"sh\":\"\",\"oe\":[\"Li-ion is significantly cheaper\",\"Li-ion has a higher energy density and suffers from zero &quot;memory effect&quot;\",\"Li-ion uses completely non-flammable electrolytes\",\"Li-ion can be overcharged safely without a BMS\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Ni-Cd batteries lose maximum capacity if repeatedly recharged before being fully depleted (memory effect). Li-ion does not have this flaw.\",\"eh\":\"\"},{\"n\":61,\"d\":\"\",\"se\":\"If the sum of two numbers is 45 and their difference is 15, what is the larger number?\",\"sh\":\"यदि दो संख्याओं का योग 45 और उनका अंतर 15 है, तो बड़ी संख्या क्या है?\",\"oe\":[\"25\",\"30\",\"35\",\"40\"],\"oh\":[\"25\",\"30\",\"35\",\"40\"],\"a\":1,\"ee\":\"Let numbers be x and y. x + y = 45, x - y = 15. Adding the equations: 2x = 60, x = 30.\",\"eh\":\"x + y = 45, x - y = 15. दोनों को जोड़ने पर: 2x = 60, x = 30.\"},{\"n\":62,\"d\":\"\",\"se\":\"A train covers 120 km in 2 hours, and then covers another 180 km in 3 hours. What is its average speed for the whole journey?\",\"sh\":\"एक ट्रेन 2 घंटे में 120 किमी और फिर 3 घंटे में 180 किमी की दूरी तय करती है। पूरी यात्रा के लिए उसकी औसत गति क्या है?\",\"oe\":[\"50 km/h\",\"55 km/h\",\"60 km/h\",\"65 km/h\"],\"oh\":[\"50 km/h\",\"55 km/h\",\"60 km/h\",\"65 km/h\"],\"a\":2,\"ee\":\"Total distance = 120 + 180 = 300 km. Total time = 2 + 3 = 5 hours. Average speed = 300 / 5 = 60 km/h.\",\"eh\":\"कुल दूरी = 300 किमी। कुल समय = 5 घंटे। 300 / 5 = 60 किमी/घंटा।\"},{\"n\":63,\"d\":\"\",\"se\":\"Find the next number in the series: 1, 1, 2, 3, 5, 8, ?\",\"sh\":\"\",\"oe\":[\"10\",\"11\",\"12\",\"13\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"This is the Fibonacci sequence. Each term is the sum of the previous two (5 + 8 = 13).\",\"eh\":\"\"},{\"n\":64,\"d\":\"\",\"se\":\"If a product is sold at a 25% profit, and the cost price is ₹400, what is the selling price?\",\"sh\":\"\",\"oe\":[\"₹450\",\"₹480\",\"₹500\",\"₹520\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Profit = 25% of 400 = 100. Selling Price = CP + Profit = 400 + 100 = ₹500.\",\"eh\":\"\"},{\"n\":65,\"d\":\"\",\"se\":\"What is the area of a rectangle with a length of 12 cm and a breadth of 5 cm?\",\"sh\":\"\",\"oe\":[\"34 cm²\",\"60 cm²\",\"17 cm²\",\"120 cm²\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Area = length × breadth = 12 × 5 = 60 cm².\",\"eh\":\"\"},{\"n\":66,\"d\":\"\",\"se\":\"If 15% of a number is 75, what is 40% of the same number?\",\"sh\":\"\",\"oe\":[\"150\",\"200\",\"250\",\"300\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Let number be x. 0.15x = 75 → x = 500. Then 40% of 500 = 200.\",\"eh\":\"\"},{\"n\":67,\"d\":\"\",\"se\":\"Which letter comes next in the series: B, E, H, K, ?\",\"sh\":\"\",\"oe\":[\"M\",\"N\",\"O\",\"P\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"The sequence skips two letters each time (+3 positions): B(+3)-&gt;E(+3)-&gt;H(+3)-&gt;K(+3)-&gt;N.\",\"eh\":\"\"},{\"n\":68,\"d\":\"\",\"se\":\"What is the median of the following data set: 10, 15, 20, 25, 30?\",\"sh\":\"\",\"oe\":[\"15\",\"20\",\"25\",\"22.5\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"In an ordered set of 5 numbers, the 3rd number is the median (20).\",\"eh\":\"\"},{\"n\":69,\"d\":\"\",\"se\":\"If 5 machines can produce 100 items in 10 hours, how many hours will 10 machines take to produce 200 items?\",\"sh\":\"\",\"oe\":[\"5 hours\",\"10 hours\",\"15 hours\",\"20 hours\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"5 machines do 100 items in 10h. Therefore, 10 machines (double power) can do 200 items (double work) in the exact same time: 10 hours.\",\"eh\":\"\"},{\"n\":70,\"d\":\"\",\"se\":\"Find the odd one out: 2, 3, 5, 7, 11, 13, 15\",\"sh\":\"\",\"oe\":[\"2\",\"7\",\"13\",\"15\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"All numbers except 15 are prime numbers. 15 is divisible by 3 and 5.\",\"eh\":\"\"},{\"n\":71,\"d\":\"\",\"se\":\"What is the simple interest earned on ₹8000 for 2 years at 8% per annum?\",\"sh\":\"\",\"oe\":[\"₹1280\",\"₹1440\",\"₹1600\",\"₹1920\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"SI = (Principal × Rate × Time) / 100 = (8000 × 8 × 2) / 100 = ₹1280.\",\"eh\":\"\"},{\"n\":72,\"d\":\"\",\"se\":\"If the ratio of 3:4 is proportional to 12:x, what is the value of x?\",\"sh\":\"\",\"oe\":[\"12\",\"15\",\"16\",\"20\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"3/4 = 12/x. Cross-multiplying: 3x = 48 → x = 16.\",\"eh\":\"\"},{\"n\":73,\"d\":\"\",\"se\":\"What is the cube root of 343?\",\"sh\":\"\",\"oe\":[\"5\",\"6\",\"7\",\"8\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"7 × 7 × 7 = 343.\",\"eh\":\"\"},{\"n\":74,\"d\":\"\",\"se\":\"In a class, 30 students have an average height of 150 cm. If a new student of height 181 cm joins, what is the new average? (approx.)\",\"sh\":\"\",\"oe\":[\"151 cm\",\"152 cm\",\"153 cm\",\"154 cm\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Total height = 30 × 150 = 4500 cm. Add new student: 4500 + 181 = 4681 cm. New average = 4681 / 31 = 151.0 cm.\",\"eh\":\"\"},{\"n\":75,\"d\":\"\",\"se\":\"Complete the analogy: Ocean : Fish :: Sky : ?\",\"sh\":\"\",\"oe\":[\"Bird\",\"Cloud\",\"Plane\",\"Star\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Fish naturally live and move in the ocean; birds naturally live and move in the sky.\",\"eh\":\"\"},{\"n\":76,\"d\":\"\",\"se\":\"What is the perimeter of a square with a side length of 8 cm?\",\"sh\":\"\",\"oe\":[\"16 cm\",\"24 cm\",\"32 cm\",\"64 cm\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Perimeter of a square = 4 × side = 4 × 8 = 32 cm.\",\"eh\":\"\"},{\"n\":77,\"d\":\"\",\"se\":\"If the price of a commodity increases by 20%, by how much percent must a consumer reduce consumption to keep expenditure unchanged?\",\"sh\":\"\",\"oe\":[\"16.67%\",\"20.00%\",\"25.00%\",\"33.33%\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Reduction % = (R / (100 + R)) × 100 = (20 / 120) × 100 = 16.67%.\",\"eh\":\"\"},{\"n\":78,\"d\":\"\",\"se\":\"Find the missing term in the sequence: 2, 6, 18, 54, ?\",\"sh\":\"\",\"oe\":[\"108\",\"162\",\"216\",\"324\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"This is a geometric series where each term is multiplied by 3 (54 × 3 = 162).\",\"eh\":\"\"},{\"n\":79,\"d\":\"\",\"se\":\"A man walks 5 km North, turns Right and walks 12 km East. What is his direct displacement from the starting point?\",\"sh\":\"\",\"oe\":[\"7 km\",\"13 km\",\"17 km\",\"24 km\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Using Pythagoras theorem: √(5² + 12²) = √(25 + 144) = √169 = 13 km.\",\"eh\":\"\"},{\"n\":80,\"d\":\"\",\"se\":\"What is the probability of rolling a sum of exactly 7 using two standard six-sided dice?\",\"sh\":\"\",\"oe\":[\"1/6\",\"1/9\",\"5/36\",\"7/36\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"There are 6 favorable combinations: (1,6),(2,5),(3,4),(4,3),(5,2),(6,1) out of 36 total outcomes. 6/36 = 1/6.\",\"eh\":\"\"},{\"n\":81,\"d\":\"\",\"se\":\"As of recent financial years, which subsidiary is the highest coal producer in Coal India Limited (CIL)?\",\"sh\":\"हाल के वित्तीय वर्षों के अनुसार, कोल इंडिया लिमिटेड (CIL) में सबसे अधिक कोयला उत्पादन करने वाली सहायक कंपनी कौन सी है?\",\"oe\":[\"SECL (South Eastern Coalfields Limited)\",\"CCL (Central Coalfields Limited)\",\"NCL (Northern Coalfields Limited)\",\"MCL (Mahanadi Coalfields Limited)\"],\"oh\":[\"SECL\",\"CCL\",\"NCL\",\"MCL (महानदी कोलफील्ड्स लिमिटेड)\"],\"a\":3,\"ee\":\"While SECL was historically the largest, MCL (headquartered in Sambalpur, Odisha) has overtaken it in recent years to become the highest-producing subsidiary.\",\"eh\":\"ऐतिहासिक रूप से SECL सबसे बड़ी थी, लेकिन हाल के वर्षों में MCL (मुख्यालय: संबलपुर, ओडिशा) सबसे बड़ी उत्पादक बन गई है।\"},{\"n\":82,\"d\":\"\",\"se\":\"The first commercial coal mining operation in India was started in 1774 in which present-day state?\",\"sh\":\"भारत में पहला व्यावसायिक कोयला खनन कार्य 1774 में वर्तमान के किस राज्य में शुरू किया गया था?\",\"oe\":[\"West Bengal\",\"Jharkhand\",\"Chhattisgarh\",\"Odisha\"],\"oh\":[\"पश्चिम बंगाल\",\"झारखंड\",\"छत्तीसगढ़\",\"ओडिशा\"],\"a\":0,\"ee\":\"The first coal mine was established in the Raniganj coalfield in West Bengal by the East India Company.\",\"eh\":\"रानीगंज कोयला क्षेत्र (पश्चिम बंगाल) में पहला खदान स्थापित किया गया था।\"},{\"n\":83,\"d\":\"\",\"se\":\"Chhattisgarh shares its state borders with how many other Indian states?\",\"sh\":\"छत्तीसगढ़ राज्य की सीमाएं कितने अन्य भारतीय राज्यों से लगती हैं?\",\"oe\":[\"5\",\"6\",\"7\",\"8\"],\"oh\":[\"5\",\"6\",\"7\",\"8\"],\"a\":2,\"ee\":\"Chhattisgarh borders MP, UP, Jharkhand, Odisha, Andhra Pradesh, Telangana, and Maharashtra.\",\"eh\":\"\"},{\"n\":84,\"d\":\"\",\"se\":\"In terms of total coal production within CIL, SECL currently ranks:\",\"sh\":\"CIL के भीतर कुल कोयला उत्पादन के मामले में, SECL वर्तमान में किस स्थान पर है?\",\"oe\":[\"First\",\"Second\",\"Third\",\"Fourth\"],\"oh\":[\"प्रथम\",\"द्वितीय\",\"तृतीय\",\"चतुर्थ\"],\"a\":1,\"ee\":\"SECL consistently maintains the second-largest production volume in CIL, behind MCL.\",\"eh\":\"\"},{\"n\":85,\"d\":\"\",\"se\":\"The central corporate headquarters of Coal India Limited (CIL) is located in:\",\"sh\":\"कोल इंडिया लिमिटेड (CIL) का केंद्रीय कॉर्पोरेट मुख्यालय कहाँ स्थित है?\",\"oe\":[\"Kolkata\",\"Ranchi\",\"New Delhi\",\"Mumbai\"],\"oh\":[\"कोलकाता\",\"रांची\",\"नई दिल्ली\",\"मुंबई\"],\"a\":0,\"ee\":\"Coal Bhawan, the headquarters of CIL, is situated in New Town, Rajarhat, Kolkata.\",\"eh\":\"\"},{\"n\":86,\"d\":\"\",\"se\":\"Which river is often referred to as the 'Lifeline of Chhattisgarh'?\",\"sh\":\"किस नदी को 'छत्तीसगढ़ की जीवन रेखा' (Lifeline of Chhattisgarh) कहा जाता है?\",\"oe\":[\"Mahanadi\",\"Godavari\",\"Narmada\",\"Indravati\"],\"oh\":[\"महानदी\",\"गोदावरी\",\"नर्मदा\",\"इंद्रावती\"],\"a\":0,\"ee\":\"The Mahanadi basin covers a massive portion of the state, providing crucial water for agriculture and industries.\",\"eh\":\"\"},{\"n\":87,\"d\":\"\",\"se\":\"The nationalization of non-coking coal mines in India, which paved the way for the formation of CIL, took place through an Act in which year?\",\"sh\":\"भारत में नॉन-कोकिंग कोयला खदानों का राष्ट्रीयकरण (Nationalisation), जिसके बाद CIL का गठन हुआ, किस वर्ष एक अधिनियम के माध्यम से हुआ?\",\"oe\":[\"1971\",\"1973\",\"1975\",\"1980\"],\"oh\":[\"1971\",\"1973\",\"1975\",\"1980\"],\"a\":1,\"ee\":\"The Coal Mines (Nationalisation) Act was passed in 1973 (coking coal was nationalized earlier in 1971). CIL was formed in 1975 to manage these.\",\"eh\":\"\"},{\"n\":88,\"d\":\"\",\"se\":\"The city of Bilaspur, home to SECL headquarters, is situated on the banks of which river?\",\"sh\":\"बिलासपुर शहर, जहाँ SECL का मुख्यालय है, किस नदी के तट पर स्थित है?\",\"oe\":[\"Mahanadi\",\"Arpa\",\"Son\",\"Hasdeo\"],\"oh\":[\"महानदी\",\"अरपा (Arpa)\",\"सोन\",\"हसदेव\"],\"a\":1,\"ee\":\"Bilaspur is famously located along the banks of the Arpa River, a tributary of the Seonath River.\",\"eh\":\"\"},{\"n\":89,\"d\":\"\",\"se\":\"Which of the following is NOT an operational mining area under SECL?\",\"sh\":\"निम्नलिखित में से कौन सा SECL के अधिकार क्षेत्र में आने वाला खनन क्षेत्र नहीं है?\",\"oe\":[\"Korba\",\"Raigarh\",\"Singrauli\",\"Hasdeo\"],\"oh\":[\"कोरबा\",\"रायगढ़\",\"सिंगरौली (Singrauli)\",\"हसदेव\"],\"a\":2,\"ee\":\"The Singrauli coalfield falls under the jurisdiction of Northern Coalfields Limited (NCL).\",\"eh\":\"सिंगरौली NCL (नॉर्दर्न कोलफील्ड्स लिमिटेड) के अंतर्गत आता है।\"},{\"n\":90,\"d\":\"\",\"se\":\"For coal sector employees, what does the abbreviation CMPF stand for?\",\"sh\":\"कोयला क्षेत्र के कर्मचारियों के लिए, CMPF का पूर्ण रूप क्या है?\",\"oe\":[\"Coal Mines Pension Fund\",\"Coal Mines Provident Fund\",\"Central Mines Provident Fund\",\"Coal Miners Provident Fund\"],\"oh\":[\"Coal Mines Pension Fund\",\"Coal Mines Provident Fund\",\"Central Mines Provident Fund\",\"Coal Miners Provident Fund\"],\"a\":1,\"ee\":\"CMPF is the statutory body established to administer provident fund schemes for workers in India's coal industry.\",\"eh\":\"\"},{\"n\":91,\"d\":\"\",\"se\":\"The state of Chhattisgarh was carved out of which larger state in the year 2000?\",\"sh\":\"छत्तीसगढ़ राज्य को वर्ष 2000 में किस बड़े राज्य से अलग करके बनाया गया था?\",\"oe\":[\"Madhya Pradesh\",\"Jharkhand\",\"Bihar\",\"Uttar Pradesh\"],\"oh\":[\"मध्य प्रदेश\",\"झारखंड\",\"बिहार\",\"उत्तर प्रदेश\"],\"a\":0,\"ee\":\"Chhattisgarh was formed on November 1, 2000, by partitioning 16 Chhattisgarhi-speaking districts of Madhya Pradesh.\",\"eh\":\"\"},{\"n\":92,\"d\":\"\",\"se\":\"Who is the current Chief Minister of Chhattisgarh (as of recent elections)?\",\"sh\":\"छत्तीसगढ़ के वर्तमान मुख्यमंत्री (हालिया चुनाव के अनुसार) कौन हैं?\",\"oe\":[\"Vishnu Deo Sai\",\"Bhupesh Baghel\",\"Raman Singh\",\"T. S. Singh Deo\"],\"oh\":[\"विष्णु देव साय\",\"भूपेश बघेल\",\"रमन सिंह\",\"टी. एस. सिंह देव\"],\"a\":0,\"ee\":\"Vishnu Deo Sai assumed the office of Chief Minister of Chhattisgarh following the December 2023 legislative assembly elections.\",\"eh\":\"\"},{\"n\":93,\"d\":\"\",\"se\":\"What is the official currency of India?\",\"sh\":\"भारत की आधिकारिक मुद्रा क्या है?\",\"oe\":[\"Rupee\",\"Dollar\",\"Euro\",\"Yen\"],\"oh\":[\"रुपया (Rupee)\",\"डॉलर\",\"यूरो\",\"येन\"],\"a\":0,\"ee\":\"The Indian Rupee (₹) is the official currency. (Basic general awareness question).\",\"eh\":\"\"},{\"n\":94,\"d\":\"\",\"se\":\"Globally, which country is the largest producer of coal?\",\"sh\":\"विश्व स्तर पर, कौन सा देश कोयले का सबसे बड़ा उत्पादक है?\",\"oe\":[\"China\",\"India\",\"United States\",\"Australia\"],\"oh\":[\"चीन\",\"भारत\",\"संयुक्त राज्य अमेरिका\",\"ऑस्ट्रेलिया\"],\"a\":0,\"ee\":\"China is by far the largest coal producer globally, followed by India in the second position.\",\"eh\":\"\"},{\"n\":95,\"d\":\"\",\"se\":\"SECL's operational coal mines are geographically spread across which two states?\",\"sh\":\"SECL की चालू कोयला खदानें भौगोलिक रूप से किन दो राज्यों में फैली हुई हैं?\",\"oe\":[\"Chhattisgarh and Madhya Pradesh\",\"Chhattisgarh and Odisha\",\"Madhya Pradesh and Uttar Pradesh\",\"Jharkhand and West Bengal\"],\"oh\":[\"छत्तीसगढ़ और मध्य प्रदेश\",\"छत्तीसगढ़ और ओडिशा\",\"मध्य प्रदेश और उत्तर प्रदेश\",\"झारखंड और पश्चिम बंगाल\"],\"a\":0,\"ee\":\"SECL operates mines in several districts of Chhattisgarh (e.g., Korba, Raigarh) and Madhya Pradesh (e.g., Shahdol, Anuppur).\",\"eh\":\"\"},{\"n\":96,\"d\":\"\",\"se\":\"Which major thermal power plant, directly fueled by SECL mines, is located in Korba?\",\"sh\":\"कोरबा में स्थित कौन सा प्रमुख थर्मल पावर प्लांट सीधे SECL की खदानों से कोयला प्राप्त करता है?\",\"oe\":[\"NTPC Korba Super Thermal Power Station\",\"NTPC Sipat\",\"NTPC Vindhyachal\",\"CSPGCL Marwa\"],\"oh\":[\"NTPC कोरबा सुपर थर्मल पावर स्टेशन\",\"NTPC सीपत\",\"NTPC विंध्याचल\",\"CSPGCL मड़वा\"],\"a\":0,\"ee\":\"NTPC Korba is a massive pit-head thermal power station supplied directly by SECL's Gevra and Kusmunda mines.\",\"eh\":\"\"},{\"n\":97,\"d\":\"\",\"se\":\"Which of the following is NOT a grade or type of coal?\",\"sh\":\"इनमें से कौन सा कोयले का ग्रेड (प्रकार) नहीं है?\",\"oe\":[\"Anthracite\",\"Bituminous\",\"Lignite\",\"Graphite\"],\"oh\":[\"एन्थ्रेसाइट\",\"बिटुमिनस\",\"लिग्नाइट\",\"ग्रेफाइट\"],\"a\":3,\"ee\":\"While graphite is an allotrope of carbon (like coal), it is not used as a fuel and is structurally different from coal ranks (Anthracite, Bituminous, Lignite).\",\"eh\":\"\"},{\"n\":98,\"d\":\"\",\"se\":\"Coal India Limited (CIL) is a Maharatna Public Sector Undertaking operating under which government ministry?\",\"sh\":\"कोल इंडिया लिमिटेड (CIL) भारत सरकार के किस मंत्रालय के अंतर्गत कार्य करता है?\",\"oe\":[\"Ministry of Power\",\"Ministry of Mines\",\"Ministry of Coal\",\"Ministry of Heavy Industries\"],\"oh\":[\"ऊर्जा मंत्रालय (Ministry of Power)\",\"खान मंत्रालय (Ministry of Mines)\",\"कोयला मंत्रालय (Ministry of Coal)\",\"भारी उद्योग मंत्रालय\"],\"a\":2,\"ee\":\"CIL operates exclusively under the jurisdiction of the Ministry of Coal, Government of India.\",\"eh\":\"\"},{\"n\":99,\"d\":\"\",\"se\":\"The official state language of Madhya Pradesh is:\",\"sh\":\"मध्य प्रदेश की आधिकारिक राज्य भाषा क्या है?\",\"oe\":[\"Hindi\",\"English\",\"Marathi\",\"Chhattisgarhi\"],\"oh\":[\"हिंदी\",\"अंग्रेजी\",\"मराठी\",\"छत्तीसगढ़ी\"],\"a\":0,\"ee\":\"Hindi is the official and most widely spoken language in Madhya Pradesh.\",\"eh\":\"\"},{\"n\":100,\"d\":\"\",\"se\":\"The National Coal Index (NCI), which reflects changes in coal prices, is published by:\",\"sh\":\"कोयले की कीमतों में बदलाव को दर्शाने वाला नेशनल कोल इंडेक्स (NCI) किसके द्वारा प्रकाशित किया जाता है?\",\"oe\":[\"Ministry of Coal\",\"Coal India Limited (CIL)\",\"NITI Aayog\",\"Ministry of Finance\"],\"oh\":[\"कोयला मंत्रालय\",\"कोल इंडिया लिमिटेड (CIL)\",\"नीति आयोग\",\"वित्त मंत्रालय\"],\"a\":0,\"ee\":\"The Ministry of Coal rolled out the NCI to track the price level of coal based on notified prices, auction prices, and import prices.\",\"eh\":\"\"}],\"sub\":\"100 questions · 47 bilingual\"},{\"id\":\"hp3\",\"num\":3,\"name\":\"High Probability Paper 3\",\"q\":[{\"n\":1,\"d\":\"\",\"se\":\"Image-based: The diagram shows a graph of battery charging current vs time for a lead-acid battery. The initial stage where high constant current is applied is called:\",\"sh\":\"चित्र-आधारित: आरेख एक लेड-एसिड बैटरी के लिए चार्जिंग करंट बनाम समय (time) का ग्राफ दिखाता है। वह प्रारंभिक चरण जहाँ उच्च स्थिर करंट (constant current) दिया जाता है, क्या कहलाता है?\",\"oe\":[\"Float charge\",\"Bulk charge\",\"Trickle charge\",\"Equalisation charge\"],\"oh\":[\"फ्लोट चार्ज (Float charge)\",\"बल्क चार्ज (Bulk charge)\",\"ट्रिकल चार्ज (Trickle charge)\",\"इक्वलाइजेशन चार्ज (Equalisation charge)\"],\"a\":1,\"ee\":\"Bulk charge is the first primary stage of charging where constant current is pushed into the battery until the voltage rises to a pre-set level (typically ~80% capacity).\",\"eh\":\"बल्क चार्ज पहला प्राथमिक चरण है जहाँ बैटरी में तब तक स्थिर करंट भेजा जाता है जब तक कि वोल्टेज पूर्व-निर्धारित स्तर तक नहीं बढ़ जाता।\"},{\"n\":2,\"d\":\"\",\"se\":\"Which layer of the OSI model is responsible for end-to-end error correction, segmentation, and flow control?\",\"sh\":\"OSI मॉडल की कौन सी लेयर (Layer) एंड-टू-एंड त्रुटि सुधार (error correction), सेगमेंटेशन और फ्लो कंट्रोल के लिए जिम्मेदार है?\",\"oe\":[\"Network layer\",\"Transport layer\",\"Data Link layer\",\"Session layer\"],\"oh\":[\"नेटवर्क लेयर\",\"ट्रांसपोर्ट लेयर\",\"डेटा लिंक लेयर\",\"सेशन लेयर\"],\"a\":1,\"ee\":\"The Transport layer (Layer 4) handles reliable delivery using protocols like TCP, ensuring data arrives completely and in order.\",\"eh\":\"ट्रांसपोर्ट लेयर (Layer 4) TCP जैसे प्रोटोकॉल का उपयोग करके विश्वसनीय डिलीवरी (reliable delivery) संभालती है।\"},{\"n\":3,\"d\":\"\",\"se\":\"In a radio communication system, the term 'freeband' typically refers to:\",\"sh\":\"रेडियो संचार प्रणाली में, 'फ्रीबैंड' (freeband) शब्द का अर्थ आमतौर पर क्या होता है?\",\"oe\":[\"Frequencies requiring no license for low-power, short-range use (ISM bands)\",\"Restricted military frequencies\",\"Satellite downlink frequencies\",\"High-power AM broadcast bands\"],\"oh\":[\"कम शक्ति वाले, कम दूरी के उपयोग (ISM बैंड) के लिए वे आवृत्तियाँ जिनके लिए लाइसेंस की आवश्यकता नहीं होती\",\"प्रतिबंधित सैन्य आवृत्तियाँ\",\"सैटेलाइट डाउनलिंक आवृत्तियाँ\",\"उच्च शक्ति वाले AM प्रसारण बैंड\"],\"a\":0,\"ee\":\"Freebands (like 2.4 GHz, 433 MHz, or 868 MHz) allow license-free operation under strictly regulated power transmission limits.\",\"eh\":\"\"},{\"n\":4,\"d\":\"\",\"se\":\"What does OTDR stand for in optical fibre testing?\",\"sh\":\"ऑप्टिकल फाइबर परीक्षण में OTDR का पूर्ण रूप क्या है?\",\"oe\":[\"Optical Time Domain Reflectometer\",\"Optical Transmitter Data Receiver\",\"Optical Tester for Data Rate\",\"Optical Transfer Ratio\"],\"oh\":[\"Optical Time Domain Reflectometer\",\"Optical Transmitter Data Receiver\",\"Optical Tester for Data Rate\",\"Optical Transfer Ratio\"],\"a\":0,\"ee\":\"An OTDR injects light pulses into a fibre and analyzes the backscattered light to locate faults, splices, and measure attenuation.\",\"eh\":\"OTDR एक फाइबर में प्रकाश पल्स (pulses) भेजता है और बैकस्कैटर्ड प्रकाश का विश्लेषण करके दोषों और स्प्लिस लॉस का पता लगाता है।\"},{\"n\":5,\"d\":\"\",\"se\":\"What is the standard length of a MAC address?\",\"sh\":\"MAC एड्रेस (MAC address) की मानक लंबाई कितनी होती है?\",\"oe\":[\"32 bits\",\"48 bits\",\"64 bits\",\"128 bits\"],\"oh\":[\"32 बिट्स\",\"48 बिट्स\",\"64 बिट्स\",\"128 बिट्स\"],\"a\":1,\"ee\":\"A Media Access Control (MAC) address is 48 bits (6 bytes) long, usually written in hexadecimal format (e.g., 00:1A:2B:3C:4D:5E).\",\"eh\":\"मीडिया एक्सेस कंट्रोल (MAC) एड्रेस 48 बिट्स (6 बाइट्स) लंबा होता है, जिसे हेक्साडेसिमल में लिखा जाता है।\"},{\"n\":6,\"d\":\"\",\"se\":\"Which type of fibre optic dispersion causes pulse broadening due to different wavelengths (colours) travelling at slightly different speeds?\",\"sh\":\"किस प्रकार का फाइबर ऑप्टिक फैलाव (Dispersion) पल्स ब्रॉडनिंग का कारण बनता है क्योंकि विभिन्न तरंग दैर्ध्य (रंग) अलग-अलग गति से यात्रा करते हैं?\",\"oe\":[\"Modal dispersion\",\"Chromatic dispersion\",\"Polarisation mode dispersion\",\"Nonlinear dispersion\"],\"oh\":[\"मोडल फैलाव (Modal dispersion)\",\"क्रोमेटिक फैलाव (Chromatic dispersion)\",\"ध्रुवीकरण मोड फैलाव (Polarisation mode dispersion)\",\"नॉनलाइनियर फैलाव\"],\"a\":1,\"ee\":\"Chromatic dispersion occurs because the refractive index of the glass core varies slightly depending on the wavelength of light.\",\"eh\":\"\"},{\"n\":7,\"d\":\"\",\"se\":\"In an IoT system, the lightweight protocol MQTT is based on which communication model?\",\"sh\":\"IoT प्रणाली में, हल्का प्रोटोकॉल MQTT किस संचार मॉडल पर आधारित है?\",\"oe\":[\"Request-Response\",\"Publish-Subscribe\",\"Client-Server\",\"Peer-to-Peer\"],\"oh\":[\"रिक्वेस्ट-रिस्पॉन्स (Request-Response)\",\"पब्लिश-सब्सक्राइब (Publish-Subscribe)\",\"क्लाइंट-सर्वर (Client-Server)\",\"पीयर-टू-पीयर (Peer-to-Peer)\"],\"a\":1,\"ee\":\"MQTT uses a central broker where devices &quot;publish&quot; messages to a topic, and other devices &quot;subscribe&quot; to receive those messages.\",\"eh\":\"\"},{\"n\":8,\"d\":\"\",\"se\":\"The specific gravity of the electrolyte in a fully charged 12V lead-acid battery is approximately:\",\"sh\":\"पूर्ण चार्ज (Fully charged) 12V लेड-एसिड बैटरी में इलेक्ट्रोलाइट का विशिष्ट गुरुत्व (Specific gravity) लगभग कितना होता है?\",\"oe\":[\"1.100\",\"1.200\",\"1.260 - 1.280\",\"1.350\"],\"oh\":[\"1.100\",\"1.200\",\"1.260 - 1.280\",\"1.350\"],\"a\":2,\"ee\":\"Specific gravity is measured using a hydrometer. 1.260-1.280 indicates full charge; values around 1.100 indicate a fully discharged battery.\",\"eh\":\"विशिष्ट गुरुत्व को हाइड्रोमीटर का उपयोग करके मापा जाता है। 1.260-1.280 फुल चार्ज को दर्शाता है।\"},{\"n\":9,\"d\":\"\",\"se\":\"Image-based: The diagram shows a setup for measuring earth resistance using the fall-of-potential method. At what distance should the potential spike (P) typically be placed relative to the current spike (C)?\",\"sh\":\"चित्र-आधारित: आरेख 'फॉल-ऑफ़-पोटेंशियल' (Fall-of-potential) विधि का उपयोग करके अर्थ रेजिस्टेंस को मापने का सेटअप दिखाता है। पोटेंशियल स्पाइक (P) को करंट स्पाइक (C) के सापेक्ष किस दूरी पर रखा जाना चाहिए?\",\"oe\":[\"At 10% of the total distance\",\"At approx 62% of the distance from the earth electrode to the current spike\",\"Exactly halfway (50%)\",\"Any arbitrary distance\"],\"oh\":[\"कुल दूरी के 10% पर\",\"अर्थ इलेक्ट्रोड से करंट स्पाइक की कुल दूरी के लगभग 62% पर\",\"बिल्कुल बीच में (50%)\",\"किसी भी यादृच्छिक (arbitrary) दूरी पर\"],\"a\":1,\"ee\":\"Placing the potential spike at 61.8% of the total distance to the current spike avoids overlapping resistance areas, ensuring an accurate reading.\",\"eh\":\"सटीक रीडिंग सुनिश्चित करने के लिए स्पाइक को 61.8% की दूरी पर रखा जाता है।\"},{\"n\":10,\"d\":\"\",\"se\":\"Which protocol is used to resolve (convert) known IP addresses to unknown MAC addresses in a local network?\",\"sh\":\"लोकल नेटवर्क में ज्ञात IP एड्रेस को अज्ञात MAC एड्रेस में बदलने के लिए किस प्रोटोकॉल का उपयोग किया जाता है?\",\"oe\":[\"DNS\",\"ARP\",\"DHCP\",\"NAT\"],\"oh\":[\"DNS\",\"ARP (Address Resolution Protocol)\",\"DHCP\",\"NAT\"],\"a\":1,\"ee\":\"ARP broadcasts a request asking &quot;Who has this IP?&quot; and the device with that IP replies with its MAC address.\",\"eh\":\"\"},{\"n\":11,\"d\":\"\",\"se\":\"In a CCTV security system, what does a PTZ camera stand for?\",\"sh\":\"CCTV सुरक्षा प्रणाली में, PTZ कैमरे का अर्थ क्या है?\",\"oe\":[\"Pan-Tilt-Zoom\",\"Point-To-Zoom\",\"Power-Trigger-Zone\",\"Pulse-Timing-Zapper\"],\"oh\":[\"Pan-Tilt-Zoom\",\"Point-To-Zoom\",\"Power-Trigger-Zone\",\"Pulse-Timing-Zapper\"],\"a\":0,\"ee\":\"PTZ cameras feature motorized assemblies allowing operators to remotely pan (move horizontally), tilt (move vertically), and optical zoom.\",\"eh\":\"\"},{\"n\":12,\"d\":\"\",\"se\":\"What is the typical soldering iron tip temperature required when working with standard Lead-Free solder?\",\"sh\":\"मानक 'लेड-फ्री' (Lead-Free) सोल्डर के साथ काम करते समय आमतौर पर सोल्डरिंग आयरन टिप (Tip) का तापमान कितना होना चाहिए?\",\"oe\":[\"180°C\",\"220°C\",\"350°C\",\"450°C\"],\"oh\":[\"180°C\",\"220°C\",\"350°C\",\"450°C\"],\"a\":2,\"ee\":\"While lead-free solder melts at around 227°C, the iron tip must be set between 350°C to 380°C to transfer sufficient heat quickly to the joint.\",\"eh\":\"लेड-फ्री सोल्डर लगभग 227°C पर पिघलता है, लेकिन उचित ऊष्मा हस्तांतरण के लिए टिप का तापमान 350°C - 380°C रखा जाता है।\"},{\"n\":13,\"d\":\"\",\"se\":\"What is the primary operational difference between a Voltage Stabiliser and a CVT (Constant Voltage Transformer)?\",\"sh\":\"वोल्टेज स्टेबलाइजर और CVT (Constant Voltage Transformer) के बीच प्राथमिक परिचालन अंतर क्या है?\",\"oe\":[\"Stabiliser uses electronic relay/servo switching; CVT uses magnetic ferroresonance\",\"CVT is strictly for DC circuits\",\"Stabiliser provides a pure sine wave; CVT provides a square wave\",\"There is no difference\"],\"oh\":[\"स्टेबलाइजर इलेक्ट्रॉनिक रिले/सर्वो स्विचिंग का उपयोग करता है; CVT चुंबकीय फेरोरेज़ोनेंस का उपयोग करता है\",\"CVT केवल DC सर्किट के लिए है\",\"स्टेबलाइजर शुद्ध साइन वेव (pure sine wave) देता है; CVT स्क्वायर वेव देता है\",\"कोई अंतर नहीं है\"],\"a\":0,\"ee\":\"CVTs regulate voltage through tank circuit saturation (ferroresonance) with no moving parts or relays, offering superior isolation.\",\"eh\":\"\"},{\"n\":14,\"d\":\"\",\"se\":\"Which layer of the TCP/IP model directly corresponds to the Network layer of the OSI model?\",\"sh\":\"TCP/IP मॉडल की कौन सी लेयर OSI मॉडल की 'नेटवर्क लेयर' (Network layer) से सीधे मेल खाती है?\",\"oe\":[\"Application\",\"Transport\",\"Internet\",\"Network Access\"],\"oh\":[\"एप्लीकेशन (Application)\",\"ट्रांसपोर्ट (Transport)\",\"इंटरनेट (Internet)\",\"नेटवर्क एक्सेस (Network Access)\"],\"a\":2,\"ee\":\"The Internet layer (which handles IP addressing and routing) in TCP/IP maps directly to the OSI Network layer.\",\"eh\":\"\"},{\"n\":15,\"d\":\"\",\"se\":\"In a GPS-based Vehicle Tracking System (VTS), which component is responsible for transmitting the calculated location data to the remote central server?\",\"sh\":\"GPS-आधारित व्हीकल ट्रैकिंग सिस्टम (VTS) में, प्राप्त लोकेशन डेटा को दूरस्थ केंद्रीय सर्वर तक ट्रांसमिट (transmit) करने के लिए कौन सा घटक जिम्मेदार है?\",\"oe\":[\"GPS receiver\",\"GSM/GPRS module\",\"Internal Microcontroller\",\"Lithium battery\"],\"oh\":[\"GPS रिसीवर\",\"GSM/GPRS मॉड्यूल\",\"इंटरनल माइक्रोकंट्रोलर\",\"लिथियम बैटरी\"],\"a\":1,\"ee\":\"The GPS module acquires the coordinates, but the GSM/GPRS module uses cellular networks (SIM card) to send that data to the server.\",\"eh\":\"\"},{\"n\":16,\"d\":\"\",\"se\":\"What is the function of a DNS server in a computer network?\",\"sh\":\"कंप्यूटर नेटवर्क में DNS सर्वर का कार्य क्या है?\",\"oe\":[\"Assigns IP addresses dynamically\",\"Resolves human-readable domain names to IP addresses\",\"Translates MAC addresses to IP addresses\",\"Encrypts HTTP data\"],\"oh\":[\"गतिशील रूप से IP पते प्रदान करना\",\"मानव-पठनीय डोमेन नाम (जैसे google.com) को IP एड्रेस में बदलना\",\"MAC पतों को IP पतों में बदलना\",\"HTTP डेटा एन्क्रिप्ट करना\"],\"a\":1,\"ee\":\"DNS (Domain Name System) acts as the phonebook of the internet, turning names like &quot;google.com&quot; into IP addresses.\",\"eh\":\"\"},{\"n\":17,\"d\":\"\",\"se\":\"Which type of RFID tag has its own internal power source and can transmit signals over longer distances?\",\"sh\":\"किस प्रकार के RFID टैग में अपना स्वयं का आंतरिक पावर स्रोत (बैटरी) होता है और यह लंबी दूरी तक सिग्नल संचारित कर सकता है?\",\"oe\":[\"Passive RFID\",\"Active RFID\",\"Inductive RFID\",\"Barcode RFID\"],\"oh\":[\"पैसिव RFID (Passive RFID)\",\"एक्टिव RFID (Active RFID)\",\"इंडक्टिव RFID\",\"बारकोड RFID\"],\"a\":1,\"ee\":\"Active RFID tags contain a battery, allowing them to broadcast signals continuously over ranges exceeding 100 meters.\",\"eh\":\"\"},{\"n\":18,\"d\":\"\",\"se\":\"The commonly used 868 MHz ISM band (used for LoRa and IoT in many regions) falls into which frequency classification?\",\"sh\":\"आमतौर पर उपयोग किया जाने वाला 868 MHz ISM बैंड (कई क्षेत्रों में LoRa और IoT के लिए उपयोग किया जाता है) किस आवृत्ति वर्गीकरण (Frequency classification) में आता है?\",\"oe\":[\"LF (Low Frequency)\",\"HF (High Frequency)\",\"UHF (Ultra High Frequency)\",\"SHF (Super High Frequency)\"],\"oh\":[\"LF (Low Frequency)\",\"HF (High Frequency)\",\"UHF (Ultra High Frequency)\",\"SHF (Super High Frequency)\"],\"a\":2,\"ee\":\"The UHF band covers frequencies from 300 MHz to 3 GHz.\",\"eh\":\"UHF बैंड 300 MHz से 3 GHz तक की आवृत्तियों को कवर करता है।\"},{\"n\":19,\"d\":\"\",\"se\":\"What is the purpose of applying an 'equalisation charge' to a lead-acid battery bank?\",\"sh\":\"लेड-एसिड बैटरी बैंक में 'इक्वलाइजेशन चार्ज' (Equalisation charge) लागू करने का उद्देश्य क्या है?\",\"oe\":[\"To reduce water loss rapidly\",\"To reverse minor sulfation and balance the voltage across all cells\",\"To permanently increase the Ah capacity beyond factory specs\",\"To discharge the battery safely\"],\"oh\":[\"पानी के नुकसान को तेजी से कम करना\",\"मामूली सल्फेशन (sulfation) को उलटना और सभी सेल के वोल्टेज को संतुलित करना\",\"फैक्ट्री स्पेक्स से परे Ah क्षमता को स्थायी रूप से बढ़ाना\",\"बैटरी को सुरक्षित रूप से डिस्चार्ज करना\"],\"a\":1,\"ee\":\"Equalisation is a controlled overcharge that mixes the stratified electrolyte and knocks sulfate crystals off the battery plates.\",\"eh\":\"\"},{\"n\":20,\"d\":\"\",\"se\":\"Which of the following is an absolute advantage of Optical Fibre communication over Copper cables?\",\"sh\":\"तांबे (Copper) के केबलों की तुलना में ऑप्टिकल फाइबर संचार का एक पूर्ण लाभ क्या है?\",\"oe\":[\"Vastly higher bandwidth capacity\",\"Complete immunity to electromagnetic interference (EMI)\",\"Significantly lower signal attenuation over long distances\",\"All of the above\"],\"oh\":[\"अत्यधिक उच्च बैंडविड्थ क्षमता\",\"विद्युत चुम्बकीय हस्तक्षेप (EMI) से पूर्ण प्रतिरक्षा (Immunity)\",\"लंबी दूरी पर काफी कम सिग्नल क्षीणन (Attenuation)\",\"उपरोक्त सभी\"],\"a\":3,\"ee\":\"Fibre optic cables use light, making them immune to EMI, capable of extreme speeds, and highly efficient over long hauls.\",\"eh\":\"\"},{\"n\":21,\"d\":\"\",\"se\":\"Image-based: The diagram outlines the 7 layers of the OSI model. Which layer is directly responsible for data framing, physical MAC addressing, and CRC error detection?\",\"sh\":\"चित्र-आधारित: आरेख OSI मॉडल की 7 परतों (layers) को रेखांकित करता है। कौन सी परत डेटा फ्रेमिंग, भौतिक MAC एड्रेसिंग और CRC त्रुटि का पता लगाने के लिए सीधे जिम्मेदार है?\",\"oe\":[\"Physical (Layer 1)\",\"Data Link (Layer 2)\",\"Network (Layer 3)\",\"Transport (Layer 4)\"],\"oh\":[\"फिजिकल (Layer 1)\",\"डेटा लिंक (Layer 2)\",\"नेटवर्क (Layer 3)\",\"ट्रांसपोर्ट (Layer 4)\"],\"a\":1,\"ee\":\"The Data Link layer packages raw bits into frames and uses MAC addresses for local delivery.\",\"eh\":\"\"},{\"n\":22,\"d\":\"\",\"se\":\"What is the typical attenuation coefficient for a standard single-mode optical fibre at the 1550 nm wavelength?\",\"sh\":\"\",\"oe\":[\"0.2 dB/km\",\"0.5 dB/km\",\"1.0 dB/km\",\"2.0 dB/km\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"1550 nm is the wavelength of lowest attenuation in silica glass, typically measuring around 0.2 to 0.25 dB per kilometer.\",\"eh\":\"\"},{\"n\":23,\"d\":\"\",\"se\":\"On a standard digital multimeter, the setting labeled 'ACV' or 'V~' is used to measure:\",\"sh\":\"\",\"oe\":[\"AC current\",\"AC voltage\",\"DC voltage\",\"Capacitance\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"ACV stands for Alternating Current Voltage (like the mains supply).\",\"eh\":\"\"},{\"n\":24,\"d\":\"\",\"se\":\"Which type of circuit breaker is specifically designed for life safety by protecting against earth leakage and preventing fatal electric shocks?\",\"sh\":\"\",\"oe\":[\"MCB (Miniature Circuit Breaker)\",\"MCCB (Molded Case Circuit Breaker)\",\"RCCB (Residual Current Circuit Breaker)\",\"ACB (Air Circuit Breaker)\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"The RCCB detects leakage currents as low as 30mA and trips instantly to prevent fatal shocks.\",\"eh\":\"\"},{\"n\":25,\"d\":\"\",\"se\":\"What does the term 'jitter' refer to in digital network communication?\",\"sh\":\"\",\"oe\":[\"Variation in signal voltage amplitude\",\"Variation in signal timing or packet delay (phase)\",\"Total loss of a digital signal\",\"Electromagnetic crosstalk between cables\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Jitter is the variance in latency (delay) between packets arriving, which severely degrades real-time applications like VoIP and video conferencing.\",\"eh\":\"\"},{\"n\":26,\"d\":\"\",\"se\":\"In broadband technology, what does the standard DOCSIS stand for?\",\"sh\":\"\",\"oe\":[\"Data Over Cable Service Interface Specification\",\"Digital Optical Cable Service Interface Standard\",\"Direct Cable Service Interface\",\"Dynamic Over Cable Service\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"DOCSIS is the international telecommunications standard used to provide high-speed internet over existing cable TV (coaxial) infrastructure.\",\"eh\":\"\"},{\"n\":27,\"d\":\"\",\"se\":\"Which of the following is a common sensor module utilized in IoT (Internet of Things) automation?\",\"sh\":\"\",\"oe\":[\"LM35 (Temperature sensor)\",\"PIR (Passive Infrared motion sensor)\",\"HC-SR04 (Ultrasonic distance sensor)\",\"All of the above\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"All three are foundational sensors used extensively in IoT nodes and microcontrollers.\",\"eh\":\"\"},{\"n\":28,\"d\":\"\",\"se\":\"What is the fundamental purpose of attaching a 'heat sink' to a power transistor or MOSFET?\",\"sh\":\"\",\"oe\":[\"To amplify high-frequency signals\",\"To increase surface area to dissipate heat and prevent thermal runaway\",\"To store electrical charge temporarily\",\"To provide electrical grounding\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Heat sinks absorb heat from the semiconductor die and dissipate it into the surrounding air via fins.\",\"eh\":\"\"},{\"n\":29,\"d\":\"\",\"se\":\"In an IP-based EPABX system, which protocol is the global standard used for initiating, maintaining, and terminating VoIP calls?\",\"sh\":\"\",\"oe\":[\"SIP (Session Initiation Protocol)\",\"HTTP\",\"FTP\",\"SMTP\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"SIP is the signaling protocol used to establish voice and video sessions over IP networks.\",\"eh\":\"\"},{\"n\":30,\"d\":\"\",\"se\":\"What is the resistance value of a 4-band resistor with the colour code: Yellow - Violet - Red - Gold?\",\"sh\":\"\",\"oe\":[\"47 Ω ± 5%\",\"470 Ω ± 5%\",\"4.7 kΩ ± 5%\",\"47 kΩ ± 5%\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Yellow(4), Violet(7), Red(Multiplier 100). 47 × 100 = 4700 Ohms = 4.7 kΩ. Gold represents a 5% tolerance.\",\"eh\":\"\"},{\"n\":31,\"d\":\"\",\"se\":\"What is the standard type of cable deployed for transmitting baseband analog video signals in legacy CCTV installations?\",\"sh\":\"\",\"oe\":[\"CAT-5 UTP\",\"RG-59 coaxial cable\",\"Single-mode fibre\",\"Unshielded multi-core cable\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"RG-59 is a 75-Ohm coaxial cable, historically the industry standard for short-to-medium range analog video transmission.\",\"eh\":\"\"},{\"n\":32,\"d\":\"\",\"se\":\"Which passive electronic component is primarily used in DC power supplies to store charge and filter out AC ripples?\",\"sh\":\"\",\"oe\":[\"Inductor\",\"Resistor\",\"Capacitor\",\"Diode\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Smoothing capacitors charge up during voltage peaks and release energy during dips, smoothing the rectified DC output.\",\"eh\":\"\"},{\"n\":33,\"d\":\"\",\"se\":\"Image-based: A waveform diagram displays a 'Modified Sine Wave' inverter output (looking like staggered square steps). What is the main disadvantage of this waveform compared to a Pure Sine Wave?\",\"sh\":\"\",\"oe\":[\"It is significantly more expensive to manufacture\",\"It causes overheating, humming, and inefficiency in inductive loads (motors/transformers)\",\"It consumes too much battery power on standby\",\"It takes up too much physical space\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"The sharp edges of a modified sine wave generate harmonics that cause motors to run hot and electronic power supplies to buzz.\",\"eh\":\"\"},{\"n\":34,\"d\":\"\",\"se\":\"In the context of computer data storage, what does the term 'solid-state' (as in SSD) signify?\",\"sh\":\"\",\"oe\":[\"It uses magnetized spinning platters\",\"It uses semiconductor flash memory with zero moving mechanical parts\",\"It uses laser-etched optical media\",\"It stores data in solid RAM blocks that clear upon reboot\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Solid-state technology relies entirely on electronic circuits (NAND flash) rather than mechanical arms and spinning disks.\",\"eh\":\"\"},{\"n\":35,\"d\":\"\",\"se\":\"What is the universally accepted standard operating voltage for large-scale telecommunications equipment (Telecom power bus)?\",\"sh\":\"\",\"oe\":[\"-48 V DC\",\"+48 V DC\",\"12 V DC\",\"230 V AC\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Telecom systems operate on negative 48V DC (where the positive terminal is grounded) to minimize galvanic corrosion on underground wires.\",\"eh\":\"\"},{\"n\":36,\"d\":\"\",\"se\":\"Which of the following is an RF/Coaxial connector and NOT a Fibre Optic connector?\",\"sh\":\"\",\"oe\":[\"SC\",\"ST\",\"BNC\",\"LC\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"BNC (Bayonet Neill–Concelman) is a quick-connect RF connector used for coaxial cable (CCTV/Radio). SC, ST, and LC are fibre connectors.\",\"eh\":\"\"},{\"n\":37,\"d\":\"\",\"se\":\"What is the primary function of the grounding mechanism in a lightning arrestor installation?\",\"sh\":\"\",\"oe\":[\"To carry massive surge currents safely to the earth without damaging equipment\",\"To physically repel lightning strikes away from the tower\",\"To measure the voltage of the lightning\",\"To convert the surge into usable grid electricity\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Grounding provides an ultra-low impedance path directly to the earth pit for the lightning surge to dissipate harmlessly.\",\"eh\":\"\"},{\"n\":38,\"d\":\"\",\"se\":\"In networking terminology, the term 'Gateway' generally refers to:\",\"sh\":\"\",\"oe\":[\"A device or node that connects two networks operating on completely different architectures or protocols\",\"A device that amplifies signal strength across long copper runs\",\"A simple network switch\",\"A server that issues IP addresses\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"A gateway acts as a &quot;door&quot; between differing networks, performing protocol translation if necessary (e.g., LAN to Internet).\",\"eh\":\"\"},{\"n\":39,\"d\":\"\",\"se\":\"What is the approximate maximum data storage capacity of a standard, single-layer CD-ROM?\",\"sh\":\"\",\"oe\":[\"700 MB\",\"4.7 GB\",\"25 GB\",\"1.44 MB\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"A standard CD holds ~700 MB. A standard DVD holds 4.7 GB, a Blu-ray holds 25 GB, and a floppy disk holds 1.44 MB.\",\"eh\":\"\"},{\"n\":40,\"d\":\"\",\"se\":\"Which of the following is the defining characteristic of an 'Unmanaged' network switch?\",\"sh\":\"\",\"oe\":[\"It supports complex configurable VLANs\",\"It is strictly plug-and-play and cannot be configured via software\",\"It performs Layer 3 IP routing\",\"It requires a dedicated management IP address\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Unmanaged switches simply pass Ethernet frames between connected devices with no user-configurable settings.\",\"eh\":\"\"},{\"n\":41,\"d\":\"\",\"se\":\"In an Indian 3-phase commercial power supply system, what is the standard nominal line-to-line voltage?\",\"sh\":\"\",\"oe\":[\"230 V\",\"415 V\",\"11 kV\",\"33 kV\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"In India, the standard line-to-neutral (single-phase) voltage is 230V, and the line-to-line (3-phase) voltage is 415V.\",\"eh\":\"\"},{\"n\":42,\"d\":\"\",\"se\":\"Image-based: A circuit schematic shows the symbol for a MOSFET transistor with three terminals marked G, D, and S. The terminal marked 'G' stands for:\",\"sh\":\"\",\"oe\":[\"Source\",\"Drain\",\"Gate\",\"Ground\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"The three terminals of a MOSFET are Gate (G), Drain (D), and Source (S). (Bipolar Junction Transistors use Base, Collector, Emitter).\",\"eh\":\"\"},{\"n\":43,\"d\":\"\",\"se\":\"What is the fundamental function of a 'Voltage Regulator' IC (like the 7805) in a DC power supply?\",\"sh\":\"\",\"oe\":[\"To maintain a highly constant output DC voltage regardless of minor fluctuations in input voltage or load current\",\"To convert raw AC into pulsating DC\",\"To filter high-frequency noise from the mains\",\"To step up the voltage\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Regulators clip/adjust to ensure the downstream electronics receive perfectly stable DC voltage.\",\"eh\":\"\"},{\"n\":44,\"d\":\"\",\"se\":\"Which of the following addresses represents a valid IPv6 Multicast block?\",\"sh\":\"\",\"oe\":[\"FF02::1\",\"192.168.1.1\",\"::1\",\"2001:0db8::1\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"In IPv6, all multicast addresses begin with the prefix FF (e.g., FF00::/8). `::1` is the loopback address.\",\"eh\":\"\"},{\"n\":45,\"d\":\"\",\"se\":\"What physical principle allows a Tong Tester (Clamp Meter) to measure AC current without breaking the electrical wire?\",\"sh\":\"\",\"oe\":[\"Hall effect (for DC) / Current Transformer principle (for AC)\",\"Thermocouple effect\",\"Piezoelectric effect\",\"Electrostatic induction\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Standard AC clamp meters use magnetic induction (acting as a current transformer), where the clamped wire acts as the primary winding.\",\"eh\":\"\"},{\"n\":46,\"d\":\"\",\"se\":\"In the specifications of a CCTV DVR, what does the parameter 'fps' (e.g., 30 fps) indicate?\",\"sh\":\"\",\"oe\":[\"Number of cameras the unit supports\",\"Number of Frames Per Second recorded, dictating video smoothness\",\"Resolution in megapixels\",\"Storage capacity of the hard drive\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"FPS refers to the frame rate; 30 fps provides smooth, real-time video playback.\",\"eh\":\"\"},{\"n\":47,\"d\":\"\",\"se\":\"Which composition ratio of Tin/Lead solder is most commonly used as the industry standard for hand-soldering electronics due to its low melting point?\",\"sh\":\"\",\"oe\":[\"60/40 (Tin 60%, Lead 40%)\",\"50/50\",\"70/30\",\"90/10\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"60/40 (and 63/37 eutectic) blends have a low melting point (~183°C) and excellent wetting properties for PCB work.\",\"eh\":\"\"},{\"n\":48,\"d\":\"\",\"se\":\"In telecom multiplexing, what is the function of a 'Demultiplexer' (DEMUX)?\",\"sh\":\"\",\"oe\":[\"Combines multiple separate signals into one transmission line\",\"Separates a single combined input signal into its multiple original outputs\",\"Amplifies weak signals over long distances\",\"Converts analog voice to digital IP packets\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"A MUX combines signals for transmission; a DEMUX splits them back apart at the receiving end.\",\"eh\":\"\"},{\"n\":49,\"d\":\"\",\"se\":\"While passive RFID tags have a range of just a few meters, the typical range of an Active RFID tag is:\",\"sh\":\"\",\"oe\":[\"&lt; 1 meter\",\"1 - 10 meters\",\"10 - 20 meters\",\"&gt; 100 meters\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Because active tags broadcast using their own battery power, they can easily cover hundreds of meters (used in fleet tracking/mining yards).\",\"eh\":\"\"},{\"n\":50,\"d\":\"\",\"se\":\"Inside modern computer architecture, what does the acronym GPU stand for?\",\"sh\":\"\",\"oe\":[\"Graphics Processing Unit\",\"General Processing Unit\",\"Global Processor Unit\",\"Group Processing Unit\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"A GPU is a specialized electronic circuit designed to rapidly manipulate memory to accelerate the creation of images/video.\",\"eh\":\"\"},{\"n\":51,\"d\":\"\",\"se\":\"In traditional analog telephony (POTS), what is the electrical purpose of the 'Ring' wire?\",\"sh\":\"\",\"oe\":[\"It carries the positive earth ground\",\"It carries the negative DC voltage (-48V) from the exchange\",\"It is purely a mechanical support wire\",\"It only carries the ringing bell tone\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"In Tip/Ring wiring, the Tip is connected to the positive ground, and the Ring carries the -48V DC supply.\",\"eh\":\"\"},{\"n\":52,\"d\":\"\",\"se\":\"Which modern battery chemistry strictly requires a charger that utilizes a precise Constant Current followed by Constant Voltage (CC-CV) charging algorithm to prevent explosions?\",\"sh\":\"\",\"oe\":[\"Nickel-Cadmium (Ni-Cd)\",\"Lithium-Ion (Li-ion)\",\"Lead-Acid trickle batteries\",\"Alkaline\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Li-ion batteries are highly sensitive to over-voltage and require a strict CC-CV profile managed by a Battery Management System (BMS).\",\"eh\":\"\"},{\"n\":53,\"d\":\"\",\"se\":\"In optical fibre testing, the physical phenomenon of 'backscattering' is utilized primarily by which instrument?\",\"sh\":\"\",\"oe\":[\"OTDR (Optical Time Domain Reflectometer)\",\"Fusion Splicer\",\"Visual Fault Locator (VFL)\",\"Media Converter\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"The OTDR reads the Rayleigh backscattered light to map the attenuation and events along the entire length of the fibre.\",\"eh\":\"\"},{\"n\":54,\"d\":\"\",\"se\":\"What is the maximum data rate supported by a fully compliant CAT-6 UTP cable when run at its maximum specified length of 100 meters?\",\"sh\":\"\",\"oe\":[\"100 Mbps\",\"1 Gbps\",\"10 Gbps\",\"40 Gbps\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"CAT-6 supports 10 Gbps only up to 55 meters. For a full 100-meter run, it guarantees 1 Gbps (1000Base-T) performance.\",\"eh\":\"\"},{\"n\":55,\"d\":\"\",\"se\":\"Which of the following high-voltage testing instruments is specifically designed to measure the insulation resistance of power and telecom cables?\",\"sh\":\"\",\"oe\":[\"Megger (Megohmmeter)\",\"Standard Digital Multimeter\",\"Oscilloscope\",\"Spectrum Analyser\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"A Megger generates high DC voltage (e.g., 500V or 1000V) to push current through the cable insulation and measure leakage resistance in Mega-ohms.\",\"eh\":\"\"},{\"n\":56,\"d\":\"\",\"se\":\"Image-based: A technician is terminating a standard 25-pair telecom cable. The first pair is Blue/White. According to the industry standard colour code, what is the second pair?\",\"sh\":\"\",\"oe\":[\"Orange/White\",\"Green/White\",\"Brown/White\",\"Slate/White\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"The primary telecom colour code sequence is: Blue, Orange, Green, Brown, Slate.\",\"eh\":\"\"},{\"n\":57,\"d\":\"\",\"se\":\"What is the critical function of a 'Surge Protection Device' (SPD) installed in an electrical panel?\",\"sh\":\"\",\"oe\":[\"To clamp and divert high-voltage transient spikes safely to earth\",\"To continually regulate and stabilize low AC voltages\",\"To convert incoming AC power into DC\",\"To filter out harmonic audio noise\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"SPDs protect sensitive electronics by instantly shunting massive, brief over-voltages (like distant lightning strikes) to ground.\",\"eh\":\"\"},{\"n\":58,\"d\":\"\",\"se\":\"In computer networking, what does the acronym NAT stand for?\",\"sh\":\"\",\"oe\":[\"Network Address Translation\",\"Network Access Table\",\"Node Address Translation\",\"Network Authentication Token\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"NAT is configured on routers to translate multiple private IP addresses on a local network into a single public IP address for internet access.\",\"eh\":\"\"},{\"n\":59,\"d\":\"\",\"se\":\"What is the decimal number equivalent of the 4-bit binary number 1101?\",\"sh\":\"\",\"oe\":[\"11\",\"13\",\"14\",\"15\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"(1 × 2³) + (1 × 2²) + (0 × 2¹) + (1 × 2⁰) = 8 + 4 + 0 + 1 = 13.\",\"eh\":\"\"},{\"n\":60,\"d\":\"\",\"se\":\"Which type of standardized connector and cable is used to connect a home ADSL/VDSL broadband modem to the telephone wall jack?\",\"sh\":\"\",\"oe\":[\"RJ-45 CAT-6 cable\",\"RJ-11 telephone cable\",\"RG-6 Coaxial cable\",\"LC Fibre optic\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"RJ-11 is the global standard connector used for unshielded twisted-pair telephone lines delivering DSL broadband.\",\"eh\":\"\"},{\"n\":61,\"d\":\"\",\"se\":\"What is the missing number in the sequence? 3, 10, 21, 36, ?\",\"sh\":\"अनुक्रम (Sequence) में लुप्त संख्या क्या है? 3, 10, 21, 36, ?\",\"oe\":[\"45\",\"48\",\"52\",\"55\"],\"oh\":[\"45\",\"48\",\"52\",\"55\"],\"a\":3,\"ee\":\"The differences between numbers are 7, 11, 15... The differences are increasing by 4. Next difference is 19. 36 + 19 = 55.\",\"eh\":\"संख्याओं के बीच का अंतर 7, 11, 15... है। अगला अंतर 19 होगा। 36 + 19 = 55.\"},{\"n\":62,\"d\":\"\",\"se\":\"A certain sum of money amounts to ₹7200 in 2 years at 10% per annum simple interest. What is the principal amount?\",\"sh\":\"कोई धनराशि 10% प्रति वर्ष साधारण ब्याज (Simple Interest) की दर से 2 वर्षों में ₹7200 हो जाती है। मूलधन (Principal) क्या है?\",\"oe\":[\"₹6000\",\"₹6200\",\"₹6400\",\"₹6800\"],\"oh\":[\"₹6000\",\"₹6200\",\"₹6400\",\"₹6800\"],\"a\":0,\"ee\":\"Amount = Principal + (P × R × T) / 100. Let P be Principal. 7200 = P + (P × 10 × 2)/100 = 1.2P. P = 7200 / 1.2 = ₹6000.\",\"eh\":\"7200 = P + (P × 10 × 2)/100 = 1.2P. P = 7200 / 1.2 = ₹6000.\"},{\"n\":63,\"d\":\"\",\"se\":\"If A is the brother of B, C is the sister of B, and D is the mother of A, what is the relationship of D to C?\",\"sh\":\"यदि A, B का भाई है, C, B की बहन है, और D, A की माँ है, तो D का C से क्या संबंध है?\",\"oe\":[\"Mother\",\"Aunt\",\"Sister\",\"Grandmother\"],\"oh\":[\"माँ (Mother)\",\"चाची/बुआ (Aunt)\",\"बहन (Sister)\",\"दादी (Grandmother)\"],\"a\":0,\"ee\":\"Since A, B, and C are siblings, and D is the mother of A, D must be the mother of all three. Therefore, D is the mother of C.\",\"eh\":\"\"},{\"n\":64,\"d\":\"\",\"se\":\"Evaluate using BODMAS rules: 5 × (2 + 3) – 4\",\"sh\":\"BODMAS नियमों का उपयोग करके हल करें: 5 × (2 + 3) – 4\",\"oe\":[\"15\",\"21\",\"25\",\"29\"],\"oh\":[\"15\",\"21\",\"25\",\"29\"],\"a\":1,\"ee\":\"Brackets first (2+3 = 5). Multiply (5 × 5 = 25). Subtract (25 - 4 = 21).\",\"eh\":\"(2+3 = 5). 5 × 5 = 25. 25 - 4 = 21.\"},{\"n\":65,\"d\":\"\",\"se\":\"Find the odd one out in this series: 16, 25, 36, 49, 64, 81, 90\",\"sh\":\"\",\"oe\":[\"49\",\"64\",\"81\",\"90\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"All numbers except 90 are perfect squares (4², 5², 6², 7², 8², 9²).\",\"eh\":\"\"},{\"n\":66,\"d\":\"\",\"se\":\"In a certain code language, the word 'APPLE' is written as 'BQQMF'. Following the same logic, how is 'MANGO' coded?\",\"sh\":\"\",\"oe\":[\"NBOHP\",\"NBOHT\",\"NBOGP\",\"NCOHP\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Each letter is shifted exactly one position forward in the alphabet (+1). M-&gt;N, A-&gt;B, N-&gt;O, G-&gt;H, O-&gt;P.\",\"eh\":\"\"},{\"n\":67,\"d\":\"\",\"se\":\"In basic mathematics, what is the value of log₁₀(1000)?\",\"sh\":\"\",\"oe\":[\"1\",\"2\",\"3\",\"10\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"The base 10 logarithm of 1000 asks &quot;10 to what power equals 1000?&quot;. Since 10³ = 1000, the answer is 3.\",\"eh\":\"\"},{\"n\":68,\"d\":\"\",\"se\":\"If the circumference of a circle is exactly 44 cm, what is its radius? (Assume π = 22/7)\",\"sh\":\"\",\"oe\":[\"3.5 cm\",\"7.0 cm\",\"10.5 cm\",\"14.0 cm\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Circumference = 2πr. 44 = 2 × (22/7) × r. 44 = (44/7) × r. Therefore, r = 7 cm.\",\"eh\":\"\"},{\"n\":69,\"d\":\"\",\"se\":\"What is the mathematical probability of drawing a single Ace from a well-shuffled standard deck of 52 playing cards?\",\"sh\":\"\",\"oe\":[\"1/13\",\"1/26\",\"1/52\",\"1/4\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"There are 4 Aces in a deck of 52 cards. Probability = 4/52, which simplifies to 1/13.\",\"eh\":\"\"},{\"n\":70,\"d\":\"\",\"se\":\"If a team of 8 workers can complete a trenching task in 12 days, how many days will a reduced team of 6 workers take to do the exact same work?\",\"sh\":\"\",\"oe\":[\"9 days\",\"12 days\",\"16 days\",\"18 days\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Inverse proportion (Men × Days = Work). 8 × 12 = 96 man-days of work. For 6 workers: 96 / 6 = 16 days.\",\"eh\":\"\"},{\"n\":71,\"d\":\"\",\"se\":\"Identify the missing number in the sequence: 1, 8, 27, 64, ?, 216\",\"sh\":\"\",\"oe\":[\"100\",\"121\",\"125\",\"144\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"This is a sequence of cubes (1³, 2³, 3³, 4³). The missing number is 5³ = 125.\",\"eh\":\"\"},{\"n\":72,\"d\":\"\",\"se\":\"A shopkeeper offers a flat 20% discount on an electrical meter marked at ₹500. What is the final selling price?\",\"sh\":\"\",\"oe\":[\"₹350\",\"₹380\",\"₹400\",\"₹420\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Discount = 20% of 500 = 100. Selling Price = 500 - 100 = ₹400.\",\"eh\":\"\"},{\"n\":73,\"d\":\"\",\"se\":\"What is the exact difference between the fractions 3/4 and 2/3?\",\"sh\":\"\",\"oe\":[\"1/12\",\"1/6\",\"5/12\",\"7/12\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Convert to a common denominator (12). (9/12) - (8/12) = 1/12.\",\"eh\":\"\"},{\"n\":74,\"d\":\"\",\"se\":\"In a certain code, 'MOUSE' is coded as 'NPVTF'. What is the code for the word 'RAT'?\",\"sh\":\"\",\"oe\":[\"SBU\",\"SBT\",\"SAU\",\"RBU\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"The pattern shifts every letter forward by 1 (+1). R-&gt;S, A-&gt;B, T-&gt;U.\",\"eh\":\"\"},{\"n\":75,\"d\":\"\",\"se\":
