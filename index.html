/* Mobile first. Everything below is the phone layout; the two queries at the

:root{

  --grad:linear-gradient(135deg,var(--navy),var(--sage));
  --bg:#efe8db; --paper:#fbf9f4; --ink:#41474f; --muted:#81878d; --line:#e7dfd1;

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:10px}

.m{font-variant-numeric:tabular-nums;white-space:nowrap}
sub,sup{font-size:.68em;line-height:0}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
.top{position:sticky;top:0;z-index:60;background:var(--grad);box-shadow:var(--sh)}
.top-in{display:flex;align-items:center;gap:9px;height:54px;max-width:760px;margin:0 auto;padding:0 14px}

.stats>div{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:11px 10px}
.stats .v{font-size:19px;font-weight:800;line-height:1.1}

.tile{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--paper);

.tile small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}

.ring.part{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.ring.done{border-color:var(--green-line);color:var(--green);background:var(--green-bg)}
.bar{height:6px;border-radius:999px;background:var(--bg);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:999px}

  margin-bottom:9px;display:flex;align-items:center;gap:8px}
.qn .sp{flex:1}
.clk{font-weight:800;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.clk.warn{color:var(--amber)}.clk.crit{color:var(--red)}
.df{border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:9px;background:var(--bg)}
.stem{font-size:16.5px;font-weight:600;line-height:1.45;margin-bottom:14px}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.opts li{border:1.5px solid var(--line);border-radius:13px;background:var(--paper)}
.opts button{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:none;

.opts .tx{flex:1;font-size:15px;line-height:1.45}
.opts li.sel{border-color:var(--navy);background:var(--bg)}

.tri{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}

.tri .t1{--tc:var(--red-line);--tcb:var(--red-bg)}
.tri .t2{--tc:var(--amber-line);--tcb:var(--amber-bg)}
.tri .t3{--tc:var(--lav);--tcb:var(--lav-bg)}
.bn{background:var(--grad);color:#fff;border-radius:18px;padding:19px;margin-bottom:11px;
  position:relative;overflow:hidden;box-shadow:var(--sh)}
.bn::after{content:"";position:absolute;right:-40px;top:-48px;width:150px;height:150px;
  border-radius:50%;background:rgba(255,255,255,.15)}
.bn h2,.bn p,.bn .eb{position:relative;z-index:2}
.bn h2{margin:7px 0 6px;font-size:19px}
.bn p{margin:0;opacity:.93;font-size:13px}
.cdn{display:flex;gap:7px;margin-top:13px;position:relative;z-index:2}
.cdn div{background:rgba(255,255,255,.18);border-radius:11px;padding:8px 0;text-align:center;flex:1}

.cdn span{font-size:9.5px;opacity:.86;letter-spacing:.06em;text-transform:uppercase}
.warn{background:var(--red-bg);border:1px solid var(--red-line);border-radius:14px;padding:14px;
  font-size:13.5px;color:var(--red);line-height:1.5;margin-bottom:11px}
.warn b{display:block;margin-bottom:4px;font-weight:800}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:12px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(251,249,244,.97);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:9px 14px calc(9px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:760px;margin:0 auto;display:flex;gap:9px;align-items:center}
.dock .pg{font-size:11.5px;font-weight:800;color:var(--muted);flex:none}
.toast{position:fixed;left:14px;right:14px;bottom:84px;z-index:99;background:var(--ink);color:#fff;
  padding:12px 16px;border-radius:14px;font-size:13.5px;text-align:center;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:7px 6px 7px 0;border-bottom:1.5px solid var(--line)}
td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line)}
@media (min-width:620px){
  .stats{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
  .row{flex-direction:row}.row>.btn{flex:1}
  h1{font-size:28px} .card{padding:22px;border-radius:20px}
  .toast{left:50%;right:auto;transform:translateX(-50%);min-width:280px}

@media (min-width:900px){ .wrap{padding:0 18px} h1{font-size:30px} }
</style>

const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function pbkdf2(pw,saltHex){
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return hex(await crypto.subtle.deriveBits(
    {name:"PBKDF2",salt:unhex(saltHex),iterations:200000,hash:"SHA-256"},key,256));
}
/* Two kinds of credential live side by side: the original pair whose password
   is their mobile number, and the issued accounts whose password is a code.
   Both normalisations are tried, so neither group has to be told a rule. */
async function verify(id,pass){
  const u=USERS.find(x=>x.e===String(id||"").trim().toLowerCase());
  if(!u) return null;
  const raw=String(pass||"").trim();
  const digits=raw.replace(/\D/g,"").slice(-10);
  const code=raw.toUpperCase().replace(/[^A-Z0-9]/g,"");
  for(const cand of [digits.length===10?digits:null,code]){
    if(!cand) continue;
    if(await pbkdf2(cand,u.s)===u.h) return u;
  }
  return null;
}

const SUBJECTS=JSON.parse("[{\"id\":\"s01\",\"num\":1,\"name\":\"Electrical Fundamentals, Components and Measurement\",\"q\":[{\"n\":1,\"d\":\"E\",\"se\":\"The SI unit of electric current is:\",\"sh\":\"विद्युत धारा की SI इकाई है:\",\"oe\":[\"Volt\",\"Ampere\",\"Ohm\",\"Coulomb\"],\"oh\":[\"वोल्ट\",\"एम्पियर\",\"ओम\",\"कूलॉम\"],\"a\":1,\"ee\":\"Current is charge flow per unit time, <span class=\\\"m\\\">I=Q/t</span>, and its SI unit is ampere (A). Coulomb measures charge, volt measures potential difference and ohm measures resistance.\",\"eh\":\"धारा प्रति इकाई समय में प्रवाहित आवेश है; इसकी इकाई एम्पियर है।\"},{\"n\":2,\"d\":\"E\",\"se\":\"One volt is equal to:\",\"sh\":\"एक वोल्ट बराबर है:\",\"oe\":[\"One coulomb per joule\",\"One ampere per second\",\"One watt per ohm\",\"One joule per coulomb\"],\"oh\":[\"एक कूलॉम प्रति जूल\",\"एक एम्पियर प्रति सेकंड\",\"एक वाट प्रति ओम\",\"एक जूल प्रति कूलॉम\"],\"a\":3,\"ee\":\"Potential difference is work done per unit charge: <span class=\\\"m\\\">V=W/Q</span>. Therefore 1 V = 1 J/C.\",\"eh\":\"विभवांतर प्रति इकाई आवेश किया गया कार्य है; अतः 1 V = 1 J/C।\"},{\"n\":3,\"d\":\"E\",\"se\":\"A 6 Ω resistor is connected across 24 V. The current is:\",\"sh\":\"6 Ω प्रतिरोध को 24 V से जोड़ने पर धारा होगी:\",\"oe\":[\"4 A\",\"0.25 A\",\"18 A\",\"144 A\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"By Ohm's law, <span class=\\\"m\\\">I=V/R=24/6=4</span> A. The law applies when physical conditions, especially temperature, remain constant.\",\"eh\":\"ओम के नियम से धारा 4 A है, बशर्ते तापमान जैसी भौतिक दशाएँ स्थिर हों।\"},{\"n\":4,\"d\":\"E\",\"se\":\"A device draws 2 A at 10 V. Its resistance is:\",\"sh\":\"10 V पर 2 A लेने वाले उपकरण का प्रतिरोध है:\",\"oe\":[\"20 Ω\",\"12 Ω\",\"5 Ω\",\"0.2 Ω\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"<span class=\\\"m\\\">R=V/I=10/2=5</span> Ω. Multiplying V and I would give power, not resistance.\",\"eh\":\"<span class=\\\"m\\\">V/I</span> से प्रतिरोध 5 Ω मिलता है; <span class=\\\"m\\\">VI</span> शक्ति देता है।\"},{\"n\":5,\"d\":\"E\",\"se\":\"Which expression gives electrical power?\",\"sh\":\"विद्युत शक्ति का सही व्यंजक कौन-सा है?\",\"oe\":[\"<span class=\\\"m\\\">V/I</span>\",\"<span class=\\\"m\\\">Q/t</span>\",\"<span class=\\\"m\\\">VI</span>\",\"<span class=\\\"m\\\">R/I</span>\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Electrical power is <span class=\\\"m\\\">P=VI</span>. Using Ohm's law it may also be written <span class=\\\"m\\\">P=I<sup>2R</sup>=V<sup>2</sup>/R</span>.\",\"eh\":\"विद्युत शक्ति <span class=\\\"m\\\">VI</span> है; ओम के नियम से इसके अन्य रूप <span class=\\\"m\\\">I<sup>2R</sup></span> और <span class=\\\"m\\\">V<sup>2</sup>/R</span> हैं।\"},{\"n\":6,\"d\":\"E\",\"se\":\"A 60 W lamp operates for 12 hours. Energy consumed is:\",\"sh\":\"60 W का लैम्प 12 घंटे चले तो ऊर्जा खपत है:\",\"oe\":[\"0.72 kWh\",\"5 kWh\",\"72 kWh\",\"720 kWh\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Energy = power × time = 60 W × 12 h = 720 Wh = 0.72 kWh.\",\"eh\":\"ऊर्जा = शक्ति × समय = 0.72 kWh।\"},{\"n\":7,\"d\":\"E\",\"se\":\"One kilowatt-hour equals:\",\"sh\":\"एक किलोवाट-घंटा बराबर है:\",\"oe\":[\"1000 J\",\"3600 J\",\"36,000 J\",\"<span class=\\\"m\\\">3.6×10<sup>6</sup></span> J\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"<span class=\\\"m\\\">1 kWh=1000 W×3600 s=3.6×10<sup>6</sup></span> J. kWh is a unit of energy, not power.\",\"eh\":\"kWh ऊर्जा की इकाई है, शक्ति की नहीं।\"},{\"n\":8,\"d\":\"M\",\"se\":\"Resistance of a uniform conductor is given by:\",\"sh\":\"समान चालक का प्रतिरोध किससे दिया जाता है?\",\"oe\":[\"<span class=\\\"m\\\">R=ρ A/L</span>\",\"<span class=\\\"m\\\">R=ρ L/A</span>\",\"<span class=\\\"m\\\">R=L/ρ A</span>\",\"<span class=\\\"m\\\">R=ρ LA</span>\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"<span class=\\\"m\\\">R=ρ L/A</span>: resistance increases with length and resistivity, and decreases with cross-sectional area.\",\"eh\":\"प्रतिरोध लंबाई व प्रतिरोधकता के साथ बढ़ता और अनुप्रस्थ क्षेत्रफल के साथ घटत stance and area\",\"Equal to current density\",\"Reciprocal of resistance only\"],\"oh\":[\"प्रतिरोधकता का व्युत्क्रम\",\"प्रतिरोध और क्षेत्रफल का गुणनफल\",\"धारा घनत्व के बराबर\",\"केवल प्रतिरोध का व्युत्क्रम\"],\"a\":0,\"ee\":\"Conductivity is a material property and <span class=\\\"m\\\">σ=1/ρ</span>. Conductance <span class=\\\"m\\\">G=1/R</span> belongs to a particular component, so it must not be confused with conductivity.\",\"eh\":\"चालकता पदार्थ का गुण है; इसे चालकत्व <span class=\\\"m\\\">G=1/R</span> से न मिलाएँ।\"},{\"n\":13,\"d\":\"M\",\"se\":\"120 C of charge passes a point in 30 s. The current is:\",\"sh\":\"30 s में 120 C आवेश प्रवाहित हो तो धारा है:\",\"oe\":[\"4 A\",\"0.25 A\",\"90 A\",\"3600 A\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"<span class=\\\"m\\\">I=Q/t=120/30=4</span> A.\",\"eh\":\"धारा आवेश-प्रवाह की दर है, अतः 4 A।\"},{\"n\":14,\"d\":\"M\",\"se\":\"In a metal wire, conventional current direction is:\",\"sh\":\"धातु के तार में परंपरागत धारा की दिशा होती है:\",\"oe\":[\"Same as electron flow\",\"Random\",\"Opposite to electron flow\",\"Always from earth to phase\"],\"oh\":[\"इलेक्ट्रॉन प्रवाह के समान\",\"अनियमित\",\"इलेक्ट्रॉन प्रवाह के विपरीत\",\"सदैव अर्थ से फेज़\"],\"a\":2,\"ee\":\"Conventional current is defined from positive to negative, while electrons drift from negative to positive. Circuit laws use conventional current unless stated otherwise.\",\"eh\":\"परंपरागत धारा धन से ऋण की ओर और इलेक्ट्रॉन प्रवाह विपरीत दिशा में होता है।\"},{\"n\":15,\"d\":\"M\",\"se\":\"A 2 kW heater on 230 V draws approximately:\",\"sh\":\"230 V पर 2 kW हीटर लगभग कितनी धारा लेगा?\",\"oe\":[\"0.115 A\",\"8.70 A\",\"46 A\",\"460 A\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"For a resistive load, <span class=\\\"m\\\">I=P/V=2000/230=8.70</span> A.\",\"eh\":\"प्रतिरोधी भार के लिए <span class=\\\"m\\\">I=P/V</span>, अतः लगभग 8.70 A।\"},{\"n\":16,\"d\":\"M\",\"se\":\"A 10 Ω resistor carries 5 A. Power dissipated is:\",\"sh\":\"10 Ω प्रतिरोध में 5 A धारा हो तो शक्ति क्षय है:\",\"oe\":[\"2 W\",\"50 W\",\"500 W\",\"250 W\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"<span class=\\\"m\\\">P=I<sup>2R</sup>=5<sup>2</sup>×10=250</span> W.\",\"eh\":\"<span class=\\\"m\\\">I<sup>2R</sup></span> लगाने पर शक्ति 250 W है।\"},{\"n\":17,\"d\":\"H\",\"se\":\"In a single-phase circuit, a protective fuse should normally be placed in the:\",\"sh\":\"एकल-फेज़ परिपथ में सुरक्षा फ्यूज सामान्यतः कहाँ लगाया जाता है?\",\"oe\":[\"Earth conductor only\",\"Neutral and earth together\",\"Live/phase conductor\",\"Equipment chassis\"],\"oh\":[\"केवल अर्थ चालक\",\"न्यूट्रल और अर्थ दोनों में\",\"लाइव/फेज़ चालक\",\"उपकरण चेसिस\"],\"a\":2,\"ee\":\"The fuse must disconnect the live supply during overcurrent. A fuse only in neutral can leave internal parts live even after it opens; protective earth must not be fused.\",\"eh\":\"फ्यूज फेज़ में होना चाहिए; अर्थ को फ्यूज नहीं किया जाता।\"},{\"n\":18,\"d\":\"H\",\"se\":\"The main protective purpose of earthing exposed metal is to:\",\"sh\":\"खुले धातु भाग को अर्थ करने का मुख्य उद्देश्य है:\",\"oe\":[\"Increase normal load current\",\"Reduce supply frequency\",\"Replace insulation\",\"Provide a low-impedance fault path so protection operates\"],\"oh\":[\"सामान्य भार धारा बढ़ाना\",\"आपूर्ति आवृत्ति घटाना\",\"इन्सुलेशन का स्थान लेना\",\"कम-प्रतिबाधा दोष-पथ देना ताकि सुरक्षा यंत्र कार्य करे\"],\"a\":3,\"ee\":\"Earthing keeps accessible metal near earth potential and allows high fault current to operate the fuse/MCB quickly. It supplements, not replaces, insulation.\",\"eh\":\"अर्थिंग दोष धारा को सुरक्षित पथ देती है और फ्यूज/MCB को शीघ्र चलाती है।\"},{\"n\":19,\"d\":\"H\",\"se\":\"Which statement correctly distinguishes an MCB from a fuse?\",\"sh\":\"MCB और फ्यूज में सही अंतर कौन-सा है?\",\"oe\":[\"An MCB trips and can usually be reset; a fuse element melts and must be replaced\",\"A fuse protects against voltage only\",\"An MCB requires no current to operate\",\"A fuse is installed in the earth conductor\"],\"oh\":[\"MCB ट्रिप होकर रीसेट हो सकता है; फ्यूज तार पिघलकर बदलना पड़ता है\",\"फ्यूज केवल वोल्टेज से बचाता है\",\"MCB को संचालन हेतु धारा नहीं चाहिए\",\"फ्यूज अर्थ चालक में लगाया जाता है\"],\"a\":0,\"ee\":\"Both are overcurrent protective devices. Typical MCBs use thermal action for overload and magnetic action for high fault current; a fuse works by melting.\",\"eh\":\"दोनों अतिधारा सुरक्षा यंत्र हैं; MCB ट्रिप करता है, फ्यूज पिघलता है।\"},{\"n\":20,\"d\":\"H\",\"se\":\"A 100 Ω resistor is continuously connected across 12 V. The most suitable minimum standard power rating is:\",\"sh\":\"100 Ω प्रतिरोध को लगातार 12 V पर जोड़ने के लिए न्यूनतम उपयुक्त मानक शक्ति रेटिंग है:\",\"oe\":[\"0.25 W\",\"2 W\",\"0.5 W\",\"1 W\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"<span class=\\\"m\\\">P=V<sup>2</sup>/R=144/100=1.44</span> W. The rating must exceed actual dissipation, so 2 W is the smallest suitable listed value; design margin may require more.\",\"eh\":\"वास्तविक क्षय 1.44 W है, इसलिए 2 W उपयुक्त न्यूनतम विकल्प है।\"},{\"n\":21,\"d\":\"H\",\"se\":\"Before measuring resistance inside equipment, the safest first action is to:\",\"sh\":\"उपकरण के भीतर प्रतिरोध मापने से पहले सबसे सुरक्षित प्रथम कार्य है:\",\"oe\":[\"Isolate the supply, verify absence of voltage, and discharge stored energy\",\"Select the lowest ohm range while energized\",\"Short phase to neutral\",\"Remove protective earth\"],\"oh\":[\"आपूर्ति अलग करें, वोल्टेज अनुपस्थिति जाँचें और संचित ऊर्जा हटाएँ\",\"चालू अवस्था में न्यूनतम ओम रेंज चुनें\",\"फेज़ को न्यूट्रल से शॉर्ट करें\",\"सुरक्षा अर्थ हटाएँ\"],\"a\":0,\"ee\":\"An ohmmeter applies its own test source; external voltage can injure the worker and damage the meter. Capacitors may remain charged after power-off, so verified isolation and discharge are essential.\",\"eh\":\"ओममीटर अपना परीक्षण स्रोत देता है; इसलिए सप्लाई अलग और संचित आवेश हटाना अनिवार्य है।\"},{\"n\":22,\"d\":\"E\",\"se\":\"Resistors 2 Ω, 3 Ω and 5 Ω in series have equivalent resistance:\",\"sh\":\"2 Ω, 3 Ω और 5 Ω श्रेणीक्रम में हों तो तुल्य प्रतिरोध है:\",\"oe\":[\"1 Ω\",\"5 Ω\",\"10 Ω\",\"30 Ω\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Series resistances add directly: <span class=\\\"m\\\">R<sub>T</sub>=2+3+5=10</span> Ω.\",\"eh\":\"श्रेणीक्रम में प्रतिरोध सीधे जुड़ते हैं।\"},{\"n\":23,\"d\":\"E\",\"se\":\"The equivalent of 6 Ω in parallel with 3 Ω is:\",\"sh\":\"6 Ω और 3 Ω समानांतर का तुल्य प्रतिरोध है:\",\"oe\":[\"9 Ω\",\"4.5 Ω\",\"3 Ω\",\"2 Ω\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"<span class=\\\"m\\\">R<sub>T</sub>=R<sub>1R</sub><sub>2</sub>/(R<sub>1</sub>+R<sub>2</sub>=18/9=2</span> Ω. A parallel equivalent is always smaller than the smallest branch resistance.\",\"eh\":\"समानांतर तुल्य प्रतिरोध सबसे छोटे शाखा प्रतिरोध से भी कम होता है।\"},{\"n\":24,\"d\":\"E\",\"se\":\"Three equal 12 Ω resistors connected in parallel give:\",\"sh\":\"तीन समान 12 Ω प्रतिरोध समानांतर में देंगें:\",\"oe\":[\"36 Ω\",\"4 Ω\",\"12 Ω\",\"144 Ω\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"For n equal parallel resistors, <span class=\\\"m\\\">R<sub>T</sub>=R/n=12/3=4</span> Ω.\",\"eh\":\"समान प्रतिरोधों के लिए तुल्य प्रतिरोध <span class=\\\"m\\\">R/n</span> होता है।\"},{\"n\":25,\"d\":\"E\",\"se\":\"Which quantity is the same through all elements of a series circuit?\",\"sh\":\"श्रेणी परिपथ के सभी अवयवों में कौन-सी राशि समान रहती है?\",\"oe\":[\"Voltage\",\"Power\",\"Resistance\",\"Current\"],\"oh\":[\"वोल्टेज\",\"शक्ति\",\"प्रतिरोध\",\"धारा\"],\"a\":3,\"ee\":\"A series path has no junction, so the same current flows through every element; voltages divide.\",\"eh\":\"श्रेणी पथ में शाखा नहीं होती, अतः धारा समान और वोल्टेज विभाजित होता है।\"},{\"n\":26,\"d\":\"M\",\"se\":\"Which quantity is the same across all branches of an ideal parallel circuit?\",\"sh\":\"आदर्श समानांतर परिपथ की सभी शाखाओं पर कौन-सी राशि समान रहती है?\",\"oe\":[\"Voltage\",\"Current\",\"Power\",\"Resistance\"],\"oh\":[\"वोल्टेज\",\"धारा\",\"शक्ति\",\"प्रतिरोध\"],\"a\":0,\"ee\":\"All parallel branches share the same two nodes, so their voltage is identical; branch currents depend on resistance.\",\"eh\":\"समानांतर शाखाएँ समान दो नोडों से जुड़ी होती हैं, इसलिए वोल्टेज समान होता है।\"},{\"n\":27,\"d\":\"M\",\"se\":\"A 2 kΩ and 4 kΩ divider is across 12 V. Output across the 4 kΩ resistor is:\",\"sh\":\"2 kΩ और 4 kΩ विभाजक 12 V पर है। 4 kΩ पर आउटपुट है:\",\"oe\":[\"4 V\",\"8 V\",\"6 V\",\"12 V\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"<span class=\\\"m\\\">V<sub>o</sub>=12×4/(2+4)=8</span> V. The calculation assumes the output is unloaded.\",\"eh\":\"बिना भार वाले वोल्टेज विभाजक का आउटपुट 8 V है।\"},{\"n\":28,\"d\":\"M\",\"se\":\"6 A enters two parallel branches of 2 Ω and 4 Ω. Current in the 2 Ω branch is:\",\"sh\":\"6 A धारा 2 Ω और 4 Ω की समानांतर शाखाओं में बँटती है। 2 Ω शाखा की धारा है:\",\"oe\":[\"1 A\",\"2 A\",\"4 A\",\"6 A\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Current divides inversely with resistance: <span class=\\\"m\\\">I<sub>2</sub>Ω=6×4/(2+4)=4</span> A. The lower-resistance branch carries more current.\",\"eh\":\"कम प्रतिरोध शाखा अधिक धारा लेती है।\"},{\"n\":29,\"d\":\"M\",\"se\":\"At a junction, 3 A and 5 A enter. If 2 A leaves through one branch, the other leaving current is:\",\"sh\":\"एक संधि में 3 A और 5 A प्रवेश करते हैं। एक शाखा से 2 A निकलता है, तो दूसरी से धारा है:\",\"oe\":[\"2 A\",\"6 A\",\"8 A\",\"10 A\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"KCL gives total entering = total leaving: 3+5=2+I, hence I=6 A.\",\"eh\":\"KCL के अनुसार प्रवेश करने वाली कुल धारा निकलने वाली कुल धारा के बराबर है।\"},{\"n\":30,\"d\":\"M\",\"se\":\"Kirchhoff's Voltage Law states that in a closed loop:\",\"sh\":\"किर्चॉफ वोल्टेज नियम के अनुसार बंद लूप में:\",\"oe\":[\"All currents are equal\",\"Resistance is zero\",\"Power is always zero\",\"Algebraic sum of voltage rises and drops is zero\"],\"oh\":[\"सभी धाराएँ समान हैं\",\"प्रतिरोध शून्य है\",\"शक्ति सदैव शून्य है\",\"वोल्टेज वृद्धि और पतन का बीजीय योग शून्य है\"],\"a\":3,\"ee\":\"KVL follows energy conservation: after one complete loop, the net potential change is zero. Sign consistency is essential.\",\"eh\":\"KVL ऊर्जा संरक्षण पर आधारित है; पूरे लूप में शुद्ध विभव परिवर्तन शून्य होता है।\"},{\"n\":31,\"d\":\"M\",\"se\":\"A 12 V source feeds 2 Ω and 4 Ω in series. Voltage across 4 Ω is:\",\"sh\":\"12 V स्रोत से 2 Ω और 4 Ω श्रेणीक्रम में जुड़े हैं। 4 Ω पर वोल्टेज है:\",\"oe\":[\"2 V\",\"4 V\",\"8 V\",\"12 V\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Total resistance is 6 Ω, current is 2 A, so <span class=\\\"m\\\">V<sub>4</sub>Ω=2×4=8</span> V. The other resistor drops 4 V; drops sum to 12 V.\",\"eh\":\"कुल धारा 2 A और 4 Ω पर पतन 8 V है।\"},{\"n\":32,\"d\":\"M\",\"se\":\"An open circuit in a simple series path normally causes:\",\"sh\":\"सरल श्रेणी पथ में खुला परिपथ सामान्यतः क्या करता है?\",\"oe\":[\"Current becomes zero\",\"Current becomes infinite\",\"Supply frequency doubles\",\"Resistance becomes zero\"],\"oh\":[\"धारा शून्य हो जाती है\",\"धारा अनंत हो जाती है\",\"आवृत्ति दोगुनी होती है\",\"प्रतिरोध शून्य होता है\"],\"a\":0,\"ee\":\"An open path has effectively very high resistance, so continuous current stops. Voltage may still appear across the open points.\",\"eh\":\"खुले पथ का प्रतिरोध बहुत अधिक होता है; धारा रुकती है पर खुले सिरों पर वोल्टेज हो सकता है।\"},{\"n\":33,\"d\":\"H\",\"se\":\"An ideal short circuit placed directly across a voltage source tends to produce:\",\"sh\":\"वोल्टेज स्रोत के सीधे समानांतर आदर्श शॉर्ट सर्किट लगाने पर सामान्यतः:\",\"oe\":[\"Zero current\",\"Normal rated current only\",\"Very large current limited by source and wiring resistance\",\"Zero terminal voltage with no heating\"],\"oh\":[\"शून्य धारा\",\"केवल सामान्य धारा\",\"स्रोत व तार प्रतिरोध से सीमित बहुत बड़ी धारा\",\"बिना ऊष्मा के शून्य वोल्टेज\"],\"a\":2,\"ee\":\"A short has near-zero resistance; actual current is limited by internal and wiring impedance and can cause intense heating/arc, so protection must operate.\",\"eh\":\"शॉर्ट का प्रतिरोध लगभग शून्य होता है, इसलिए अत्यधिक दोष धारा बह सकती है।\"},{\"n\":34,\"d\":\"H\",\"se\":\"A 12 V source with 1 Ω internal resistance supplies a 5 Ω load. Current is:\",\"sh\":\"12 V स्रोत का आंतरिक प्रतिरोध 1 Ω और भार 5 Ω है। धारा है:\",\"oe\":[\"12 A\",\"2 A\",\"2.4 A\",\"0.5 A\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Total series resistance is 1+5=6 Ω, hence <span class=\\\"m\\\">I=12/6=2</span> A. The load terminal voltage is 10 V, not 12 V.\",\"eh\":\"आंतरिक प्रतिरोध के कारण भार वोल्टेज 10 V रह जाता है।\"},{\"n\":35,\"d\":\"H\",\"se\":\"Two 5 kΩ resistors form a 10 V divider. A 5 kΩ voltmeter is connected across the lower resistor. The indicated voltage is approximately:\",\"sh\":\"10 V पर दो 5 kΩ प्रतिरोधों का विभाजक है। निचले प्रतिरोध के समानांतर 5 kΩ वोल्टमीटर जोड़ने पर रीडिंग लगभग है:\",\"oe\":[\"3.33 V\",\"5 V\",\"6.67 V\",\"10 V\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Lower 5 kΩ || meter 5 kΩ = 2.5 kΩ. Thus <span class=\\\"m\\\">V<sub>o</sub>=10×2.5/(5+2.5)=3.33</span> V. This is loading error.\",\"eh\":\"मीटर का सीमित इनपुट प्रतिरोध विभाजक को लोड कर रीडिंग घटाता है।\"},{\"n\":36,\"d\":\"H\",\"se\":\"For a Wheatstone bridge with arms <span class=\\\"m\\\">R<sub>1</sub>,R<sub>2</sub>,R<sub>3</sub>,R<sub>4</sub></span>, the balance condition is:\",\"sh\":\"व्हीटस्टोन ब्रिज की संतुलन शर्त है:\",\"oe\":[\"<span class=\\\"m\\\">R<sub>1</sub>+R<sub>2</sub>=R<sub>3</sub>+R<sub>4</sub></span>\",\"<span class=\\\"m\\\">R<sub>1R</sub><sub>2</sub>=R<sub>3R</sub><sub>4</sub></span>\",\"All four resistors must be equal\",\"<span class=\\\"m\\\">R<sub>1</sub>/R<sub>2</sub>=R<sub>3</sub>/R<sub>4</sub></span>\"],\"oh\":[\"\",\"\",\"चारों प्रतिरोध समान हों\",\"\"],\"a\":3,\"ee\":\"At balance, detector current is zero and opposite midpoint potentials are equal, giving the resistance-ratio condition. All four arms need not be equal.\",\"eh\":\"संतुलन पर डिटेक्टर धारा शून्य और अनुपात समान होता है।\"},{\"n\":37,\"d\":\"H\",\"se\":\"For maximum power transfer from a linear DC network, the load resistance should equal:\",\"sh\":\"रैखिक DC नेटवर्क से अधिकतम शक्ति हस्तांतरण हेतु भार प्रतिरोध बराबर होना चाहिए:\",\"oe\":[\"Zero\",\"Thevenin resistance seen by the load\",\"Twice the source voltage\",\"Infinite resistance\"],\"oh\":[\"शून्य\",\"भार से दिखने वाला थेवेनिन प्रतिरोध\",\"स्रोत वोल्टेज का दोगुना\",\"अनंत प्रतिरोध\"],\"a\":1,\"ee\":\"Maximum load power occurs when <span class=\\\"m\\\">R<sub>L</sub>=R<sub>Th</sub></span>. Efficiency is then only 50%, so this is not the usual condition for efficient power systems.\",\"eh\":\"अधिकतम शक्ति पर भार और थेवेनिन प्रतिरोध समान होते हैं, पर दक्षता 50% होती है।\"},{\"n\":38,\"d\":\"E\",\"se\":\"The time period of a 50 Hz waveform is:\",\"sh\":\"50 Hz तरंग का आवर्तकाल है:\",\"oe\":[\"20 ms\",\"50 ms\",\"0.5 s\",\"50 s\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"<span class=\\\"m\\\">T=1/f=1/50=0.02</span> s = 20 ms.\",\"eh\":\"आवर्तकाल आवृत्ति का व्युत्क्रम है।\"},{\"n\":39,\"d\":\"E\",\"se\":\"A 1 kHz signal has a period of:\",\"sh\":\"1 kHz संकेत का आवर्तकाल है:\",\"oe\":[\"1 s\",\"100 ms\",\"10 ms\",\"1 ms\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"<span class=\\\"m\\\">T=1/1000</span> s = 0.001 s = 1 ms.\",\"eh\":\"1 kHz का एक चक्र 1 ms में पूरा होता है।\"},{\"n\":40,\"d\":\"E\",\"se\":\"A sine wave has a peak value of 325 V. Its RMS value is approximately:\",\"sh\":\"ज्यावक्रीय तरंग का शिखर 325 V है। RMS मान लगभग है:\",\"oe\":[\"460 V\",\"325 V\",\"230 V\",\"162.5 V\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"For a sine wave, <span class=\\\"m\\\">V<sub>rms</sub>=V<sub>m</sub>/\\\\sqrt2=0.707V<sub>m</sub>≈230</span> V. RMS is the equivalent DC heating value.\",\"eh\":\"RMS समान ऊष्मीय प्रभाव वाला DC मान है।\"},{\"n\":41,\"d\":\"E\",\"se\":\"A 230 V AC nameplate value denotes RMS for a sinusoidal supply. The insulation experiences a positive peak of approximately:\",\"sh\":\"ज्यावक्रीय आपूर्ति में 230 V AC नेमप्लेट मान RMS दर्शाता है। इन्सुलेशन पर लगभग कितना धनात्मक शिखर आता है?\",\"oe\":[\"115 V\",\"230 V\",\"260 V\",\"325 V\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"<span class=\\\"m\\\">V<sub>m</sub>=\\\\sqrt2V<sub>rms</sub>=1.414×230≈325</span> V.\",\"eh\":\"शिखर मान RMS का लगभग 1.414 गुना है।\"},{\"n\":42,\"d\":\"E\",\"se\":\"The average value of an ideal sine wave over one complete cycle is:\",\"sh\":\"आदर्श ज्यावक्रीय तरंग का पूरे चक्र पर औसत मान है:\",\"oe\":[\"0.707 of peak\",\"Zero\",\"0.637 of peak\",\"Equal to peak\"],\"oh\":[\"शिखर का 0.707\",\"शून्य\",\"शिखर का 0.637\",\"शिखर के बराबर\"],\"a\":1,\"ee\":\"Positive and negative half-cycles cancel over a full cycle. The often-used 0.637 peak is the average of a rectified sine or one half-cycle.\",\"eh\":\"पूर्ण चक्र का औसत शून्य; 0.637 शिखर रेक्टिफाइड/अर्धचक्र औसत है।\"},{\"n\":43,\"d\":\"M\",\"se\":\"The form factor of a sine wave is approximately:\",\"sh\":\"ज्यावक्रीय तरंग का रूप गुणक लगभग है:\",\"oe\":[\"1.11\",\"0.707\",\"1.414\",\"0.637\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Form factor = RMS value\",\"eh\":\"average rectified value = 0.707/0.637 ≈ 1.11. / रूप गुणक RMS और रेक्टिफाइड औसत का अनुपात है।\"},{\"n\":44,\"d\":\"M\",\"se\":\"The crest (peak) factor of a sine wave is:\",\"sh\":\"ज्यावक्रीय तरंग का शिखर गुणक है:\",\"oe\":[\"0.637\",\"0.707\",\"1.414\",\"2.0\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Crest factor = peak/RMS = <span class=\\\"m\\\">\\\\sqrt2≈1.414</span>.\",\"eh\":\"शिखर गुणक = शिखर मान ÷ RMS मान।\"},{\"n\":45,\"d\":\"M\",\"se\":\"Angular frequency <span class=\\\"m\\\">ω</span> is related to frequency f by:\",\"sh\":\"कोणीय आवृत्ति <span class=\\\"m\\\">ω</span> और आवृत्ति f का संबंध है:\",\"oe\":[\"<span class=\\\"m\\\">ω=2π f</span>\",\"<span class=\\\"m\\\">ω=f/2π</span>\",\"<span class=\\\"m\\\">ω=1/f</span>\",\"<span class=\\\"m\\\">ω=π/f</span>\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"One cycle is <span class=\\\"m\\\">2π</span> radians, so <span class=\\\"m\\\">ω=2π f</span> rad/s.\",\"eh\":\"एक चक्र <span class=\\\"m\\\">2π</span> रेडियन है।\"},{\"n\":46,\"d\":\"M\",\"se\":\"Inductive reactance is:\",\"sh\":\"प्रेरक प्रतिघात है:\",\"oe\":[\"<span class=\\\"m\\\">1/2π fL</span>\",\"<span class=\\\"m\\\">2π L/f</span>\",\"<span class=\\\"m\\\">f/2π L</span>\",\"<span class=\\\"m\\\">2π fL</span>\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"<span class=\\\"m\\\">X<sub>L</sub>=2π fL</span> ohms; it increases with both frequency and inductance.\",\"eh\":\"प्रेरक प्रतिघात आवृत्ति और प्रेरकत्व के साथ बढ़ता है।\"},{\"n\":47,\"d\":\"M\",\"se\":\"Capacitive reactance is:\",\"sh\":\"धारिता प्रतिघात है:\",\"oe\":[\"<span class=\\\"m\\\">2π fC</span>\",\"<span class=\\\"m\\\">C/2π f</span>\",\"<span class=\\\"m\\\">1/2π fC</span>\",\"<span class=\\\"m\\\">2π C/f</span>\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"<span class=\\\"m\\\">X<sub>C</sub>=1/(2π fC)</span> ohms; it decreases as frequency or capacitance increases.\",\"eh\":\"धारिता प्रतिघात आवृत्ति या धारिता बढ़ने पर घटता है।\"},{\"n\":48,\"d\":\"M\",\"se\":\"If frequency doubles, ideal inductive reactance becomes:\",\"sh\":\"आवृत्ति दोगुनी होने पर आदर्श प्रेरक प्रतिघात होगा:\",\"oe\":[\"Half\",\"Double\",\"One-fourth\",\"Unchanged\"],\"oh\":[\"आधा\",\"दोगुना\",\"चौथाई\",\"अपरिवर्तित\"],\"a\":1,\"ee\":\"Since <span class=\\\"m\\\">X<sub>L</sub>=2π fL</span>, <span class=\\\"m\\\">X<sub>L</sub></span> is directly proportional to frequency.\",\"eh\":\"प्रेरक प्रतिघात आवृत्ति के सीधे अनुपाती है।\"},{\"n\":49,\"d\":\"M\",\"se\":\"If frequency doubles, ideal capacitive reactance becomes:\",\"sh\":\"आवृत्ति दोगुनी होने पर आदर्श धारिता प्रतिघात होगा:\",\"oe\":[\"Double\",\"Four times\",\"Half\",\"Unchanged\"],\"oh\":[\"दोगुना\",\"चार गुना\",\"आधा\",\"अपरिवर्तित\"],\"a\":2,\"ee\":\"<span class=\\\"m\\\">X<sub>C</sub>\\\\propto1/f</span>, so doubling f halves <span class=\\\"m\\\">X<sub>C</sub></span>. This is why capacitors pass higher-frequency signals more readily.\",\"eh\":\"आवृत्ति दोगुनी होने पर धारिता प्रतिघात आधा होता है।\"},{\"n\":50,\"d\":\"H\",\"se\":\"In a purely inductive AC circuit, current:\",\"sh\":\"शुद्ध प्रेरक AC परिपथ में धारा:\",\"oe\":[\"Lags voltage by 90°\",\"Leads voltage by 90°\",\"Is in phase\",\"Is zero at all times\"],\"oh\":[\"वोल्टेज से 90° पीछे रहती है\",\"वोल्टेज से 90° आगे रहती है\",\"समान कला में रहती है\",\"सदैव शून्य रहती है\"],\"a\":0,\"ee\":\"For an ideal inductor, voltage leads current by 90°, equivalently current lags voltage by 90° (&ldquo;ELI&rdquo;).\",\"eh\":\"आदर्श प्रेरक में धारा वोल्टेज से 90° पीछे रहती है।\"},{\"n\":51,\"d\":\"H\",\"se\":\"In a purely capacitive AC circuit, current:\",\"sh\":\"शुद्ध धारिता AC परिपथ में धारा:\",\"oe\":[\"Lags voltage by 90°\",\"Leads voltage by 90°\",\"Is in phase with voltage\",\"Has twice the voltage frequency\"],\"oh\":[\"वोल्टेज से 90° पीछे रहती है\",\"वोल्टेज से 90° आगे रहती है\",\"वोल्टेज के समान कला में रहती है\",\"वोल्टेज की दोगुनी आवृत्ति होती है\"],\"a\":1,\"ee\":\"For an ideal capacitor, current leads voltage by 90° (&ldquo;ICE&rdquo;). Real components also contain resistance and losses, so exact phase may differ.\",\"eh\":\"आदर्श संधारित्र में धारा वोल्टेज से 90° आगे रहती है।\"},{\"n\":52,\"d\":\"H\",\"se\":\"A series RL circuit has R = 3 Ω and <span class=\\\"m\\\">X<sub>L</sub>=4</span> Ω. Its impedance magnitude is:\",\"sh\":\"श्रेणी RL परिपथ में R = 3 Ω और <span class=\\\"m\\\">X<sub>L</sub>=4</span> Ω है। प्रतिबाधा का परिमाण है:\",\"oe\":[\"1 Ω\",\"7 Ω\",\"12 Ω\",\"5 Ω\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Resistance and reactance are perpendicular phasor components: <span class=\\\"m\\\">|Z|=√(R<sup>2</sup>+X<sub>L</sub><sup>2</sup>=√(9+16)=5</span> Ω, not their simple sum.\",\"eh\":\"प्रतिरोध और प्रतिघात का फेजर योग लेने पर 5 Ω मिलता है।\"},{\"n\":53,\"d\":\"H\",\"se\":\"A single-phase load takes 10 A from 230 V at 0.8 power factor. Real power is:\",\"sh\":\"230 V पर 10 A और 0.8 शक्ति गुणक वाले एकल-फेज़ भार की वास्तविक शक्ति है:\",\"oe\":[\"1840 W\",\"2300 W\",\"2875 W\",\"184 W\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"<span class=\\\"m\\\">P=VI\\\\cosφ=230×10×0.8=1840</span> W. Apparent power is 2300 VA; the two are equal only at unity power factor.\",\"eh\":\"वास्तविक शक्ति 1840 W और प्रतीयमान शक्ति 2300 VA है।\"},{\"n\":54,\"d\":\"E\",\"se\":\"A four-band resistor marked brown-black-red-gold is:\",\"sh\":\"भूरा-काला-लाल-सुनहरा चार-पट्टी प्रतिरोध है:\",\"oe\":[\"100 Ω ±5%\",\"1 kΩ ±5%\",\"10 kΩ ±10%\",\"1 MΩ ±5%\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Brown=1, black=0, red multiplier <span class=\\\"m\\\">10<sup>2</sup></span>: 10×100=1000 Ω=1 kΩ; gold tolerance is ±5%.\",\"eh\":\"प्रथम दो पट्टियाँ अंक, तीसरी गुणक और चौथी सह्यता है।\"},{\"n\":55,\"d\":\"E\",\"se\":\"Which four-band code represents 4.7 kΩ ±10%?\",\"sh\":\"4.7 kΩ ±10% का चार-पट्टी रंग कोड है:\",\"oe\":[\"Yellow-violet-orange-silver\",\"Green-blue-red-gold\",\"Yellow-violet-red-silver\",\"Violet-yellow-red-gold\"],\"oh\":[\"पीला-बैंगनी-नारंगी-रजत\",\"हरा-नीला-लाल-सुनहरा\",\"पीला-बैंगनी-लाल-रजत\",\"बैंगनी-पीला-लाल-सुनहरा\"],\"a\":2,\"ee\":\"Yellow=4, violet=7, red multiplier <span class=\\\"m\\\">10<sup>2</sup></span>, giving 4700 Ω; silver is ±10%.\",\"eh\":\"47×100 = 4700 Ω और रजत सह्यता ±10% है।\"},{\"n\":56,\"d\":\"E\",\"se\":\"Gold as the tolerance band means:\",\"sh\":\"सह्यता पट्टी के रूप में सुनहरा रंग दर्शाता है:\",\"oe\":[\"±1%\",\"±2%\",\"±10%\",\"±5%\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Gold is ±5%; silver is ±10%; no tolerance band traditionally means ±20%.\",\"eh\":\"सुनहरा ±5%, रजत ±10% और बिना पट्टी सामान्यतः ±20% है।\"},{\"n\":57,\"d\":\"E\",\"se\":\"Which statement about a fixed carbon-film resistor is correct?\",\"sh\":\"स्थिर कार्बन-फिल्म प्रतिरोध के बारे में सही कथन है:\",\"oe\":[\"It is normally non-polarized\",\"It stores charge like a battery\",\"It passes current in one direction only\",\"Its unit is henry\"],\"oh\":[\"यह सामान्यतः अध्रुवित होता है\",\"यह बैटरी की तरह आवेश संचित करता है\",\"यह केवल एक दिशा में धारा देता है\",\"इसकी इकाई हेनरी है\"],\"a\":0,\"ee\":\"A resistor can normally be connected either way. Polarity matters for devices such as diodes and polarized electrolytic capacitors, not ordinary fixed resistors.\",\"eh\":\"सामान्य स्थिर प्रतिरोध की दिशा नहीं होती।\"},{\"n\":58,\"d\":\"E\",\"se\":\"A visibly burnt resistor most commonly fails:\",\"sh\":\"दिखाई देने वाला जला प्रतिरोध सामान्यतः किस प्रकार विफल होता है?\",\"oe\":[\"As a perfect capacitor\",\"Open or greatly increased in resistance\",\"By generating AC\",\"With exactly half its marked value\"],\"oh\":[\"पूर्ण संधारित्र की तरह\",\"खुला या बहुत अधिक प्रतिरोध\",\"AC उत्पन्न करके\",\"ठीक आधे मान पर\"],\"a\":1,\"ee\":\"Overheating can crack/burn the resistive element, producing an open circuit or a high/drifted value. Diagnose with power isolated; visible condition alone is not a complete test.\",\"eh\":\"अधिक ताप से प्रतिरोधी तत्व खुल सकता है या मान बहुत बढ़ सकता है।\"},{\"n\":59,\"d\":\"E\",\"se\":\"A potentiometer used as a voltage divider normally uses:\",\"sh\":\"वोल्टेज विभाजक के रूप में पोटेंशियोमीटर सामान्यतः उपयोग करता है:\",\"oe\":[\"Only the two end terminals\",\"Its metal case and one terminal\",\"Both ends and the wiper\",\"No electrical terminal\"],\"oh\":[\"केवल दो अंतिम टर्मिनल\",\"केस और एक टर्मिनल\",\"दोनों सिरे और वाइपर\",\"कोई टर्मिनल नहीं\"],\"a\":2,\"ee\":\"The two ends connect across the supply and the wiper provides the adjustable fraction. Using only wiper plus one end makes a variable resistor (rheostat).\",\"eh\":\"तीनों टर्मिनल से वोल्टेज विभाजक; दो से परिवर्ती प्रतिरोध बनता है।\"},{\"n\":60,\"d\":\"M\",\"se\":\"The SI unit of capacitance is:\",\"sh\":\"धारिता की SI इकाई है:\",\"oe\":[\"Henry\",\"Weber\",\"Siemens\",\"Farad\"],\"oh\":[\"हेनरी\",\"वेबर\",\"सीमेंस\",\"फैरड\"],\"a\":3,\"ee\":\"Capacitance <span class=\\\"m\\\">C=Q/V</span>, so one farad stores one coulomb per volt. Henry is the unit of inductance.\",\"eh\":\"1 फैरड = 1 कूलॉम प्रति वोल्ट; हेनरी प्रेरकत्व की इकाई है।\"},{\"n\":61,\"d\":\"M\",\"se\":\"Capacitors connected in parallel have total capacitance equal to:\",\"sh\":\"समानांतर जुड़े संधारित्रों की कुल धारिता है:\",\"oe\":[\"The smallest capacitance\",\"Reciprocal sum only\",\"The sum of individual capacitances\",\"Zero\"],\"oh\":[\"सबसे छोटी धारिता\",\"केवल व्युत्क्रम योग\",\"सभी धारिताओं का योग\",\"शून्य\"],\"a\":2,\"ee\":\"Parallel capacitors share voltage and their charge capacities add: <span class=\\\"m\\\">C<sub>T</sub>=C<sub>1</sub>+C<sub>2</sub>+...</span>.\",\"eh\":\"समानांतर में वोल्टेज समान और कुल धारिता सीधे जुड़ती है।\"},{\"n\":62,\"d\":\"M\",\"se\":\"For capacitors in series:\",\"sh\":\"संधारित्रों के श्रेणी संयोजन में:\",\"oe\":[\"<span class=\\\"m\\\">1/C<sub>T</sub>=1/C<sub>1</sub>+1/C<sub>2</sub>+...</span>\",\"<span class=\\\"m\\\">C<sub>T</sub>=C<sub>1</sub>+C<sub>2</sub>+...</span>\",\"Total is greater than the largest\",\"Voltage is zero across each\"],\"oh\":[\"\",\"\",\"कुल सबसे बड़े से अधिक\",\"प्रत्येक पर वोल्टेज शून्य\"],\"a\":0,\"ee\":\"Series capacitors carry equal charge and their reciprocal capacitances add; total capacitance is less than the smallest unit.\",\"eh\":\"श्रेणी संयोजन की कुल धारिता सबसे छोटे संधारित्र से भी कम होती है।\"},{\"n\":63,\"d\":\"M\",\"se\":\"Two 10 µF capacitors in series give:\",\"sh\":\"दो 10 µF संधारित्र श्रेणी में देंगें:\",\"oe\":[\"20 µF\",\"10 µF\",\"100 µF\",\"5 µF\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Two equal series capacitors give <span class=\\\"m\\\">C/2=5</span> µF.\",\"eh\":\"दो समान श्रेणी संधारित्रों की कुल धारिता आधी होती है।\"},{\"n\":64,\"d\":\"M\",\"se\":\"After a long time on ideal DC, a fully charged capacitor behaves approximately as:\",\"sh\":\"आदर्श DC पर लंबे समय बाद पूर्ण आवेशित संधारित्र लगभग कैसा व्यवहार करता है?\",\"oe\":[\"Short circuit\",\"Open circuit\",\"Constant-current source\",\"Inductor\"],\"oh\":[\"शॉर्ट सर्किट\",\"खुला परिपथ\",\"स्थिर धारा स्रोत\",\"प्रेरक\"],\"a\":1,\"ee\":\"In steady DC, capacitor current <span class=\\\"m\\\">i=C dv/dt</span> becomes zero because voltage no longer changes. Real capacitors have small leakage.\",\"eh\":\"स्थिर DC में वोल्टेज परिवर्तन शून्य होने से धारा लगभग शून्य होती है।\"},{\"n\":65,\"d\":\"M\",\"se\":\"Which capacitor quantity cannot change instantaneously in an ideal circuit?\",\"sh\":\"आदर्श परिपथ में संधारित्र की कौन-सी राशि तत्काल नहीं बदल सकती?\",\"oe\":[\"Current\",\"Voltage\",\"Reactance\",\"Frequency\"],\"oh\":[\"धारा\",\"वोल्टेज\",\"प्रतिघात\",\"आवृत्ति\"],\"a\":1,\"ee\":\"Instantaneous capacitor-voltage change would require infinite current because <span class=\\\"m\\\">i=C dv/dt</span>. Inductor current, not its voltage, has the corresponding continuity rule.\",\"eh\":\"संधारित्र वोल्टेज तत्काल बदलने के लिए अनंत धारा चाहिए।\"},{\"n\":66,\"d\":\"M\",\"se\":\"A 10 kΩ resistor and 100 µF capacitor form an RC circuit. Its time constant is:\",\"sh\":\"10 kΩ और 100 µF के RC परिपथ का समय नियतांक है:\",\"oe\":[\"0.01 s\",\"0.1 s\",\"1 s\",\"10 s\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"<span class=\\\"m\\\">τ=RC=10,000×100×10<sup>-6</sup>=1</span> s. At one time constant a charging capacitor reaches about 63.2% of its final value.\",\"eh\":\"एक समय नियतांक पर वोल्टेज अंतिम मान का लगभग 63.2% होता है।\"},{\"n\":67,\"d\":\"M\",\"se\":\"Which inductor quantity cannot change instantaneously in an ideal circuit?\",\"sh\":\"आदर्श परिपथ में प्रेरक की कौन-सी राशि तत्काल नहीं बदल सकती?\",\"oe\":[\"Current\",\"Voltage\",\"Resistance\",\"Frequency\"],\"oh\":[\"धारा\",\"वोल्टेज\",\"प्रतिरोध\",\"आवृत्ति\"],\"a\":0,\"ee\":\"From <span class=\\\"m\\\">v=L di/dt</span>, an instantaneous current jump requires infinite voltage. Stored magnetic energy sustains current when switching occurs.\",\"eh\":\"प्रेरक धारा का तत्काल परिवर्तन अनंत वोल्टेज माँगेगा।\"},{\"n\":68,\"d\":\"M\",\"se\":\"The SI unit of inductance is:\",\"sh\":\"प्रेरकत्व की SI इकाई है:\",\"oe\":[\"Farad\",\"Tesla\",\"Ohm\",\"Henry\"],\"oh\":[\"फैरड\",\"टेस्ला\",\"ओम\",\"हेनरी\"],\"a\":3,\"ee\":\"Inductance is measured in henry (H); capacitance in farad and resistance in ohm.\",\"eh\":\"प्रेरकत्व हेनरी में मापा जाता है।\"},{\"n\":69,\"d\":\"M\",\"se\":\"An ideal transformer has 500 primary turns and 100 secondary turns. With 230 V on the primary, secondary voltage is:\",\"sh\":\"आदर्श ट्रांसफॉर्मर में प्राथमिक 500 और द्वितीयक 100 फेरे हैं। प्राथमिक पर 230 V हो तो द्वितीयक वोल्टेज है:\",\"oe\":[\"1150 V\",\"230 V\",\"92 V\",\"46 V\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"<span class=\\\"m\\\">V<sub>s</sub>/V<sub>p</sub>=N<sub>s</sub>/N<sub>p</sub>=100/500=0.2</span>, so <span class=\\\"m\\\">V<sub>s</sub>=46</span> V. It is a step-down transformer.\",\"eh\":\"फेरा अनुपात 0.2 होने से द्वितीयक वोल्टेज 46 V है।\"},{\"n\":70,\"d\":\"H\",\"se\":\"Why should an ordinary transformer not be connected to steady DC at its rated AC voltage?\",\"sh\":\"साधारण ट्रांसफॉर्मर को रेटेड AC वोल्टेज के बराबर स्थिर DC से क्यों नहीं जोड़ना चाहिए?\",\"oe\":[\"DC always has zero current\",\"No continuous changing flux is produced, so winding current can become dangerously high\",\"Its turns ratio becomes infinite\",\"Secondary frequency doubles\"],\"oh\":[\"DC में धारा शून्य होती है\",\"सतत बदलता फ्लक्स नहीं बनता और वाइंडिंग धारा खतरनाक रूप से बढ़ सकती है\",\"फेरा अनुपात अनंत हो जाता है\",\"द्वितीयक आवृत्ति दोगुनी होती है\"],\"a\":1,\"ee\":\"After the switching transient, DC produces no changing flux and hence no transformer back-emf; primary current is then limited mainly by low winding resistance, causing overheating.\",\"eh\":\"DC पर विरोधी प्रेरित EMF नहीं बनता, इसलिए प्राथमिक धारा बहुत बढ़ सकती है।\"},{\"n\":71,\"d\":\"H\",\"se\":\"For a de-energized relay, a normally closed (NC) contact is:\",\"sh\":\"डी-एनर्जाइज़्ड रिले में normally closed (NC) संपर्क:\",\"oe\":[\"Always insulated from common\",\"Connected only after the coil is energized\",\"Electrically connected to common\",\"The same as the coil terminal\"],\"oh\":[\"कॉमन से सदैव अलग\",\"केवल कॉइल चालू होने पर जुड़ता है\",\"कॉमन से विद्युत रूप से जुड़ा होता है\",\"कॉइल टर्मिनल के समान\"],\"a\":2,\"ee\":\"NO/NC labels refer to the relay's normal, de-energized state. Energizing the coil transfers the common contact from NC to NO in a changeover relay.\",\"eh\":\"NO/NC की स्थिति कॉइल बंद अवस्था में परिभाषित होती है।\"},{\"n\":72,\"d\":\"H\",\"se\":\"The primary operating principle of a fuse is:\",\"sh\":\"फ्यूज का मुख्य कार्य सिद्धांत है:\",\"oe\":[\"Heating effect of overcurrent melts the element\",\"Electrostatic attraction opens contacts\",\"It reduces frequency\",\"It stores fault energy indefinitely\"],\"oh\":[\"अतिधारा के ऊष्मीय प्रभाव से तत्व पिघलता है\",\"स्थिरवैद्युत आकर्षण संपर्क खोलता है\",\"यह आवृत्ति घटाता है\",\"यह दोष ऊर्जा संचित करता है\"],\"a\":0,\"ee\":\"Fuse heating follows roughly <span class=\\\"m\\\">I<sup>2R</sup></span>; sufficient overcurrent melts the calibrated element and interrupts the circuit. Voltage and breaking-capacity ratings must also suit the application.\",\"eh\":\"अतिधारा से फ्यूज तत्व पिघलकर परिपथ खोल देता है।\"},{\"n\":73,\"d\":\"H\",\"se\":\"A 100 µF capacitor charged to 10 V stores:\",\"sh\":\"10 V तक आवेशित 100 µF संधारित्र में ऊर्जा है:\",\"oe\":[\"0.005 J\",\"0.05 J\",\"0.5 J\",\"5 J\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"<span class=\\\"m\\\">E=\\\\tfrac12CV<sup>2</sup>=0.5×100×10<sup>-6</sup>×100=0.005</span> J.\",\"eh\":\"संधारित्र ऊर्जा <span class=\\\"m\\\">\\\\tfrac12CV<sup>2</sup></span> से 0.005 J है।\"},{\"n\":74,\"d\":\"H\",\"se\":\"A 2 H inductor carrying 3 A stores:\",\"sh\":\"3 A धारा वाले 2 H प्रेरक में ऊर्जा है:\",\"oe\":[\"3 J\",\"6 J\",\"18 J\",\"9 J\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"<span class=\\\"m\\\">E=\\\\tfrac12LI<sup>2</sup>=0.5×2×9=9</span> J. Sudden interruption can create a high voltage as this energy is released.\",\"eh\":\"प्रेरक ऊर्जा 9 J है; धारा अचानक तोड़ने पर उच्च वोल्टेज बन सकता है।\"},{\"n\":75,\"d\":\"E\",\"se\":\"An ammeter is connected:\",\"sh\":\"एमीटर जोड़ा जाता है:\",\"oe\":[\"Across the supply\",\"In series with the branch\",\"Between phase and earth only\",\"Without opening the circuit in every case\"],\"oh\":[\"आपूर्ति के समानांतर\",\"शाखा के श्रेणीक्रम में\",\"केवल फेज़ और अर्थ के बीच\",\"हर स्थिति में परिपथ खोले बिना\"],\"a\":1,\"ee\":\"The branch current must pass through the ammeter, so it is connected in series. Connecting a low-resistance ammeter across a source can cause a dangerous short.\",\"eh\":\"एमीटर श्रेणी में जुड़ता है; समानांतर जोड़ना शॉर्ट कर सकता है।\"},{\"n\":76,\"d\":\"E\",\"se\":\"A voltmeter is connected:\",\"sh\":\"वोल्टमीटर जोड़ा जाता है:\",\"oe\":[\"In series with the load\",\"In the earth wire\",\"In parallel across the two points\",\"Only after shorting the load\"],\"oh\":[\"भार के श्रेणीक्रम में\",\"अर्थ तार में\",\"दो बिंदुओं के समानांतर\",\"भार शॉर्ट करने के बाद\"],\"a\":2,\"ee\":\"A voltmeter measures potential difference between two points and is placed in parallel. Its high input resistance minimizes circuit loading.\",\"eh\":\"वोल्टमीटर दो बिंदुओं का विभवांतर मापता है और समानांतर जुड़ता है।\"},{\"n\":77,\"d\":\"E\",\"se\":\"An ideal ammeter has:\",\"sh\":\"आदर्श एमीटर का प्रतिरोध है:\",\"oe\":[\"Infinite\",\"Very high but finite\",\"Equal to load resistance\",\"Zero\"],\"oh\":[\"अनंत\",\"बहुत अधिक\",\"भार के बराबर\",\"शून्य\"],\"a\":3,\"ee\":\"Zero internal resistance would cause no extra voltage drop or change in circuit current. Real ammeters have small resistance and a burden voltage.\",\"eh\":\"आदर्श एमीटर का प्रतिरोध शून्य; वास्तविक का बहुत कम होता है।\"},{\"n\":78,\"d\":\"E\",\"se\":\"An ideal voltmeter has:\",\"sh\":\"आदर्श वोल्टमीटर का प्रतिरोध है:\",\"oe\":[\"Zero\",\"Equal to source resistance\",\"Infinite\",\"One ohm\"],\"oh\":[\"शून्य\",\"स्रोत के बराबर\",\"अनंत\",\"एक ओम\"],\"a\":2,\"ee\":\"Infinite input resistance draws zero current and causes no loading. Real digital voltmeters commonly have high, but finite, input resistance.\",\"eh\":\"आदर्श वोल्टमीटर धारा नहीं लेता; वास्तविक का प्रतिरोध बहुत अधिक होता है।\"},{\"n\":79,\"d\":\"E\",\"se\":\"When the approximate voltage is unknown, first select:\",\"sh\":\"वोल्टेज का अनुमान अज्ञात हो तो पहले चुनें:\",\"oe\":[\"Lowest current range\",\"Highest suitable voltage range\",\"Resistance mode\",\"Diode mode\"],\"oh\":[\"न्यूनतम धारा रेंज\",\"उच्चतम उपयुक्त वोल्टेज रेंज\",\"प्रतिरोध मोड\",\"डायोड मोड\"],\"a\":1,\"ee\":\"Starting high protects the meter; step down for better resolution. Also select AC or DC correctly and confirm lead sockets.\",\"eh\":\"पहले उच्च रेंज लें, फिर बेहतर रिज़ॉल्यूशन हेतु घटाएँ; AC/DC और लीड सॉकेट भी जाँचें।\"},{\"n\":80,\"d\":\"E\",\"se\":\"Resistance should normally be measured with the circuit:\",\"sh\":\"प्रतिरोध सामान्यतः किस अवस्था में मापा जाना चाहिए?\",\"oe\":[\"De-energized\",\"At maximum supply voltage\",\"Shorted to phase\",\"Carrying rated current\"],\"oh\":[\"विद्युत-विहीन\",\"अधिकतम वोल्टेज पर\",\"फेज़ से शॉर्ट\",\"रेटेड धारा लेते हुए\"],\"a\":0,\"ee\":\"The ohmmeter uses an internal source; external voltage gives false readings and may damage it. Isolate components when parallel paths affect the result.\",\"eh\":\"ओममीटर अपना स्रोत उपयोग करता है, इसलिए परिपथ विद्युत-विहीन होना चाहिए।\"},{\"n\":81,\"d\":\"E\",\"se\":\"A continuity beep proves only that:\",\"sh\":\"कंटिन्यूटी बीप केवल यह सिद्ध करती है कि:\",\"oe\":[\"Insulation is safe at operating voltage\",\"Resistance is below the meter's continuity threshold\",\"The conductor can carry any current\",\"Polarity is correct\"],\"oh\":[\"परिचालन वोल्टेज पर इन्सुलेशन सुरक्षित है\",\"प्रतिरोध मीटर की बीप सीमा से कम है\",\"चालक कोई भी धारा ले सकता है\",\"ध्रुवता सही है\"],\"a\":1,\"ee\":\"Continuity is a low-voltage, low-current check. It does not establish insulation strength, current capacity or absence of an intermittent fault.\",\"eh\":\"कंटिन्यूटी कम-वोल्टेज जाँच है; यह इन्सुलेशन या धारा क्षमता सिद्ध नहीं करती।\"},{\"n\":82,\"d\":\"E\",\"se\":\"A healthy silicon diode in DMM diode mode commonly shows:\",\"sh\":\"DMM डायोड मोड में स्वस्थ सिलिकॉन डायोड सामान्यतः दिखाता है:\",\"oe\":[\"Zero both directions\",\"OL both directions\",\"About 0.6-0.7 V forward and OL reverse\",\"230 V forward\"],\"oh\":[\"दोनों दिशाओं में शून्य\",\"दोनों दिशाओं में OL\",\"अग्र में लगभग 0.6-0.7 V और पश्च में OL\",\"अग्र में 230 V\"],\"a\":2,\"ee\":\"The reading is forward junction voltage, not resistance. Zero both ways suggests short; OL both ways suggests open, subject to in-circuit parallel paths.\",\"eh\":\"अग्र वोल्टेज लगभग 0.6-0.7 V; दोनों ओर शून्य शॉर्ट और दोनों ओर OL खुला संकेत कर सकता है।\"},{\"n\":83,\"d\":\"M\",\"se\":\"Before using an analog ohmmeter, shorting the probes and adjusting &ldquo;Ω zero&rdquo; compensates mainly for:\",\"sh\":\"एनालॉग ओममीटर में प्रोब शॉर्ट कर &ldquo;Ω zero&rdquo; समायोजन मुख्यतः किसकी क्षतिपूर्ति करता है?\",\"oe\":[\"Supply frequency\",\"Parallax only\",\"External circuit voltage\",\"Battery condition and lead/internal resistance\"],\"oh\":[\"आपूर्ति आवृत्ति\",\"केवल लंबन\",\"बाहरी वोल्टेज\",\"बैटरी स्थिति तथा लीड/आंतरिक प्रतिरोध\"],\"a\":3,\"ee\":\"The analog ohmmeter depends on its battery and series resistance; zero adjustment sets full-scale current for 0 Ω. Its ohm scale is reversed and nonlinear.\",\"eh\":\"शून्य समायोजन 0 Ω पर पूर्ण-स्केल धारा स्थापित करता है।\"},{\"n\":84,\"d\":\"M\",\"se\":\"A high-input-resistance digital voltmeter is preferred because it:\",\"sh\":\"उच्च इनपुट-प्रतिरोध DVM वांछनीय है क्योंकि यह:\",\"oe\":[\"Reduces loading of the measured circuit\",\"Always measures current without opening the circuit\",\"Eliminates every measurement error\",\"Supplies power to the load\"],\"oh\":[\"मापे जा रहे परिपथ की लोडिंग घटाता है\",\"धारा सदैव बिना परिपथ खोले मापता है\",\"हर त्रुटि समाप्त करता है\",\"भार को शक्ति देता है\"],\"a\":0,\"ee\":\"A higher input resistance draws less current, so the measured node voltage changes less. It reduces loading but does not eliminate calibration, noise or range errors.\",\"eh\":\"उच्च इनपुट प्रतिरोध कम धारा लेकर रीडिंग पर कम प्रभाव डालता है।\"},{\"n\":85,\"d\":\"M\",\"se\":\"To measure current with a clamp meter, clamp around:\",\"sh\":\"क्लैम्प मीटर से धारा मापने हेतु क्लैम्प करें:\",\"oe\":[\"Phase and neutral together\",\"Entire multicore cable always\",\"One current-carrying conductor\",\"Meter test leads only\"],\"oh\":[\"फेज़ और न्यूट्रल दोनों साथ\",\"सदैव पूरा बहु-कोर केबल\",\"एक धारा-वहन चालक\",\"केवल मीटर लीड\"],\"a\":2,\"ee\":\"Clamp around one conductor so its magnetic field is measured. Equal opposite currents in phase and neutral largely cancel if both are enclosed.\",\"eh\":\"एक चालक को घेरें; फेज़ और न्यूट्रल साथ लेने पर क्षेत्र परस्पर निरस्त होता है।\"},{\"n\":86,\"d\":\"M\",\"se\":\"A basic PMMC (moving-coil) instrument directly measures:\",\"sh\":\"मूल PMMC (चल-कुंडली) यंत्र सीधे मापता है:\",\"oe\":[\"AC only\",\"Frequency only\",\"Insulation resistance only\",\"DC / DC\"],\"oh\":[\"केवल AC\",\"केवल आवृत्ति\",\"केवल इन्सुलेशन प्रतिरोध\",\"\"],\"a\":3,\"ee\":\"PMMC torque reverses with current direction; on symmetrical AC, average torque is zero unless a rectifier is used. It gives a uniform scale on DC.\",\"eh\":\"PMMC सीधे DC मापता है; AC हेतु रेक्टिफायर चाहिए।\"},{\"n\":87,\"d\":\"M\",\"se\":\"A moving-iron instrument can be used for:\",\"sh\":\"चल-लौह यंत्र का उपयोग किया जा सकता है:\",\"oe\":[\"Both AC and DC\",\"DC only\",\"Optical power only\",\"Capacitance only\"],\"oh\":[\"AC और DC दोनों\",\"केवल DC\",\"केवल प्रकाशीय शक्ति\",\"केवल धारिता\"],\"a\":0,\"ee\":\"Deflecting torque in a moving-iron instrument depends on current magnitude (approximately square), so current reversal does not reverse torque.\",\"eh\":\"चल-लौह यंत्र का टॉर्क धारा की दिशा पर निर्भर नहीं, इसलिए AC/DC दोनों मापता है।\"},{\"n\":88,\"d\":\"M\",\"se\":\"The range of an ammeter is extended by connecting a low resistance:\",\"sh\":\"एमीटर की रेंज बढ़ाने हेतु कम प्रतिरोध जोड़ा जाता है:\",\"oe\":[\"In series as a multiplier\",\"In parallel as a shunt\",\"Across the supply without meter\",\"In the earth conductor\"],\"oh\":[\"श्रेणी में गुणक\",\"समानांतर शंट\",\"मीटर के बिना आपूर्ति पर\",\"अर्थ चालक में\"],\"a\":1,\"ee\":\"A shunt bypasses most current while the movement carries its rated small current. It must have a known low resistance and adequate power rating.\",\"eh\":\"शंट अधिकांश धारा को बायपास करता है और मीटर की रेंज बढ़ाता है।\"},{\"n\":89,\"d\":\"M\",\"se\":\"The range of a voltmeter is extended by adding a high resistance:\",\"sh\":\"वोल्टमीटर की रेंज बढ़ाने हेतु उच्च प्रतिरोध जोड़ा जाता है:\",\"oe\":[\"In series as a multiplier\",\"In parallel as a shunt\",\"Across its fuse only\",\"Across the current terminals\"],\"oh\":[\"श्रेणी में गुणक\",\"समानांतर शंट\",\"केवल फ्यूज के समानांतर\",\"धारा टर्मिनल के समानांतर\"],\"a\":0,\"ee\":\"The series multiplier limits movement current at the new full-scale voltage.\",\"eh\":\"श्रेणी गुणक नई पूर्ण-स्केल वोल्टेज पर मीटर धारा सीमित करता है।\"},{\"n\":90,\"d\":\"M\",\"se\":\"Parallax error on an analog meter is minimized by:\",\"sh\":\"एनालॉग मीटर में लंबन त्रुटि घटाने का तरीका है:\",\"oe\":[\"Reading from the side\",\"Viewing pointer perpendicular to the scale, aligned with mirror image\",\"Selecting resistance mode on a live circuit\",\"Tapping the glass hard\"],\"oh\":[\"किनारे से पढ़ना\",\"स्केल पर लंबवत देखकर सूचक को दर्पण प्रतिबिंब से मिलाना\",\"चालू परिपथ में ओम मोड\",\"काँच को जोर से ठोकना\"],\"a\":1,\"ee\":\"Eye, pointer and its mirror image should align so viewing angle does not shift the apparent reading.\",\"eh\":\"आँख, सूचक और दर्पण प्रतिबिंब एक सीध में रखने से लंबन घटता है।\"},{\"n\":91,\"d\":\"M\",\"se\":\"Repeated readings are tightly grouped but all are 5% above the true value. They are:\",\"sh\":\"बार-बार की रीडिंग पास-पास हैं, पर सभी सत्य मान से 5% अधिक हैं। वे हैं:\",\"oe\":[\"Accurate but not precise\",\"Neither accurate nor precise\",\"Precise but not accurate\",\"Both perfectly accurate and precise\"],\"oh\":[\"यथार्थ पर परिशुद्ध नहीं\",\"न यथार्थ न परिशुद्ध\",\"परिशुद्ध पर यथार्थ नहीं\",\"पूर्णतः दोनों\"],\"a\":2,\"ee\":\"Close grouping means good precision; a systematic offset from the true value means poor accuracy. Calibration reveals the bias; adjustment or a documented correction may then address it.\",\"eh\":\"पास-पास रीडिंग परिशुद्धता, सत्य से हटाव यथार्थता की कमी दर्शाता है; अंशांकन इस विचलन को प्रकट करता है।\"},{\"n\":92,\"d\":\"M\",\"se\":\"An instrument reads 0.2 V when the true input is zero. This is primarily:\",\"sh\":\"सत्य इनपुट शून्य होने पर यंत्र 0.2 V दिखाता है। यह मुख्यतः है:\",\"oe\":[\"Multiplication error\",\"Frequency error only\",\"Quantization proof\",\"Zero/offset error\"],\"oh\":[\"गुणन त्रुटि\",\"केवल आवृत्ति त्रुटि\",\"क्वांटाइजेशन प्रमाण\",\"शून्य या ऑफसेट त्रुटि\"],\"a\":3,\"ee\":\"A nonzero indication at zero input is a zero offset. If stable, subtracting it may correct readings, but calibration is the proper control.\",\"eh\":\"शून्य इनपुट पर गैर-शून्य रीडिंग शून्य/ऑफसेट त्रुटि है।\"},{\"n\":93,\"d\":\"M\",\"se\":\"Calibration primarily means:\",\"sh\":\"अंशांकन का मुख्य अर्थ है:\",\"oe\":[\"Repairing every faulty component\",\"Increasing meter range\",\"Cleaning the display\",\"Comparing indications with a traceable reference and documenting deviation\"],\"oh\":[\"हर दोषपूर्ण अवयव बदलना\",\"मीटर रेंज बढ़ाना\",\"डिस्प्ले साफ करना\",\"ट्रेस योग्य संदर्भ से तुलना कर विचलन दर्ज करना\"],\"a\":3,\"ee\":\"Calibration establishes the relationship between indication and reference; adjustment or repair may follow but is not identical to calibration.\",\"eh\":\"अंशांकन तुलना व विचलन निर्धारण है; समायोजन/मरम्मत अलग क्रिया है।\"},{\"n\":94,\"d\":\"M\",\"se\":\"On an oscilloscope, vertical sensitivity is mainly set by:\",\"sh\":\"ऑसिलोस्कोप में ऊर्ध्व संवेदनशीलता मुख्यतः किससे तय होती है?\",\"oe\":[\"Volts/div control\",\"Time/div control\",\"Trigger slope only\",\"Probe ground colour\"],\"oh\":[\"वोल्ट प्रति डिवीजन नियंत्रण\",\"समय प्रति डिवीजन नियंत्रण\",\"केवल ट्रिगर स्लोप\",\"प्रोब ग्राउंड रंग\"],\"a\":0,\"ee\":\"Vertical divisions multiplied by volts/div (and probe attenuation) give voltage. Time/div sets horizontal time scale.\",\"eh\":\"ऊर्ध्व डिवीजन × volts/div से वोल्टेज; time/div क्षैतिज समय देता है।\"},{\"n\":95,\"d\":\"H\",\"se\":\"One waveform cycle occupies 4 horizontal divisions at 0.5 ms/div. Frequency is:\",\"sh\":\"एक चक्र 0.5 ms/div पर 4 क्षैतिज डिवीजन घेरता है। आवृत्ति है:\",\"oe\":[\"2 kHz\",\"500 Hz\",\"250 Hz\",\"50 Hz\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Period = 4×0.5 ms = 2 ms; <span class=\\\"m\\\">f=1/T=1/0.002=500</span> Hz. Include probe/time-base settings before accepting a result.\",\"eh\":\"आवर्तकाल 2 ms और आवृत्ति 500 Hz है।\"},{\"n\":96,\"d\":\"H\",\"se\":\"A centered sine wave spans 6 vertical divisions peak-to-peak at 2 V/div using a ×1 probe. Peak voltage is:\",\"sh\":\"×1 प्रोब पर 2 V/div में ज्यावक्रीय तरंग 6 डिवीजन peak-to-peak है। शिखर वोल्टेज है:\",\"oe\":[\"3 V\",\"12 V\",\"6 V\",\"24 V\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"<span class=\\\"m\\\">V<sub>pp</sub>=6×2=12</span> V and <span class=\\\"m\\\">V<sub>p</sub>=V<sub>pp</sub>/2=6</span> V. For a sine wave, <span class=\\\"m\\\">V<sub>rms</sub>=V<sub>p</sub>/\\\\sqrt2</span>, if required.\",\"eh\":\"peak-to-peak 12 V, इसलिए शिखर 6 V है।\"},{\"n\":97,\"d\":\"H\",\"se\":\"A key advantage of a DSO over a traditional analog CRO is the ability to:\",\"sh\":\"पारंपरिक एनालॉग CRO की तुलना में DSO का प्रमुख लाभ है:\",\"oe\":[\"Measure only DC\",\"Work without probes\",\"Capture, store and recall single-shot/transient waveforms\",\"Eliminate aliasing automatically in every case\"],\"oh\":[\"केवल DC मापना\",\"बिना प्रोब चलना\",\"एकल/क्षणिक तरंग पकड़ना, सहेजना और पुनः देखना\",\"हर स्थिति में एलियासिंग समाप्त करना\"],\"a\":2,\"ee\":\"Digital acquisition permits storage, measurement and transfer of transient waveforms. Sampling rate, memory depth and probe bandwidth still limit accuracy.\",\"eh\":\"DSO क्षणिक संकेत सहेज सकता है, पर सैंपल दर व बैंडविड्थ की सीमाएँ रहती हैं।\"},{\"n\":98,\"d\":\"H\",\"se\":\"The main purpose of a signal/function generator is to:\",\"sh\":\"सिग्नल/फंक्शन जनरेटर का मुख्य उद्देश्य है:\",\"oe\":[\"Measure insulation resistance\",\"Apply known test waveforms to a circuit\",\"Measure battery specific gravity\",\"Replace protective earthing\"],\"oh\":[\"इन्सुलेशन प्रतिरोध मापना\",\"परिपथ को ज्ञात परीक्षण तरंग देना\",\"बैटरी विशिष्ट गुरुत्व मापना\",\"सुरक्षा अर्थ का स्थान लेना\"],\"a\":1,\"ee\":\"It supplies controlled sine, square, triangle or pulse signals with selected frequency/amplitude for tracing and testing. It is a source, not primarily a measuring instrument.\",\"eh\":\"यह ज्ञात आवृत्ति/आयाम का परीक्षण संकेत देता है।\"},{\"n\":99,\"d\":\"H\",\"se\":\"Which instrument directly measures inductance, capacitance and resistance?\",\"sh\":\"कौन-सा यंत्र प्रेरकत्व, धारिता और प्रतिरोध सीधे मापता है?\",\"oe\":[\"Hydrometer\",\"Tachometer\",\"Lux meter\",\"LCR meter\"],\"oh\":[\"हाइड्रोमीटर\",\"टैकोमीटर\",\"लक्स मीटर\",\"LCR मीटर\"],\"a\":3,\"ee\":\"An LCR meter applies an AC test signal and determines impedance parameters. The displayed value can depend on test frequency and series/parallel model.\",\"eh\":\"LCR मीटर AC परीक्षण से L, C और R निर्धारित करता है; मान परीक्षण आवृत्ति पर निर्भर हो सकता है।\"},{\"n\":100,\"d\":\"H\",\"se\":\"A megger is primarily used to measure:\",\"sh\":\"मेगर का मुख्य उपयोग है:\",\"oe\":[\"High insulation resistance using a high DC test voltage\",\"Low contact resistance while energized\",\"Signal frequency\",\"Battery electrolyte density\"],\"oh\":[\"उच्च DC परीक्षण वोल्टेज से उच्च इन्सुलेशन प्रतिरोध\",\"चालू अवस्था में कम संपर्क प्रतिरोध\",\"संकेत आवृत्ति\",\"बैटरी इलेक्ट्रोलाइट घनत्व\"],\"a\":0,\"ee\":\"An insulation tester applies a higher DC test voltage and reads resistance, often in MΩ/GΩ. Isolate sensitive electronics, use the correct test voltage, keep clear during the test and discharge the item afterward.\",\"eh\":\"मेगर उच्च DC वोल्टेज से इन्सुलेशन प्रतिरोध मापता है; संवेदनशील इलेक्ट्रॉनिक्स अलग रखें और बाद में डिस्चार्ज करें। ---\"}]},{\"id\":\"s02\",\"num\":2,\"name\":\"Semiconductor Devices, Rectifiers, Amplifiers, Oscillators and Digital Electronics\",\"q\":[{\"n\":1,\"d\":\"E\",\"se\":\"A pure semiconductor without intentional impurity is called:\",\"sh\":\"बिना जानबूझकर अशुद्धि मिलाया शुद्ध अर्धचालक कहलाता है:\",\"oe\":[\"P-type\",\"N-type\",\"Intrinsic\",\"Degenerate\"],\"oh\":[\"P-प्रकार\",\"N-प्रकार\",\"आंतरिक\",\"अपकर्षित\"],\"a\":2,\"ee\":\"An intrinsic semiconductor is chemically pure; thermally generated electrons and holes are equal in number. Doping produces an extrinsic P- or N-type material.\",\"eh\":\"आंतरिक अर्धचालक में इलेक्ट्रॉन और होल की संख्या समान होती है; डोपिंग से बाह्य अर्धचालक बनता है।\"},{\"n\":2,\"d\":\"E\",\"se\":\"The majority carriers in an N-type semiconductor are:\",\"sh\":\"N-प्रकार अर्धचालक में बहुसंख्यक वाहक हैं:\",\"oe\":[\"Electrons\",\"Holes\",\"Protons\",\"Ions moving through the crystal\"],\"oh\":[\"इलेक्ट्रॉन\",\"होल\",\"प्रोटॉन\",\"क्रिस्टल में चलते आयन\"],\"a\":0,\"ee\":\"Pentavalent donor doping supplies extra free electrons. Holes remain minority carriers; the material as a whole is electrically neutral.\",\"eh\":\"पंचसंयोजी डोनर अशुद्धि अतिरिक्त इलेक्ट्रॉन देती है।\"},{\"n\":3,\"d\":\"E\",\"se\":\"The majority carriers in a P-type semiconductor are:\",\"sh\":\"P-प्रकार अर्धचालक में बहुसंख्यक वाहक हैं:\",\"oe\":[\"Neutrons\",\"Free ions\",\"Electrons\",\"Holes\"],\"oh\":[\"न्यूट्रॉन\",\"मुक्त आयन\",\"इलेक्ट्रॉन\",\"होल\"],\"a\":3,\"ee\":\"Trivalent acceptor doping creates holes as majority carriers; electrons are minority carriers.\",\"eh\":\"त्रिसंयोजी एक्सेप्टर अशुद्धि होल बनाती है।\"},{\"n\":4,\"d\":\"E\",\"se\":\"For forward bias of a PN diode, connect:\",\"sh\":\"PN डायोड को अग्र अभिनत करने के लिए जोड़ें:\",\"oe\":[\"P to negative and N to positive\",\"P to positive and N to negative\",\"Both sides to positive\",\"Both sides to earth\"],\"oh\":[\"P को ऋण और N को धन\",\"P को धन और N को ऋण\",\"दोनों ओर धन\",\"दोनों ओर अर्थ\"],\"a\":1,\"ee\":\"Forward bias reduces the depletion barrier and permits substantial current after the knee region.\",\"eh\":\"अग्र अभिनति अवक्षय परत की बाधा घटाकर धारा प्रवाहित करती है।\"},{\"n\":5,\"d\":\"E\",\"se\":\"For reverse bias of a PN diode, connect:\",\"sh\":\"PN डायोड को पश्च अभिनत करने के लिए जोड़ें:\",\"oe\":[\"P to positive, N to negative\",\"P to negative, N to positive\",\"Anode and cathode together\",\"No source\"],\"oh\":[\"P को धन, N को ऋण\",\"P को ऋण, N को धन\",\"एनोड-कैथोड साथ\",\"कोई स्रोत नहीं\"],\"a\":1,\"ee\":\"Reverse bias widens the depletion region, allowing only small leakage until breakdown.\",\"eh\":\"पश्च अभिनति अवक्षय परत चौड़ी करती है; भंजन तक बहुत कम क्षरण धारा बहती है।\"},{\"n\":6,\"d\":\"E\",\"se\":\"Typical forward knee values at room temperature are approximately:\",\"sh\":\"कमरे के ताप पर सामान्य अग्र घुटना वोल्टेज लगभग हैं:\",\"oe\":[\"Si 0.3 V, Ge 0.7 V\",\"Both 5 V\",\"Si 1.5 V, Ge 3 V\",\"Si 0.7 V, Ge 0.3 V\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"A practical silicon junction commonly drops about 0.7 V and germanium about 0.3 V at ordinary test current; exact voltage varies with current and temperature.\",\"eh\":\"सिलिकॉन लगभग 0.7 V और जर्मेनियम लगभग 0.3 V देता है।\"},{\"n\":7,\"d\":\"E\",\"se\":\"Before breakdown, reverse diode current is mainly due to:\",\"sh\":\"भंजन से पहले डायोड की पश्च धारा मुख्यतः किसके कारण है?\",\"oe\":[\"Minority carriers\",\"Majority-carrier avalanche at zero voltage\",\"The load resistor only\",\"Transformer action\"],\"oh\":[\"अल्पसंख्यक वाहक\",\"शून्य वोल्टेज पर हिमस्खलन\",\"केवल भार प्रतिरोध\",\"ट्रांसफॉर्मर क्रिया\"],\"a\":0,\"ee\":\"Thermally generated minority carriers cause small reverse saturation/leakage current; it rises strongly with temperature.\",\"eh\":\"अल्पसंख्यक वाहक छोटी पश्च क्षरण धारा बनाते हैं, जो ताप के साथ बढ़ती है।\"},{\"n\":8,\"d\":\"E\",\"se\":\"The band printed on a common axial rectifier diode marks the:\",\"sh\":\"सामान्य अक्षीय दिष्टकारी डायोड की छपी पट्टी दर्शाती है:\",\"oe\":[\"Anode\",\"Gate\",\"Cathode\",\"Emitter\"],\"oh\":[\"एनोड\",\"गेट\",\"कैथोड\",\"एमिटर\"],\"a\":2,\"ee\":\"The physical band marks the cathode and corresponds to the bar in the circuit symbol. Always confirm the datasheet for unusual packages.\",\"eh\":\"पट्टी कैथोड दर्शाती है और प्रतीक की बार के अनुरूप होती है।\"},{\"n\":9,\"d\":\"E\",\"se\":\"A healthy silicon diode in DMM diode mode normally shows:\",\"sh\":\"DMM डायोड मोड में स्वस्थ सिलिकॉन डायोड सामान्यतः दिखाता है:\",\"oe\":[\"About 0.6-0.7 V forward and OL reverse\",\"OL in both directions\",\"Zero in both directions\",\"230 V forward\"],\"oh\":[\"अग्र में 0.6-0.7 V, पश्च में OL\",\"दोनों ओर OL\",\"दोनों ओर शून्य\",\"अग्र में 230 V\"],\"a\":0,\"ee\":\"One-way junction drop is expected. Near zero both ways suggests a short; OL both ways suggests an open, unless in-circuit parallel paths distort the test.\",\"eh\":\"दोनों ओर शून्य शॉर्ट और दोनों ओर OL खुला डायोड संकेत कर सकता है।\"},{\"n\":10,\"d\":\"E\",\"se\":\"PIV of a diode means the maximum:\",\"sh\":\"डायोड का PIV अधिकतम क्या दर्शाता है?\",\"oe\":[\"Forward current\",\"Power gain\",\"Reverse voltage it can withstand without breakdown\",\"Junction temperature only\"],\"oh\":[\"अग्र धारा\",\"शक्ति लब्धि\",\"भंजन बिना सहने योग्य पश्च वोल्टेज\",\"केवल संधि ताप\"],\"a\":2,\"ee\":\"Peak inverse voltage is a reverse-voltage rating. In rectifier selection, the circuit's worst reverse stress must remain within the rated repetitive reverse voltage with margin.\",\"eh\":\"PIV डायोड की पश्च वोल्टेज सहन क्षमता है।\"},{\"n\":11,\"d\":\"M\",\"se\":\"A Zener diode is normally used for regulation in:\",\"sh\":\"ज़ेनर डायोड का नियमन हेतु सामान्य उपयोग होता है:\",\"oe\":[\"Forward saturation\",\"Controlled reverse breakdown\",\"Zero-bias oscillation\",\"Transformer action\"],\"oh\":[\"अग्र संतृप्ति\",\"नियंत्रित पश्च भंजन\",\"शून्य अभिनति दोलन\",\"ट्रांसफॉर्मर क्रिया\"],\"a\":1,\"ee\":\"In reverse breakdown, Zener voltage changes little over its allowed current range. A series resistor is essential to limit current and power.\",\"eh\":\"पश्च भंजन क्षेत्र में ज़ेनर लगभग स्थिर वोल्टेज देता है; श्रेणी प्रतिरोध आवश्यक है।\"},{\"n\":12,\"d\":\"M\",\"se\":\"In a simple Zener regulator, the series resistor primarily:\",\"sh\":\"सरल ज़ेनर नियामक में श्रेणी प्रतिरोध मुख्यतः:\",\"oe\":[\"Increases breakdown voltage\",\"Reverses polarity\",\"Stores charge\",\"Limits current through Zener and load\"],\"oh\":[\"भंजन वोल्टेज बढ़ाता है\",\"ध्रुवता उलटता है\",\"आवेश संचित करता है\",\"ज़ेनर व भार धारा सीमित करता है\"],\"a\":3,\"ee\":\"Without current limiting, the Zener may exceed its power rating. The resistor current splits into load current and Zener current.\",\"eh\":\"प्रतिरोध धारा सीमित करता है; उसकी धारा भार और ज़ेनर में विभाजित होती है।\"},{\"n\":13,\"d\":\"M\",\"se\":\"An LED emits light when it is normally:\",\"sh\":\"LED सामान्यतः कब प्रकाश देता है?\",\"oe\":[\"Reverse biased beyond rating\",\"Left open\",\"Connected without current limiting\",\"Forward biased with controlled current\"],\"oh\":[\"रेटिंग से अधिक पश्च अभिनत\",\"खुला छोड़ा\",\"बिना धारा सीमित किए जोड़ा\",\"नियंत्रित धारा के साथ अग्र अभिनत\"],\"a\":3,\"ee\":\"Carrier recombination under forward bias releases photons. A resistor or constant-current driver prevents destructive excess current.\",\"eh\":\"अग्र अभिनति में पुनर्संयोजन से प्रकाश बनता है; धारा सीमित करना आवश्यक है।\"},{\"n\":14,\"d\":\"M\",\"se\":\"A photodiode is commonly operated in:\",\"sh\":\"फोटोडायोड सामान्यतः किस अवस्था में चलाया जाता है?\",\"oe\":[\"Heavy forward conduction\",\"Reverse bias\",\"SCR latching mode\",\"Magnetic saturation\"],\"oh\":[\"भारी अग्र चालन\",\"पश्च अभिनति\",\"SCR लैचिंग\",\"चुंबकीय संतृप्ति\"],\"a\":1,\"ee\":\"Reverse bias widens the depletion region and gives fast light-dependent current. Photovoltaic zero-bias operation is also possible in some sensors.\",\"eh\":\"पश्च अभिनति में प्रकाश-निर्भर धारा तेज़ी से मिलती है।\"},{\"n\":15,\"d\":\"M\",\"se\":\"The main benefit of an optocoupler is:\",\"sh\":\"ऑप्टोकपलर का मुख्य लाभ है:\",\"oe\":[\"Frequency multiplication\",\"Mechanical amplification\",\"Electrical isolation with optical signal transfer\",\"AC rectification only\"],\"oh\":[\"आवृत्ति गुणन\",\"यांत्रिक प्रवर्धन\",\"प्रकाशीय संकेत से विद्युत पृथक्करण\",\"केवल AC दिष्टकरण\"],\"a\":2,\"ee\":\"An internal LED and photosensor transfer information without a direct conductive path, providing galvanic isolation within rated limits.\",\"eh\":\"LED और फोटो-सेंसर बिना प्रत्यक्ष विद्युत संपर्क संकेत भेजते हैं।\"},{\"n\":16,\"d\":\"M\",\"se\":\"A varactor diode functions mainly as a voltage-controlled:\",\"sh\":\"वैरैक्टर डायोड मुख्यतः वोल्टेज-नियंत्रित किस रूप में काम करता है?\",\"oe\":[\"Capacitance\",\"Inductance\",\"Transformer\",\"Fuse\"],\"oh\":[\"धारिता\",\"प्रेरकत्व\",\"ट्रांसफॉर्मर\",\"फ्यूज\"],\"a\":0,\"ee\":\"Its reverse-biased junction capacitance varies with applied voltage, making it useful in electronic tuning. It is not operated as a forward rectifier in this role.\",\"eh\":\"पश्च अभिनत संधि धारिता वोल्टेज से बदलती है और ट्यूनिंग में उपयोग होती है।\"},{\"n\":17,\"d\":\"M\",\"se\":\"The three BJT terminals are:\",\"sh\":\"BJT के तीन टर्मिनल हैं:\",\"oe\":[\"Gate, source, drain\",\"Anode, cathode, gate\",\"Emitter, base, collector\",\"Line, neutral, earth\"],\"oh\":[\"गेट, स्रोत, ड्रेन\",\"एनोड, कैथोड, गेट\",\"एमिटर, बेस, कलेक्टर\",\"लाइन, न्यूट्रल, अर्थ\"],\"a\":2,\"ee\":\"BJT terminals are emitter, base and collector. Gate/source/drain belong to FETs; anode/cathode/gate to SCRs.\",\"eh\":\"BJT में E, B, C होते हैं।\"},{\"n\":18,\"d\":\"M\",\"se\":\"In normal active operation of an NPN transistor, conventional collector current flows mainly:\",\"sh\":\"सामान्य सक्रिय NPN ट्रांजिस्टर में परंपरागत कलेक्टर धारा मुख्यतः बहती है:\",\"oe\":[\"Base to emitter only\",\"Emitter to collector\",\"Gate to source\",\"Collector to emitter\"],\"oh\":[\"केवल बेस से एमिटर\",\"एमिटर से कलेक्टर\",\"गेट से स्रोत\",\"कलेक्टर से एमिटर\"],\"a\":3,\"ee\":\"Conventional current enters the collector and leaves the emitter in an NPN device; electron motion is opposite.\",\"eh\":\"NPN में परंपरागत धारा कलेक्टर से एमिटर की ओर होती है।\"},{\"n\":19,\"d\":\"M\",\"se\":\"The common-emitter current gain β is approximately:\",\"sh\":\"कॉमन-एमिटर धारा लब्धि β लगभग है:\",\"oe\":[\"<span class=\\\"m\\\">I<sub>E</sub>/I<sub>C</sub></span>\",\"<span class=\\\"m\\\">I<sub>C</sub>/I<sub>B</sub></span>\",\"<span class=\\\"m\\\">V<sub>C</sub>/V<sub>B</sub></span>\",\"<span class=\\\"m\\\">I<sub>B</sub>/I<sub>C</sub></span>\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"<span class=\\\"m\\\">β=I<sub>C</sub>/I<sub>B</sub></span> in the active region. It varies between devices and with operating conditions, so a switch should not rely on a single nominal value.\",\"eh\":\"सक्रिय क्षेत्र में β = कलेक्टर धारा ÷ बेस धारा।\"},{\"n\":20,\"d\":\"M\",\"se\":\"The common-base current gain α is approximately:\",\"sh\":\"कॉमन-बेस धारा लब्धि α लगभग है:\",\"oe\":[\"<span class=\\\"m\\\">I<sub>C</sub>/I<sub>E</sub></span>\",\"<span class=\\\"m\\\">I<sub>E</sub>/I<sub>B</sub></span>\",\"<span class=\\\"m\\\">V<sub>C</sub>/V<sub>E</sub></span>\",\"<span class=\\\"m\\\">I<sub>B</sub>/I<sub>C</sub></span>\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"<span class=\\\"m\\\">α=I<sub>C</sub>/I<sub>E</sub></span>, slightly less than 1 because <span class=\\\"m\\\">I<sub>E</sub>=I<sub>C</sub>+I<sub>B</sub></span>.\",\"eh\":\"α एक से थोड़ा कम होता है क्योंकि एमिटर धारा कलेक्टर और बेस धाराओं का योग है।\"},{\"n\":21,\"d\":\"M\",\"se\":\"The correct relation between α and β is:\",\"sh\":\"α और β का सही संबंध है:\",\"oe\":[\"<span class=\\\"m\\\">β=1-α</span>\",\"<span class=\\\"m\\\">β=α/(1-α)</span>\",\"<span class=\\\"m\\\">β=1/α</span>\",\"<span class=\\\"m\\\">β=α<sup>2</sup></span>\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"From <span class=\\\"m\\\">I<sub>E</sub>=I<sub>C</sub>+I<sub>B</sub></span>, <span class=\\\"m\\\">β=α/(1-α)</span> and <span class=\\\"m\\\">α=β/(β+1)</span>.\",\"eh\":\"धारा संबंध से यह रूप प्राप्त होता है।\"},{\"n\":22,\"d\":\"M\",\"se\":\"A common-emitter amplifier normally introduces a voltage phase shift of:\",\"sh\":\"कॉमन-एमिटर प्रवर्धक सामान्यतः वोल्टेज में कला परिवर्तन देता है:\",\"oe\":[\"0°\",\"90°\",\"180°\",\"360° only at DC\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Increasing base signal raises collector current and the collector-resistor drop, causing collector voltage to fall; output is inverted.\",\"eh\":\"बेस संकेत बढ़ने पर कलेक्टर वोल्टेज घटता है, इसलिए आउटपुट उल्टा होता है।\"},{\"n\":23,\"d\":\"M\",\"se\":\"For BJT switching, the usual OFF and ON regions are respectively:\",\"sh\":\"BJT स्विचिंग में OFF और ON क्षेत्र क्रमशः हैं:\",\"oe\":[\"Cut-off and saturation\",\"Active and breakdown\",\"Saturation and cut-off\",\"Reverse active and active\"],\"oh\":[\"कट-ऑफ और संतृप्ति\",\"सक्रिय और भंजन\",\"संतृप्ति और कट-ऑफ\",\"पश्च सक्रिय और सक्रिय\"],\"a\":0,\"ee\":\"Cut-off gives negligible collector current; saturation gives low <span class=\\\"m\\\">V<sub>CE</sub></span> and acts as a closed switch. The active region is used for linear amplification.\",\"eh\":\"कट-ऑफ OFF, संतृप्ति ON और सक्रिय क्षेत्र प्रवर्धन हेतु है।\"},{\"n\":24,\"d\":\"M\",\"se\":\"The purpose of transistor biasing in a linear amplifier is to:\",\"sh\":\"रैखिक प्रवर्धक में ट्रांजिस्टर अभिनति का उद्देश्य है:\",\"oe\":[\"Eliminate the supply\",\"Force permanent cut-off\",\"Make β exactly constant\",\"Establish a suitable quiescent operating point\"],\"oh\":[\"आपूर्ति हटाना\",\"स्थायी कट-ऑफ\",\"β को ठीक स्थिर करना\",\"उपयुक्त स्थिर कार्य-बिंदु स्थापित करना\"],\"a\":3,\"ee\":\"A proper Q-point permits symmetrical signal swing and reduces clipping despite temperature/device variation.\",\"eh\":\"उचित Q-बिंदु सममित संकेत स्विंग और कम विकृति देता है।\"},{\"n\":25,\"d\":\"M\",\"se\":\"Across a DC relay coil driven by an NPN switch, a flyback diode is placed:\",\"sh\":\"NPN स्विच से चलने वाली DC रिले कॉइल के समानांतर फ्लाइबैक डायोड लगाया जाता है:\",\"oe\":[\"Forward-biased during normal operation\",\"In series with the base only\",\"Across the AC mains\",\"Reverse-biased normally, to conduct the turn-off current\"],\"oh\":[\"सामान्य कार्य में अग्र अभिनत\",\"केवल बेस के श्रेणी में\",\"AC मेन्स के पार\",\"सामान्यतः पश्च अभिनत, बंद करते समय धारा हेतु\"],\"a\":3,\"ee\":\"The coil's stored magnetic energy creates a high reverse voltage at switch-off. The diode provides a safe current path and clamps the spike.\",\"eh\":\"कॉइल की संचित ऊर्जा बंद करते समय उच्च स्पाइक बनाती है; डायोड उसे सीमित करता है।\"},{\"n\":26,\"d\":\"H\",\"se\":\"Compared with a BJT, a FET is primarily:\",\"sh\":\"BJT की तुलना में FET मुख्यतः है:\",\"oe\":[\"Voltage-controlled with high input impedance\",\"Current-controlled with low input impedance\",\"A mechanical device\",\"A two-terminal rectifier\"],\"oh\":[\"वोल्टेज-नियंत्रित और उच्च इनपुट प्रतिबाधा\",\"धारा-नियंत्रित और कम इनपुट प्रतिबाधा\",\"यांत्रिक युक्ति\",\"दो-टर्मिनल दिष्टकारी\"],\"a\":0,\"ee\":\"Gate voltage controls channel current and gate current is very small. A BJT requires base current and is described as current-controlled at this level.\",\"eh\":\"FET में गेट वोल्टेज चैनल धारा नियंत्रित करता है।\"},{\"n\":27,\"d\":\"H\",\"se\":\"The insulated gate of a MOSFET makes it especially vulnerable to:\",\"sh\":\"MOSFET का इन्सुलेटेड गेट विशेष रूप से किससे संवेदनशील है?\",\"oe\":[\"Low-frequency sound\",\"Magnetic polarity only\",\"Electrostatic discharge\",\"Mechanical relay bounce only\"],\"oh\":[\"कम आवृत्ति ध्वनि\",\"केवल चुंबकीय ध्रुवता\",\"स्थिरवैद्युत निर्वहन\",\"केवल रिले बाउंस\"],\"a\":2,\"ee\":\"The thin gate oxide can be punctured by static voltage. Use ESD control, discharge yourself and avoid leaving the gate floating.\",\"eh\":\"पतली गेट ऑक्साइड ESD से क्षतिग्रस्त हो सकती है।\"},{\"n\":28,\"d\":\"H\",\"se\":\"The terminals of an SCR are:\",\"sh\":\"SCR के टर्मिनल हैं:\",\"oe\":[\"Emitter, base, collector\",\"Anode, cathode, gate\",\"Source, drain, body\",\"Input, output, common\"],\"oh\":[\"एमिटर, बेस, कलेक्टर\",\"एनोड, कैथोड, गेट\",\"स्रोत, ड्रेन, बॉडी\",\"इनपुट, आउटपुट, कॉमन\"],\"a\":1,\"ee\":\"A gate pulse triggers an appropriately forward-biased SCR; it then latches while current stays above holding current.\",\"eh\":\"गेट पल्स SCR को चालू करता है और होल्डिंग धारा तक वह लैच रहता है।\"},{\"n\":29,\"d\":\"H\",\"se\":\"After a DC SCR has latched ON, removing gate drive normally:\",\"sh\":\"DC SCR के लैच होकर ON होने के बाद गेट ड्राइव हटाने पर सामान्यतः:\",\"oe\":[\"Continues only while the gate pulse remains\",\"Immediately turns it OFF\",\"Does not turn it OFF; anode current must fall below holding current\",\"Converts it to a TRIAC\"],\"oh\":[\"केवल गेट पल्स रहने तक चलता है\",\"तुरंत OFF करता है\",\"OFF नहीं होता; एनोड धारा होल्डिंग धारा से नीचे करनी होगी\",\"TRIAC बनाता है\"],\"a\":2,\"ee\":\"The gate initiates conduction but does not control turn-off of a conventional SCR. DC circuits need commutation or current interruption.\",\"eh\":\"साधारण SCR का गेट टर्न-ऑफ नियंत्रित नहीं करता।\"},{\"n\":30,\"d\":\"H\",\"se\":\"Which device is a bidirectional thyristor commonly used for AC power control?\",\"sh\":\"AC शक्ति नियंत्रण में प्रयुक्त द्विदिश थाइरिस्टर है:\",\"oe\":[\"Zener\",\"TRIAC\",\"Photodiode\",\"UJT\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"A TRIAC conducts in either direction after triggering and suits lamp dimmers and AC control. An SCR is essentially unidirectional.\",\"eh\":\"TRIAC दोनों अर्धचक्रों में चालन कर सकता है।\"},{\"n\":31,\"d\":\"H\",\"se\":\"A DIAC is most commonly used to:\",\"sh\":\"DIAC का सामान्य उपयोग है:\",\"oe\":[\"Provide DC voltage regulation\",\"Amplify audio\",\"Store one bit\",\"Give symmetrical trigger pulses to a TRIAC\"],\"oh\":[\"DC वोल्टेज नियमन\",\"ऑडियो प्रवर्धन\",\"एक बिट संग्रह\",\"TRIAC को सममित ट्रिगर पल्स देना\"],\"a\":3,\"ee\":\"A DIAC breaks over in either polarity and helps produce similar TRIAC firing in both half-cycles.\",\"eh\":\"DIAC दोनों ध्रुवताओं में ब्रेकओवर कर TRIAC को सममित ट्रिगर देता है।\"},{\"n\":32,\"d\":\"H\",\"se\":\"A common application of a UJT is:\",\"sh\":\"UJT का सामान्य अनुप्रयोग है:\",\"oe\":[\"Relaxation oscillator and SCR triggering\",\"High-fidelity power amplification\",\"Full-wave bridge rectification\",\"Binary storage\"],\"oh\":[\"रिलैक्सेशन दोलित्र और SCR ट्रिगरिंग\",\"उच्च-निष्ठा शक्ति प्रवर्धन\",\"पूर्ण-तरंग सेतु दिष्टकरण\",\"बाइनरी संग्रह\"],\"a\":0,\"ee\":\"UJT negative-resistance behaviour supports capacitor charge-discharge oscillation and sharp trigger pulses.\",\"eh\":\"UJT का ऋणात्मक प्रतिरोध क्षेत्र रिलैक्सेशन दोलन और ट्रिगर पल्स हेतु उपयोगी है।\"},{\"n\":33,\"d\":\"H\",\"se\":\"An IGBT combines:\",\"sh\":\"IGBT किसका संयोजनात्मक लाभ देता है?\",\"oe\":[\"MOS-gate high input impedance with bipolar power conduction\",\"A mechanical contact with a fuse\",\"Zener regulation with optical sensing\",\"Two ordinary diodes only\"],\"oh\":[\"MOS गेट की उच्च इनपुट प्रतिबाधा और द्विध्रुवी शक्ति चालन\",\"यांत्रिक संपर्क और फ्यूज\",\"ज़ेनर नियमन और प्रकाश संवेदन\",\"केवल दो साधारण डायोड\"],\"a\":0,\"ee\":\"An IGBT is voltage-driven at its insulated gate and handles substantial power using bipolar conduction characteristics.\",\"eh\":\"IGBT का गेट वोल्टेज-नियंत्रित है और यह उच्च शक्ति स्विचिंग में उपयोगी है।\"},{\"n\":34,\"d\":\"E\",\"se\":\"A basic single-phase half-wave rectifier uses:\",\"sh\":\"मूल एकल-फेज़ अर्ध-तरंग दिष्टकारी उपयोग करता है:\",\"oe\":[\"Four diodes\",\"Three diodes\",\"Two diodes\",\"One diode\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"One diode passes one AC half-cycle and blocks the other, producing pulsating DC.\",\"eh\":\"एक डायोड केवल एक अर्धचक्र देता है।\"},{\"n\":35,\"d\":\"E\",\"se\":\"A centre-tapped full-wave rectifier normally uses:\",\"sh\":\"केंद्र-टैप पूर्ण-तरंग दिष्टकारी सामान्यतः उपय
