ोग करता है:\",\"oe\":[\"One diode\",\"Two diodes\",\"Three diodes\",\"Four diodes without centre tap\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Two diodes conduct alternately from the two halves of a centre-tapped secondary.\",\"eh\":\"केंद्र-टैप द्वितीयक की दोनों आधी वाइंडिंग से दो डायोड बारी-बारी चलाते हैं।\"},{\"n\":36,\"d\":\"E\",\"se\":\"A bridge rectifier contains four diodes; during each half-cycle normally:\",\"sh\":\"सेतु दिष्टकारी में चार डायोड होते हैं; प्रत्येक अर्धचक्र में सामान्यतः:\",\"oe\":[\"One conducts\",\"All four conduct\",\"Two conduct\",\"None conduct\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"A diagonal pair conducts on each half-cycle, keeping load current in the same direction.\",\"eh\":\"प्रत्येक अर्धचक्र में तिरछे दो डायोड चलकर भार धारा की दिशा समान रखते हैं।\"},{\"n\":37,\"d\":\"E\",\"se\":\"For a 50 Hz input, half-wave rectifier ripple frequency is:\",\"sh\":\"50 Hz इनपुट पर अर्ध-तरंग दिष्टकारी की रिपल आवृत्ति है:\",\"oe\":[\"100 Hz\",\"25 Hz\",\"150 Hz\",\"50 Hz\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"One output pulse occurs per input cycle, so ripple frequency equals supply frequency.\",\"eh\":\"प्रति चक्र एक पल्स होने से रिपल आवृत्ति 50 Hz है।\"},{\"n\":38,\"d\":\"E\",\"se\":\"For a 50 Hz input, full-wave rectifier ripple frequency is:\",\"sh\":\"50 Hz इनपुट पर पूर्ण-तरंग दिष्टकारी की रिपल आवृत्ति है:\",\"oe\":[\"25 Hz\",\"50 Hz\",\"100 Hz\",\"200 Hz\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Both half-cycles create positive output pulses, so ripple frequency is <span class=\\\"m\\\">2f=100</span> Hz.\",\"eh\":\"दोनों अर्धचक्र उपयोग होने से रिपल आवृत्ति दोगुनी है।\"},{\"n\":39,\"d\":\"E\",\"se\":\"The maximum theoretical rectification efficiency is approximately:\",\"sh\":\"अधिकतम सैद्धांतिक दिष्टकरण दक्षता लगभग है:\",\"oe\":[\"40.6% half-wave and 81.2% full-wave\",\"81.2% half-wave and 40.6% full-wave\",\"100% for both\",\"25% for both\"],\"oh\":[\"40.6% अर्ध-तरंग और 81.2% पूर्ण-तरंग\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Full-wave use of both half-cycles gives about twice the ideal maximum efficiency of half-wave rectification.\",\"eh\":\"पूर्ण-तरंग दोनों अर्धचक्र उपयोग करता है, इसलिए दक्षता अधिक है।\"},{\"n\":40,\"d\":\"E\",\"se\":\"The ideal unfiltered ripple factors are approximately:\",\"sh\":\"आदर्श बिना फ़िल्टर रिपल गुणक लगभग हैं:\",\"oe\":[\"HWR 0.482, FWR 1.21\",\"HWR 1.21, FWR 0.482\",\"Both zero\",\"Both 1.414\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Lower ripple factor means smoother DC; full-wave output (0.482) is inherently smoother than half-wave (1.21).\",\"eh\":\"कम रिपल गुणक बेहतर DC दर्शाता है।\"},{\"n\":41,\"d\":\"E\",\"se\":\"For an ideal half-wave rectifier with secondary peak <span class=\\\"m\\\">V<sub>m</sub></span>, diode PIV is:\",\"sh\":\"आदर्श अर्ध-तरंग दिष्टकारी में द्वितीयक शिखर <span class=\\\"m\\\">V<sub>m</sub></span> हो तो डायोड PIV है:\",\"oe\":[\"<span class=\\\"m\\\">V<sub>m</sub></span>\",\"<span class=\\\"m\\\">2V<sub>m</sub></span>\",\"<span class=\\\"m\\\">V<sub>m</sub>/2</span>\",\"Zero\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"During the blocked half-cycle, the diode withstands approximately the secondary peak. Practical design uses rating margin.\",\"eh\":\"अवरोधित अर्धचक्र में डायोड लगभग <span class=\\\"m\\\">V<sub>m</sub></span> पश्च वोल्टेज सहता है।\"},{\"n\":42,\"d\":\"M\",\"se\":\"In an ideal centre-tapped full-wave rectifier, PIV of each diode is:\",\"sh\":\"आदर्श केंद्र-टैप पूर्ण-तरंग दिष्टकारी में प्रत्येक डायोड का PIV है:\",\"oe\":[\"<span class=\\\"m\\\">V<sub>m</sub>/2</span>\",\"<span class=\\\"m\\\">V<sub>m</sub></span>\",\"Zero\",\"<span class=\\\"m\\\">2V<sub>m</sub></span>, where <span class=\\\"m\\\">V<sub>m</sub></span> is peak of one half-secondary\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"The nonconducting diode sees its own half-secondary peak plus the opposite conducting half, totaling about <span class=\\\"m\\\">2V<sub>m</sub></span>.\",\"eh\":\"बंद डायोड पर दोनों आधी वाइंडिंग के शिखर जुड़ते हैं।\"},{\"n\":43,\"d\":\"M\",\"se\":\"In an ideal bridge rectifier, PIV of each diode is approximately:\",\"sh\":\"आदर्श सेतु दिष्टकारी में प्रत्येक डायोड का PIV लगभग है:\",\"oe\":[\"<span class=\\\"m\\\">2V<sub>m</sub></span>\",\"<span class=\\\"m\\\">V<sub>m</sub>/2</span>\",\"<span class=\\\"m\\\">V<sub>m</sub></span>\",\"<span class=\\\"m\\\">4V<sub>m</sub></span>\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Each reverse-biased bridge diode sees roughly the secondary peak, an advantage over the centre-tapped full-wave circuit's <span class=\\\"m\\\">2V<sub>m</sub></span> requirement.\",\"eh\":\"सेतु में प्रत्येक डायोड का PIV लगभग <span class=\\\"m\\\">V<sub>m</sub></span> है।\"},{\"n\":44,\"d\":\"M\",\"se\":\"The key transformer advantage of a bridge rectifier is that it:\",\"sh\":\"सेतु दिष्टकारी का मुख्य ट्रांसफॉर्मर लाभ है कि यह:\",\"oe\":[\"Needs no transformer at any voltage\",\"Uses the full secondary without a centre tap\",\"Produces no ripple\",\"Uses only one diode drop\"],\"oh\":[\"\",\"केंद्र-टैप बिना पूर्ण द्वितीयक उपयोग करता है\",\"\",\"\"],\"a\":1,\"ee\":\"A bridge does not require a centre-tapped secondary and uses the full winding each half-cycle, though two diode drops occur in the conducting path.\",\"eh\":\"सेतु को केंद्र-टैप नहीं चाहिए, पर पथ में दो डायोड ड्रॉप होते हैं।\"},{\"n\":45,\"d\":\"M\",\"se\":\"Ignoring diode drop, average DC output of a half-wave rectified sine is:\",\"sh\":\"डायोड ड्रॉप उपेक्षित करने पर अर्ध-तरंग ज्यावक्रीय आउटपुट का औसत DC है:\",\"oe\":[\"<span class=\\\"m\\\">2V<sub>m</sub>/π</span>\",\"<span class=\\\"m\\\">V<sub>m</sub>/2</span>\",\"<span class=\\\"m\\\">V<sub>m</sub>/π</span>\",\"<span class=\\\"m\\\">V<sub>m</sub></span>\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Half-wave average is <span class=\\\"m\\\">V<sub>m</sub>/π≈0.318V<sub>m</sub></span>.\",\"eh\":\"अर्ध-तरंग औसत शिखर का लगभग 0.318 है।\"},{\"n\":46,\"d\":\"M\",\"se\":\"Ignoring diode drop, average DC output of a full-wave rectified sine is:\",\"sh\":\"डायोड ड्रॉप उपेक्षित करने पर पूर्ण-तरंग ज्यावक्रीय आउटपुट का औसत DC है:\",\"oe\":[\"<span class=\\\"m\\\">V<sub>m</sub>/π</span>\",\"<span class=\\\"m\\\">2V<sub>m</sub>/π</span>\",\"<span class=\\\"m\\\">V<sub>m</sub>/2π</span>\",\"Zero\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Full-wave average is <span class=\\\"m\\\">2V<sub>m</sub>/π≈0.637V<sub>m</sub></span>, twice the half-wave average.\",\"eh\":\"पूर्ण-तरंग औसत शिखर का लगभग 0.637 है।\"},{\"n\":47,\"d\":\"M\",\"se\":\"If each conducting silicon diode drops 0.7 V, the bridge conduction path loses approximately:\",\"sh\":\"प्रत्येक सिलिकॉन डायोड का ड्रॉप 0.7 V हो तो सेतु चालन पथ का कुल ड्रॉप लगभग है:\",\"oe\":[\"1.4 V\",\"0.7 V\",\"2.8 V\",\"Zero\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Two bridge diodes conduct in series each half-cycle: 2×0.7=1.4 V.\",\"eh\":\"सेतु में एक समय पर दो डायोड चलते हैं, इसलिए कुल ड्रॉप 1.4 V है।\"},{\"n\":48,\"d\":\"M\",\"se\":\"A capacitor-input smoothing filter is connected mainly:\",\"sh\":\"संधारित्र-इनपुट स्मूथिंग फ़िल्टर मुख्यतः जुड़ता है:\",\"oe\":[\"In series with the transformer primary\",\"Across one diode only\",\"In the earth lead\",\"In parallel across the rectifier load\"],\"oh\":[\"\",\"\",\"\",\"दिष्टकारी भार के समानांतर\"],\"a\":3,\"ee\":\"It charges near waveform peaks and supplies load current between peaks, reducing output variation.\",\"eh\":\"संधारित्र शिखर पर चार्ज और बीच में भार को धारा देकर रिपल घटाता है।\"},{\"n\":49,\"d\":\"M\",\"se\":\"With load and frequency unchanged, increasing filter capacitance generally:\",\"sh\":\"भार और आवृत्ति समान हों तो फ़िल्टर धारिता बढ़ाने से सामान्यतः:\",\"oe\":[\"Increases ripple\",\"Reduces ripple\",\"Reverses DC polarity\",\"Doubles diode PIV automatically\"],\"oh\":[\"\",\"रिपल घटता है\",\"\",\"\"],\"a\":1,\"ee\":\"Larger C discharges more slowly between charging peaks, so ripple decreases; peak diode charging current may increase.\",\"eh\":\"बड़ी धारिता धीरे डिस्चार्ज होकर रिपल घटाती है, पर शिखर डायोड धारा बढ़ सकती है।\"},{\"n\":50,\"d\":\"M\",\"se\":\"For a capacitor-filtered supply, increasing load current usually:\",\"sh\":\"संधारित्र-फ़िल्टर आपूर्ति में भार धारा बढ़ाने से सामान्यतः:\",\"oe\":[\"Increases ripple and lowers DC output\",\"Eliminates ripple\",\"Raises output above the peak\",\"Makes regulation perfect\"],\"oh\":[\"रिपल बढ़ता और DC आउटपुट घटता है\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"A heavier load discharges the capacitor faster between peaks, increasing ripple and voltage sag.\",\"eh\":\"अधिक भार संधारित्र को तेज़ डिस्चार्ज करता है।\"},{\"n\":51,\"d\":\"M\",\"se\":\"In a choke-input filter, the choke is connected mainly to:\",\"sh\":\"चोक-इनपुट फ़िल्टर में चोक मुख्यतः किस प्रकार जोड़ा जाता है?\",\"oe\":[\"Short the rectifier output\",\"Pass ripple and block DC\",\"Replace the load\",\"Oppose AC ripple while passing DC load current\"],\"oh\":[\"दिष्टकारी आउटपुट को शॉर्ट करना\",\"रिपल पास और DC रोकना\",\"भार को बदलना\",\"AC रिपल का विरोध और DC भार धारा को पास करना\"],\"a\":3,\"ee\":\"A series choke has low opposition to DC but inductive reactance (X<sub>L</sub>=2\\\\pi fL) for ripple, so it smooths current.\",\"eh\":\"श्रेणी चोक DC को पास करता है, पर रिपल के लिए प्रेरक प्रतिघात देता है।\"},{\"n\":52,\"d\":\"M\",\"se\":\"A conventional capacitor-input π filter has the sequence:\",\"sh\":\"परंपरागत संधारित्र-इनपुट π फ़िल्टर का क्रम है:\",\"oe\":[\"L-C-L\",\"R-L-R\",\"C-L-C\",\"L-R-C\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"The two shunt capacitors and series choke form a C-L-C network whose circuit shape resembles the Greek letter π.\",\"eh\":\"दो समानांतर संधारित्र और बीच का श्रेणी चोक C-L-C नेटवर्क बनाते हैं।\"},{\"n\":53,\"d\":\"M\",\"se\":\"With a light load and capacitor-input filter, the DC output tends to approach:\",\"sh\":\"हल्के भार और संधारित्र-इनपुट फ़िल्टर में DC आउटपुट किसके निकट जाता है?\",\"oe\":[\"Zero\",\"RMS value divided by two\",\"Unfiltered average only\",\"The rectified waveform peak, less diode drops\"],\"oh\":[\"\",\"\",\"\",\"दिष्ट तरंग के शिखर से डायोड ड्रॉप घटाकर\"],\"a\":3,\"ee\":\"The capacitor charges near the peak and discharges little at light load; therefore the no-load voltage can be much higher than the rectified average.\",\"eh\":\"हल्के भार पर संधारित्र कम डिस्चार्ज होकर शिखर के पास वोल्टेज रखता है।\"},{\"n\":54,\"d\":\"H\",\"se\":\"Which expression defines percentage voltage regulation of a DC supply?\",\"sh\":\"DC आपूर्ति के प्रतिशत वोल्टेज नियमन का सही सूत्र है:\",\"oe\":[\"<span class=\\\"m\\\">V<sub>FL</sub>/V<sub>NL</sub>×100</span>\",\"<span class=\\\"m\\\">(V<sub>FL</sub>-V<sub>NL</sub>/V<sub>NL</sub>×100</span>\",\"<span class=\\\"m\\\">(V<sub>NL</sub>-V<sub>FL</sub>/V<sub>FL</sub>×100</span>\",\"<span class=\\\"m\\\">(V<sub>NL</sub>+V<sub>FL</sub>/V<sub>FL</sub>×100</span>\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Regulation measures the fall from no-load voltage (V<sub>NL</sub>) to full-load voltage (V<sub>FL</sub>), referenced conventionally to full-load value. Smaller percentage means better regulation.\",\"eh\":\"कम प्रतिशत बेहतर नियमन दर्शाता है।\"},{\"n\":55,\"d\":\"H\",\"se\":\"Choose the correct block order of a basic regulated mains-powered DC supply:\",\"sh\":\"मूल विनियमित मेन्स-चालित DC आपूर्ति का सही ब्लॉक क्रम चुनिए:\",\"oe\":[\"Filter → transformer → load → rectifier → regulator\",\"Transformer → rectifier → filter → regulator → load\",\"Rectifier → regulator → transformer → filter → load\",\"Regulator → transformer → rectifier → load → filter\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"The transformer changes/isolates AC, the rectifier makes pulsating DC, the filter smooths it, and the regulator stabilizes the voltage delivered to the load.\",\"eh\":\"ट्रांसफॉर्मर, दिष्टकारी, फ़िल्टर और नियामक क्रमशः रूपांतरण, दिष्टीकरण, स्मूथिंग और स्थिरीकरण करते हैं।\"},{\"n\":56,\"d\":\"H\",\"se\":\"In a simple Zener shunt regulator, the Zener diode is connected:\",\"sh\":\"सरल ज़ेनर शंट नियामक में ज़ेनर डायोड जुड़ता है:\",\"oe\":[\"Reverse-biased in parallel with the load\",\"Forward-biased in series with the load\",\"Across the transformer primary\",\"In series with the rectifier diode only\"],\"oh\":[\"पश्च अभिनत होकर भार के समानांतर\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"A series resistor limits current, while the reverse-biased Zener clamps the load voltage near (V<sub>Z</sub>). The resistor must safely carry load plus Zener current.\",\"eh\":\"श्रेणी प्रतिरोध धारा सीमित करता है और समानांतर ज़ेनर वोल्टेज स्थिर रखता है।\"},{\"n\":57,\"d\":\"H\",\"se\":\"A 12 V source feeds a 5.1 V Zener through 330 Ω. Ignoring load current, resistor/Zener current is closest to:\",\"sh\":\"12 V स्रोत, 5.1 V ज़ेनर और 330 Ω श्रेणी प्रतिरोध में भार धारा उपेक्षित हो तो धारा लगभग है:\",\"oe\":[\"5.1 mA\",\"20.9 mA\",\"36.4 mA\",\"69 mA\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"(I=(12-5.1)/330=6.9/330=0.0209\\\\text{ A}=20.9\\\\text{ mA}). Check Zener power too: (P<sub>Z</sub>\\\\approx5.1\\\\times0.0209=0.107\\\\text{ W}).\",\"eh\":\"धारा 20.9 mA और ज़ेनर शक्ति लगभग 0.107 W है।\"},{\"n\":58,\"d\":\"H\",\"se\":\"A properly connected 7805 three-terminal regulator nominally provides:\",\"sh\":\"सही प्रकार जुड़े 7805 त्रि-टर्मिनल नियामक का नाममात्र आउटपुट है:\",\"oe\":[\"−5 V\",\"+8 V\",\"+12 V\",\"+5 V\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"In the 78xx fixed positive-regulator family, &ldquo;05&rdquo; denotes +5 V. Adequate input headroom, bypass capacitors and thermal limits still matter.\",\"eh\":\"78xx धनात्मक नियामक है और 05 का अर्थ +5 V है।\"},{\"n\":59,\"d\":\"H\",\"se\":\"The 79xx family is generally used for:\",\"sh\":\"79xx परिवार सामान्यतः किसके लिए है?\",\"oe\":[\"Fixed negative voltage regulation\",\"Fixed positive voltage regulation\",\"Digital frequency division\",\"Optical isolation\"],\"oh\":[\"स्थिर ऋणात्मक वोल्टेज नियमन\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"79xx devices are fixed negative regulators; for example, 7905 is nominally −5 V. Pinouts must be checked rather than assumed from 78xx devices.\",\"eh\":\"79xx स्थिर ऋणात्मक नियामक परिवार है; पिनआउट डेटा-पत्र से जाँचें।\"},{\"n\":60,\"d\":\"H\",\"se\":\"Which IC is a commonly used adjustable positive linear voltage regulator?\",\"sh\":\"सामान्य समायोज्य धनात्मक रैखिक वोल्टेज नियामक IC है:\",\"oe\":[\"7400\",\"555\",\"LM317\",\"7905\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"LM317 uses an external resistor divider to set its output (within input, dropout, current and thermal limits). The 7400 is a NAND-gate IC, 555 a timer, and 7905 a fixed negative regulator.\",\"eh\":\"LM317 बाहरी प्रतिरोधों से समायोज्य धनात्मक आउटपुट देता है।\"},{\"n\":61,\"d\":\"E\",\"se\":\"Voltage gain is defined as:\",\"sh\":\"वोल्टेज लाभ की परिभाषा है:\",\"oe\":[\"<span class=\\\"m\\\">I<sub>o</sub>/I<sub>i</sub></span>\",\"<span class=\\\"m\\\">P<sub>o</sub>/P<sub>i</sub></span>\",\"<span class=\\\"m\\\">V<sub>i</sub>/V<sub>o</sub></span>\",\"<span class=\\\"m\\\">V<sub>o</sub>/V<sub>i</sub></span>\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Voltage gain (A<sub>v</sub>=V<sub>o</sub>/V<sub>i</sub>). A negative sign, when shown, indicates phase inversion rather than a negative magnitude.\",\"eh\":\"वोल्टेज लाभ आउटपुट और इनपुट वोल्टेज का अनुपात है।\"},{\"n\":62,\"d\":\"E\",\"se\":\"Current gain is:\",\"sh\":\"धारा लाभ है:\",\"oe\":[\"<span class=\\\"m\\\">I<sub>o</sub>/I<sub>i</sub></span>\",\"<span class=\\\"m\\\">V<sub>o</sub>/V<sub>i</sub></span>\",\"<span class=\\\"m\\\">P<sub>i</sub>/P<sub>o</sub></span>\",\"<span class=\\\"m\\\">R<sub>o</sub>/R<sub>i</sub></span>\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Current gain compares output current with input current under the stated circuit conditions.\",\"eh\":\"धारा लाभ आउटपुट धारा का इनपुट धारा से अनुपात है।\"},{\"n\":63,\"d\":\"E\",\"se\":\"Power gain is expressed as:\",\"sh\":\"शक्ति लाभ व्यक्त किया जाता है:\",\"oe\":[\"<span class=\\\"m\\\">V<sub>i</sub>/V<sub>o</sub></span>\",\"<span class=\\\"m\\\">P<sub>o</sub>/P<sub>i</sub></span>\",\"<span class=\\\"m\\\">I<sub>i</sub>/I<sub>o</sub></span>\",\"<span class=\\\"m\\\">R<sub>i</sub>/R<sub>o</sub></span>\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"(A<sub>p</sub>=P<sub>o</sub>/P<sub>i</sub>). In compatible conditions, power gain is also the product of voltage-gain and current-gain magnitudes.\",\"eh\":\"शक्ति लाभ आउटपुट शक्ति और इनपुट शक्ति का अनुपात है।\"},{\"n\":64,\"d\":\"E\",\"se\":\"For a voltage ratio (A<sub>v</sub>), gain in decibels is:\",\"sh\":\"वोल्टेज अनुपात (A<sub>v</sub>) के लिए डेसीबल लाभ है:\",\"oe\":[\"<span class=\\\"m\\\">10\\\\log<sub>10A</sub><sub>v</sub></span>\",\"<span class=\\\"m\\\">A<sub>v</sub>/20</span>\",\"<span class=\\\"m\\\">20\\\\log<sub>10A</sub><sub>v</sub></span>\",\"<span class=\\\"m\\\">20A<sub>v</sub></span>\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"With equal impedance assumptions, voltage or current ratios use (20\\\\log<sub>10</sub>), while a power ratio uses (10\\\\log<sub>10</sub>).\",\"eh\":\"समान प्रतिबाधा पर वोल्टेज अनुपात के लिए 20 log और शक्ति अनुपात के लिए 10 log होता है।\"},{\"n\":65,\"d\":\"E\",\"se\":\"A voltage gain of 10 corresponds to:\",\"sh\":\"10 के वोल्टेज लाभ का डेसीबल मान है:\",\"oe\":[\"20 dB\",\"10 dB\",\"40 dB\",\"100 dB\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"(20\\\\log<sub>10</sub>(10)=20\\\\text{ dB}).\",\"eh\":\"10 का वोल्टेज अनुपात 20 dB है।\"},{\"n\":66,\"d\":\"E\",\"se\":\"For cascaded amplifier stages, overall linear gain and dB gain are respectively found by:\",\"sh\":\"कैस्केड प्रवर्धक चरणों में कुल रैखिक लाभ और dB लाभ क्रमशः कैसे मिलते हैं?\",\"oe\":[\"Adding both\",\"Multiplying both\",\"Multiplying linear gains and adding dB gains\",\"Subtracting both\"],\"oh\":[\"\",\"\",\"रैखिक लाभ गुणा, dB लाभ जोड़\",\"\"],\"a\":2,\"ee\":\"Stage ratios multiply: (A=A_1A_2\\\\cdots). Logarithms convert that product into a sum in decibels.\",\"eh\":\"चरणों के रैखिक लाभ गुणा होते हैं और dB लाभ जुड़ते हैं।\"},{\"n\":67,\"d\":\"M\",\"se\":\"An amplifier has lower and upper cut-off frequencies (f_L=200\\\\) Hz and (f_H=8.2\\\\) kHz. Its bandwidth is:\",\"sh\":\"किसी प्रवर्धक में (f_L=200\\\\) Hz और (f_H=8.2\\\\) kHz है। बैंडविड्थ है:\",\"oe\":[\"8.4 kHz\",\"4.1 kHz\",\"8.2 kHz\",\"8.0 kHz\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"(BW=f_H-f_L=8200-200=8000\\\\text{ Hz}=8.0\\\\text{ kHz}). Cut-off points are commonly the −3 dB points.\",\"eh\":\"बैंडविड्थ ऊपरी और निचली कट-ऑफ आवृत्तियों का अंतर है।\"},{\"n\":68,\"d\":\"M\",\"se\":\"A common-emitter voltage amplifier normally produces an output that is:\",\"sh\":\"कॉमन-एमिटर वोल्टेज प्रवर्धक का आउटपुट सामान्यतः होता है:\",\"oe\":[\"Always zero\",\"Approximately 180° out of phase with input\",\"Exactly 90° ahead\",\"Unamplified and in phase\"],\"oh\":[\"\",\"इनपुट से लगभग 180° विपरीत फेज\",\"\",\"\"],\"a\":1,\"ee\":\"Increasing base drive increases collector current, increasing collector-resistor drop and lowering collector voltage; hence voltage inversion.\",\"eh\":\"बेस धारा बढ़ने पर कलेक्टर वोल्टेज घटता है, इसलिए 180° फेज उलटाव मिलता है।\"},{\"n\":69,\"d\":\"M\",\"se\":\"The common-collector (emitter-follower) stage is known for:\",\"sh\":\"कॉमन-कलेक्टर (एमिटर-फॉलोअर) चरण की विशेषता है:\",\"oe\":[\"Very high voltage gain and phase inversion\",\"Voltage gain near unity, high input and low output impedance\",\"No current gain\",\"Oscillation without feedback\"],\"oh\":[\"\",\"लगभग इकाई वोल्टेज लाभ, उच्च इनपुट व कम आउटपुट प्रतिबाधा\",\"\",\"\"],\"a\":1,\"ee\":\"An emitter follower is valuable as a buffer: it offers current gain and impedance transformation, but voltage gain is slightly below unity.\",\"eh\":\"यह बफर के रूप में उच्च इनपुट और कम आउटपुट प्रतिबाधा देता है।\"},{\"n\":70,\"d\":\"M\",\"se\":\"A common-base BJT stage characteristically has:\",\"sh\":\"कॉमन-बेस BJT चरण की सामान्य विशेषता है:\",\"oe\":[\"High input impedance and 180° inversion\",\"Infinite current gain\",\"Zero voltage gain\",\"Low input impedance, high output impedance and no voltage phase reversal\"],\"oh\":[\"\",\"\",\"\",\"कम इनपुट, उच्च आउटपुट प्रतिबाधा और वोल्टेज फेज उलटाव नहीं\"],\"a\":3,\"ee\":\"Common-base current gain (α) is slightly below one, but voltage gain can exceed one. Its low input capacitance effect suits high-frequency use.\",\"eh\":\"कॉमन-बेस का धारा लाभ एक से थोड़ा कम, पर वोल्टेज लाभ अधिक हो सकता है।\"},{\"n\":71,\"d\":\"M\",\"se\":\"In a Class-A amplifier, the active device conducts for:\",\"sh\":\"क्लास-A प्रवर्धक में सक्रिय युक्ति कितने चक्र तक चालन करती है?\",\"oe\":[\"90°\",\"180°\",\"360°\",\"Less than 180°\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Class A conducts through the entire input cycle, giving good linearity but relatively low efficiency.\",\"eh\":\"क्लास-A पूरे 360° चक्र में चालन करता है, अतः रैखिकता अच्छी पर दक्षता कम होती है।\"},{\"n\":72,\"d\":\"M\",\"se\":\"Ideally, each device in a Class-B push-pull output stage conducts for:\",\"sh\":\"आदर्श क्लास-B पुश-पुल चरण में प्रत्येक युक्ति चालन करती है:\",\"oe\":[\"180°\",\"360°\",\"270°\",\"90°\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Each transistor handles one half-cycle. Combining both halves reconstructs the waveform, but the zero crossing can suffer crossover distortion.\",\"eh\":\"प्रत्येक ट्रांजिस्टर आधा चक्र चलाता है; शून्य-क्रॉसिंग पर विकृति हो सकती है।\"},{\"n\":73,\"d\":\"M\",\"se\":\"The conduction angle of a Class-AB amplifier lies:\",\"sh\":\"क्लास-AB प्रवर्धक का चालन कोण होता है:\",\"oe\":[\"Below 90°\",\"Exactly 180°\",\"Greater than 180° but less than 360°\",\"Exactly 360°\"],\"oh\":[\"\",\"\",\"180° से अधिक पर 360° से कम\",\"\"],\"a\":2,\"ee\":\"Slight forward bias makes both devices conduct around zero crossing, reducing Class-B crossover distortion at some cost in idle power.\",\"eh\":\"हल्की अभिनति शून्य-क्रॉसिंग विकृति घटाती है।\"},{\"n\":74,\"d\":\"M\",\"se\":\"Class-C operation is mainly suited to:\",\"sh\":\"क्लास-C संचालन मुख्यतः किसके लिए उपयुक्त है?\",\"oe\":[\"Precision DC amplification\",\"Tuned RF power amplification\",\"Audio preamplifiers without filters\",\"Linear instrumentation amplifiers\"],\"oh\":[\"\",\"ट्यूनित RF शक्ति प्रवर्धन\",\"\",\"\"],\"a\":1,\"ee\":\"The device conducts for less than 180°, creating pulses; a resonant tuned circuit selects the desired sinusoidal RF component.\",\"eh\":\"180° से कम चालन के पल्सों से ट्यूनित परिपथ वांछित RF ज्यावक्र बनाता है।\"},{\"n\":75,\"d\":\"M\",\"se\":\"Crossover distortion in an unbiased complementary Class-B stage occurs mainly:\",\"sh\":\"अभिनति-विहीन पूरक क्लास-B चरण में क्रॉसओवर विकृति मुख्यतः होती है:\",\"oe\":[\"Near the zero crossing because neither transistor initially conducts\",\"Only at maximum supply voltage\",\"Because both devices are permanently saturated\",\"Due to transformer core loss only\"],\"oh\":[\"शून्य-क्रॉसिंग के पास क्योंकि प्रारंभ में कोई ट्रांजिस्टर नहीं चलता\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Each silicon base-emitter junction needs forward voltage before conduction, creating a small dead band. Class-AB bias reduces it.\",\"eh\":\"बेस-एमिटर दहलीज के कारण डेड-बैंड बनता है; क्लास-AB अभिनति इसे घटाती है।\"},{\"n\":76,\"d\":\"H\",\"se\":\"Applying negative feedback to a well-designed amplifier generally:\",\"sh\":\"सुविकसित प्रवर्धक में ऋणात्मक पुनर्भरण सामान्यतः:\",\"oe\":[\"Raises gain without limit\",\"Guarantees oscillation\",\"Narrows bandwidth and increases distortion\",\"Reduces gain but improves stability, linearity and often bandwidth\"],\"oh\":[\"\",\"\",\"\",\"लाभ घटाकर स्थिरता, रैखिकता और प्रायः बैंडविड्थ सुधारता है\"],\"a\":3,\"ee\":\"Negative feedback trades some open-loop gain for predictable closed-loop gain, lower distortion and wider response, provided stability margins are adequate.\",\"eh\":\"ऋणात्मक पुनर्भरण कुछ लाभ के बदले स्थिरता, कम विकृति और व्यापक प्रतिक्रिया देता है।\"},{\"n\":77,\"d\":\"H\",\"se\":\"An electronic oscillator sustains an AC output without an external periodic input by using:\",\"sh\":\"इलेक्ट्रॉनिक दोलक बाहरी आवर्ती इनपुट के बिना AC आउटपुट बनाए रखता है:\",\"oe\":[\"DC supply plus frequency-selective positive feedback\",\"A rectifier alone\",\"Negative feedback only\",\"An open circuit\"],\"oh\":[\"DC आपूर्ति तथा आवृत्ति-चयनात्मक धनात्मक पुनर्भरण\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"The active device converts DC power into an AC signal; the feedback network returns the correct phase and selects frequency.\",\"eh\":\"सक्रिय युक्ति DC ऊर्जा को AC में बदलती और पुनर्भरण नेटवर्क आवृत्ति चुनता है।\"},{\"n\":78,\"d\":\"H\",\"se\":\"For sustained sinusoidal oscillation at the oscillation frequency, the Barkhausen condition is ideally:\",\"sh\":\"सतत ज्यावक्रीय दोलन हेतु आदर्श बार्कहाउज़ेन शर्त है:\",\"oe\":[\"<span class=\\\"m\\\">|Aβ|=0</span>, phase 180°\",\"<span class=\\\"m\\\">|Aβ|&lt;1</span>, any phase\",\"<span class=\\\"m\\\">|Aβ|&gt;10</span>, phase 90°\",\"<span class=\\\"m\\\">|Aβ|=1</span>, total loop phase 0° or 360°\"],\"oh\":[\"\",\"\",\"\",\"लूप फेज 0° या 360°\"],\"a\":3,\"ee\":\"Unity loop-gain magnitude maintains amplitude and a net 0°/360° phase makes feedback regenerative. Start-up normally requires loop gain slightly above one before nonlinear limiting settles it.\",\"eh\":\"आरंभ में लाभ थोड़ा अधिक होकर बाद में आयाम स्थिर होता है।\"},{\"n\":79,\"d\":\"H\",\"se\":\"Which pairing is most appropriate?\",\"sh\":\"कौन-सा युग्म सर्वाधिक उपयुक्त है?\",\"oe\":[\"RC oscillator—microwave only; LC oscillator—DC only\",\"Both are only power-supply filters\",\"RC oscillator—low/audio frequencies; LC oscillator—radio frequencies\",\"LC oscillator—requires no reactive component\"],\"oh\":[\"\",\"\",\"RC—निम्न/ऑडियो, LC—रेडियो आवृत्तियाँ\",\"\"],\"a\":2,\"ee\":\"RC networks are convenient at low frequencies; LC resonant tanks are efficient at higher/radio frequencies. Practical ranges overlap, so this is a design tendency, not an absolute boundary.\",\"eh\":\"RC निम्न और LC उच्च/RF आवृत्तियों में सामान्य है।\"},{\"n\":80,\"d\":\"H\",\"se\":\"Among RC, LC and quartz-crystal oscillators, the best frequency stability is generally provided by:\",\"sh\":\"RC, LC और क्वार्ट्ज-क्रिस्टल दोलकों में सामान्यतः सर्वोत्तम आवृत्ति स्थिरता देता है:\",\"oe\":[\"RC phase-shift oscillator\",\"Quartz-crystal oscillator\",\"LC Hartley oscillator\",\"Any oscillator equally\"],\"oh\":[\"\",\"क्वार्ट्ज-क्रिस्टल दोलक\",\"\",\"\"],\"a\":1,\"ee\":\"A quartz crystal has a very high Q and precise mechanical resonance, so its frequency drifts much less than ordinary RC or LC networks.\",\"eh\":\"क्रिस्टल का उच्च Q और सटीक अनुनाद बहुत अच्छी स्थिरता देते हैं।\"},{\"n\":81,\"d\":\"E\",\"se\":\"The two binary digits are:\",\"sh\":\"दो द्विआधारी अंक हैं:\",\"oe\":[\"1 and 2\",\"0 and 9\",\"0 and 1\",\"A and B\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Binary is a base-2 number system using only 0 and 1; digital circuits represent them with two defined logic ranges.\",\"eh\":\"द्विआधारी प्रणाली आधार-2 है और केवल 0, 1 प्रयोग करती है।\"},{\"n\":82,\"d\":\"E\",\"se\":\"Decimal 13 in binary is:\",\"sh\":\"दशमलव 13 का द्विआधारी रूप है:\",\"oe\":[\"1011\",\"1101\",\"1110\",\"1001\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"(13=8+4+1), so the (8,4,2,1) bits are 1,1,0,1: (1101_2).\",\"eh\":\"13 = 8 + 4 + 1, अतः 1101₂।\"},{\"n\":83,\"d\":\"E\",\"se\":\"Binary (10110_2) equals decimal:\",\"sh\":\"द्विआधारी (10110_2) का दशमलव मान है:\",\"oe\":[\"18\",\"20\",\"24\",\"22\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"(1\\\\times16+0\\\\times8+1\\\\times4+1\\\\times2+0=22).\",\"eh\":\"स्थानिक भार जोड़ने पर 16 + 4 + 2 = 22।\"},{\"n\":84,\"d\":\"E\",\"se\":\"Hexadecimal digit A represents decimal:\",\"sh\":\"षोडशाधारी अंक A का दशमलव मान है:\",\"oe\":[\"10\",\"11\",\"12\",\"15\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Hexadecimal uses 0–9 followed by A–F for decimal values 10–15.\",\"eh\":\"षोडशाधारी में A से F क्रमशः 10 से 15 हैं।\"},{\"n\":85,\"d\":\"E\",\"se\":\"Binary (1111_2) is hexadecimal:\",\"sh\":\"द्विआधारी (1111_2) का षोडशाधारी रूप है:\",\"oe\":[\"E\",\"10\",\"A\",\"F\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"(1111_2=8+4+2+1=15<sub>10</sub>=F<sub>16</sub>). One hexadecimal digit represents four binary bits.\",\"eh\":\"चार बिट 1111 का हेक्स मान F है।\"},{\"n\":86,\"d\":\"E\",\"se\":\"Octal (17_8) equals decimal:\",\"sh\":\"अष्टाधारी (17_8) का दशमलव मान है:\",\"oe\":[\"17\",\"16\",\"15\",\"14\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"(1\\\\times8+7=15). Octal digits can only range from 0 to 7.\",\"eh\":\"1×8 + 7 = 15 और अष्टाधारी अंक 0–7 होते हैं।\"},{\"n\":87,\"d\":\"M\",\"se\":\"The 8421 BCD code for decimal digit 9 is:\",\"sh\":\"दशमलव अंक 9 का 8421 BCD कोड है:\",\"oe\":[\"1001\",\"1010\",\"1111\",\"0111\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"BCD encodes each decimal digit separately in four bits; 9 is (1001). Codes 1010 through 1111 are invalid for a single 8421-BCD digit.\",\"eh\":\"BCD में प्रत्येक दशमलव अंक अलग चार बिट में होता है।\"},{\"n\":88,\"d\":\"M\",\"se\":\"The 8421 BCD representation of decimal 12 is:\",\"sh\":\"दशमलव 12 का 8421 BCD निरूपण है:\",\"oe\":[\"1100\",\"0001 0010\",\"1010 0010\",\"0000 1100\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Encode decimal digits separately: 1→0001 and 2→0010. Binary 12 is 1100, but that is not its two-digit BCD form.\",\"eh\":\"1 और 2 को अलग-अलग चार बिट में कोड करने पर 0001 0010 मिलता है।\"},{\"n\":89,\"d\":\"M\",\"se\":\"ASCII is primarily a code for representing:\",\"sh\":\"ASCII मुख्यतः किसके निरूपण का कोड है?\",\"oe\":[\"Characters such as letters, digits and control symbols\",\"Analog voltage gain\",\"Transformer turns ratio\",\"Only image pixels\"],\"oh\":[\"अक्षर, अंक और नियंत्रण चिह्न\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"ASCII assigns numeric codes to characters and controls. Standard ASCII is 7-bit; &ldquo;extended ASCII&rdquo; refers to several non-universal 8-bit extensions.\",\"eh\":\"मानक ASCII 7-बिट वर्ण कोड है।\"},{\"n\":90,\"d\":\"M\",\"se\":\"A two-input AND gate produces logic 1 when:\",\"sh\":\"दो-इनपुट AND गेट का आउटपुट 1 कब होता है?\",\"oe\":[\"Either input is 0\",\"Inputs are different\",\"At least one input is 1\",\"Both inputs are 1\"],\"oh\":[\"\",\"\",\"\",\"दोनों इनपुट 1 हों\"],\"a\":3,\"ee\":\"AND implements (Y=A\\\\cdot B); its only high-output row is (A=1,B=1).\",\"eh\":\"AND का आउटपुट केवल सभी इनपुट 1 होने पर 1 है।\"},{\"n\":91,\"d\":\"M\",\"se\":\"A two-input OR gate produces logic 1 when:\",\"sh\":\"दो-इनपुट OR गेट का आउटपुट 1 कब होता है?\",\"oe\":[\"Both inputs are 0\",\"At least one input is 1\",\"Inputs are equal only\",\"Both inputs are floating\"],\"oh\":[\"\",\"कम-से-कम एक इनपुट 1 हो\",\"\",\"\"],\"a\":1,\"ee\":\"Inclusive OR gives 0 only for 00; it gives 1 for 01, 10 and 11.\",\"eh\":\"OR केवल 00 पर 0 और अन्य तीन संयोजनों पर 1 देता है।\"},{\"n\":92,\"d\":\"M\",\"se\":\"A NOT gate performs:\",\"sh\":\"NOT गेट क्या करता है?\",\"oe\":[\"Addition\",\"Memory storage\",\"Logical complementation\",\"Frequency multiplication\"],\"oh\":[\"\",\"\",\"तार्किक पूरकन\",\"\"],\"a\":2,\"ee\":\"An inverter outputs the opposite logic state: 0→1 and 1→0, written (Y=\\\\overline{A}).\",\"eh\":\"इन्वर्टर इनपुट का विपरीत लॉजिक देता है।\"},{\"n\":93,\"d\":\"M\",\"se\":\"Which gate alone can be interconnected to realize any Boolean function?\",\"sh\":\"कौन-सा गेट अकेले जोड़कर कोई भी बूलियन फलन बनाया जा सकता है?\",\"oe\":[\"XOR only\",\"NAND\",\"Buffer only\",\"XNOR only\"],\"oh\":[\"\",\"नैंड\",\"\",\"\"],\"a\":1,\"ee\":\"NAND is a universal gate because NOT, AND and OR—and therefore any Boolean expression—can be constructed from NAND gates.\",\"eh\":\"NAND से NOT, AND और OR बन सकते हैं, इसलिए यह सार्वत्रिक है।\"},{\"n\":94,\"d\":\"M\",\"se\":\"Which other gate is also universal?\",\"sh\":\"कौन-सा अन्य गेट भी सार्वत्रिक है?\",\"oe\":[\"NOR\",\"XOR\",\"AND without inversion\",\"OR without inversion\"],\"oh\":[\"नॉर\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"NOR alone can implement inversion, OR and AND using De Morgan&rsquo;s laws, so it is also functionally complete.\",\"eh\":\"डी मॉर्गन नियमों से NOR द्वारा सभी मूल फलन बनाए जा सकते हैं।\"},{\"n\":95,\"d\":\"M\",\"se\":\"For a two-input XOR gate, output is 1 when:\",\"sh\":\"दो-इनपुट XOR गेट का आउटपुट 1 कब होता है?\",\"oe\":[\"Both inputs are 0\",\"Both inputs are 1\",\"Inputs are different\",\"Inputs are always equal\"],\"oh\":[\"\",\"\",\"इनपुट भिन्न हों\",\"\"],\"a\":2,\"ee\":\"XOR truth table is 00→0, 01→1, 10→1, 11→0; it detects inequality for two inputs.\",\"eh\":\"XOR दो इनपुट भिन्न होने पर 1 देता है।\"},{\"n\":96,\"d\":\"H\",\"se\":\"For a two-input XNOR gate, output is 1 when:\",\"sh\":\"दो-इनपुट XNOR गेट का आउटपुट 1 कब होता है?\",\"oe\":[\"Only input A is 1\",\"Inputs are different\",\"Exactly one input is 1\",\"Inputs are equal\"],\"oh\":[\"\",\"\",\"\",\"इनपुट समान हों\"],\"a\":3,\"ee\":\"XNOR is the complement of XOR: it gives 1 for 00 and 11, acting as a one-bit equality detector.\",\"eh\":\"XNOR समान इनपुट 00 या 11 पर 1 देता है।\"},{\"n\":97,\"d\":\"H\",\"se\":\"In a half adder, the Sum and Carry outputs are respectively:\",\"sh\":\"हाफ-एडर में Sum और Carry आउटपुट क्रमशः हैं:\",\"oe\":[\"AND and OR\",\"OR and XOR\",\"XOR and AND\",\"XNOR and NOT\"],\"oh\":[\"\",\"\",\"XOR तथा AND\",\"\"],\"a\":2,\"ee\":\"For inputs A and B, (S=A\\\\oplus B) and (C=A\\\\cdot B). A half adder has no carry-in input.\",\"eh\":\"हाफ-एडर में Sum = XOR, Carry = AND और carry-in नहीं होता।\"},{\"n\":98,\"d\":\"H\",\"se\":\"A full adder differs from a half adder because it adds:\",\"sh\":\"फुल-एडर हाफ-एडर से भिन्न है क्योंकि यह जोड़ता है:\",\"oe\":[\"Two operand bits plus a carry-in bit\",\"Decimal digits only\",\"Only one input bit\",\"Analog voltages\"],\"oh\":[\"दो ऑपरेंड बिट और एक carry-in बिट\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"A full adder accepts A, B and (C<sub>in</sub>), producing Sum and (C<sub>out</sub>). Multiple stages form a multi-bit binary adder.\",\"eh\":\"फुल-एडर A, B और carry-in लेकर Sum और carry-out देता है।\"},{\"n\":99,\"d\":\"H\",\"se\":\"Which statement correctly distinguishes a multiplexer from a demultiplexer?\",\"sh\":\"मल्टीप्लेक्सर और डीमल्टीप्लेक्सर का सही अंतर है:\",\"oe\":[\"Both only store one bit\",\"A MUX selects one of many inputs to one output; a DEMUX routes one input to one of many outputs\",\"A MUX converts AC to DC\",\"A DEMUX is always an analog amplifier\"],\"oh\":[\"\",\"MUX अनेक इनपुट में एक चुनता, DEMUX एक इनपुट को अनेक आउटपुट में किसी एक पर भेजता है\",\"\",\"\"],\"a\":1,\"ee\":\"Select lines control the chosen path. With (n) select lines, an ideal arrangement can select among (2^n) paths.\",\"eh\":\"चयन रेखाएँ मार्ग चुनती हैं; (n) चयन बिट (2^n) मार्ग चुन सकते हैं।\"},{\"n\":100,\"d\":\"H\",\"se\":\"Choose the correctly matched set:\",\"sh\":\"सही मिलान चुनिए:\",\"oe\":[\"Flip-flop—rectifies AC; counter—amplifies audio; shift register—regulates voltage\",\"Flip-flop—stores a byte; counter—stores no state; shift register—only generates sine waves\",\"Flip-flop—selects analog channels; counter—isolates circuits; shift register—rectifies pulses\",\"Flip-flop—stores one bit; counter—counts clock events; shift register—stores/moves a bit pattern\"],\"oh\":[\"\",\"\",\"\",\"फ्लिप-फ्लॉप—एक बिट, काउंटर—क्लॉक गणना, शिफ्ट रजिस्टर—बिट पैटर्न संचय/स्थानांतरण\"],\"a\":3,\"ee\":\"Flip-flops are basic one-bit storage elements. Counters change state in a prescribed sequence per clock, while shift registers transfer stored bits stage by stage.\",\"eh\":\"फ्लिप-फ्लॉप एक बिट रखता, काउंटर पल्स गिनता और शिफ्ट रजिस्टर बिटों को चरण-दर-चरण खिसकाता है।\"}]},{\"id\":\"s03\",\"num\":3,\"name\":\"Radio Principles, Modulation, Transmitters, Receivers, Antennas and Feeders\",\"q\":[{\"n\":1,\"d\":\"E\",\"se\":\"The SI unit of radio frequency is:\",\"sh\":\"रेडियो आवृत्ति की SI इकाई है:\",\"oe\":[\"Metre\",\"Watt\",\"Hertz\",\"Weber\"],\"oh\":[\"मीटर\",\"वाट\",\"हर्ट्ज़\",\"वेबर\"],\"a\":2,\"ee\":\"Hertz means cycles per second. kHz, MHz and GHz are (10^3), (10^6) and (10^9) hertz respectively.\",\"eh\":\"हर्ट्ज़ का अर्थ प्रति सेकंड चक्र है; kHz, MHz और GHz इसके गुणक हैं।\"},{\"n\":2,\"d\":\"E\",\"se\":\"The fundamental relation among wave velocity (v), frequency (f) and wavelength (\\\\lambda) is:\",\"sh\":\"तरंग वेग (v), आवृत्ति (f) और तरंगदैर्घ्य (\\\\lambda) का मूल संबंध है:\",\"oe\":[\"(v=f/\\\\lambda)\",\"(v=\\\\lambda/f)\",\"(v=f+\\\\lambda)\",\"(v=f\\\\lambda)\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"A wave travels one wavelength per cycle, so velocity equals frequency multiplied by wavelength.\",\"eh\":\"एक चक्र में तरंग एक तरंगदैर्घ्य चलती है, इसलिए (v=f\\\\lambda)।\"},{\"n\":3,\"d\":\"E\",\"se\":\"Radio waves in free space travel at approximately:\",\"sh\":\"मुक्त अंतरिक्ष में रेडियो तरंगों का वेग लगभग है:\",\"oe\":[\"(3\\\\times10^8\\\\) m/s\",\"(3\\\\times10^5\\\\) m/s\",\"(3\\\\times10^3\\\\) m/s\",\"340 m/s\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Radio waves are electromagnetic waves and travel in vacuum at the speed of light, approximately (3\\\\times10^8\\\\) m/s.\",\"eh\":\"रेडियो तरंगें विद्युतचुंबकीय हैं और निर्वात में प्रकाश के वेग से चलती हैं।\"},{\"n\":4,\"d\":\"E\",\"se\":\"The free-space wavelength at 100 MHz is approximately:\",\"sh\":\"100 MHz पर मुक्त-अंतरिक्ष तरंगदैर्घ्य लगभग है:\",\"oe\":[\"0.3 m\",\"3 m\",\"30 m\",\"300 m\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"(\\\\lambda=c/f=(3\\\\times10^8)/(100\\\\times10^6)=3\\\\) m.\",\"eh\":\"(\\\\lambda=c/f) लगाने पर 3 मीटर मिलता है।\"},{\"n\":5,\"d\":\"E\",\"se\":\"A frequency of 10 MHz lies in the:\",\"sh\":\"10 MHz आवृत्ति किस बैंड में आती है?\",\"oe\":[\"MF\",\"HF\",\"VHF\",\"UHF\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"ITU nomenclature places HF from 3 to 30 MHz. MF is 0.3–3 MHz and VHF is 30–300 MHz.\",\"eh\":\"ITU के अनुसार HF 3–30 MHz है।\"},{\"n\":6,\"d\":\"E\",\"se\":\"A frequency of 100 MHz lies in the:\",\"sh\":\"100 MHz आवृत्ति किस बैंड में आती है?\",\"oe\":[\"LF\",\"MF\",\"HF\",\"VHF\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"VHF covers 30–300 MHz; therefore 100 MHz is VHF.\",\"eh\":\"VHF की सीमा 30–300 MHz है।\"},{\"n\":7,\"d\":\"E\",\"se\":\"The chief purpose of modulation in radio communication is to:\",\"sh\":\"रेडियो संचार में मॉड्यूलेशन का मुख्य उद्देश्य है:\",\"oe\":[\"Eliminate the information signal\",\"Make the antenna infinitely long\",\"place information on a suitable high-frequency carrier\",\"Convert all signals to DC\"],\"oh\":[\"\",\"\",\"सूचना को उपयुक्त उच्च-आवृत्ति वाहक पर चढ़ाना\",\"\"],\"a\":2,\"ee\":\"Modulation enables practical antenna size, efficient radiation, channel allocation and separation of simultaneous services.\",\"eh\":\"मॉड्यूलेशन व्यावहारिक एंटीना, प्रभावी विकिरण और चैनल पृथक्करण संभव करता है।\"},{\"n\":8,\"d\":\"E\",\"se\":\"In a radio system, the carrier is:\",\"sh\":\"रेडियो प्रणाली में वाहक है:\",\"oe\":[\"The loudspeaker output\",\"A high-frequency wave varied by the information\",\"The DC supply only\",\"Atmospheric noise\"],\"oh\":[\"\",\"सूचना द्वारा परिवर्तित उच्च-आवृत्ति तरंग\",\"\",\"\"],\"a\":1,\"ee\":\"The carrier provides the RF transport mechanism; modulation varies one of its parameters according to the information signal.\",\"eh\":\"वाहक RF माध्यम देता है और सूचना उसके किसी प्राचल को बदलती है।\"},{\"n\":9,\"d\":\"E\",\"se\":\"The modulating signal normally represents:\",\"sh\":\"मॉड्यूलेटिंग संकेत सामान्यतः दर्शाता है:\",\"oe\":[\"Only the antenna impedance\",\"The receiver supply\",\"The information or message\",\"The earth connection\"],\"oh\":[\"\",\"\",\"सूचना या संदेश\",\"\"],\"a\":2,\"ee\":\"Speech, music or data is the baseband/message signal used to vary the carrier.\",\"eh\":\"वाणी, संगीत या डेटा आधारबैंड सूचना संकेत होता है।\"},{\"n\":10,\"d\":\"E\",\"se\":\"In amplitude modulation, the carrier's _____ varies with the message.\",\"sh\":\"आयाम मॉड्यूलेशन में वाहक का _____ संदेश के अनुसार बदलता है।\",\"oe\":[\"Mean frequency only\",\"Propagation speed\",\"Wavelength independently of frequency\",\"Amplitude\"],\"oh\":[\"\",\"\",\"\",\"आयाम\"],\"a\":3,\"ee\":\"In ideal AM, carrier amplitude follows the message while its nominal frequency and phase remain constant.\",\"eh\":\"आदर्श AM में वाहक आयाम बदलता है, नाममात्र आवृत्ति और फेज स्थिर रहते हैं।\"},{\"n\":11,\"d\":\"E\",\"se\":\"In frequency modulation, the carrier's _____ varies with the message.\",\"sh\":\"आवृत्ति मॉड्यूलेशन में वाहक का _____ संदेश के अनुसार बदलता है।\",\"oe\":[\"Average amplitude\",\"Instantaneous frequency\",\"Propagation velocity\",\"DC resistance\"],\"oh\":[\"\",\"तात्कालिक आवृत्ति\",\"\",\"\"],\"a\":1,\"ee\":\"FM varies instantaneous carrier frequency about its centre value; ideal FM amplitude remains constant.\",\"eh\":\"FM में तात्कालिक आवृत्ति केंद्र आवृत्ति के आसपास बदलती है और आयाम स्थिर रहता है।\"},{\"n\":12,\"d\":\"E\",\"se\":\"In phase modulation, the varied carrier parameter is:\",\"sh\":\"फेज मॉड्यूलेशन में बदलने वाला वाहक प्राचल है:\",\"oe\":[\"Power-supply voltage\",\"Antenna height\",\"Phase\",\"Propagation speed\"],\"oh\":[\"\",\"\",\"कला\",\"\"],\"a\":2,\"ee\":\"PM varies the instantaneous phase of the carrier according to the message. FM and PM are both angle-modulation methods.\",\"eh\":\"PM में वाहक की तात्कालिक कला बदलती है; FM और PM कोण मॉड्यूलेशन हैं।\"},{\"n\":13,\"d\":\"M\",\"se\":\"For single-tone AM with carrier frequency (f_c) and modulating frequency (f_m), the sidebands occur at:\",\"sh\":\"एकल-टोन AM में (f_c) वाहक और (f_m) मॉड्यूलेटिंग आवृत्ति होने पर साइडबैंड हैं:\",\"oe\":[\"(f_c-f_m) and (f_c+f_m)\",\"(f_m/2) and (2f_m)\",\"(f_c) only\",\"(2f_c) and (3f_c)\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"AM produces a lower side frequency (f_c-f_m) and upper side frequency (f_c+f_m); the carrier remains at (f_c).\",\"eh\":\"AM में LSF और USF वाहक से (f_m) नीचे और ऊपर बनते हैं।\"},{\"n\":14,\"d\":\"M\",\"se\":\"If the highest audio frequency in conventional AM is 5 kHz, the required RF bandwidth is:\",\"sh\":\"परंपरागत AM में उच्चतम ऑडियो आवृत्ति 5 kHz हो तो RF बैंडविड्थ है:\",\"oe\":[\"10 kHz\",\"5 kHz\",\"2.5 kHz\",\"15 kHz\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Conventional double-sideband AM bandwidth is (2f<sub>m(max)</sub>=2\\\\times5=10\\\\) kHz.\",\"eh\":\"AM बैंडविड्थ उच्चतम मॉड्यूलेटिंग आवृत्ति की दोगुनी है।\"},{\"n\":15,\"d\":\"M\",\"se\":\"From an AM envelope, modulation index (m) is obtained from:\",\"sh\":\"AM आवरण से मॉड्यूलेशन सूचकांक (m) का सूत्र है:\",\"oe\":[\"((V<sub>max</sub>+V<sub>min</sub>)/(V<sub>max</sub>-V<sub>min</sub>))\",\"((V<sub>max</sub>-V<sub>min</sub>)/(V<sub>max</sub>+V<sub>min</sub>))\",\"(V<sub>max</sub>/V<sub>min</sub>)\",\"(V<sub>min</sub>/V<sub>max</sub>)\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"For a correctly displayed sinusoidal AM envelope, (m=(V<sub>max</sub>-V<sub>min</sub>)/(V<sub>max</sub>+V<sub>min</sub>)).\",\"eh\":\"सही AM आवरण में अधिकतम और न्यूनतम मानों से यह अनुपात मिलता है।\"},{\"n\":16,\"d\":\"M\",\"se\":\"An AM envelope has (V<sub>max</sub>=8\\\\) V and (V<sub>min</sub>=2\\\\) V. The modulation index is:\",\"sh\":\"AM आवरण में (V<sub>max</sub>=8\\\\) V और (V<sub>min</sub>=2\\\\) V है। मॉड्यूलेशन सूचकांक है:\",\"oe\":[\"0.25\",\"0.40\",\"0.80\",\"0.60\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"(m=(8-2)/(8+2)=6/10=0.60), or 60% modulation.\",\"eh\":\"सूत्र से (m=0.60), अर्थात 60% मिलता है।\"},{\"n\":17,\"d\":\"M\",\"se\":\"In conventional AM, 100% modulation corresponds to:\",\"sh\":\"परंपरागत AM में 100% मॉड्यूलेशन का अर्थ है:\",\"oe\":[\"(m=1)\",\"(m=0)\",\"(m=2)\",\"(m=100)\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Modulation index is a ratio: 100% equals 1.0. With a sinusoid, the envelope just reaches zero at its minima.\",\"eh\":\"100% का अनुपात 1.0 है और आवरण न्यूनतम पर शून्य छूता है।\"},{\"n\":18,\"d\":\"M\",\"se\":\"Over-modulation of conventional AM occurs when:\",\"sh\":\"परंपरागत AM में अति-मॉड्यूलेशन कब होता है?\",\"oe\":[\"(m&gt;1)\",\"(m=0)\",\"Carrier frequency is zero\",\"Only one sideband exists\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"When (m&gt;1), the envelope crosses/inverts and a simple envelope detector produces severe distortion.\",\"eh\":\"(m&gt;1) पर आवरण उलटता है और एनवेलप डिटेक्टर विकृति देता है।\"},{\"n\":19,\"d\":\"M\",\"se\":\"For single-tone conventional AM, total transmitted power is:\",\"sh\":\"एकल-टोन परंपरागत AM में कुल प्रेषित शक्ति है:\",\"oe\":[\"(P<sub>c</sub> m^2)\",\"(P<sub>c</sub>/(1+m))\",\"(2P_c m)\",\"(P<sub>c</sub>(1+m^2/2))\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"The two sidebands together carry (P<sub>c</sub> m^2/2), so total power is carrier plus sideband power: (P<sub>t</sub>=P<sub>c</sub>(1+m^2/2)).\",\"eh\":\"कुल शक्ति वाहक और दोनों साइडबैंड शक्तियों का योग है।\"},{\"n\":20,\"d\":\"M\",\"se\":\"If (P<sub>c</sub>=100\\\\) W and (m=0.8), power in each AM sideband is:\",\"sh\":\"(P<sub>c</sub>=100\\\\) W और (m=0.8) होने पर प्रत्येक AM साइडबैंड की शक्ति है:\",\"oe\":[\"8 W\",\"32 W\",\"16 W\",\"64 W\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Each sideband power is (P<sub>c</sub> m^2/4=100\\\\times0.64/4=16\\\\) W; both together carry 32 W.\",\"eh\":\"प्रत्येक साइडबैंड 16 W और दोनों कुल 32 W रखते हैं।\"},{\"n\":21,\"d\":\"M\",\"se\":\"In conventional AM with a sinusoidal message, the carrier component:\",\"sh\":\"ज्यावक्रीय संदेश वाले परंपरागत AM में वाहक घटक:\",\"oe\":[\"Carries no message by itself but consumes most power\",\"Alone contains both sideband messages\",\"Vanishes at every modulation index\",\"Has twice the audio frequency\"],\"oh\":[\"स्वयं सूचना नहीं रखता, पर अधिकांश शक्ति लेता है\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Information resides in the sideband variation. The large carrier enables simple envelope detection but makes conventional AM power-inefficient.\",\"eh\":\"सूचना साइडबैंड में होती है; वाहक सरल संसूचन देता है पर शक्ति दक्षता घटाता है।\"},{\"n\":22,\"d\":\"M\",\"se\":\"DSB-SC transmission differs from conventional AM because:\",\"sh\":\"DSB-SC परंपरागत AM से भिन्न है क्योंकि:\",\"oe\":[\"Both sidebands are removed\",\"Only the carrier is transmitted\",\"The carrier is suppressed while both sidebands remain\",\"Its bandwidth is zero\"],\"oh\":[\"\",\"\",\"वाहक दबाया जाता है, दोनों साइडबैंड रहते हैं\",\"\"],\"a\":2,\"ee\":\"DSB-SC saves carrier power but still occupies twice the message bandwidth and needs coherent/synchronous detection.\",\"eh\":\"DSB-SC वाहक शक्ति बचाता है, पर दोनों साइडबैंड रखता और समकालिक संसूचन चाहता है।\"},{\"n\":23,\"d\":\"M\",\"se\":\"For a message bandwidth of 3 kHz, an ideal SSB signal occupies approximately:\",\"sh\":\"3 kHz संदेश बैंडविड्थ के लिए आदर्श SSB संकेत लगभग कितनी बैंडविड्थ लेता है?\",\"oe\":[\"12 kHz\",\"3 kHz\",\"6 kHz\",\"1.5 kHz\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"SSB transmits only one sideband, so occupied bandwidth approximately equals the message bandwidth; DSB AM would need about 6 kHz.\",\"eh\":\"SSB में एक ही साइडबैंड होने से बैंडविड्थ संदेश के बराबर होती है।\"},{\"n\":24,\"d\":\"M\",\"se\":\"An ideal FM signal has:\",\"sh\":\"आदर्श FM संकेत में होता है:\",\"oe\":[\"Zero frequency deviation\",\"A missing carrier\",\"Constant amplitude\",\"Only one sideband\"],\"oh\":[\"\",\"\",\"स्थिर आयाम\",\"\"],\"a\":2,\"ee\":\"Information is in instantaneous frequency, allowing amplitude limiters to remove many amplitude-noise variations before detection.\",\"eh\":\"सूचना आवृत्ति में होती है, इसलिए लिमिटर आयाम शोर घटा सकता है।\"},{\"n\":25,\"d\":\"M\",\"se\":\"The FM modulation index is:\",\"sh\":\"FM मॉड्यूलेशन सूचकांक है:\",\"oe\":[\"(f_c/f_m)\",\"(f_m/\\\\Delta f)\",\"(\\\\Delta f/f_m)\",\"(f_c/\\\\Delta f)\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"For single-tone FM, (β=\\\\Delta f/f_m), where (\\\\Delta f) is peak frequency deviation.\",\"eh\":\"एकल-टोन FM में (β) शिखर विचलन और मॉड्यूलेटिंग आवृत्ति का अनुपात है।\"},{\"n\":26,\"d\":\"M\",\"se\":\"An FM signal has peak deviation 75 kHz and modulating frequency 15 kHz. Its modulation index is:\",\"sh\":\"FM संकेत में शिखर विचलन 75 kHz और मॉड्यूलेटिंग आवृत्ति 15 kHz है। सूचकांक है:\",\"oe\":[\"5\",\"0.2\",\"60\",\"90\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"(β=75/15=5).\",\"eh\":\"FM सूचकांक विचलन को मॉड्यूलेटिंग आवृत्ति से भाग देकर 5 मिलता है।\"},{\"n\":27,\"d\":\"M\",\"se\":\"Using Carson's rule, the approximate bandwidth for (\\\\Delta f=75\\\\) kHz and (f<sub>m(max)</sub>=15\\\\) kHz is:\",\"sh\":\"कासर्न नियम से (\\\\Delta f=75\\\\) kHz और (f<sub>m(max)</sub>=15\\\\) kHz के लिए बैंडविड्थ है:\",\"oe\":[\"75 kHz\",\"90 kHz\",\"150 kHz\",\"180 kHz\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"(BW\\\\approx2(\\\\Delta f+f_m)=2(75+15)=180\\\\) kHz. Carson's rule is an engineering approximation for significant FM sidebands.\",\"eh\":\"कासर्न नियम से लगभग 180 kHz मिलता है।\"},{\"n\":28,\"d\":\"M\",\"se\":\"FM pre-emphasis at the transmitter primarily:\",\"sh\":\"प्रेषित्र में FM प्री-एम्फेसिस मुख्यतः:\",\"oe\":[\"Suppresses the carrier completely\",\"Boosts higher audio frequencies before modulation\",\"Converts FM to AM\",\"Removes the antenna\"],\"oh\":[\"\",\"मॉड्यूलेशन से पहले उच्च ऑडियो आवृत्तियाँ बढ़ाता है\",\"\",\"\"],\"a\":1,\"ee\":\"High-frequency audio is boosted before transmission because FM noise tends to rise with audio frequency; complementary de-emphasis restores response and reduces noise.\",\"eh\":\"उच्च ऑडियो को पहले बढ़ाकर रिसीवर में डी-एम्फेसिस से प्रतिक्रिया और शोर सुधारे जाते हैं।\"},{\"n\":29,\"d\":\"M\",\"se\":\"FM de-emphasis in the receiver is used to:\",\"sh\":\"अभिग्राही में FM डी-एम्फेसिस का उपयोग है:\",\"oe\":[\"Increase RF carrier power\",\"Restore the audio response and reduce high-frequency noise\",\"Generate the local oscillator\",\"Increase antenna length\"],\"oh\":[\"\",\"ऑडियो प्रतिक्रिया बहाल कर उच्च-आवृत्ति शोर घटाना\",\"\",\"\"],\"a\":1,\"ee\":\"De-emphasis is complementary to transmitter pre-emphasis; it attenuates the deliberately boosted high-frequency audio and associated noise.\",\"eh\":\"यह प्री-एम्फेसिस का पूरक है और उच्च-आवृत्ति शोर घटाता है।\"},{\"n\":30,\"d\":\"H\",\"se\":\"A simple diode envelope detector correctly recovers conventional AM when:\",\"sh\":\"सरल डायोड एनवेलप डिटेक्टर परंपरागत AM को सही पुनः प्राप्त करता है जब:\",\"oe\":[\"The carrier is fully suppressed\",\"Modulation index is always above 2\",\"A carrier is present and the envelope is not over-modulated\",\"The signal is pure FM\"],\"oh\":[\"\",\"\",\"वाहक उपस्थित हो और अति-मॉड्यूलेशन न हो\",\"\"],\"a\":2,\"ee\":\"Envelope detection relies on the AM envelope reproducing the message. Suppressed-carrier or over-modulated signals require another detection method or distort.\",\"eh\":\"एनवेलप डिटेक्टर को सही, न उलटा हुआ आवरण और उपस्थित वाहक चाहिए।\"},{\"n\":31,\"d\":\"H\",\"se\":\"FM generally rejects amplitude noise better than AM mainly because:\",\"sh\":\"FM सामान्यतः AM से आयाम शोर को बेहतर अस्वीकार करता है क्योंकि:\",\"oe\":[\"FM has no carrier frequency\",\"FM always uses less bandwidth\",\"Its antenna is always directional\",\"Information is in frequency and amplitude variations can be limited\"],\"oh\":[\"\",\"\",\"\",\"सूचना आवृत्ति में है और आयाम परिवर्तन लिमिट किए जा सकते हैं\"],\"a\":3,\"ee\":\"A limiter removes unwanted amplitude changes before the frequency detector. FM still suffers frequency/phase noise and is not noise-free.\",\"eh\":\"लिमिटर डिटेक्टर से पहले अनचाहे आयाम परिवर्तन हटाता है; FM पूर्णतः शोर-मुक्त नहीं है।\"},{\"n\":32,\"d\":\"H\",\"se\":\"The FM capture effect means that a receiver tends to:\",\"sh\":\"FM कैप्चर प्रभाव का अर्थ है कि अभिग्राही:\",\"oe\":[\"Reproduce the stronger of two co-channel FM signals\",\"Add both signals linearly like audio\",\"Reject every strong signal\",\"Convert a weak FM signal to AM\"],\"oh\":[\"समान चैनल के दो FM संकेतों में अधिक शक्तिशाली को ग्रहण करता है\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"When two FM signals share a channel, a sufficiently stronger one can dominate the detector output rather than both being reproduced equally.\",\"eh\":\"समान चैनल पर पर्याप्त शक्तिशाली FM संकेत डिटेक्टर पर हावी हो सकता है।\"},{\"n\":33,\"d\":\"H\",\"se\":\"Ground-wave propagation is most useful mainly at:\",\"sh\":\"भू-तरंग संचरण मुख्यतः किस पर उपयोगी है?\",\"oe\":[\"Optical frequencies\",\"Lower radio frequencies such as LF/MF\",\"Only millimetre waves\",\"X-rays\"],\"oh\":[\"\",\"निम्न रेडियो आवृत्तियाँ जैसे LF/MF\",\"\",\"\"],\"a\":1,\"ee\":\"Ground waves follow the Earth's surface more effectively at lower frequencies; attenuation rises as frequency increases and ground conductivity matters.\",\"eh\":\"निम्न आवृत्तियाँ पृथ्वी की सतह का अनुसरण बेहतर करती हैं; चालकता और आवृत्ति क्षीणन को प्रभावित करते हैं।\"},{\"n\":34,\"d\":\"H\",\"se\":\"Long-distance HF communication beyond the horizon commonly uses:\",\"sh\":\"क्षितिज से परे लंबी दूरी HF संचार सामान्यतः उपयोग करता है:\",\"oe\":[\"Ground wave only\",\"Direct cable conduction\",\"Ultrasonic reflection\",\"Sky-wave propagation via the ionosphere\"],\"oh\":[\"\",\"\",\"\",\"आयनमंडल द्वारा आकाश-तरंग संचरण\"],\"a\":3,\"ee\":\"HF energy can be refracted/returned by ionised atmospheric regions, enabling beyond-horizon links. Conditions vary with frequency, time, season and solar activity.\",\"eh\":\"आयनमंडल HF ऊर्जा को पृथ्वी की ओर लौटाकर क्षितिज-पार संचार देता है।\"},{\"n\":35,\"d\":\"H\",\"se\":\"VHF and higher terrestrial links are commonly dominated by:\",\"sh\":\"VHF और उससे उच्च स्थलीय लिंक सामान्यतः किससे नियंत्रित होते हैं?\",\"oe\":[\"Space-wave/line-of-sight propagation\",\"Audio-frequency ground conduction\",\"Ionospheric reflection at all times\",\"Water waves\"],\"oh\":[\"अंतरिक्ष-तरंग या दृष्टि-रेखा संचरण\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"VHF/UHF generally travel by direct and ground-reflected space waves and are limited approximately by the radio horizon, though diffraction and tropospheric effects can extend range.\",\"eh\":\"VHF/UHF प्रायः दृष्टि-रेखा से चलते हैं, पर विवर्तन/क्षोभमंडलीय प्रभाव सीमा बदल सकते हैं।\"},{\"n\":36,\"d\":\"H\",\"se\":\"Skip distance is the:\",\"sh\":\"स्किप दूरी है:\",\"oe\":[\"Minimum distance from a transmitter at which a given sky wave first returns to Earth\",\"Antenna-to-feedline length\",\"Distance between sidebands\",\"Receiver audio bandwidth\"],\"oh\":[\"प्रेषित्र से वह न्यूनतम दूरी जहाँ दी गई आकाश-तरंग पहली बार पृथ्वी पर लौटती है\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Between the end of useful ground-wave coverage and first sky-wave return there may be a skip/dead zone.\",\"eh\":\"भू-तरंग सीमा और प्रथम आकाश-तरंग वापसी के बीच स्किप क्षेत्र हो सकता है।\"},{\"n\":37,\"d\":\"H\",\"se\":\"Radio fading is best described as:\",\"sh\":\"रेडियो फेडिंग का सर्वोत्तम वर्णन है:\",\"oe\":[\"Permanent increase of transmitter power\",\"Intentional modulation\",\"Variation of received signal strength with time/path conditions\",\"A fixed receiver IF\"],\"oh\":[\"\",\"\",\"समय या पथ स्थितियों से प्राप्त संकेत शक्ति में परिवर्तन\",\"\"],\"a\":2,\"ee\":\"Multipath interference, ionospheric change, movement and shadowing can make received amplitude vary. Diversity and suitable antenna placement help mitigate it.\",\"eh\":\"बहुपथ, आयनमंडलीय परिवर्तन और छाया से संकेत शक्ति बदलती है।\"},{\"n\":38,\"d\":\"H\",\"se\":\"Using (d\\\\approx4.12(\\\\sqrt{h_1}+\\\\sqrt{h_2})\\\\) km with heights in metres, antennas at 100 m and 25 m have a radio-horizon distance of approximately:\",\"sh\":\"(d\\\\approx4.12(\\\\sqrt{h_1}+\\\\sqrt{h_2})\\\\) km से 100 m और 25 m ऊँचे एंटीनों की रेडियो-क्षितिज दूरी लगभग है:\",\"oe\":[\"20.6 km\",\"61.8 km\",\"51.5 km\",\"41.2 km\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"(d=4.12(10+5)=61.8\\\\) km. This common effective-Earth approximation is not a guarantee; terrain and propagation conditions matter.\",\"eh\":\"सूत्र से 61.8 km मिलता है; वास्तविक भूभाग और वायुमंडल सीमा बदलते हैं।\"},{\"n\":39,\"d\":\"E\",\"se\":\"The RF oscillator in a transmitter primarily generates the:\",\"sh\":\"प्रेषित्र का RF दोलक मुख्यतः उत्पन्न करता है:\",\"oe\":[\"Loudspeaker current\",\"Microphone sound\",\"Carrier frequency\",\"Antenna earth resistance\"],\"oh\":[\"\",\"\",\"वाहक आवृत्ति\",\"\"],\"a\":2,\"ee\":\"The RF oscillator establishes the carrier. Its stability directly affects the transmitted channel frequency.\",\"eh\":\"RF दोलक वाहक बनाता है और उसकी स्थिरता चैनल आवृत्ति को प्रभावित करती है।\"},{\"n\":40,\"d\":\"E\",\"se\":\"A microphone in a voice transmitter converts:\",\"sh\":\"वाणी प्रेषित्र में माइक्रोफोन परिवर्तित करता है:\",\"oe\":[\"RF into light\",\"DC into mechanical rotation\",\"Heat into frequency\",\"Sound into an electrical audio signal\"],\"oh\":[\"\",\"\",\"\",\"ध्वनि को विद्युत ऑडियो संकेत में\"],\"a\":3,\"ee\":\"The microphone is an input transducer; an AF amplifier then raises its small electrical signal to a useful level.\",\"eh\":\"माइक्रोफोन इनपुट ट्रांसड्यूसर है और AF प्रवर्धक उसके छोटे संकेत को बढ़ाता है।\"},{\"n\":41,\"d\":\"E\",\"se\":\"The modulator stage:\",\"sh\":\"मॉड्यूलेटर चरण:\",\"oe\":[\"Combines the information with the carrier\",\"Charges the battery only\",\"Converts RF to sound at the speaker\",\"Grounds the antenna permanently\"],\"oh\":[\"सूचना को वाहक के साथ संयोजित करता है\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"The modulator varies the selected carrier parameter—amplitude, frequency or phase—according to the message.\",\"eh\":\"मॉड्यूलेटर संदेश के अनुसार वाहक का आयाम, आवृत्ति या कला बदलता है।\"},{\"n\":42,\"d\":\"E\",\"se\":\"The main function of the final RF power amplifier is to:\",\"sh\":\"अंतिम RF शक्ति प्रवर्धक का मुख्य कार्य है:\",\"oe\":[\"Raise the modulated RF signal to the required transmit power\",\"Detect the received audio\",\"Generate AGC voltage\",\"Reduce all RF to zero\"],\"oh\":[\"मॉड्यूलेटेड RF संकेत को आवश्यक प्रेषण शक्ति तक बढ़ाना\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"It delivers sufficient RF power to the output matching network and antenna while meeting linearity and spectral requirements.\",\"eh\":\"यह मिलान नेटवर्क और एंटीना को पर्याप्त RF शक्ति देता है।\"},{\"n\":43,\"d\":\"E\",\"se\":\"The transmitter output network chiefly provides:\",\"sh\":\"प्रेषित्र आउटपुट नेटवर्क मुख्यतः देता है:\",\"oe\":[\"Audio demodulation\",\"Impedance matching and harmonic filtering\",\"Battery charging\",\"Receiver AGC\"],\"oh\":[\"\",\"प्रतिबाधा मिलान और हार्मोनिक फ़िल्टरिंग\",\"\",\"\"],\"a\":1,\"ee\":\"Proper matching transfers power efficiently, while the tuned/filter network suppresses unwanted harmonic radiation.\",\"eh\":\"सही मिलान शक्ति स्थानांतरण सुधारता और फ़िल्टर अवांछित हार्मोनिक विकिरण घटाता है।\"},{\"n\":44,\"d\":\"E\",\"se\":\"A buffer stage between oscillator and later stages is used mainly to:\",\"sh\":\"दोलक और आगे के चरणों के बीच बफर मुख्यतः उपयोग होता है:\",\"oe\":[\"Demodulate FM\",\"Create microphone audio\",\"Isolate the oscillator from load changes\",\"Increase antenna height\"],\"oh\":[\"\",\"\",\"दोलक को भार परिवर्तन से पृथक रखना\",\"\"],\"a\":2,\"ee\":\"Isolation reduces frequency pulling and prevents later-stage tuning/load variations from disturbing the oscillator.\",\"eh\":\"पृथक्करण आगे के भार से दोलक आवृत्ति खिंचाव को घटाता है।\"},{\"n\":45,\"d\":\"M\",\"se\":\"For the best carrier-frequency stability, a transmitter commonly uses a:\",\"sh\":\"सर्वोत्तम वाहक-आवृत्ति स्थिरता हेतु प्रेषित्र सामान्यतः उपयोग करता है:\",\"oe\":[\"Carbon resistor\",\"Diode detector\",\"Loudspeaker\",\"Crystal-controlled oscillator\"],\"oh\":[\"\",\"\",\"\",\"क्रिस्टल-नियंत्रित दोलक\"],\"a\":3,\"ee\":\"Quartz resonance has high Q and low drift compared with ordinary LC oscillators, though practical synthesizers may also be crystal-referenced.\",\"eh\":\"क्वार्ट्ज़ का उच्च Q कम आवृत्ति विचलन देता है।\"},{\"n\":46,\"d\":\"M\",\"se\":\"A frequency multiplier stage is used to:\",\"sh\":\"आवृत्ति गुणक चरण का उपयोग है:\",\"oe\":[\"Reduce audio amplitude only\",\"Divide DC voltage\",\"Detect the message\",\"Obtain a harmonic multiple of the oscillator frequency\"],\"oh\":[\"\",\"\",\"\",\"दोलक आवृत्ति का हार्मोनिक गुणज प्राप्त करना\"],\"a\":3,\"ee\":\"A nonlinear stage creates harmonics and a tuned circuit selects the required multiple; it does not multiply power by the same factor.\",\"eh\":\"अरैखिक चरण हार्मोनिक बनाता और ट्यूनित परिपथ आवश्यक गुणज चुनता है।\"},{\"n\":47,\"d\":\"M\",\"se\":\"Which is a sensible simplified AM transmitter order?\",\"sh\":\"सरल AM प्रेषित्र का उचित क्रम कौन-सा है?\",\"oe\":[\"Speaker → detector → mixer → antenna\",\"Antenna → AF amplifier → microphone → oscillator\",\"Microphone/AF chain + RF oscillator → modulator → RF power/output network → antenna\",\"Detector → AGC → local oscillator → microphone\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"The AF chain supplies the message, the oscillator supplies the carrier, the modulator combines them, and RF/output stages deliver the signal to the antenna.\",\"eh\":\"AF संदेश और RF दोलक वाहक देता; मॉड्यूलेटर तथा आउटपुट चरण इसे एंटीना तक पहुँचाते हैं।\"},{\"n\":48,\"d\":\"M\",\"se\":\"In high-level AM, modulation is applied:\",\"sh\":\"उच्च-स्तरीय AM में मॉड्यूलेशन लगाया जाता है:\",\"oe\":[\"After the antenna\",\"Only in the microphone\",\"At the receiver detector\",\"At or near the final RF power stage\"],\"oh\":[\"\",\"\",\"\",\"अंतिम RF शक्ति चरण पर या उसके निकट\"],\"a\":3,\"ee\":\"High-level modulation varies the supply/output of a high-power RF stage, so the audio modulator must deliver substantial power.\",\"eh\":\"उच्च-स्तरीय मॉड्यूलेशन अंतिम उच्च-शक्ति RF चरण पर होता है और पर्याप्त ऑडियो शक्ति चाहता है।\"},{\"n\":49,\"d\":\"M\",\"se\":\"After low-level AM modulation, subsequent RF amplifiers generally must be:\",\"sh\":\"निम्न-स्तरीय AM मॉड्यूलेशन के बाद के RF प्रवर्धक सामान्यतः होने चाहिए:\",\"oe\":[\"Purely switching and nonlinear\",\"Diode detectors\",\"Audio filters only\",\"Linear enough to preserve the envelope\"],\"oh\":[\"\",\"\",\"\",\"आवरण सुरक्षित रखने जितने रैखिक\"],\"a\":3,\"ee\":\"Nonlinear amplification after low-level AM would distort the envelope and create unwanted spectral components.\",\"eh\":\"अरैखिक प्रवर्धन AM आवरण और स्पेक्ट्रम को विकृत करेगा।\"},{\"n\":50,\"d\":\"M\",\"se\":\"A Class-C RF power amplifier is normally followed by a tuned circuit because:\",\"sh\":\"क्लास-C RF शक्ति प्रवर्धक के बाद ट्यूनित परिपथ सामान्यतः इसलिए होता है क्योंकि:\",\"oe\":[\"Class C is a DC regulator\",\"It must reproduce speech directly\",\"The tuned load selects the desired RF fundamental from current pulses\",\"It eliminates the carrier\"],\"oh\":[\"\",\"\",\"ट्यूनित भार धारा पल्सों से वांछित RF मूल आवृत्ति चुनता है\",\"\"],\"a\":2,\"ee\":\"Class C conducts for less than 180° and is nonlinear, but a resonant tank reconstructs the desired sinusoidal carrier efficiently.\",\"eh\":\"क्लास-C के पल्सों से अनुनादी टैंक वांछित RF ज्यावक्र बनाता है।\"},{\"n\":51,\"d\":\"M\",\"se\":\"Unwanted transmitter harmonics are chiefly reduced by the:\",\"sh\":\"अवांछित प्रेषित्र हार्मोनिक मुख्यतः किससे घटते हैं?\",\"oe\":[\"Microphone diaphragm\",\"Receiver detector\",\"Battery fuse alone\",\"Low-pass or band-pass output filter\"],\"oh\":[\"\",\"\",\"\",\"निम्न-पारक या बैंड-पारक आउटपुट फ़िल्टर\"],\"a\":3,\"ee\":\"Harmonics can interfere with other services; the output network passes the wanted band and attenuates multiples.\",\"eh\":\"आउटपुट फ़िल्टर वांछित बैंड पास कर हार्मोनिक गुणज दबाता है।\"},{\"n\":52,\"d\":\"M\",\"se\":\"During bench testing, a dummy load is preferred to an antenna when the aim is to:\",\"sh\":\"बेंच परीक्षण में एंटीना की जगह डमी लोड कब उपयुक्त है?\",\"oe\":[\"Increase radiation range\",\"Absorb rated RF power with minimal radiation\",\"Generate audio\",\"Demodulate the signal\"],\"oh\":[\"\",\"न्यूनतम विकिरण के साथ निर्धारित RF शक्ति सोखना\",\"\",\"\"],\"a\":1,\"ee\":\"A correctly rated matched dummy load allows safe power tests without intentionally radiating; it must have suitable impedance and RF power rating.\",\"eh\":\"सही प्रतिबाधा और शक्ति रेटिंग वाला डमी लोड बिना अनावश्यक विकिरण परीक्षण देता है।\"},{\"n\":53,\"d\":\"M\",\"se\":\"The most direct instrument for checking transmitter carrier frequency is a:\",\"sh\":\"प्रेषित्र वाहक आवृत्ति जाँचने का सबसे प्रत्यक्ष यंत्र है:\",\"oe\":[\"Hydrometer\",\"Megger\",\"Wattmeter only\",\"Frequency counter\"],\"oh\":[\"\",\"\",\"\",\"आवृत्ति काउंटर\"],\"a\":3,\"ee\":\"A suitable RF frequency counter measures cycles per second; correct coupling and input-level limits prevent loading or damage.\",\"eh\":\"उपयुक्त RF काउंटर सही युग्मन के साथ वाहक आवृत्ति मापता है।\"},{\"n\":54,\"d\":\"H\",\"se\":\"An AM transmitter has carrier power 100 W and (m=0.6). Its total transmitted power is:\",\"sh\":\"AM प्रेषित्र में वाहक शक्ति 100 W और (m=0.6) है। कुल प्रेषित शक्ति है:\",\"oe\":[\"106 W\",\"136 W\",\"118 W\",\"160 W\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"(P<sub>t</sub>=P<sub>c</sub>(1+m^2/2)=100(1+0.36/2)=118\\\\) W. The two sidebands together carry 18 W.\",\"eh\":\"कुल शक्ति 118 W और दोनों साइडबैंड कुल 18 W रखते हैं।\"},{\"n\":55,\"d\":\"H\",\"se\":\"The maximum useful sideband-power efficiency of conventional single-tone AM at (m=1) is:\",\"sh\":\"(m=1) पर परंपरागत एकल-टोन AM की अधिकतम उपयोगी साइडबैंड-शक्ति दक्षता है:\",\"oe\":[\"33.3%\",\"50%\",\"66.7%\",\"100%\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"At (m=1), sideband power is (P<sub>c</sub>/2) and total power (1.5P_c); efficiency (=(0.5/1.5)\\\\times100=33.3\\\\%\\\\).\",\"eh\":\"उपयोगी साइडबैंड शक्ति कुल शक्ति की एक-तिहाई है।\"},{\"n\":56,\"d\":\"H\",\"se\":\"A high reflected-power indication at a transmitter output most strongly suggests:\",\"sh\":\"प्रेषित्र आउटपुट पर अधिक परावर्तित शक्ति मुख्यतः क्या दर्शाती है?\",\"oe\":[\"Antenna/feedline impedance mismatch\",\"Perfect matching\",\"Correct AM detection\",\"Excess microphone gain only\"],\"oh\":[\"एंटीना-फीडलाइन प्रतिबाधा असंगति\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Mismatch reflects part of the forward RF energy, raises VSWR and can over-stress the final stage or feedline.\",\"eh\":\"असंगति RF ऊर्जा लौटाती, VSWR बढ़ाती और अंतिम चरण को क्षति पहुँचा सकती है।\"},{\"n\":57,\"d\":\"H\",\"se\":\"Removing the buffer between a VFO and a power amplifier may cause carrier drift chiefly through:\",\"sh\":\"VFO और शक्ति प्रवर्धक के बीच बफर हटाने पर वाहक विचलन मुख्यतः किससे हो सकता है?\",\"oe\":[\"Audio de-emphasis\",\"Detector distortion\",\"Oscillator pulling due to changing load\",\"Improved isolation\"],\"oh\":[\"\",\"\",\"बदलते भार से दोलक आवृत्ति खिंचाव\",\"\"],\"a\":2,\"ee\":\"Load or tuning changes in the power chain can feed back to the VFO and shift its frequency; a buffer reduces this coupling.\",\"eh\":\"आगे के भार परिवर्तन VFO को प्रभावित कर आवृत्ति बदल सकते हैं; बफर इसे रोकता है।\"},{\"n\":58,\"d\":\"E\",\"se\":\"The basic purpose of a radio receiver is to:\",\"sh\":\"रेडियो अभिग्राही का मूल उद्देश्य है:\",\"oe\":[\"Select a wanted RF signal and recover its information\",\"Radiate transmitter power\",\"Generate mains electricity\",\"Charge every battery\"],\"oh\":[\"वांछित RF संकेत चुनकर सूचना पुनः प्राप्त करना\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"A receiver selects, amplifies and demodulates the wanted station, then reproduces the baseband information.\",\"eh\":\"अभिग्राही वांछित स्टेशन चुनता, प्रवर्धित और डिमॉड्यूलेट कर सूचना देता है।\"},{\"n\":59,\"d\":\"E\",\"se\":\"The detector or demodulator in a receiver:\",\"sh\":\"अभिग्राही का डिटेक्टर या डिमॉड्यूलेटर:\",\"oe\":[\"Recovers the message from the modulated carrier\",\"Raises antenna height\",\"Generates the transmitted carrier\",\"Measures battery density\"],\"oh\":[\"मॉड्यूलेटेड वाहक से संदेश निकालता है\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Detection reverses the modulation process at baseband level; AM and FM require different detector principles.\",\"eh\":\"संसूचन मॉड्यूलेशन प्रक्रिया को उलटकर आधारबैंड सूचना निकालता है।\"},{\"n\":60,\"d\":\"E\",\"se\":\"The AF amplifier in a radio receiver drives the:\",\"sh\":\"रेडियो अभिग्राही का AF प्रवर्धक किसे चलाता है?\",\"oe\":[\"RF oscillator\",\"Antenna director\",\"Loudspeaker or headphones\",\"Mixer local-oscillator coil only\"],\"oh\":[\"\",\"\",\"लाउडस्पीकर या हेडफोन\",\"\"],\"a\":2,\"ee\":\"After detection, the recovered audio is amplified in voltage/power to operate the output transducer.\",\"eh\":\"संसूचन के बाद ऑडियो को आउटपुट ट्रांसड्यूसर चलाने हेतु प्रवर्धित किया जाता है।\"},{\"n\":61,\"d\":\"E\",\"se\":\"Receiver sensitivity is the ability to:\",\"sh\":\"अभिग्राही संवेदनशीलता की परिभाषा है:\",\"oe\":[\"Reject all nearby stations\",\"Reproduce every frequency perfectly\",\"Receive weak signals satisfactorily\",\"Deliver maximum transmitter power\"],\"oh\":[\"\",\"\",\"कमजोर संकेतों को संतोषजनक ग्रहण करना\",\"\"],\"a\":2,\"ee\":\"Sensitivity concerns the minimum input signal needed for a specified usable output or signal-to-noise performance.\",\"eh\":\"संवेदनशीलता निर्दिष्ट उपयोगी आउटपुट हेतु आवश्यक न्यूनतम इनपुट संकेत से संबंधित है।\"},{\"n\":62,\"d\":\"E\",\"se\":\"Receiver selectivity is the ability to:\",\"sh\":\"अभिग्राही वरणात्मकता की परिभाषा है:\",\"oe\":[\"Receive the weakest signal only\",\"Separate the wanted station from nearby frequencies\",\"Increase loudspeaker size\",\"Generate modulation\"],\"oh\":[\"\",\"वांछित स्टेशन को निकट आवृत्तियों से अलग करना\",\"\",\"\"],\"a\":1,\"ee\":\"Selectivity is largely determined by tuned RF/IF bandwidth and filter shape; too narrow can reduce fidelity.\",\"eh\":\"ट्यूनित RF/IF बैंडविड्थ वरणात्मकता तय करती है; अत्यधिक संकीर्णता विश्वसनीयता घटा सकती है।\"},{\"n\":63,\"d\":\"E\",\"se\":\"Receiver fidelity means:\",\"sh\":\"अभिग्राही विश्वसनीयता का अर्थ है:\",\"oe\":[\"Maximum antenna gain\",\"Faithful reproduction of the original information\",\"Highest possible IF\",\"Complete rejection of all audio\"],\"oh\":[\"\",\"मूल सूचना का निष्ठापूर्ण पुनरुत्पादन\",\"\",\"\"],\"a\":1,\"ee\":\"Good fidelity requires adequate, reasonably flat audio/baseband response with low distortion.\",\"eh\":\"अच्छी विश्वसनीयता हेतु पर्याप्त समतल प्रतिक्रिया और कम विकृति चाहिए।\"},{\"n\":64,\"d\":\"E\",\"se\":\"The defining action of a superheterodyne receiver is to:\",\"sh\":\"सुपरहेटरोडाइन अभिग्राही की मुख्य क्रिया है:\",\"oe\":[\"Amplify audio before receiving RF\",\"Use no oscillator\",\"Convert AC mains directly to sound\",\"Convert selected RF to a fixed intermediate frequency\"],\"oh\":[\"\",\"\",\"\",\"चुनी RF को स्थिर मध्यवर्ती आवृत्ति में बदलना\"],\"a\":3,\"ee\":\"A mixer and local oscillator translate different station frequencies to one fixed IF, where stable gain and selectivity are easier.\",\"eh\":\"मिश्रक और स्थानीय दोलक विभिन्न स्टेशनों को एक स्थिर IF पर लाते हैं।\"},{\"n\":65,\"d\":\"M\",\"se\":\"A mixer ideally produces components including:\",\"sh\":\"मिश्रक आदर्शतः किन घटकों को उत्पन्न करता है?\",\"oe\":[\"Only the RF input\",\"Sum and difference of its input frequencies\",\"DC only\",\"Audio without any detector in all cases\"],\"oh\":[\"\",\"इनपुट आवृत्तियों का योग और अंतर\",\"\",\"\"],\"a\":1,\"ee\":\"Mixer nonlinearity creates (f<sub>LO</sub>+f<sub>RF</sub>) and (|f<sub>LO</sub>-f<sub>RF</sub>|); the IF filter selects the required product.\",\"eh\":\"मिश्रक योग और अंतर आवृत्तियाँ बनाता है, IF फ़िल्टर आवश्यक घटक चुनता है।\"},{\"n\":66,\"d\":\"M\",\"se\":\"The intermediate frequency is normally given by:\",\"sh\":\"मध्यवर्ती आवृत्ति सामान्यतः है:\",\"oe\":[\"(f<sub>LO</sub>+f<sub>RF</sub>) only\",\"(f<sub>RF</sub>/f<sub>LO</sub>)\",\"(f<sub>RF</sub>f<sub>LO</sub>)\",\"(|f<sub>LO</sub>-f<sub>RF</sub>|)\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Superheterodyne tuning keeps the absolute LO–RF difference equal to the selected fixed IF.\",\"eh\":\"सुपरहेट ट्यूनिंग में LO और RF का परिमाण अंतर स्थिर IF होता है।\"},{\"n\":67,\"d\":\"M\",\"se\":\"For high-side injection, a receiver tuned to 1.000 MHz with IF 455 kHz requires an LO of:\",\"sh\":\"उच्च-पक्ष इंजेक्शन में 1.000 MHz स्टेशन और 455 kHz IF हेतु LO है:\",\"oe\":[\"0.545 MHz\",\"1.455 MHz\",\"1.000 MHz\",\"0.455 MHz\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"High-side injection uses (f<sub>LO</sub>=f<sub>RF</sub>+f<sub>IF</sub>=1.000+0.455=1.455\\\\) MHz.\",\"eh\":\"उच्च-पक्ष LO वांछित RF से IF जितना ऊपर होता है।\"},{\"n\":68,\"d\":\"M\",\"se\":\"A commonly used IF in conventional AM broadcast receivers is:\",\"sh\":\"परंपरागत AM प्रसारण अभिग्राही में सामान्य IF है:\",\"oe\":[\"10.7 MHz\",\"455 kHz\",\"50 Hz\",\"100 MHz\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"455 kHz is a common nominal AM broadcast IF; actual designs may use other values, so it is not a universal law.\",\"eh\":\"455 kHz सामान्य AM IF है, पर सभी डिज़ाइनों के लिए अनिवार्य नहीं।\"},{\"n\":69,\"d\":\"M\",\"se\":\"A commonly used IF in conventional FM broadcast receivers is:\",\"sh\":\"परंपरागत FM प्रसारण अभिग्राही में सामान्य IF है:\",\"oe\":[\"10.7 MHz\",\"455 Hz\",\"50 MHz\",\"1 kHz\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"10.7 MHz is the common nominal FM broadcast IF, while 455 kHz is associated with many AM receivers.\",\"eh\":\"10.7 MHz सामान्य FM प्रसारण IF है।\"},{\"n\":70,\"d\":\"M\",\"se\":\"The major advantage of a fixed IF is that it permits:\",\"sh\":\"स्थिर IF का प्रमुख लाभ है:\",\"oe\":[\"High, stable gain and selectivity at one frequency\",\"An infinitely short antenna\",\"Elimination of the detector\",\"Reception without tuning\"],\"oh\":[\"एक आवृत्ति पर उच्च स्थिर लाभ और वरणात्मकता\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Fixed-frequency IF amplifiers and filters can be optimised more sharply and consistently than wide-range tunable amplifiers.\",\"eh\":\"स्थिर आवृत्ति पर IF फ़िल्टर और प्रवर्धक बेहतर अनुकूलित किए जा सकते हैं।\"},{\"n\":71,\"d\":\"M\",\"se\":\"During station tuning, the local oscillator must:\",\"sh\":\"स्टेशन ट्यूनिंग के दौरान स्थानीय दोलक को:\",\"oe\":[\"Remain at audio frequency\",\"Stop oscillating\",\"Track the RF tuning so their difference stays at IF\",\"Equal the loudspeaker frequency\"],\"oh\":[\"\",\"\",\"RF ट्यूनिंग का अनुसरण करना ताकि अंतर IF रहे\",\"\"],\"a\":2,\"ee\":\"Ganged/tuned circuits keep the desired RF and LO relationship approximately correct across the receiver band.\",\"eh\":\"युग्मित ट्यूनिंग पूरे बैंड में RF–LO अंतर को IF के पास रखती है।\"},{\"n\":72,\"d\":\"M\",\"se\":\"With high-side injection, the image frequency is separated from the wanted station by:\",\"sh\":\"उच्च-पक्ष इंजेक्शन में प्रतिबिंब आवृत्ति वांछित स्टेशन से कितनी दूर होती है?\",\"oe\":[\"(2f<sub>IF</sub>)\",\"(f<sub>IF</sub>/2)\",\"(f<sub>RF</sub>)\",\"Zero\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Both desired and image inputs can differ from the same LO by IF. For high-side injection, (f<sub>image</sub>=f<sub>RF</sub>+2f<sub>IF</sub>).\",\"eh\":\"उच्च-पक्ष इंजेक्शन में प्रतिबिंब वांछित RF से (2IF) ऊपर होता है।\"},{\"n\":73,\"d\":\"M\",\"se\":\"A receiver is tuned to 1.000 MHz, uses 455 kHz IF and high-side injection. Its image frequency is:\",\"sh\":\"अभिग्राही 1.000 MHz पर ट्यून है, IF 455 kHz और उच्च-पक्ष इंजेक्शन है। प्रतिबिंब आवृत्ति है:\",\"oe\":[\"0.090 MHz\",\"0.545 MHz\",\"1.455 MHz\",\"1.910 MHz\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"(f<sub>image</sub>=f<sub>RF</sub>+2f<sub>IF</sub>=1.000+0.910=1.910\\\\) MHz. The LO itself is 1.455 MHz, not the image.\",\"eh\":\"प्रतिबिंब 1.910 MHz है; 1.455 MHz स्थानीय दोलक है।\"},{\"n\":74,\"d\":\"M\",\"se\":\"An RF amplifier ahead of the mixer can improve:\",\"sh\":\"मिश्रक से पहले RF प्रवर्धक क्या सुधार सकता है?\",\"oe\":[\"Sensitivity and image rejection\",\"Only loudspeaker power\",\"Battery electrolyte density\",\"Audio de-emphasis only\"],\"oh\":[\"संवेदनशीलता और प्रतिबिंब अस्वीकृति\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"A low-noise tuned RF stage adds gain and preselection before conversion, reducing image and out-of-band responses.\",\"eh\":\"ट्यूनित RF चरण पूर्व-चयन और कम-शोर लाभ देकर प्रतिबिंब प्रतिक्रिया घटाता है।\"},{\"n\":75,\"d\":\"M\",\"se\":\"Automatic gain control normally:\",\"sh\":\"स्वचालित लाभ नियंत्रण सामान्यतः:\",\"oe\":[\"Raises gain on the strongest signals\",\"Changes antenna polarisation\",\"Generates the station carrier\",\"Reduces receiver gain as received signal strength increases\"],\"oh\":[\"\",\"\",\"\",\"प्राप्त संकेत बढ़ने पर अभिग्राही लाभ घटाता है\"],\"a\":3,\"ee\":\"AGC derives a control voltage related to signal level, preventing overload and reducing large volume changes between stations.\",\"eh\":\"AGC मजबूत संकेत पर लाभ घटाकर अतिभार और ध्वनि परिवर्तन कम करता है।\"},{\"n\":76,\"d\":\"H\",\"se\":\"For an AM diode envelope detector, the RC time constant should be:\",\"sh\":\"AM डायोड एनवेलप डिटेक्टर में RC समय नियतांक होना चाहिए:\",\"oe\":[\"Long enough to filter carrier ripple but short enough to follow the audio envelope\",\"Exactly zero\",\"Much longer than every audio period\",\"Independent of carrier and audio frequencies\"],\"oh\":[\"वाहक रिपल फ़िल्टर करने जितना बड़ा, पर ऑडियो आवरण का अनुसरण करने जितना छोटा\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"The practical condition is approximately (1/f_c \\\\ll RC \\\\ll 1/f<sub>m(max)</sub>); too small leaves carrier ripple, too large causes diagonal clipping.\",\"eh\":\"बहुत छोटा RC रिपल और बहुत बड़ा RC विकर्ण क्लिपिंग देता है।\"},{\"n\":77,\"d\":\"H\",\"se\":\"The limiter stage in an FM receiver is placed before the frequency detector to:\",\"sh\":\"FM अभिग्राही में आवृत्ति डिटेक्टर से पहले लिमिटर का उद्देश्य है:\",\"oe\":[\"Remove unwanted amplitude variations\",\"Create AM sidebands\",\"Increase image response\",\"Generate speaker power\"],\"oh\":[\"अनचाहे आयाम परिवर्तन हटाना\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Because ideal FM information is in frequency, clipping amplitude variation improves immunity to amplitude noise before discrimination.\",\"eh\":\"FM सूचना आवृत्ति में होने से आयाम परिवर्तन हटाने पर शोर प्रतिरक्षा सुधरती है।\"},{\"n\":78,\"d\":\"H\",\"se\":\"An FM discriminator converts:\",\"sh\":\"FM डिस्क्रिमिनेटर परिवर्तित करता है:\",\"oe\":[\"Audio amplitude into RF power\",\"Frequency deviation into an output voltage\",\"DC into antenna length\",\"AM carrier power into IF gain\"],\"oh\":[\"\",\"आवृत्ति विचलन को आउटपुट वोल्टेज में\",\"\",\"\"],\"a\":1,\"ee\":\"Its output polarity/magnitude follows instantaneous frequency displacement, recreating the modulating waveform.\",\"eh\":\"आउटपुट तात्कालिक आवृत्ति विचलन का अनुसरण कर संदेश पुनः बनाता है।\"},{\"n\":79,\"d\":\"H\",\"se\":\"The ratio detector is associated chiefly with:\",\"sh\":\"रेशियो डिटेक्टर मुख्यतः किससे संबंधित है?\",\"oe\":[\"AM carrier generation\",\"FM demodulation with some amplitude-noise rejection\",\"Antenna matching only\",\"Battery charging\"],\"oh\":[\"\",\"कुछ आयाम-शोर अस्वीकृति सहित FM डिमॉड्यूलेशन\",\"\",\"\"],\"a\":1,\"ee\":\"A ratio detector is an FM detector whose circuit action offers amplitude limiting/rejection, reducing the need for a separate limiter in some designs.\",\"eh\":\"रेशियो डिटेक्टर FM संसूचन करता और कुछ आयाम परिवर्तन अस्वीकार करता है।\"},{\"n\":80,\"d\":\"H\",\"se\":\"Receiving the same station at two dial positions is called double spotting and often indicates poor:\",\"sh\":\"एक ही स्टेशन का दो डायल स्थानों पर मिलना डबल स्पॉटिंग कहलाता है और प्रायः खराब किसे दर्शाता है?\",\"oe\":[\"Audio fidelity only\",\"Loudspeaker matching\",\"Image-frequency rejection\",\"Battery capacity\"],\"oh\":[\"\",\"\",\"प्रतिबिंब आवृत्ति अस्वीकृति\",\"\"],\"a\":2,\"ee\":\"If front-end selectivity fails to reject the image, both desired and image frequencies can produce the same IF response.\",\"eh\":\"खराब RF पूर्व-चयन से वांछित और प्रतिबिंब दोनों समान IF बना सकते हैं।\"},{\"n\":81,\"d\":\"H\",\"se\":\"For stage-by-stage signal injection in a silent superheterodyne receiver, a sensible isolation method is to start at the:\",\"sh\":\"मूक सुपरहेटरोडाइन अभिग्राही में चरण-दर-चरण सिग्नल इंजेक्शन की उपयुक्त शुरुआत है:\",\"oe\":[\"Audio output and move backward stage by stage\",\"Antenna and replace every component\",\"Mains plug with an RF probe\",\"Speaker cone without checking supply\"],\"oh\":[\"ऑडियो आउटपुट से शुरू कर चरण-दर-चरण पीछे जाना\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"After safety and supply checks, verify the audio output, then detector/IF/front end; the first boundary where the signal disappears localises the fault.\",\"eh\":\"सुरक्षा और आपूर्ति जाँच के बाद आउटपुट से पीछे जाने पर संकेत गायब होने का बिंदु दोष क्षेत्र बताता है।\"},{\"n\":82,\"d\":\"H\",\"se\":\"If detector output audio is present but
