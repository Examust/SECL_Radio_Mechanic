rce/regulation or bias headroom\"],\"oh\":[\"पूर्ण आपूर्ति\",\"केबल लेबल\",\"हाइड्रोमीटर फ्लोट\",\"शक्ति स्रोत/नियमन या बायस हेडरूम\"],\"a\":3,\"ee\":\"Low rail voltage clips signal stages and upsets bias.\",\"eh\":\"कम रेल वोल्टेज क्लिपिंग और बायस दोष देता है।\"},{\"n\":82,\"d\":\"M\",\"se\":\"Frequency drift increasing as equipment warms suggests:\",\"sh\":\"उपकरण गरम होने पर आवृत्ति ड्रिफ्ट बढ़े तो:\",\"oe\":[\"Battery separator\",\"Speaker cone only\",\"Thermally sensitive oscillator/component\",\"Correct crystal reference\"],\"oh\":[\"बैटरी सेपरेटर\",\"केवल स्पीकर कोन\",\"ताप-संवेदी दोलक/घटक\",\"सही क्रिस्टल संदर्भ\"],\"a\":2,\"ee\":\"Controlled heat/cool tests can identify a temperature-dependent part.\",\"eh\":\"नियंत्रित गरम/ठंडा परीक्षण ताप-निर्भर घटक खोजता है।\"},{\"n\":83,\"d\":\"M\",\"se\":\"An intermittent output restored by tapping near a connector suggests:\",\"sh\":\"कनेक्टर के पास हल्के टैप से आउटपुट लौटे तो:\",\"oe\":[\"Perfect board\",\"Correct fuse\",\"Excess capacity\",\"Loose connector, cracked joint or broken conductor\"],\"oh\":[\"पूर्ण बोर्ड\",\"सही फ्यूज\",\"अधिक क्षमता\",\"ढीला कनेक्टर, क्रैक जोड़ या टूटा चालक\"],\"a\":3,\"ee\":\"Mechanical sensitivity is a signature of poor contact.\",\"eh\":\"यांत्रिक संवेदनशीलता खराब संपर्क का संकेत है।\"},{\"n\":84,\"d\":\"M\",\"se\":\"Signal tracing means:\",\"sh\":\"सिग्नल ट्रेसिंग का अर्थ:\",\"oe\":[\"Injecting mains\",\"Replacing blindly\",\"Following an existing signal stage by stage\",\"Measuring acid\"],\"oh\":[\"मेन्स इंजेक्ट\",\"अंधा बदलना\",\"मौजूदा संकेत को चरण-दर-चरण अनुसरण\",\"अम्ल मापना\"],\"a\":2,\"ee\":\"The point where signal disappears or corrupts bounds the fault.\",\"eh\":\"जहाँ संकेत गायब/विकृत हो, वहीं दोष सीमा मिलती है।\"},{\"n\":85,\"d\":\"M\",\"se\":\"Signal injection means:\",\"sh\":\"सिग्नल इंजेक्शन का अर्थ:\",\"oe\":[\"Shorting output\",\"Applying a known test signal at selected stages\",\"Increasing fuse rating\",\"Opening battery vents only\"],\"oh\":[\"आउटपुट शॉर्ट\",\"चुने चरणों पर ज्ञात परीक्षण संकेत देना\",\"फ्यूज रेटिंग बढ़ाना\",\"केवल वेंट खोलना\"],\"a\":1,\"ee\":\"A known signal checks the downstream chain from each injection point.\",\"eh\":\"ज्ञात संकेत हर बिंदु से आगे की श्रृंखला जाँचता है।\"},{\"n\":86,\"d\":\"M\",\"se\":\"The half-split method is efficient because it:\",\"sh\":\"हाफ-स्प्लिट विधि प्रभावी है क्योंकि:\",\"oe\":[\"Tests one random part\",\"Requires no diagram\",\"Always replaces PCB\",\"Eliminates about half the suspect path per test\"],\"oh\":[\"एक यादृच्छिक भाग\",\"आरेख नहीं चाहिए\",\"सदैव PCB बदलती है\",\"हर परीक्षण में लगभग आधा संदिग्ध पथ हटाती है\"],\"a\":3,\"ee\":\"Repeated midpoint tests rapidly narrow the faulty section.\",\"eh\":\"बार-बार मध्य जाँच दोष क्षेत्र शीघ्र संकरा करती है।\"},{\"n\":87,\"d\":\"M\",\"se\":\"Substitution testing should use:\",\"sh\":\"प्रतिस्थापन परीक्षण में उपयोग करें:\",\"oe\":[\"A known-good compatible part/module\",\"Any higher-voltage module\",\"Unknown scrap\",\"Bypassed protection\"],\"oh\":[\"ज्ञात-सही संगत भाग/मॉड्यूल\",\"कोई बड़ा मॉड्यूल\",\"अज्ञात स्क्रैप\",\"बायपास सुरक्षा\"],\"a\":0,\"ee\":\"Compatibility and controlled change make the result meaningful.\",\"eh\":\"संगतता और नियंत्रित परिवर्तन परिणाम विश्वसनीय बनाते हैं।\"},{\"n\":88,\"d\":\"M\",\"se\":\"A current-limited bench supply helps:\",\"sh\":\"धारा-सीमित बेंच आपूर्ति मदद करती है:\",\"oe\":[\"Guarantee no fault\",\"Replace fuse permanently\",\"Prevent further damage while observing abnormal current\",\"Increase all voltages\"],\"oh\":[\"दोष शून्य गारंटी\",\"फ्यूज स्थायी बदलना\",\"असामान्य धारा देखते हुए आगे क्षति रोकना\",\"सभी वोल्टेज बढ़ाना\"],\"a\":2,\"ee\":\"Set safe voltage/current before connection and raise cautiously.\",\"eh\":\"जोड़ने से पहले सुरक्षित वोल्टेज/धारा सेट कर सावधानी से बढ़ाएँ।\"},{\"n\":89,\"d\":\"M\",\"se\":\"Bridging a fuse during diagnosis is:\",\"sh\":\"निदान में फ्यूज बायपास करना:\",\"oe\":[\"Best practice\",\"Required for every short\",\"A calibration step\",\"Unsafe because it removes designed protection\"],\"oh\":[\"सर्वोत्तम अभ्यास\",\"हर शॉर्ट हेतु आवश्यक\",\"कैलिब्रेशन कदम\",\"असुरक्षित क्योंकि सुरक्षा हटती है\"],\"a\":3,\"ee\":\"Use protected current limiting, not improvised bypasses.\",\"eh\":\"अस्थायी बायपास नहीं, सुरक्षित धारा सीमा उपयोग करें।\"},{\"n\":90,\"d\":\"M\",\"se\":\"Repair records should include:\",\"sh\":\"मरम्मत अभिलेख में होना चाहिए:\",\"oe\":[\"Only technician name\",\"Symptom, measurements, cause, action and verification\",\"Only replaced part\",\"No before-values\"],\"oh\":[\"केवल नाम\",\"लक्षण, माप, कारण, कार्य और सत्यापन\",\"केवल बदला भाग\",\"पूर्व मान नहीं\"],\"a\":1,\"ee\":\"Records prevent repeated work and support trend/preventive analysis.\",\"eh\":\"अभिलेख पुनरावृत्ति रोक और प्रवृत्ति विश्लेषण में मदद करते हैं।\"},{\"n\":91,\"d\":\"M\",\"se\":\"Preventive maintenance is performed:\",\"sh\":\"निवारक अनुरक्षण किया जाता है:\",\"oe\":[\"Before failure on a schedule/condition basis\",\"Only after breakdown\",\"Without inspection\",\"By disabling alarms\"],\"oh\":[\"विफलता से पहले अनुसूची/दशा आधार पर\",\"केवल टूटने बाद\",\"बिना निरीक्षण\",\"अलार्म बंद करके\"],\"a\":0,\"ee\":\"Cleaning, inspection and measured checks reduce failure probability.\",\"eh\":\"सफाई, निरीक्षण और माप विफलता संभावना घटाते हैं।\"},{\"n\":92,\"d\":\"M\",\"se\":\"Breakdown maintenance begins:\",\"sh\":\"भंग अनुरक्षण शुरू होता है:\",\"oe\":[\"After an unplanned failure\",\"Before any symptom\",\"At fixed intervals only\",\"With no repair\"],\"oh\":[\"अनियोजित विफलता के बाद\",\"किसी लक्षण से पहले\",\"केवल निश्चित अंतराल\",\"बिना मरम्मत\"],\"a\":0,\"ee\":\"Its objective is to restore service after failure.\",\"eh\":\"इसका लक्ष्य विफलता के बाद सेवा बहाल करना है।\"},{\"n\":93,\"d\":\"H\",\"se\":\"Supply rails are correct; injecting audio at AF input gives no speaker output. Fault is most likely in:\",\"sh\":\"आपूर्ति सही; AF इनपुट पर ऑडियो देने पर स्पीकर आउटपुट नहीं। दोष क्षेत्र:\",\"oe\":[\"RF antenna\",\"Battery hydrometer\",\"AF amplifier/output path\",\"Line ringing source\"],\"oh\":[\"RF एंटीना\",\"बैटरी हाइड्रोमीटर\",\"AF प्रवर्धक/आउटपुट पथ\",\"लाइन रिंगिंग स्रोत\"],\"a\":2,\"ee\":\"A known AF input bypasses earlier RF/detector stages.\",\"eh\":\"ज्ञात AF इनपुट पहले के RF/डिटेक्टर चरणों को बायपास करता है।\"},{\"n\":94,\"d\":\"H\",\"se\":\"IF signal reaches detector input but recovered audio is absent. Suspect:\",\"sh\":\"IF संकेत डिटेक्टर इनपुट तक है पर ऑडियो नहीं। संदिग्ध:\",\"oe\":[\"Detector/demodulator stage\",\"Antenna mast only\",\"Speaker magnet first\",\"Battery separator\"],\"oh\":[\"डिटेक्टर/डिमॉड्यूलेटर चरण\",\"केवल एंटीना मस्तूल\",\"पहले स्पीकर चुंबक\",\"बैटरी सेपरेटर\"],\"a\":0,\"ee\":\"Signal presence before and absence after the detector isolates that stage.\",\"eh\":\"डिटेक्टर से पहले संकेत और बाद में अनुपस्थिति उसी चरण को दर्शाती है।\"},{\"n\":95,\"d\":\"H\",\"se\":\"Equipment fails hot and recovers cold. Best next test is:\",\"sh\":\"उपकरण गरम पर विफल और ठंडा पर ठीक। अगला सही परीक्षण:\",\"oe\":[\"Replace everything\",\"Controlled thermal localisation while monitoring the symptom\",\"Apply open flame\",\"Ignore temperature\"],\"oh\":[\"सब बदलें\",\"लक्षण देखते हुए नियंत्रित ताप स्थानीयकरण\",\"खुली लौ\",\"ताप अनदेखा\"],\"a\":1,\"ee\":\"Safe heat/cool application can identify a thermally intermittent component.\",\"eh\":\"सुरक्षित गरम/ठंडा प्रयोग ताप-अंतराल घटक खोज सकता है।\"},{\"n\":96,\"d\":\"H\",\"se\":\"A replacement fuse blows immediately. Next action is to:\",\"sh\":\"नया फ्यूज तुरंत उड़े। अगला कदम:\",\"oe\":[\"Fit larger fuse\",\"Bridge it\",\"Repeat indefinitely\",\"De-energise and isolate the short/overload section\"],\"oh\":[\"बड़ा फ्यूज\",\"बायपास\",\"बार-बार दोहराएँ\",\"डी-एनर्जाइज कर शॉर्ट/ओवरलोड क्षेत्र अलग करें\"],\"a\":3,\"ee\":\"Repeated fuse replacement without cause correction risks damage/fire.\",\"eh\":\"कारण ठीक बिना फ्यूज बदलते रहना क्षति/आग जोखिम है।\"},{\"n\":97,\"d\":\"H\",\"se\":\"Using continuity mode on an energised line is wrong because:\",\"sh\":\"जीवित लाइन पर सततता मोड गलत है क्योंकि:\",\"oe\":[\"It improves accuracy\",\"It raises insulation\",\"It calibrates automatically\",\"External voltage can damage the meter and invalidate the result\"],\"oh\":[\"सटीकता बढ़ती\",\"इन्सुलेशन बढ़ता\",\"स्वतः कैलिब्रेट\",\"बाहरी वोल्टेज मीटर क्षतिग्रस्त और परिणाम गलत कर सकता है\"],\"a\":3,\"ee\":\"First prove de-energisation with an appropriate voltage test.\",\"eh\":\"पहले उचित वोल्टेज जाँच से डी-एनर्जाइजेशन सिद्ध करें।\"},{\"n\":98,\"d\":\"H\",\"se\":\"Output is normal unloaded but collapses under load. Suspect:\",\"sh\":\"आउटपुट बिना भार सामान्य पर भार में गिरता है। संदिग्ध:\",\"oe\":[\"Perfect supply\",\"Infinite capacity\",\"High source/series resistance or weak regulation\",\"No current demand\"],\"oh\":[\"पूर्ण आपूर्ति\",\"अनंत क्षमता\",\"उच्च स्रोत/श्रेणी प्रतिरोध या कमजोर नियमन\",\"कोई धारा मांग नहीं\"],\"a\":2,\"ee\":\"Load exposes voltage drop that a high-impedance no-load meter hides.\",\"eh\":\"भार वह ड्रॉप दिखाता है जिसे बिना भार उच्च-प्रतिबाधा मीटर छिपाता है।\"},{\"n\":99,\"d\":\"H\",\"se\":\"Repeated connector corrosion is best prevented by:\",\"sh\":\"बार-बार कनेक्टर क्षरण का सर्वोत्तम निवारण:\",\"oe\":[\"Correct sealing, strain relief, cleaning and environmental control\",\"Only replacing fuse\",\"Increasing voltage\",\"Leaving moisture\"],\"oh\":[\"सही सीलिंग, स्ट्रेन रिलीफ, सफाई और पर्यावरण नियंत्रण\",\"केवल फ्यूज बदलना\",\"वोल्टेज बढ़ाना\",\"नमी छोड़ना\"],\"a\":0,\"ee\":\"Root-cause environmental control prevents recurrence better than repeated replacement.\",\"eh\":\"पर्यावरण मूल कारण नियंत्रित करना बार-बार बदलने से बेहतर है।\"},{\"n\":100,\"d\":\"H\",\"se\":\"After repair, final acceptance must include:\",\"sh\":\"मरम्मत के बाद अंतिम स्वीकृति में:\",\"oe\":[\"Power-on only\",\"No-load check only\",\"Functional and safety verification under specified conditions plus record update\",\"Removing protection\"],\"oh\":[\"केवल पावर ऑन\",\"केवल बिना भार\",\"निर्दिष्ट दशाओं में कार्य/सुरक्षा सत्यापन और अभिलेख अद्यतन\",\"सुरक्षा हटाना\"],\"a\":2,\"ee\":\"A repair is incomplete until performance, protection and documentation are verified.\",\"eh\":\"प्रदर्शन, सुरक्षा और दस्तावेज़ सत्यापित बिना मरम्मत पूर्ण नहीं।\"}]},{\"id\":\"s05\",\"num\":5,\"name\":\"Quantitative Ability, Mental Ability, Logical and Reasoning Skill\",\"q\":[{\"n\":1,\"d\":\"E\",\"se\":\"Using BODMAS, evaluate 48 ÷ 6 × 4 + 3.\",\"sh\":\"BODMAS से 48 ÷ 6 × 4 + 3 का मान ज्ञात करें।\",\"oe\":[\"35 / 35\",\"11 / 11\",\"27 / 27\",\"32 / 32\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Division and multiplication have equal priority and are done left to right: 48÷6=8, 8×4=32, then +3=35.\",\"eh\":\"भाग और गुणा समान प्राथमिकता पर बाएँ से दाएँ होते हैं: 48÷6=8, 8×4=32, फिर +3=35।\"},{\"n\":2,\"d\":\"E\",\"se\":\"The HCF of 36 and 48 is:\",\"sh\":\"36 और 48 का म.स. है:\",\"oe\":[\"6 / 6\",\"18 / 18\",\"24 / 24\",\"12 / 12\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"36=2²×3² and 48=2⁴×3; common minimum powers give 2²×3=12.\",\"eh\":\"36=2²×3² और 48=2⁴×3; समान न्यूनतम घात 2²×3=12 देते हैं।\"},{\"n\":3,\"d\":\"E\",\"se\":\"The LCM of 12 and 18 is:\",\"sh\":\"12 और 18 का ल.स. है:\",\"oe\":[\"24 / 24\",\"36 / 36\",\"54 / 54\",\"72 / 72\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"12=2²×3 and 18=2×3²; maximum powers give 2²×3²=36.\",\"eh\":\"12=2²×3 और 18=2×3²; अधिकतम घात 2²×3²=36 देते हैं।\"},{\"n\":4,\"d\":\"M\",\"se\":\"Which number is divisible by 9?\",\"sh\":\"कौन-सी संख्या 9 से विभाज्य है?\",\"oe\":[\"4513 / 4513\",\"4523 / 4523\",\"4563 / 4563\",\"4553 / 4553\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"A number is divisible by 9 when its digit sum is divisible by 9. For 4563, the sum is 18.\",\"eh\":\"अंकों का योग 9 से विभाज्य हो तो संख्या 9 से विभाज्य है। 4563 का योग 18 है।\"},{\"n\":5,\"d\":\"M\",\"se\":\"Evaluate 3/4 + 5/8.\",\"sh\":\"3/4 + 5/8 का मान ज्ञात करें।\",\"oe\":[\"11/8 / 11/8\",\"8/12 / 8/12\",\"1 / 1\",\"13/8 / 13/8\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Convert 3/4 to 6/8; then 6/8+5/8=11/8=1⅜.\",\"eh\":\"3/4 को 6/8 करें; तब 6/8+5/8=11/8=1⅜।\"},{\"n\":6,\"d\":\"M\",\"se\":\"0.375 in lowest fractional form is:\",\"sh\":\"0.375 का सरलतम भिन्न रूप है:\",\"oe\":[\"37/100 / 37/100\",\"3/5 / 3/5\",\"5/8 / 5/8\",\"3/8 / 3/8\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"0.375=375/1000; dividing numerator and denominator by 125 gives 3/8.\",\"eh\":\"0.375=375/1000; अंश और हर को 125 से भाग देने पर 3/8 मिलता है।\"},{\"n\":7,\"d\":\"M\",\"se\":\"Which is greatest?\",\"sh\":\"कौन-सा सबसे बड़ा है?\",\"oe\":[\"0.62 / 0.62\",\"5/8 / 5/8\",\"61% / 61%\",\"0.60 / 0.60\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"5/8=0.625, which exceeds 0.62, 0.61 and 0.60.\",\"eh\":\"5/8=0.625, जो 0.62, 0.61 और 0.60 से अधिक है।\"},{\"n\":8,\"d\":\"H\",\"se\":\"The remainder when 2¹⁰ is divided by 7 is:\",\"sh\":\"2¹⁰ को 7 से भाग देने पर शेष है:\",\"oe\":[\"1 / 1\",\"3 / 3\",\"2 / 2\",\"4 / 4\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Powers of 2 modulo 7 repeat 2,4,1 every three powers. Since 10 leaves remainder 1 on division by 3, the remainder is 2.\",\"eh\":\"7 के सापेक्ष 2 की घातों के शेष 2,4,1 दोहरते हैं। 10 को 3 से भाग पर शेष 1 है, अतः उत्तर 2।\"},{\"n\":9,\"d\":\"H\",\"se\":\"What least positive number must be added to 560 to make it divisible by 9?\",\"sh\":\"560 को 9 से विभाज्य बनाने के लिए न्यूनतम धनात्मक संख्या कितनी जोड़ें?\",\"oe\":[\"7 / 7\",\"4 / 4\",\"5 / 5\",\"8 / 8\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"560 has digit sum 11. The next multiple-of-9 digit sum is 18, so add 7; 567 is divisible by 9.\",\"eh\":\"560 के अंकों का योग 11 है। अगला 9 का गुणज 18 है, इसलिए 7 जोड़ें; 567 विभाज्य है।\"},{\"n\":10,\"d\":\"M\",\"se\":\"Two positive integers have HCF 12 and LCM 420. If one is 60, the other is:\",\"sh\":\"दो धन पूर्णांकों का म.स. 12 और ल.स. 420 है। एक 60 हो तो दूसरा है:\",\"oe\":[\"72 / 72\",\"96 / 96\",\"120 / 120\",\"84 / 84\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"For two integers, product = HCF×LCM. Other number=(12×420)/60=84.\",\"eh\":\"दो पूर्णांकों के लिए गुणनफल=म.स.×ल.स.; दूसरी संख्या=(12×420)/60=84।\"},{\"n\":11,\"d\":\"E\",\"se\":\"25% of 240 is:\",\"sh\":\"240 का 25% है:\",\"oe\":[\"48 / 48\",\"60 / 60\",\"50 / 50\",\"80 / 80\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"25%=1/4, and one-fourth of 240 is 60.\",\"eh\":\"25%=1/4 और 240 का चौथाई 60 है।\"},{\"n\":12,\"d\":\"E\",\"se\":\"A value of 80 is increased by 15%. The new value is:\",\"sh\":\"80 में 15% वृद्धि की जाए तो नया मान है:\",\"oe\":[\"88 / 88\",\"94 / 94\",\"92 / 92\",\"95 / 95\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"15% of 80 is 12; therefore 80+12=92.\",\"eh\":\"80 का 15% 12 है; अतः 80+12=92।\"},{\"n\":13,\"d\":\"E\",\"se\":\"A price of ₹500 is reduced by 20%. The new price is:\",\"sh\":\"₹500 में 20% कमी के बाद नया मूल्य है:\",\"oe\":[\"₹400 / ₹400\",\"₹380 / ₹380\",\"₹420 / ₹420\",\"₹450 / ₹450\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"After a 20% reduction, 80% remains: 500×0.80=₹400.\",\"eh\":\"20% कमी के बाद 80% बचता है: 500×0.80=₹400।\"},{\"n\":14,\"d\":\"M\",\"se\":\"A number is increased by 20% and then decreased by 20%. The net change is:\",\"sh\":\"किसी संख्या में 20% वृद्धि और फिर 20% कमी की गई। शुद्ध परिवर्तन है:\",\"oe\":[\"No change\",\"4% increase\",\"8% decrease\",\"4% decrease\"],\"oh\":[\"कोई परिवर्तन नहीं\",\"4% वृद्धि\",\"8% कमी\",\"4% कमी\"],\"a\":3,\"ee\":\"Multipliers are 1.20×0.80=0.96, leaving 96% of the original: a 4% decrease.\",\"eh\":\"गुणक 1.20×0.80=0.96 है; मूल का 96% बचता है, अर्थात 4% कमी।\"},{\"n\":15,\"d\":\"M\",\"se\":\"A commodity's price rises by 25%. By what percent must consumption fall to keep expenditure unchanged?\",\"sh\":\"वस्तु का मूल्य 25% बढ़े तो व्यय समान रखने हेतु खपत कितने प्रतिशत घटे?\",\"oe\":[\"15% / 15%\",\"20% / 20%\",\"25% / 25%\",\"30% / 30%\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"New price factor is 1.25, so quantity factor must be 1/1.25=0.80; reduction=20%.\",\"eh\":\"नया मूल्य गुणक 1.25 है, इसलिए मात्रा गुणक 1/1.25=0.80; कमी 20%।\"},{\"n\":16,\"d\":\"M\",\"se\":\"After a 20% increase, a number becomes 240. The original number was:\",\"sh\":\"20% वृद्धि के बाद संख्या 240 हुई। मूल संख्या थी:\",\"oe\":[\"192 / 192\",\"216 / 216\",\"200 / 200\",\"288 / 288\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Original×1.20=240, so original=240/1.20=200.\",\"eh\":\"मूल×1.20=240, इसलिए मूल=240/1.20=200।\"},{\"n\":17,\"d\":\"H\",\"se\":\"A clerk multiplied a number by 1.2 instead of 0.8. Relative to the correct result, the percentage error is:\",\"sh\":\"क्लर्क ने संख्या को 0.8 के बदले 1.2 से गुणा किया। सही परिणाम के सापेक्ष प्रतिशत त्रुटि है:\",\"oe\":[\"50% / 50%\",\"33⅓% / 33⅓%\",\"40% / 40%\",\"150% / 150%\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Error=(1.2−0.8)x=0.4x; correct result=0.8x. Thus error%=0.4/0.8×100=50%.\",\"eh\":\"त्रुटि=(1.2−0.8)x=0.4x और सही परिणाम=0.8x; अतः त्रुटि%=0.4/0.8×100=50%।\"},{\"n\":18,\"d\":\"H\",\"se\":\"A is 30% more than B. B is what percent less than A?\",\"sh\":\"A, B से 30% अधिक है। B, A से कितने प्रतिशत कम है?\",\"oe\":[\"20% / 20%\",\"30% / 30%\",\"33⅓% / 33⅓%\",\"23 1/13% / 23 1/13%\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Let B=100, so A=130. Shortfall=30 on base 130: 30/130×100=23 1/13%.\",\"eh\":\"B=100 मानें, तब A=130। कमी 30 है और आधार 130: 30/130×100=23 1/13%।\"},{\"n\":19,\"d\":\"M\",\"se\":\"A population of 10,000 rises by 10% and next year falls by 10%. The final population is:\",\"sh\":\"10,000 की जनसंख्या 10% बढ़ती और अगले वर्ष 10% घटती है। अंतिम जनसंख्या है:\",\"oe\":[\"9,800 / 9,800\",\"9,900 / 9,900\",\"10,000 / 10,000\",\"10,100 / 10,100\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"10,000×1.10×0.90=9,900. Equal successive percentages act on different bases.\",\"eh\":\"10,000×1.10×0.90=9,900। समान प्रतिशत अलग आधारों पर लगते हैं।\"},{\"n\":20,\"d\":\"H\",\"se\":\"Pass marks are 40%. A candidate scores 144 and fails by 16 marks. Maximum marks are:\",\"sh\":\"उत्तीर्णांक 40% हैं। अभ्यर्थी 144 अंक पाकर 16 से अनुत्तीर्ण है। अधिकतम अंक हैं:\",\"oe\":[\"360 / 360\",\"420 / 420\",\"400 / 400\",\"500 / 500\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Pass marks=144+16=160. If 160 is 40%, maximum=160/0.40=400.\",\"eh\":\"उत्तीर्णांक=144+16=160। यदि 160, 40% है तो अधिकतम=160/0.40=400।\"},{\"n\":21,\"d\":\"E\",\"se\":\"₹360 is divided in the ratio 2:3. The two shares are:\",\"sh\":\"₹360 को 2:3 में बाँटा गया। दोनों हिस्से हैं:\",\"oe\":[\"₹144 and ₹216\",\"₹120 and ₹240\",\"₹150 and ₹210\",\"₹180 and ₹180\"],\"oh\":[\"₹144 और ₹216\",\"₹120 और ₹240\",\"₹150 और ₹210\",\"₹180 और ₹180\"],\"a\":0,\"ee\":\"Total parts=5; one part=360/5=72. Shares are 2×72=144 and 3×72=216.\",\"eh\":\"कुल भाग 5; एक भाग=360/5=72। हिस्से 2×72=144 और 3×72=216।\"},{\"n\":22,\"d\":\"E\",\"se\":\"Two numbers are in the ratio 3:5 and their sum is 64. They are:\",\"sh\":\"दो संख्याएँ 3:5 के अनुपात में हैं और योग 64 है। वे हैं:\",\"oe\":[\"18 and 46\",\"21 and 43\",\"27 and 37\",\"24 and 40\"],\"oh\":[\"18 और 46\",\"21 और 43\",\"27 और 37\",\"24 और 40\"],\"a\":3,\"ee\":\"Eight parts total 64, so one part=8; numbers are 3×8 and 5×8.\",\"eh\":\"आठ भागों का योग 64 है, अतः एक भाग=8; संख्याएँ 3×8 और 5×8।\"},{\"n\":23,\"d\":\"E\",\"se\":\"Five identical machines make 200 units in a fixed time. At the same rate, eight machines make:\",\"sh\":\"पाँच समान मशीनें निश्चित समय में 200 इकाई बनाती हैं। उसी दर पर आठ मशीनें बनाएँगी:\",\"oe\":[\"250 units\",\"320 units\",\"300 units\",\"400 units\"],\"oh\":[\"250 इकाई\",\"320 इकाई\",\"300 इकाई\",\"400 इकाई\"],\"a\":1,\"ee\":\"Output is directly proportional to machines: 200×8/5=320.\",\"eh\":\"उत्पादन मशीनों के प्रत्यक्ष समानुपाती है: 200×8/5=320।\"},{\"n\":24,\"d\":\"M\",\"se\":\"Twelve workers finish a job in 15 days. At equal efficiency, 20 workers need:\",\"sh\":\"12 श्रमिक कार्य 15 दिन में करते हैं। समान दक्षता पर 20 श्रमिकों को लगेंगे:\",\"oe\":[\"8 days\",\"10 days\",\"9 days\",\"12 days\"],\"oh\":[\"8 दिन\",\"10 दिन\",\"9 दिन\",\"12 दिन\"],\"a\":2,\"ee\":\"Workers and days are inversely proportional: 12×15=20×d, so d=9.\",\"eh\":\"श्रमिक और दिन व्युत्क्रमानुपाती हैं: 12×15=20×d, अतः d=9।\"},{\"n\":25,\"d\":\"M\",\"se\":\"The average of 12, 18, 24 and 30 is:\",\"sh\":\"12, 18, 24 और 30 का औसत है:\",\"oe\":[\"21 / 21\",\"20 / 20\",\"22 / 22\",\"24 / 24\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Sum=84 and count=4; average=84/4=21.\",\"eh\":\"योग=84 और संख्या=4; औसत=84/4=21।\"},{\"n\":26,\"d\":\"M\",\"se\":\"In a class, 20 students average 60 marks and 30 students average 70 marks. The combined average is:\",\"sh\":\"एक कक्षा में 20 छात्रों का औसत 60 और 30 छात्रों का औसत 70 है। संयुक्त औसत है:\",\"oe\":[\"64 / 64\",\"65 / 65\",\"68 / 68\",\"66 / 66\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Weighted average=(20×60+30×70)/50=66.\",\"eh\":\"भारित औसत=(20×60+30×70)/50=66।\"},{\"n\":27,\"d\":\"M\",\"se\":\"If A:B=2:3 and B:C=4:5, then A:B:C is:\",\"sh\":\"यदि A:B=2:3 और B:C=4:5, तो A:B:C है:\",\"oe\":[\"2:4:5 / 2:4:5\",\"8:12:15 / 8:12:15\",\"8:3:15 / 8:3:15\",\"4:6:5 / 4:6:5\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Make B common at 12: A:B=8:12 and B:C=12:15.\",\"eh\":\"B को 12 पर समान करें: A:B=8:12 और B:C=12:15।\"},{\"n\":28,\"d\":\"M\",\"se\":\"The average of eight numbers is 15. If 27 is added as a ninth number, the new average is:\",\"sh\":\"आठ संख्याओं का औसत 15 है। 27 को नौवीं संख्या जोड़ने पर नया औसत है:\",\"oe\":[\"16 / 16\",\"16½ / 16½\",\"16⅓ / 16⅓\",\"17 / 17\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Old total=8×15=120; new average=(120+27)/9=16⅓.\",\"eh\":\"पुराना योग=8×15=120; नया औसत=(120+27)/9=16⅓।\"},{\"n\":29,\"d\":\"H\",\"se\":\"A and B have incomes in ratio 4:5 and expenditures in ratio 3:4. Each saves ₹1,000. Their total income is:\",\"sh\":\"A और B की आय 4:5 तथा व्यय 3:4 है। दोनों ₹1,000 बचाते हैं। कुल आय है:\",\"oe\":[\"₹9,000 / ₹9,000\",\"₹8,000 / ₹8,000\",\"₹10,000 / ₹10,000\",\"₹12,000 / ₹12,000\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"With incomes 4x,5x and expenses 3y,4y, the two saving equations give x=y=1000; total=9x=₹9,000.\",\"eh\":\"आय 4x,5x और व्यय 3y,4y मानने पर दोनों बचत समीकरण x=y=1000 देते हैं; कुल=9x=₹9,000।\"},{\"n\":30,\"d\":\"H\",\"se\":\"Milk and water are in ratio 5:3. After adding 16 L water, the ratio becomes 5:4. The initial mixture was:\",\"sh\":\"दूध और पानी 5:3 हैं। 16 L पानी जोड़ने पर अनुपात 5:4 हो जाता है। प्रारंभिक मिश्रण था:\",\"oe\":[\"96 L / 96 L\",\"112 L / 112 L\",\"144 L / 144 L\",\"128 L / 128 L\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Let amounts be 5x and 3x. From 5x:(3x+16)=5:4, x=16; initial total=8x=128 L.\",\"eh\":\"मात्राएँ 5x और 3x मानें। 5x:(3x+16)=5:4 से x=16; प्रारंभिक कुल=8x=128 L।\"},{\"n\":31,\"d\":\"E\",\"se\":\"An article costs ₹800 and sells for ₹920. Profit percent is:\",\"sh\":\"वस्तु का क्रय मूल्य ₹800 और विक्रय मूल्य ₹920 है। लाभ प्रतिशत है:\",\"oe\":[\"12% / 12%\",\"15% / 15%\",\"20% / 20%\",\"25% / 25%\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Profit=₹120; profit%=120/800×100=15%.\",\"eh\":\"लाभ=₹120; लाभ%=120/800×100=15%।\"},{\"n\":32,\"d\":\"E\",\"se\":\"An article marked ₹1,000 is sold at 10% discount. Selling price is:\",\"sh\":\"₹1,000 अंकित वस्तु 10% बट्टे पर बेची गई। विक्रय मूल्य है:\",\"oe\":[\"₹890 / ₹890\",\"₹910 / ₹910\",\"₹900 / ₹900\",\"₹990 / ₹990\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"SP=1000×0.90=₹900.\",\"eh\":\"SP=1000×0.90=₹900।\"},{\"n\":33,\"d\":\"M\",\"se\":\"An article sold for ₹960 incurs a 20% loss. Its cost price is:\",\"sh\":\"₹960 में बेचने पर 20% हानि होती है। क्रय मूल्य है:\",\"oe\":[\"₹1,200 / ₹1,200\",\"₹1,080 / ₹1,080\",\"₹1,152 / ₹1,152\",\"₹1,250 / ₹1,250\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"At 20% loss, SP=80% of CP; CP=960/0.80=₹1,200.\",\"eh\":\"20% हानि पर SP, CP का 80% है; CP=960/0.80=₹1,200।\"},{\"n\":34,\"d\":\"M\",\"se\":\"A marked price of ₹1,500 is reduced successively by 10% and 20%. The final selling price is:\",\"sh\":\"₹1,500 अंकित मूल्य पर क्रमशः 10% और 20% बट्टा है। अंतिम विक्रय मूल्य है:\",\"oe\":[\"₹1,050 / ₹1,050\",\"₹1,100 / ₹1,100\",\"₹1,200 / ₹1,200\",\"₹1,080 / ₹1,080\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"SP=1500×0.90×0.80=₹1,080; equivalent discount is 28%.\",\"eh\":\"SP=1500×0.90×0.80=₹1,080; समतुल्य बट्टा 28% है।\"},{\"n\":35,\"d\":\"M\",\"se\":\"Profit is 20% of the selling price. Profit as a percentage of cost price is:\",\"sh\":\"लाभ, विक्रय मूल्य का 20% है। क्रय मूल्य पर लाभ प्रतिशत है:\",\"oe\":[\"16⅔% / 16⅔%\",\"25% / 25%\",\"20% / 20%\",\"24% / 24%\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Let SP=100; profit=20 and CP=80. Thus profit%=20/80×100=25%.\",\"eh\":\"SP=100 मानें; लाभ=20 और CP=80। अतः लाभ%=20/80×100=25%।\"},{\"n\":36,\"d\":\"M\",\"se\":\"A shopkeeper marks an article 40% above cost and gives 10% discount. His profit percent is:\",\"sh\":\"दुकानदार वस्तु को लागत से 40% अधिक अंकित कर 10% बट्टा देता है। लाभ प्रतिशत है:\",\"oe\":[\"24% / 24%\",\"28% / 28%\",\"26% / 26%\",\"30% / 30%\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"SP factor=1.40×0.90=1.26 of CP; profit=26%.\",\"eh\":\"SP गुणक=1.40×0.90=1.26 CP; लाभ=26%।\"},{\"n\":37,\"d\":\"H\",\"se\":\"A seller charges the cost price of 1 kg but supplies only 900 g. His profit percent is:\",\"sh\":\"विक्रेता 1 kg के लागत मूल्य जितना लेता है पर 900 g देता है। लाभ प्रतिशत है:\",\"oe\":[\"11 1/9% / 11 1/9%\",\"10% / 10%\",\"9 1/11% / 9 1/11%\",\"12½% / 12½%\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"If 1 kg costs ₹100, 900 g costs ₹90 and sells for ₹100. Profit%=10/90×100=11 1/9%.\",\"eh\":\"1 kg की लागत ₹100 हो तो 900 g की लागत ₹90 और बिक्री ₹100। लाभ%=10/90×100=11 1/9%।\"},{\"n\":38,\"d\":\"H\",\"se\":\"An article is sold at 10% profit. If sold for ₹60 more, profit would be 18%. Cost price is:\",\"sh\":\"वस्तु 10% लाभ पर बेची जाती है। ₹60 अधिक में बेचने पर लाभ 18% होता। क्रय मूल्य है:\",\"oe\":[\"₹600 / ₹600\",\"₹720 / ₹720\",\"₹800 / ₹800\",\"₹750 / ₹750\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"The extra ₹60 is 8% of CP; CP=60/0.08=₹750.\",\"eh\":\"अतिरिक्त ₹60, CP का 8% है; CP=60/0.08=₹750।\"},{\"n\":39,\"d\":\"E\",\"se\":\"Simple interest on ₹2,000 at 5% per annum for 3 years is:\",\"sh\":\"₹2,000 पर 5% वार्षिक दर से 3 वर्ष का साधारण ब्याज है:\",\"oe\":[\"₹250 / ₹250\",\"₹300 / ₹300\",\"₹350 / ₹350\",\"₹400 / ₹400\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"SI=PRT/100=2000×5×3/100=₹300.\",\"eh\":\"SI=PRT/100=2000×5×3/100=₹300।\"},{\"n\":40,\"d\":\"E\",\"se\":\"The amount on ₹1,500 at 8% simple interest for 2 years is:\",\"sh\":\"₹1,500 पर 8% साधारण ब्याज से 2 वर्ष बाद राशि है:\",\"oe\":[\"₹1,620 / ₹1,620\",\"₹1,680 / ₹1,680\",\"₹1,740 / ₹1,740\",\"₹1,800 / ₹1,800\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"SI=₹240; amount=1500+240=₹1,740.\",\"eh\":\"SI=₹240; राशि=1500+240=₹1,740।\"},{\"n\":41,\"d\":\"M\",\"se\":\"Compound amount on ₹10,000 at 10% per annum for 2 years is:\",\"sh\":\"₹10,000 पर 10% वार्षिक चक्रवृद्धि से 2 वर्ष बाद राशि है:\",\"oe\":[\"₹12,100 / ₹12,100\",\"₹11,000 / ₹11,000\",\"₹12,000 / ₹12,000\",\"₹12,200 / ₹12,200\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Amount=10000(1.10)²=₹12,100.\",\"eh\":\"राशि=10000(1.10)²=₹12,100।\"},{\"n\":42,\"d\":\"M\",\"se\":\"For ₹5,000 at 10% per annum for 2 years, CI exceeds SI by:\",\"sh\":\"₹5,000 पर 10% वार्षिक दर से 2 वर्ष में CI, SI से कितना अधिक है:\",\"oe\":[\"₹25 / ₹25\",\"₹75 / ₹75\",\"₹100 / ₹100\",\"₹50 / ₹50\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"For two years, difference=P(r/100)²=5000(0.10)²=₹50.\",\"eh\":\"दो वर्ष हेतु अंतर=P(r/100)²=5000(0.10)²=₹50।\"},{\"n\":43,\"d\":\"M\",\"se\":\"A sum doubles in 8 years at simple interest. The annual rate is:\",\"sh\":\"कोई राशि साधारण ब्याज पर 8 वर्ष में दोगुनी होती है। वार्षिक दर है:\",\"oe\":[\"10% / 10%\",\"12.5% / 12.5%\",\"11.5% / 11.5%\",\"15% / 15%\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Doubling means interest=principal, so RT/100=1 and R=100/8=12.5%.\",\"eh\":\"दोगुना होने पर ब्याज=मूलधन, इसलिए RT/100=1 और R=100/8=12.5%।\"},{\"n\":44,\"d\":\"H\",\"se\":\"A sum amounts to ₹9,261 in 3 years at 5% compound interest annually. Principal is:\",\"sh\":\"कोई राशि 5% वार्षिक चक्रवृद्धि से 3 वर्ष में ₹9,261 होती है। मूलधन है:\",\"oe\":[\"₹7,500 / ₹7,500\",\"₹8,200 / ₹8,200\",\"₹8,000 / ₹8,000\",\"₹8,400 / ₹8,400\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"P=9261/(1.05)³=9261/1.157625=₹8,000.\",\"eh\":\"P=9261/(1.05)³=9261/1.157625=₹8,000।\"},{\"n\":45,\"d\":\"H\",\"se\":\"For ₹10,000, the two-year difference between compound and simple interest is ₹144. The annual rate is:\",\"sh\":\"₹10,000 पर दो वर्ष में चक्रवृद्धि और साधारण ब्याज का अंतर ₹144 है। वार्षिक दर है:\",\"oe\":[\"12% / 12%\",\"10% / 10%\",\"14% / 14%\",\"16% / 16%\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"144=10000(r/100)²=r², so r=12%.\",\"eh\":\"144=10000(r/100)²=r², अतः r=12%।\"},{\"n\":46,\"d\":\"E\",\"se\":\"If A alone completes a job in 12 days, A's one-day work is:\",\"sh\":\"यदि A अकेला कार्य 12 दिन में करता है, तो एक दिन का कार्य है:\",\"oe\":[\"1/6 / 1/6\",\"1/10 / 1/10\",\"12 / 12\",\"1/12 / 1/12\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Daily work is the reciprocal of time: 1/12 job.\",\"eh\":\"दैनिक कार्य समय का व्युत्क्रम है: 1/12 कार्य।\"},{\"n\":47,\"d\":\"E\",\"se\":\"A can finish a job in 10 days and B in 15 days. Together they finish it in:\",\"sh\":\"A कार्य 10 दिन और B 15 दिन में करता है। साथ मिलकर समय है:\",\"oe\":[\"5 days\",\"6 days\",\"7.5 days\",\"12 days\"],\"oh\":[\"5 दिन\",\"6 दिन\",\"7.5 दिन\",\"12 दिन\"],\"a\":1,\"ee\":\"Combined rate=1/10+1/15=1/6, so time=6 days.\",\"eh\":\"संयुक्त दर=1/10+1/15=1/6, अतः समय=6 दिन।\"},{\"n\":48,\"d\":\"E\",\"se\":\"Time taken to travel 60 km at 40 km/h is:\",\"sh\":\"40 km/h से 60 km चलने में समय है:\",\"oe\":[\"1 hour\",\"2 hours\",\"1.5 hours\",\"2.5 hours\"],\"oh\":[\"1 घंटा\",\"2 घंटे\",\"1.5 घंटे\",\"2.5 घंटे\"],\"a\":2,\"ee\":\"Time=distance/speed=60/40=1.5 hours.\",\"eh\":\"समय=दूरी/चाल=60/40=1.5 घंटे।\"},{\"n\":49,\"d\":\"M\",\"se\":\"A finishes a job in 20 days and B in 30 days. Working together, they need:\",\"sh\":\"A कार्य 20 दिन और B 30 दिन में करता है। साथ मिलकर लगेंगे:\",\"oe\":[\"12 days\",\"10 days\",\"15 days\",\"25 days\"],\"oh\":[\"12 दिन\",\"10 दिन\",\"15 दिन\",\"25 दिन\"],\"a\":0,\"ee\":\"Combined rate=1/20+1/30=1/12; time=12 days.\",\"eh\":\"संयुक्त दर=1/20+1/30=1/12; समय=12 दिन।\"},{\"n\":50,\"d\":\"M\",\"se\":\"A pipe fills a tank in 12 hours while a leak empties it in 18 hours. With both open, the tank fills in:\",\"sh\":\"पाइप टंकी 12 घंटे में भरता और रिसाव 18 घंटे में खाली करता है। दोनों खुले हों तो भरने का समय है:\",\"oe\":[\"24 hours\",\"30 hours\",\"54 hours\",\"36 hours\"],\"oh\":[\"24 घंटे\",\"30 घंटे\",\"54 घंटे\",\"36 घंटे\"],\"a\":3,\"ee\":\"Net rate=1/12−1/18=1/36; time=36 hours.\",\"eh\":\"शुद्ध दर=1/12−1/18=1/36; समय=36 घंटे।\"},{\"n\":51,\"d\":\"M\",\"se\":\"A 180 m train running at 54 km/h crosses a pole in:\",\"sh\":\"180 m लंबी ट्रेन 54 km/h से चलते हुए खंभा पार करती है:\",\"oe\":[\"10 seconds\",\"12 seconds\",\"15 seconds\",\"18 seconds\"],\"oh\":[\"10 सेकंड\",\"12 सेकंड\",\"15 सेकंड\",\"18 सेकंड\"],\"a\":1,\"ee\":\"54 km/h=15 m/s; time=180/15=12 s.\",\"eh\":\"54 km/h=15 m/s; समय=180/15=12 s।\"},{\"n\":52,\"d\":\"M\",\"se\":\"A vehicle covers equal distances at 60 km/h and 40 km/h. Its average speed is:\",\"sh\":\"वाहन समान दूरियाँ 60 km/h और 40 km/h से तय करता है। औसत चाल है:\",\"oe\":[\"45 km/h / 45 km/h\",\"50 km/h / 50 km/h\",\"48 km/h / 48 km/h\",\"52 km/h / 52 km/h\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"For equal distances, average speed=2ab/(a+b)=2×60×40/100=48 km/h.\",\"eh\":\"समान दूरियों हेतु औसत चाल=2ab/(a+b)=2×60×40/100=48 km/h।\"},{\"n\":53,\"d\":\"H\",\"se\":\"A father is three times his son's age. After 10 years he will be twice the son's age. Their present ages are:\",\"sh\":\"पिता की आयु पुत्र की तीन गुनी है। 10 वर्ष बाद वह पुत्र की आयु का दोगुना होगा। वर्तमान आयु हैं:\",\"oe\":[\"30 years and 10 years\",\"36 years and 12 years\",\"42 years and 14 years\",\"45 years and 15 years\"],\"oh\":[\"30 वर्ष और 10 वर्ष\",\"36 वर्ष और 12 वर्ष\",\"42 वर्ष और 14 वर्ष\",\"45 वर्ष और 15 वर्ष\"],\"a\":0,\"ee\":\"Let son's age=x and father's=3x. Then 3x+10=2(x+10), so x=10 and father=30.\",\"eh\":\"पुत्र=x और पिता=3x। 3x+10=2(x+10) से x=10 और पिता=30।\"},{\"n\":54,\"d\":\"H\",\"se\":\"A is twice as efficient as B. Together they complete a job in 12 days. A alone would take:\",\"sh\":\"A, B से दुगुना दक्ष है। दोनों मिलकर कार्य 12 दिन में करते हैं। A अकेला समय लेगा:\",\"oe\":[\"16 days\",\"20 days\",\"24 days\",\"18 days\"],\"oh\":[\"16 दिन\",\"20 दिन\",\"24 दिन\",\"18 दिन\"],\"a\":3,\"ee\":\"Let B's rate=x and A's=2x. Then 3x=1/12, so A's rate=1/18.\",\"eh\":\"B की दर=x और A की=2x। 3x=1/12, इसलिए A की दर=1/18।\"},{\"n\":55,\"d\":\"H\",\"se\":\"A boat's downstream speed is 18 km/h and upstream speed is 10 km/h. Speed in still water and stream speed are:\",\"sh\":\"नाव की अनुकूल धारा चाल 18 km/h और प्रतिकूल चाल 10 km/h है। स्थिर जल चाल और धारा चाल हैं:\",\"oe\":[\"12 km/h and 6 km/h\",\"14 km/h and 4 km/h\",\"15 km/h and 3 km/h\",\"16 km/h and 2 km/h\"],\"oh\":[\"12 km/h और 6 km/h\",\"14 km/h और 4 km/h\",\"15 km/h और 3 km/h\",\"16 km/h और 2 km/h\"],\"a\":1,\"ee\":\"Still-water speed=(18+10)/2=14; stream speed=(18−10)/2=4 km/h.\",\"eh\":\"स्थिर जल चाल=(18+10)/2=14; धारा चाल=(18−10)/2=4 km/h।\"},{\"n\":56,\"d\":\"E\",\"se\":\"Find the next term: 2, 4, 6, 8, ?\",\"sh\":\"अगला पद ज्ञात करें: 2, 4, 6, 8, ?\",\"oe\":[\"9 / 9\",\"11 / 11\",\"10 / 10\",\"12 / 12\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Each term increases by 2; next=10.\",\"eh\":\"प्रत्येक पद 2 बढ़ता है; अगला=10।\"},{\"n\":57,\"d\":\"E\",\"se\":\"Find the next letter: A, C, E, G, ?\",\"sh\":\"अगला अक्षर ज्ञात करें: A, C, E, G, ?\",\"oe\":[\"I / I\",\"H / H\",\"J / J\",\"K / K\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"The series uses alternate letters: positions 1,3,5,7,9; position 9 is I.\",\"eh\":\"श्रृंखला एक-एक अक्षर छोड़ती है: स्थान 1,3,5,7,9; स्थान 9 पर I है।\"},{\"n\":58,\"d\":\"E\",\"se\":\"Find the next term: 3, 6, 12, 24, ?\",\"sh\":\"अगला पद ज्ञात करें: 3, 6, 12, 24, ?\",\"oe\":[\"36 / 36\",\"42 / 42\",\"54 / 54\",\"48 / 48\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Each term is doubled: 24×2=48.\",\"eh\":\"प्रत्येक पद दुगुना है: 24×2=48।\"},{\"n\":59,\"d\":\"M\",\"se\":\"Find the next term: 5, 9, 17, 33, ?\",\"sh\":\"अगला पद ज्ञात करें: 5, 9, 17, 33, ?\",\"oe\":[\"49 / 49\",\"65 / 65\",\"57 / 57\",\"66 / 66\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Pattern is ×2−1: 33×2−1=65.\",\"eh\":\"पैटर्न ×2−1 है: 33×2−1=65।\"},{\"n\":60,\"d\":\"M\",\"se\":\"Find the next term: 2, 5, 10, 17, 26, ?\",\"sh\":\"अगला पद ज्ञात करें: 2, 5, 10, 17, 26, ?\",\"oe\":[\"35 / 35\",\"36 / 36\",\"37 / 37\",\"39 / 39\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Differences are 3,5,7,9; next difference is 11, giving 37.\",\"eh\":\"अंतर 3,5,7,9 हैं; अगला अंतर 11, इसलिए 37।\"},{\"n\":61,\"d\":\"M\",\"se\":\"Find the next letter: Z, W, T, Q, ?\",\"sh\":\"अगला अक्षर ज्ञात करें: Z, W, T, Q, ?\",\"oe\":[\"N / N\",\"M / M\",\"O / O\",\"P / P\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Move three letters backward each time: Z→W→T→Q→N.\",\"eh\":\"हर बार तीन अक्षर पीछे जाएँ: Z→W→T→Q→N।\"},{\"n\":62,\"d\":\"M\",\"se\":\"Identify the wrong term: 1, 4, 9, 15, 25, 36.\",\"sh\":\"गलत पद पहचानें: 1, 4, 9, 15, 25, 36.\",\"oe\":[\"4 / 4\",\"9 / 9\",\"25 / 25\",\"15 / 15\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"These should be consecutive squares 1,4,9,16,25,36; therefore 15 is wrong.\",\"eh\":\"ये क्रमिक वर्ग 1,4,9,16,25,36 होने चाहिए; इसलिए 15 गलत है।\"},{\"n\":63,\"d\":\"M\",\"se\":\"Find the next term: 7, 14, 12, 24, 22, 44, ?\",\"sh\":\"अगला पद ज्ञात करें: 7, 14, 12, 24, 22, 44, ?\",\"oe\":[\"40 / 40\",\"42 / 42\",\"46 / 46\",\"48 / 48\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Operations alternate ×2, −2. Thus 44−2=42.\",\"eh\":\"क्रियाएँ ×2, −2 बारी-बारी हैं। अतः 44−2=42।\"},{\"n\":64,\"d\":\"H\",\"se\":\"Find the next term: 1, 2, 6, 24, 120, ?\",\"sh\":\"अगला पद ज्ञात करें: 1, 2, 6, 24, 120, ?\",\"oe\":[\"600 / 600\",\"625 / 625\",\"720 / 720\",\"840 / 840\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Terms are factorials: 1!,2!,3!,4!,5!; next is 6!=720.\",\"eh\":\"पद क्रमगुणित हैं: 1!,2!,3!,4!,5!; अगला 6!=720।\"},{\"n\":65,\"d\":\"H\",\"se\":\"Find the next letter: A, Z, C, X, E, V, G, T, ?\",\"sh\":\"अगला अक्षर ज्ञात करें: A, Z, C, X, E, V, G, T, ?\",\"oe\":[\"I / I\",\"H / H\",\"R / R\",\"S / S\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Odd positions rise A,C,E,G,I; even positions fall Z,X,V,T. Next odd term is I.\",\"eh\":\"विषम स्थान A,C,E,G,I बढ़ते और सम स्थान Z,X,V,T घटते हैं। अगला विषम पद I है।\"},{\"n\":66,\"d\":\"E\",\"se\":\"If every letter is shifted one step forward, CAT is coded as:\",\"sh\":\"यदि हर अक्षर एक स्थान आगे किया जाए, तो CAT का कूट है:\",\"oe\":[\"CBU / CBU\",\"DAS / DAS\",\"EBV / EBV\",\"DBU / DBU\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"C→D, A→B and T→U, hence DBU.\",\"eh\":\"C→D, A→B और T→U, अतः DBU।\"},{\"n\":67,\"d\":\"E\",\"se\":\"If a word is written in reverse order, RADIO becomes:\",\"sh\":\"यदि शब्द उल्टे क्रम में लिखा जाए, तो RADIO बनेगा:\",\"oe\":[\"OIRAD / OIRAD\",\"OIDAR / OIDAR\",\"RADIO / RADIO\",\"AIDOR / AIDOR\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Reversing the five letters gives O-I-D-A-R.\",\"eh\":\"पाँचों अक्षर उलटने पर O-I-D-A-R मिलता है।\"},{\"n\":68,\"d\":\"E\",\"se\":\"Using A=1, B=2, ..., Z=26, the value of DOG is:\",\"sh\":\"A=1, B=2, ..., Z=26 से DOG का मान है:\",\"oe\":[\"24 / 24\",\"25 / 25\",\"26 / 26\",\"28 / 28\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"D+O+G=4+15+7=26.\",\"eh\":\"D+O+G=4+15+7=26।\"},{\"n\":69,\"d\":\"M\",\"se\":\"In a code, TABLE becomes UBCMF by shifting each letter +1. CHAIR becomes:\",\"sh\":\"एक कूट में हर अक्षर +1 करने से TABLE, UBCMF बनता है। CHAIR बनेगा:\",\"oe\":[\"DIBJS / DIBJS\",\"DHBJS / DHBJS\",\"DIBJR / DIBJR\",\"EIBJS / EIBJS\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"C→D, H→I, A→B, I→J, R→S: DIBJS.\",\"eh\":\"C→D, H→I, A→B, I→J, R→S: DIBJS।\"},{\"n\":70,\"d\":\"M\",\"se\":\"If a word's code is the sum of letter positions and PEN=35, the code for INK is:\",\"sh\":\"यदि कूट अक्षर-स्थानों का योग है और PEN=35, तो INK का कूट है:\",\"oe\":[\"32 / 32\",\"33 / 33\",\"36 / 36\",\"34 / 34\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"I+N+K=9+14+11=34.\",\"eh\":\"I+N+K=9+14+11=34।\"},{\"n\":71,\"d\":\"M\",\"se\":\"If red is called blue, blue is called green, and green is called yellow, what is the coded name for the colour of a clear sky?\",\"sh\":\"यदि लाल को नीला, नीले को हरा और हरे को पीला कहा जाए, तो साफ आकाश के रंग का कूट नाम क्या है?\",\"oe\":[\"Blue\",\"Green\",\"Red\",\"Yellow\"],\"oh\":[\"नीला\",\"हरा\",\"लाल\",\"पीला\"],\"a\":1,\"ee\":\"A clear sky is actually blue; in the substitutions, blue is called green.\",\"eh\":\"साफ आकाश वास्तव में नीला है; दिए प्रतिस्थापन में नीले को हरा कहा गया है।\"},{\"n\":72,\"d\":\"M\",\"se\":\"For each digit, subtract 1 from an odd digit and add 2 to an even digit. 4335 becomes:\",\"sh\":\"हर विषम अंक से 1 घटाएँ और सम अंक में 2 जोड़ें। 4335 बनेगा:\",\"oe\":[\"5224 / 5224\",\"6324 / 6324\",\"6224 / 6224\",\"6244 / 6244\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"4→6, 3→2, 3→2 and 5→4; therefore 6224.\",\"eh\":\"4→6, 3→2, 3→2 और 5→4; अतः 6224।\"},{\"n\":73,\"d\":\"H\",\"se\":\"In a code language, 'coal is black' is 'ka na pa', 'black stone hard' is 'pa da ma', and 'coal burns' is 'ka sa'. The code for 'black' is:\",\"sh\":\"कूट भाषा में 'coal is black'='ka na pa', 'black stone hard'='pa da ma' और 'coal burns'='ka sa' है। 'black' का कूट है:\",\"oe\":[\"pa / pa\",\"ka / ka\",\"na / na\",\"ma / ma\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"The common word in the first two sentences is black; the common code is pa.\",\"eh\":\"पहले दो वाक्यों का समान शब्द black और समान कूट pa है।\"},{\"n\":74,\"d\":\"H\",\"se\":\"Using opposite alphabet pairs A↔Z, B↔Y, ..., the code for MINE is:\",\"sh\":\"विपरीत अक्षर युग्म A↔Z, B↔Y, ... से MINE का कूट है:\",\"oe\":[\"MIRV / MIRV\",\"NRNV / NRNV\",\"ORNU / ORNU\",\"NRMV / NRMV\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"M↔N, I↔R, N↔M and E↔V, giving NRMV.\",\"eh\":\"M↔N, I↔R, N↔M और E↔V, अतः NRMV।\"},{\"n\":75,\"d\":\"E\",\"se\":\"Book is to Read as Food is to:\",\"sh\":\"पुस्तक का संबंध पढ़ने से है, वैसे भोजन का संबंध है:\",\"oe\":[\"Cook\",\"Eat\",\"Serve\",\"Buy\"],\"oh\":[\"पकाना\",\"खाना\",\"परोसना\",\"खरीदना\"],\"a\":1,\"ee\":\"A book is read; food is eaten. The relation is object to its primary use.\",\"eh\":\"पुस्तक पढ़ी जाती है; भोजन खाया जाता है। संबंध वस्तु और उसके मुख्य उपयोग का है।\"},{\"n\":76,\"d\":\"E\",\"se\":\"Doctor is to Hospital as Teacher is to:\",\"sh\":\"चिकित्सक का संबंध अस्पताल से है, वैसे शिक्षक का संबंध है:\",\"oe\":[\"Book\",\"Student\",\"School\",\"Chalk\"],\"oh\":[\"पुस्तक\",\"विद्यार्थी\",\"विद्यालय\",\"चॉक\"],\"a\":2,\"ee\":\"The relation is profession to usual workplace: doctor-hospital, teacher-school.\",\"eh\":\"संबंध पेशे और सामान्य कार्यस्थल का है: चिकित्सक-अस्पताल, शिक्षक-विद्यालय।\"},{\"n\":77,\"d\":\"E\",\"se\":\"Choose the odd one out: square, rectangle, triangle, cube.\",\"sh\":\"विषम चुनें: वर्ग, आयत, त्रिभुज, घन।\",\"oe\":[\"Cube\",\"Square\",\"Rectangle\",\"Triangle\"],\"oh\":[\"घन\",\"वर्ग\",\"आयत\",\"त्रिभुज\"],\"a\":0,\"ee\":\"Cube is three-dimensional; the others are plane two-dimensional figures.\",\"eh\":\"घन त्रिविमीय है; अन्य समतल द्विविमीय आकृतियाँ हैं।\"},{\"n\":78,\"d\":\"M\",\"se\":\"8 is related to 64 in the same way as 12 is related to:\",\"sh\":\"8 का 64 से वही संबंध है जो 12 का है:\",\"oe\":[\"96 / 96\",\"124 / 124\",\"156 / 156\",\"144 / 144\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"The second number is the square of the first: 8²=64 and 12²=144.\",\"eh\":\"दूसरी संख्या पहली का वर्ग है: 8²=64 और 12²=144।\"},{\"n\":79,\"d\":\"M\",\"se\":\"Bird is to Nest as Bee is to:\",\"sh\":\"पक्षी का संबंध घोंसले से है, वैसे मधुमक्खी का संबंध है:\",\"oe\":[\"Cave\",\"Hive\",\"Web\",\"Burrow\"],\"oh\":[\"गुफा\",\"छत्ता\",\"जाला\",\"बिल\"],\"a\":1,\"ee\":\"The relation is creature to dwelling: bird-nest and bee-hive.\",\"eh\":\"संबंध जीव और निवास का है: पक्षी-घोंसला और मधुमक्खी-छत्ता।\"},{\"n\":80,\"d\":\"M\",\"se\":\"Complete the analogy: Finger : Hand :: Toe : ?\",\"sh\":\"सादृश्य पूरा करें: उँगली : हाथ :: पैर की उँगली : ?\",\"oe\":[\"Leg\",\"Nail\",\"Foot\",\"Shoe\"],\"oh\":[\"टाँग\",\"नाखून\",\"पैर\",\"जूता\"],\"a\":2,\"ee\":\"A finger is a part of a hand; a toe is a part of a foot.\",\"eh\":\"उँगली हाथ का भाग है; पैर की उँगली पैर का भाग है।\"},{\"n\":81,\"d\":\"H\",\"se\":\"Choose the odd one out: 27, 64, 125, 196.\",\"sh\":\"विषम चुनें: 27, 64, 125, 196.\",\"oe\":[\"196 / 196\",\"27 / 27\",\"64 / 64\",\"125 / 125\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"27=3³, 64=4³ and 125=5³; the next cube would be 216, not 196.\",\"eh\":\"27=3³, 64=4³ और 125=5³; अगला घन 216 होता, 196 नहीं।\"},{\"n\":82,\"d\":\"H\",\"se\":\"7 is related to 56 by n(n+1). By the same rule, 9 is related to:\",\"sh\":\"7 का 56 से संबंध n(n+1) नियम से है। उसी नियम से 9 का संबंध है:\",\"oe\":[\"72 / 72\",\"81 / 81\",\"99 / 99\",\"90 / 90\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Apply n(n+1): 7×8=56, so 9×10=90.\",\"eh\":\"n(n+1) लगाएँ: 7×8=56, इसलिए 9×10=90।\"},{\"n\":83,\"d\":\"E\",\"se\":\"A man says of a woman, 'She is the daughter of my mother.' The woman is his:\",\"sh\":\"एक पुरुष स्त्री के बारे में कहता है, 'वह मेरी माँ की बेटी है।' स्त्री उसकी है:\",\"oe\":[\"Mother\",\"Sister\",\"Daughter\",\"Aunt\"],\"oh\":[\"माँ\",\"बहन\",\"बेटी\",\"बुआ/मौसी\"],\"a\":1,\"ee\":\"The mother's female child, other than the male speaker, is his sister.\",\"eh\":\"माँ की स्त्री संतान, पुरुष वक्ता से अलग, उसकी बहन है।\"},{\"n\":84,\"d\":\"E\",\"se\":\"Your father's father is your:\",\"sh\":\"आपके पिता के पिता आपके हैं:\",\"oe\":[\"Maternal grandfather\",\"Uncle\",\"Paternal grandfather\",\"Father-in-law\"],\"oh\":[\"नाना\",\"चाचा\",\"दादा\",\"ससुर\"],\"a\":2,\"ee\":\"Father's father is the paternal grandfather.\",\"eh\":\"पिता के पिता दादा होते हैं।\"},{\"n\":85,\"d\":\"M\",\"se\":\"P is the brother of Q, and Q is the mother of R. P is R's:\",\"sh\":\"P, Q का भाई है और Q, R की माँ है। P, R का है:\",\"oe\":[\"Maternal uncle\",\"Father\",\"Paternal uncle\",\"Brother\"],\"oh\":[\"मामा\",\"पिता\",\"चाचा\",\"भाई\"],\"a\":0,\"ee\":\"P is the brother of R's mother, hence R's maternal uncle.\",\"eh\":\"P, R की माँ का भाई है, अतः R का मामा है।\"},{\"n\":86,\"d\":\"M\",\"se\":\"A is B's mother. C is A's husband. D is C's brother. D is B's:\",\"sh\":\"A, B की माँ है। C, A का पति है। D, C का भाई है। D, B का है:\",\"oe\":[\"Maternal uncle\",\"Brother\",\"Grandfather\",\"Paternal uncle\"],\"oh\":[\"मामा\",\"भाई\",\"दादा\",\"चाचा\"],\"a\":3,\"ee\":\"C is B's father; C's brother D is B's paternal uncle.\",\"eh\":\"C, B का पिता है; C का भाई D, B का चाचा है।\"},{\"n\":87,\"d\":\"M\",\"se\":\"If A+B means 'A is mother of B' and A×B means 'A is brother of B', then P×Q+R means P is R's:\",\"sh\":\"यदि A+B का अर्थ 'A, B की माँ है' और A×B का अर्थ 'A, B का भाई है', तो P×Q+R में P, R का है:\",\"oe\":[\"Father\",\"Maternal uncle\",\"Brother\",\"Paternal uncle\"],\"oh\":[\"पिता\",\"मामा\",\"भाई\",\"चाचा\"],\"a\":1,\"ee\":\"P×Q makes P Q's brother; Q+R makes Q R's mother. Thus P is R's maternal uncle.\",\"eh\":\"P×Q से P, Q का भाई; Q+R से Q, R की माँ। अतः P, R का मामा है।\"},{\"n\":88,\"d\":\"H\",\"se\":\"Pointing to a boy, a woman says, 'His mother is the only daughter of my mother.' The boy is the woman's:\",\"sh\":\"एक लड़के की ओर संकेत कर स्त्री कहती है, 'उसकी माँ मेरी माँ की इकलौती बेटी है।' लड़का स्त्री का है:\",\"oe\":[\"Brother\",\"Nephew\",\"Son\",\"Cousin\"],\"oh\":[\"भाई\",\"भांजा/भतीजा\",\"पुत्र\",\"चचेरा/ममेरा भाई\"],\"a\":2,\"ee\":\"The only daughter of the woman's mother is the woman herself; therefore she is the boy's mother.\",\"eh\":\"स्त्री की माँ की इकलौती बेटी वही स्त्री है; अतः वह लड़के की माँ है।\"},{\"n\":89,\"d\":\"E\",\"se\":\"A person facing north turns right. The person now faces:\",\"sh\":\"उत्तर की ओर मुख व्यक्ति दाएँ मुड़ता है। अब दिशा है:\",\"oe\":[\"East\",\"West\",\"South\",\"North\"],\"oh\":[\"पूर्व\",\"पश्चिम\",\"दक्षिण\",\"उत्तर\"],\"a\":0,\"ee\":\"A right turn from north points east.\",\"eh\":\"उत्तर से दायाँ मोड़ पूर्व दिशा देता है।\"},{\"n\":90,\"d\":\"E\",\"se\":\"A person walks 3 km east and then 4 km north. The shortest distance from the start is:\",\"sh\":\"व्यक्ति 3 km पूर्व और फिर 4 km उत्तर चलता है। आरंभ से न्यूनतम दूरी है:\",\"oe\":[\"4 km / 4 km\",\"6 km / 6 km\",\"7 km / 7 km\",\"5 km / 5 km\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"The path forms a right triangle; displacement=√(3²+4²)=5 km.\",\"eh\":\"मार्ग समकोण त्रिभुज बनाता है; विस्थापन=√(3²+4²)=5 km।\"},{\"n\":91,\"d\":\"M\",\"se\":\"A person faces west, turns left, then turns right. Final direction is:\",\"sh\":\"व्यक्ति पश्चिम की ओर है, बाएँ मुड़ता और फिर दाएँ मुड़ता है। अंतिम दिशा है:\",\"oe\":[\"North\",\"West\",\"East\",\"South\"],\"oh\":[\"उत्तर\",\"पश्चिम\",\"पूर्व\",\"दक्षिण\"],\"a\":1,\"ee\":\"West→left gives south; south→right returns west.\",\"eh\":\"पश्चिम→बायाँ से दक्षिण; दक्षिण→दायाँ से फिर पश्चिम।\"},{\"n\":92,\"d\":\"M\",\"se\":\"A person walks 10 m north, 6 m east and 10 m south. The person is finally:\",\"sh\":\"व्यक्ति 10 m उत्तर, 6 m पूर्व और 10 m दक्षिण चलता है। अंत में वह है:\",\"oe\":[\"6 m west of the start\",\"10 m north of the start\",\"6 m east of the start\",\"16 m east of the start\"],\"oh\":[\"आरंभ से 6 m पश्चिम\",\"आरंभ से 10 m उत्तर\",\"आरंभ से 6 m पूर्व\",\"आरंभ से 16 m पूर्व\"],\"a\":2,\"ee\":\"The north and south movements cancel; only 6 m east remains.\",\"eh\":\"उत्तर और दक्षिण चाल रद्द हो जाती हैं; केवल 6 m पूर्व बचता है।\"},{\"n\":93,\"d\":\"M\",\"se\":\"In a row of 40 persons, R is 12th from the left. R's rank from the right is:\",\"sh\":\"40 व्यक्तियों की पंक्ति में R बाएँ से 12वाँ है। दाएँ से स्थान है:\",\"oe\":[\"29th\",\"28th\",\"30th\",\"31st\"],\"oh\":[\"29वाँ\",\"28वाँ\",\"30वाँ\",\"31वाँ\"],\"a\":0,\"ee\":\"Rank from right=40−12+1=29.\",\"eh\":\"दाएँ से स्थान=40−12+1=29।\"},{\"n\":94,\"d\":\"M\",\"se\":\"A is 18th from the top and 25th from the bottom. Total persons are:\",\"sh\":\"A ऊपर से 18वाँ और नीचे से 25वाँ है। कुल व्यक्ति हैं:\",\"oe\":[\"41 / 41\",\"43 / 43\",\"44 / 44\",\"42 / 42\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Total=18+25−1=42 because A is counted from both ends.\",\"eh\":\"कुल=18+25−1=42, क्योंकि A दोनों ओर से गिना गया है।\"},{\"n\":95,\"d\":\"H\",\"se\":\"A person walks 8 m north, turns right for 6 m, turns right for 8 m, then turns left for 4 m. Final position is:\",\"sh\":\"व्यक्ति 8 m उत्तर, दाएँ 6 m, फिर दाएँ 8 m और फिर बाएँ 4 m चलता है। अंतिम स्थिति है:\",\"oe\":[\"2 m east of the start\",\"10 m east of the start\",\"10 m west of the start\",\"4 m south of the start\"],\"oh\":[\"आरंभ से 2 m पूर्व\",\"आरंभ से 10 m पूर्व\",\"आरंभ से 10 m पश्चिम\",\"आरंभ से 4 m दक्षिण\"],\"a\":1,\"ee\":\"Coordinates: (0,8)→(6,8)→(6,0); facing south, left is east, so finish at (10,0).\",\"eh\":\"निर्देशांक: (0,8)→(6,8)→(6,0); दक्षिणमुख से बायाँ पूर्व है, अंत (10,0)।\"},{\"n\":96,\"d\":\"E\",\"se\":\"Two numbers sum to 30. If one is 12, the other is:\",\"sh\":\"दो संख्याओं का योग 30 है। एक 12 हो तो दूसरी है:\",\"oe\":[\"16 / 16\",\"20 / 20\",\"18 / 18\",\"22 / 22\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Other number=30−12=18.\",\"eh\":\"दूसरी संख्या=30−12=18।\"},{\"n\":97,\"d\":\"M\",\"se\":\"Three pens and two books cost ₹94. If each pen costs ₹10, each book costs:\",\"sh\":\"तीन पेन और दो पुस्तकें ₹94 की हैं। प्रत्येक पेन ₹10 का हो तो प्रत्येक पुस्तक है:\",\"oe\":[\"₹32 / ₹32\",\"₹27 / ₹27\",\"₹30 / ₹30\",\"₹34 / ₹34\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"Books together cost 94−3×10=₹64; each book=64/2=₹32.\",\"eh\":\"दोनों पुस्तकों की लागत=94−3×10=₹64; प्रत्येक=64/2=₹32।\"},{\"n\":98,\"d\":\"H\",\"se\":\"Five persons A, B, C, D and E face north in a row. C is in the middle; A is immediately left of C; E is at the right end; B is not adjacent to E. Who is at the left end?\",\"sh\":\"A, B, C, D, E उत्तरमुख पंक्ति में हैं। C मध्य में; A उसके तुरंत बाएँ; E दाएँ छोर पर; B, E के पास नहीं। बाएँ छोर पर कौन है?\",\"oe\":[\"A / A\",\"C / C\",\"D / D\",\"B / B\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"Positions 2=A, 3=C, 5=E. B cannot be 4, so B=1 and D=4.\",\"eh\":\"स्थान 2=A, 3=C, 5=E। B स्थान 4 नहीं हो सकता, इसलिए B=1 और D=4।\"},{\"n\":99,\"d\":\"H\",\"se\":\"P, Q, R and S sit around a circle facing the centre. P is opposite R, and Q is immediately to the right of P. Who is immediately to the left of P?\",\"sh\":\"P, Q, R, S केंद्रमुख वृत्त में बैठे हैं। P, R के सामने है और Q, P के तुरंत दाएँ है। P के तुरंत बाएँ कौन है?\",\"oe\":[\"Q / Q\",\"S / S\",\"R / R\",\"Cannot be determined\"],\"oh\":[\"\",\"\",\"\",\"निर्धारित नहीं\"],\"a\":1,\"ee\":\"With four seats, R occupies P's opposite seat and Q one adjacent seat; the remaining adjacent seat, on P's left, is S.\",\"eh\":\"चार सीटों में R सामने और Q एक पास की सीट लेता है; P की दूसरी पास वाली बाईं सीट S की है।\"},{\"n\":100,\"d\":\"H\",\"se\":\"Six persons A-F face north in a row. A is at the left end, F at the right end, C immediately right of A, E immediately left of F, and B immediately left of D. Who is third from the left?\",\"sh\":\"छह व्यक्ति A-F उत्तरमुख पंक्ति में हैं। A बाएँ छोर, F दाएँ छोर, C तुरंत A के दाएँ, E तुरंत F के बाएँ और B तुरंत D के बाएँ है। बाएँ से तीसरा कौन है?\",\"oe\":[\"C / C\",\"D / D\",\"B / B\",\"E / E\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":2,\"ee\":\"Fixed positions are A-C-_-_-E-F. The remaining adjacent order B-D fills positions 3-4; third is B.\",\"eh\":\"निश्चित क्रम A-C-_-_-E-F है। शेष पास-पास क्रम B-D स्थान 3-4 भरता है; तीसरा B है। ---\"}]},{\"id\":\"s06\",\"num\":6,\"name\":\"CIL, SECL, Chhattisgarh, Madhya Pradesh and Coal-Sector Current Affairs\",\"q\":[{\"n\":1,\"d\":\"E\",\"se\":\"Coal India Limited came into being in:\",\"sh\":\"कोल इंडिया लिमिटेड अस्तित्व में आया:\",\"oe\":[\"November 1975\",\"November 1965\",\"January 1985\",\"April 1991\"],\"oh\":[\"नवंबर 1975\",\"नवंबर 1965\",\"जनवरी 1985\",\"अप्रैल 1991\"],\"a\":0,\"ee\":\"CIL's official history states that the holding company was formed in November 1975.\",\"eh\":\"CIL के आधिकारिक इतिहास के अनुसार होल्डिंग कंपनी नवंबर 1975 में बनी।\"},{\"n\":2,\"d\":\"E\",\"se\":\"CIL presently holds which CPSE status?\",\"sh\":\"CIL को वर्तमान में कौन-सा CPSE दर्जा प्राप्त है?\",\"oe\":[\"Navratna\",\"Miniratna-I\",\"Miniratna-II\",\"Maharatna\"],\"oh\":[\"नवरत्न\",\"मिनीरत्न-I\",\"मिनीरत्न-II\",\"महारत्न\"],\"a\":3,\"ee\":\"Coal India Limited is a Maharatna Central Public Sector Enterprise.\",\"eh\":\"कोल इंडिया लिमिटेड महारत्न केंद्रीय सार्वजनिक क्षेत्र उद्यम है।\"},{\"n\":3,\"d\":\"E\",\"se\":\"Coal India Limited functions under the administrative control of the:\",\"sh\":\"कोल इंडिया लिमिटेड किसके प्रशासनिक नियंत्रण में है?\",\"oe\":[\"Ministry of Power\",\"Ministry of Coal\",\"Ministry of Mines only\",\"Ministry of Steel\"],\"oh\":[\"विद्युत मंत्रालय\",\"कोयला मंत्रालय\",\"केवल खान मंत्रालय\",\"इस्पात मंत्रालय\"],\"a\":1,\"ee\":\"CIL is under the Government of India's Ministry of Coal.\",\"eh\":\"CIL भारत सरकार के कोयला मंत्रालय के अधीन है।\"},{\"n\":4,\"d\":\"E\",\"se\":\"CIL's registered/corporate headquarters is in:\",\"sh\":\"CIL का पंजीकृत/कॉर्पोरेट मुख्यालय है:\",\"oe\":[\"Ranchi\",\"Dhanbad\",\"Kolkata\",\"Bilaspur\"],\"oh\":[\"रांची\",\"धनबाद\",\"कोलकाता\",\"बिलासपुर\"],\"a\":2,\"ee\":\"Coal Bhawan, CIL's headquarters, is in New Town, Rajarhat, Kolkata.\",\"eh\":\"CIL का मुख्यालय कोल भवन, न्यू टाउन, राजारहाट, कोलकाता में है।\"},{\"n\":5,\"d\":\"E\",\"se\":\"By production volume, CIL describes itself as the world's:\",\"sh\":\"उत्पादन मात्रा के आधार पर CIL स्वयं को विश्व की क्या बताता है?\",\"oe\":[\"Largest coal producer\",\"Largest iron-ore producer\",\"Largest oil producer\",\"Largest copper producer\"],\"oh\":[\"सबसे बड़ा कोयला उत्पादक\",\"सबसे बड़ा लौह-अयस्क उत्पादक\",\"सबसे बड़ा तेल उत्पादक\",\"सबसे बड़ा ताँबा उत्पादक\"],\"a\":0,\"ee\":\"CIL's official profile identifies it as the world's largest coal-producing company.\",\"eh\":\"CIL की आधिकारिक प्रोफ़ाइल इसे विश्व की सबसे बड़ी कोयला उत्पादक कंपनी बताती है।\"},{\"n\":6,\"d\":\"E\",\"se\":\"As verified on 2 September 2026, CIL's official profile lists how many subsidiaries, including its foreign subsidiary?\",\"sh\":\"2 सितंबर 2026 को सत्यापित CIL प्रोफ़ाइल में विदेशी अनुषंगी सहित कितनी अनुषंगियाँ सूचीबद्ध हैं?\",\"oe\":[\"7 / 7\",\"8 / 8\",\"10 / 10\",\"13 / 13\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"The live CIL profile lists 13 subsidiaries; the older number 8 refers to the traditional seven producing companies plus CMPDI.\",\"eh\":\"लाइव CIL प्रोफ़ाइल 13 अनुषंगियाँ बताती है; पुरानी संख्या 8 पारंपरिक सात उत्पादक कंपनियों और CMPDI का समूह था।\"},{\"n\":7,\"d\":\"E\",\"se\":\"CIL's foreign subsidiary Coal India Africana Limitada is associated with:\",\"sh\":\"CIL की विदेशी अनुषंगी Coal India Africana Limitada किस देश से जुड़ी है?\",\"oe\":[\"Australia\",\"Mozambique\",\"Indonesia\",\"South Africa\"],\"oh\":[\"ऑस्ट्रेलिया\",\"मोज़ाम्बिक\",\"इंडोनेशिया\",\"दक्षिण अफ्रीका\"],\"a\":1,\"ee\":\"Coal India Africana Limitada, or CIAL, is CIL's Mozambique subsidiary.\",\"eh\":\"Coal India Africana Limitada या CIAL, CIL की मोज़ाम्बिक अनुषंगी है।\"},{\"n\":8,\"d\":\"E\",\"se\":\"North Eastern Coalfields mines in Assam are managed directly by:\",\"sh\":\"असम की North Eastern Coalfields खदानों का प्रत्यक्ष प्रबंधन कौन करता है?\",\"oe\":[\"SECL / SECL\",\"CMPDI / CMPDI\",\"Coal India Limited\",\"MCL / MCL\"],\"oh\":[\"\",\"\",\"कोल इंडिया लिमिटेड\",\"\"],\"a\":2,\"ee\":\"CIL's official profile says NEC's Assam mines are managed directly by CIL.\",\"eh\":\"CIL की आधिकारिक प्रोफ़ाइल के अनुसार असम की NEC खदानें CIL सीधे संचालित करता है।\"},{\"n\":9,\"d\":\"M\",\"se\":\"CMPDI primarily provides:\",\"sh\":\"CMPDI मुख्यतः क्या प्रदान करता है?\",\"oe\":[\"Mine planning, design and consultancy\",\"Coal retailing only\",\"Power generation\",\"Railway operation\"],\"oh\":[\"खान योजना, डिज़ाइन और परामर्श\",\"केवल कोयला खुदरा बिक्री\",\"विद्युत उत्पादन\",\"रेलवे संचालन\"],\"a\":0,\"ee\":\"Central Mine Planning &amp; Design Institute is CIL's planning, design, exploration and consultancy arm.\",\"eh\":\"Central Mine Planning &amp; Design Institute, CIL की योजना, डिज़ाइन, अन्वेषण और परामर्श इकाई है।\"},{\"n\":10,\"d\":\"M\",\"se\":\"Which subsidiary-headquarters pair is correct?\",\"sh\":\"कौन-सा अनुषंगी-मुख्यालय युग्म सही है?\",\"oe\":[\"ECL — Nagpur\",\"ECL — Bilaspur\",\"ECL — Sambalpur\",\"ECL — Sanctoria\"],\"oh\":[\"ECL — नागपुर\",\"ECL — बिलासपुर\",\"ECL — संबलपुर\",\"ECL — सांक्टोरिया\"],\"a\":3,\"ee\":\"Eastern Coalfields Limited is headquartered at Sanctoria in West Bengal.\",\"eh\":\"Eastern Coalfields Limited का मुख्यालय पश्चिम बंगाल के सांक्टोरिया में है।\"},{\"n\":11,\"d\":\"M\",\"se\":\"BCCL is headquartered at:\",\"sh\":\"BCCL का मुख्यालय है:\",\"oe\":[\"Ranchi\",\"Dhanbad\",\"Singrauli\",\"Kolkata\"],\"oh\":[\"रांची\",\"धनबाद\",\"सिंगरौली\",\"कोलकाता\"],\"a\":1,\"ee\":\"Bharat Coking Coal Limited is headquartered in Dhanbad, Jharkhand.\",\"eh\":\"भारत कोकिंग कोल लिमिटेड का मुख्यालय धनबाद, झारखंड में है।\"},{\"n\":12,\"d\":\"M\",\"se\":\"CCL is headquartered at:\",\"sh\":\"CCL का मुख्यालय है:\",\"oe\":[\"Dhanbad\",\"Nagpur\",\"Ranchi\",\"Bilaspur\"],\"oh\":[\"धनबाद\",\"नागपुर\",\"रांची\",\"बिलासपुर\"],\"a\":2,\"ee\":\"Central Coalfields Limited is headquartered in Ranchi.\",\"eh\":\"Central Coalfields Limited का मुख्यालय रांची में है।\"},{\"n\":13,\"d\":\"M\",\"se\":\"NCL is headquartered at:\",\"sh\":\"NCL का मुख्यालय है:\",\"oe\":[\"Singrauli\",\"Sanctoria\",\"Sambalpur\",\"Korba\"],\"oh\":[\"सिंगरौली\",\"सांक्टोरिया\",\"संबलपुर\",\"कोरबा\"],\"a\":0,\"ee\":\"Northern Coalfields Limited is headquartered at Singrauli.\",\"eh\":\"Northern Coalfields Limited का मुख्यालय सिंगरौली में है।\"},{\"n\":14,\"d\":\"M\",\"se\":\"WCL is headquartered at:\",\"sh\":\"WCL का मुख्यालय है:\",\"oe\":[\"Ranchi\",\"Bilaspur\",\"Dhanbad\",\"Nagpur\"],\"oh\":[\"रांची\",\"बिलासपुर\",\"धनबाद\",\"नागपुर\"],\"a\":3,\"ee\":\"Western Coalfields Limited is headquartered in Nagpur.\",\"eh\":\"Western Coalfields Limited का मुख्यालय नागपुर में है।\"},{\"n\":15,\"d\":\"M\",\"se\":\"SECL is headquartered at:\",\"sh\":\"SECL का मुख्यालय है:\",\"oe\":[\"Sambalpur\",\"Bilaspur\",\"Kolkata\",\"Nagpur\"],\"oh\":[\"संबलपुर\",\"बिलासपुर\",\"कोलकाता\",\"नागपुर\"],\"a\":1,\"ee\":\"South Eastern Coalfields Limited's headquarters is at Seepat Road, Bilaspur.\",\"eh\":\"South Eastern Coalfields Limited का मुख्यालय सीपत रोड, बिलासपुर में है।\"},{\"n\":16,\"d\":\"M\",\"se\":\"MCL is headquartered at:\",\"sh\":\"MCL का मुख्यालय है:\",\"oe\":[\"Singrauli\",\"Sanctoria\",\"Sambalpur\",\"Ranchi\"],\"oh\":[\"सिंगरौली\",\"सांक्टोरिया\",\"संबलपुर\",\"रांची\"],\"a\":2,\"ee\":\"Mahanadi Coalfields Limited is headquartered in Sambalpur, Odisha.\",\"eh\":\"Mahanadi Coalfields Limited का मुख्यालय संबलपुर, ओडिशा में है।\"},{\"n\":17,\"d\":\"M\",\"se\":\"CIL's coal production in FY 2025-26 was:\",\"sh\":\"वित्त वर्ष 2025-26 में CIL का कोयला उत्पादन था:\",\"oe\":[\"768.19 MT / 768.19 MT\",\"668.19 MT / 668.19 MT\",\"744.83 MT / 744.83 MT\",\"814.85 MT / 814.85 MT\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"CIL's official production page reports 768.19 million tonnes for FY 2025-26.\",\"eh\":\"CIL का आधिकारिक उत्पादन पृष्ठ FY 2025-26 के लिए 768.19 मिलियन टन बताता है।\"},{\"n\":18,\"d\":\"M\",\"se\":\"CIL's coal offtake in FY 2025-26 was:\",\"sh\":\"वित्त वर्ष 2025-26 में CIL का कोयला ऑफटेक था:\",\"oe\":[\"768.19 MT / 768.19 MT\",\"714.83 MT / 714.83 MT\",\"814.85 MT / 814.85 MT\",\"744.83 MT / 744.83 MT\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":3,\"ee\":\"The official FY 2025-26 figure is 744.83 MT; do not interchange production and offtake.\",\"eh\":\"आधिकारिक FY 2025-26 आँकड़ा 744.83 MT है; उत्पादन और ऑफटेक को न बदलें।\"},{\"n\":19,\"d\":\"M\",\"se\":\"The UTTAM portal is chiefly associated with:\",\"sh\":\"UTTAM पोर्टल मुख्यतः किससे संबंधित है?\",\"oe\":[\"Employee pension\",\"Coal-quality monitoring and transparency\",\"Mine lease auction only\",\"Railway recruitment\"],\"oh\":[\"कर्मचारी पेंशन\",\"कोयला गुणवत्ता निगरानी और पारदर्शिता\",\"केवल खान पट्टा नीलामी\",\"रेलवे भर्ती\"],\"a\":1,\"ee\":\"UTTAM gives consumers visibility into coal-quality assessment and monitoring.\",\"eh\":\"UTTAM उपभोक्ताओं को कोयला गुणवत्ता आकलन और निगरानी में दृश्यता देता है।\"},{\"n\":20,\"d\":\"H\",\"se\":\"Third-party sampling in CIL's quality system is intended to provide:\",\"sh\":\"CIL की गुणवत्ता प्रणाली में तृतीय-पक्ष नमूनाकरण का उद्देश्य है:\",\"oe\":[\"Mine ownership transfer\",\"Employee attendance\",\"Independent quality assessment\",\"Royalty collection only\"],\"oh\":[\"खान स्वामित्व हस्तांतरण\",\"कर्मचारी उपस्थिति\",\"स्वतंत्र गुणवत्ता आकलन\",\"केवल रॉयल्टी संग्रह\"],\"a\":2,\"ee\":\"Independent agencies sample and assess coal to reduce producer-consumer quality disputes.\",\"eh\":\"स्वतंत्र एजेंसियाँ नमूना और आकलन करके उत्पादक-उपभोक्ता गुणवत्ता विवाद घटाती हैं।\"},{\"n\":21,\"d\":\"H\",\"se\":\"Coal Controller Organisation's grade-related role includes:\",\"sh\":\"Coal Controller Organisation की ग्रेड-संबंधी भूमिका में शामिल है:\",\"oe\":[\"Quality surveillance and annual grade oversight\",\"Issuing mining diplomas\",\"Operating every CIL mine\",\"Fixing railway fares\"],\"oh\":[\"गुणवत्ता निगरानी और वार्षिक ग्रेड पर्यवेक्षण\",\"खनन डिप्लोमा जारी करना\",\"हर CIL खान चलाना\",\"रेल किराया तय करना\"],\"a\":0,\"ee\":\"CCO performs quality surveillance and publishes/oversees annual grade-declaration processes.\",\"eh\":\"CCO गुणवत्ता निगरानी करता और वार्षिक ग्रेड घोषणा प्रक्रियाओं का पर्यवेक्षण/प्रकाशन करता है।\"},{\"n\":22,\"d\":\"H\",\"se\":\"Since the 2012 grading change, non-coking coal grades are principally linked to:\",\"sh\":\"2012 की ग्रेडिंग बदलाव के बाद नॉन-कोकिंग कोयला ग्रेड मुख्यतः किससे जुड़े हैं?\",\"oe\":[\"Mine depth only\",\"Ash colour only\",\"Employee strength\",\"Gross Calorific Value (GCV)\"],\"oh\":[\"केवल खान गहराई\",\"केवल राख का रंग\",\"कर्मचारी संख्या\",\"सकल ऊष्मीय मान (GCV)\"],\"a\":3,\"ee\":\"The notified shift replaced the older UHV basis with GCV-based grading for non-coking coal.\",\"eh\":\"अधिसूचित बदलाव ने पुरानी UHV पद्धति के स्थान पर नॉन-कोकिंग कोयले की GCV-आधारित ग्रेडिंग लागू की।\"},{\"n\":23,\"d\":\"H\",\"se\":\"First Mile Connectivity in coal logistics mainly means:\",\"sh\":\"कोयला लॉजिस्टिक्स में First Mile Connectivity का मुख्य अर्थ है:\",\"oe\":[\"Last-mile household delivery\",\"Mechanised movement from mine to loading/dispatch point\",\"Only underground ventilation\",\"Inter-state passenger transport\"],\"oh\":[\"घर तक अंतिम वितरण\",\"खान से लोडिंग/प्रेषण बिंदु तक यंत्रीकृत परिवहन\",\"केवल भूमिगत वेंटिलेशन\",\"अंतरराज्यीय यात्री परिवहन\"],\"a\":1,\"ee\":\"FMC uses conveyors, silos and rapid loading to reduce road handling, dust and delay.\",\"eh\":\"FMC कन्वेयर, साइलो और रैपिड लोडिंग से सड़क हैंडलिंग, धूल और देरी घटाता है।\"},{\"n\":24,\"d\":\"H\",\"se\":\"As verified on 2 September 2026, the Union Minister and Minister of State for Coal &amp; Mines are respectively:\",\"sh\":\"2 सितंबर 2026 को सत्यापित केंद्रीय कोयला एवं खान मंत्री और राज्य मंत्री क्रमशः हैं:\",\"oe\":[\"Piyush Goyal and G. Kishan Reddy\",\"Pralhad Joshi and Satish Chandra Dubey\",\"G. Kishan Reddy and Satish Chandra Dubey\",\"Dharmendra Pradhan and Piyush Goyal\"],\"oh\":[\"पीयूष गोयल और जी. किशन रेड्डी\",\"प्रह्लाद जोशी और सतीश चंद्र दुबे\",\"जी. किशन रेड्डी और सतीश चंद्र दुबे\",\"धर्मेंद्र प्रधान और पीयूष गोयल\"],\"a\":2,\"ee\":\"The Ministry of Coal homepage lists G. Kishan Reddy as Union Minister and Satish Chandra Dubey as MoS.\",\"eh\":\"कोयला मंत्रालय का मुखपृष्ठ जी. किशन रेड्डी को केंद्रीय मंत्री और सतीश चंद्र दुबे को राज्य मंत्री बताता है।\"},{\"n\":25,\"d\":\"H\",\"se\":\"In coal marketing, e-auction primarily provides:\",\"sh\":\"कोयला विपणन में ई-नीलामी मु const HP_BUILTIN=JSON.parse("[{\"id\":\"hp1\",\"num\":1,\"name\":\"High Probability Paper 1\",\"q\":[{\"n\":1,\"d\":\"\",\"se\":\"The core of an Optical Fibre is made up of which material?\",\"sh\":\"ऑप्टिकल फाइबर का कोर (Core) किस सामग्री का बना होता है?\",\"oe\":[\"Copper\",\"Aluminium\",\"Silica Glass\",\"Plastic\"],\"oh\":[\"तांबा (Copper)\",\"एल्युमिनियम\",\"सिलिका ग्लास (Silica Glass)\",\"प्लास्टिक\"],\"a\":2,\"ee\":\"Optical fibres are made of high-purity silica glass (SiO₂) with a higher refractive index than the cladding.\",\"eh\":\"ऑप्टिकल फाइबर उच्च शुद्धता वाले सिलिका ग्लास (SiO₂) से बने होते हैं, जिनका अपवर्तनांक (refractive index) क्लैडिंग से अधिक होता है।\"},{\"n\":2,\"d\":\"\",\"se\":\"What is the maximum data rate supported by CAT-6 Ethernet cable?\",\"sh\":\"CAT-6 ईथरनेट केबल द्वारा समर्थित अधिकतम डेटा दर क्या है?\",\"oe\":[\"100 Mbps\",\"1 Gbps\",\"10 Gbps\",\"100 Gbps\"],\"oh\":[\"100 Mbps\",\"1 Gbps\",\"10 Gbps\",\"100 Gbps\"],\"a\":2,\"ee\":\"CAT-6 cable supports up to 10 Gbps at a maximum length of 55 meters, and 1 Gbps at 100 meters.\",\"eh\":\"CAT-6 केबल 55 मीटर की अधिकतम लंबाई पर 10 Gbps और 100 मीटर पर 1 Gbps को सपोर्ट करता है।\"},{\"n\":3,\"d\":\"\",\"se\":\"In an IP address, what does the subnet mask 255.255.255.0 indicate?\",\"sh\":\"IP एड्रेस में, सबनेट मास्क 255.255.255.0 क्या दर्शाता है?\",\"oe\":[\"Class A network\",\"Class B network\",\"Class C network\",\"Class D network\"],\"oh\":[\"क्लास A नेटवर्क\",\"क्लास B नेटवर्क\",\"क्लास C नेटवर्क\",\"क्लास D नेटवर्क\"],\"a\":2,\"ee\":\"A subnet mask of 255.255.255.0 (/24) indicates a Class C network with 24 network bits and 8 host bits.\",\"eh\":\"255.255.255.0 (/24) सबनेट मास्क क्लास C नेटवर्क को दर्शाता है, जिसमें 24 नेटवर्क बिट्स और 8 होस्ट बिट्स होते हैं।\"},{\"n\":4,\"d\":\"\",\"se\":\"Which of the following is NOT a standard type of UPS?\",\"sh\":\"इनमें से कौन सा UPS का एक मानक प्रकार नहीं है?\",\"oe\":[\"Offline UPS\",\"Online UPS\",\"Line-Interactive UPS\",\"Series UPS\"],\"oh\":[ signals to digital signals and vice versa in telecom is called:\",\"sh\":\"\",\"oe\":[\"CODEC\",\"MODEM\",\"MUX\",\"DEMUX\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"A CODEC (Coder-Decoder) converts analog audio to digital and back again.\",\"eh\":\"\"},{\"n\":21,\"d\":\"\",\"se\":\"Which type of fuse is most commonly used in industrial electrical installations?\",\"sh\":\"\",\"oe\":[\"Cartridge fuse\",\"HRC fuse\",\"Rewirable fuse\",\"Drop-out fuse\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"High Rupturing Capacity (HRC) fuses are used industrially due to their ability to safely clear high fault currents.\",\"eh\":\"\"},{\"n\":22,\"d\":\"\",\"se\":\"What is the maximum number of hosts in a Class C network?\",\"sh\":\"\",\"oe\":[\"254\",\"65534\",\"16777214\",\"126\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"8 bits for hosts = 2⁸ (256) minus 2 (network ID and broadcast ID) = 254.\",\"eh\":\"\"},{\"n\":23,\"d\":\"\",\"se\":\"In a CCTV system, what does NVR stand for?\",\"sh\":\"\",\"oe\":[\"Network Video Recorder\",\"National Video Recorder\",\"Network Visual Recorder\",\"Non-Volatile Recorder\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":0,\"ee\":\"An NVR records video streams from IP cameras over an Ethernet network.\",\"eh\":\"\"},{\"n\":24,\"d\":\"\",\"se\":\"What is the frequency range of the 5 GHz Wi-Fi band?\",\"sh\":\"\",\"oe\":[\"2.4 - 2.4835 GHz\",\"5.15 - 5.825 GHz\",\"5 - 6 GHz\",\"900 MHz\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"The 5 GHz Wi-Fi band occupies the 5.15 GHz to 5.825 GHz spectrum.\",\"eh\":\"\"},{\"n\":25,\"d\":\"\",\"se\":\"Which type of optical fibre has a larger core diameter?\",\"sh\":\"\",\"oe\":[\"Single-mode fibre\",\"Multimode fibre\",\"Both have same core diameter\",\"Plastic fibre\"],\"oh\":[\"\",\"\",\"\",\"\"],\"a\":1,\"ee\":\"Multimode has a core diameter of 50 µm or 62.5 µm, while single-mode is 8-10 µm.\",\"eh\":\"\"},{\"n\":32,\"d\":\"\",\"se\":\"In the T568B standard for a 10/100Base-T network, which pins are used for transmitting data?\",\"sh\":\"10/100Base-T नेटवर्क के लिए T568B मानक में डेटा ट्रांसमिट (Transmit) करने के लिए किन पिनों का उपयोग किया जाता है?\",\"oe\":[\"Pins 1 and 2\",\"Pins 3 and 6\",\"Pins 4 and 5\",\"Pins 7 and 8\"],\"oh\":[\"पिन 1 और 2\",\"पिन 3 और 6\",\"पिन 4 और 5\",\"पिन 7 और 8\"],\"a\":0,\"ee\":\"In 10/100 Ethernet, Pins 1 and 2 are TX (Transmit), while Pins 3 and 6 are RX (Receive).\",\"eh\":\"10/100 ईथरनेट में पिन 1 और 2 ट्रांसमिट (TX) के लिए और 3 और 6 रिसीव (RX) के लिए होते हैं।\"},{\"n\":61,\"d\":\"\",\"se\":\"If 60% of a number is 120, what is the number?\",\"sh\":\"यदि किसी संख्या का 60% 120 है, तो वह संख्या क्या है?\",\"oe\":[\"180\",\"200\",\"220\",\"240\"],\"oh\":[\"180\",\"200\",\"220\",\"240\"],\"a\":1,\"ee\":\"0.6x = 120 → x = 120 / 0.6 = 200.\",\"eh\":\"0.6x = 120 → x = 120 / 0.6 = 200.\"},{\"n\":62,\"d\":\"\",\"se\":\"A train travels 240 km in 4 hours. What is its speed in m/s?\",\"sh\":\"एक ट्रेन 4 घंटे में 240 किमी की यात्रा करती है। m/s में इसकी गति क्या है?\",\"oe\":[\"10 m/s\",\"15 m/s\",\"16.67 m/s\",\"20 m/s\"],\"oh\":[\"10 m/s\",\"15 m/s\",\"16.67 m/s\",\"20 m/s\"],\"a\":2,\"ee\":\"240/4 = 60 km/h. To m/s: 60 × (5/18) = 16.67 m/s.\",\"eh\":\"240/4 = 60 km/h। m/s में बदलने के लिए: 60 × (5/18) = 16.67 m/s.\"},{\"n\":81,\"d\":\"\",\"se\":\"Where is the headquarters of South Eastern Coalfields Limited (SECL) located?\",\"sh\":\"साउथ ईस्टर्न कोलफील्ड्स लिमिटेड (SECL) का मुख्यालय कहाँ स्थित है?\",\"oe\":[\"Ranchi\",\"Bilaspur\",\"Kolkata\",\"Nagpur\"],\"oh\":[\"रांची\",\"बिलासपुर\",\"कोलकाता\",\"नागपुर\"],\"a\":1,\"ee\":\"SECL's operational headquarters is located in Bilaspur, Chhattisgarh.\",\"eh\":\"\"},{\"n\":87,\"d\":\"\",\"se\":\"Which district in Chhattisgarh is widely known as the &quot;Power Capital&quot; of the state due to its massive coal mines and thermal power plants?\",\"sh\":\"छत्तीसगढ़ के किस जिले को अपनी विशाल कोयला खदानों और थर्मल पावर प्लांट के कारण राज्य की &quot;ऊर्जा राजधानी&quot; (Power Capital) के रूप में जाना जाता है?\",\"oe\":[\"Raipur\",\"Korba\",\"Bilaspur\",\"Durg\"],\"oh\":[\"रायपुर\",\"कोरबा\",\"बिलासपुर\",\"दुर्ग\"],\"a\":1,\"ee\":\"Korba houses major mines like Gevra and Kusmunda, along with NTPC and state power plants, making it the power hub of the region. (Note: Dhanbad is the overall &quot;Coal Capital of India&quot;).\",\"eh\":\"गेवरा, कुसमुंडा और दीपका जैसी विशाल खदानों के कारण कोरबा को ऊर्जा केंद्र माना जाता है।\"},{\"n\":93,\"d\":\"\",\"se\":\"What is the name of the SECL headquarters building?\",\"sh\":\"SECL के मुख्यालय भवन का क्या नाम है?\",\"oe\":[\"Coal Bhawan\",\"SECL Bhawan\",\"Urja Bhawan\",\"Vidyut Bhawan\"],\"oh\":[\"कोल भवन (Coal Bhawan)\",\"एसईसीएल भवन (SECL Bhawan)\",\"ऊर्जा भवन\",\"विद्युत भवन\"],\"a\":1,\"ee\":\"SECL's headquarters is known as SECL Bhawan. &quot;Coal Bhawan&quot; is the CIL central headquarters in Kolkata.\",\"eh\":\"कोल इंडिया लिमिटेड (CIL) का मुख्यालय 'कोल भवन' (कोलकाता) है, जबकि SECL का मुख्यालय 'SECL भवन' (बिलासपुर) है।\"},{\"n\":94,\"d\":\"\",\"se\":\"What is the total coal production target of CIL for the financial year 2025-26?\",\"sh\":\"वित्तीय वर्ष 2025-26 के लिए कोल इंडिया लिमिटेड (CIL) का कुल कोयला उत्पादन लक्ष्य क्या है?\",\"oe\":[\"500 MT\",\"600 MT\",\"780 MT\",\"1000 MT (1 Billion Tonnes)\"],\"oh\":[\"500 MT\",\"600 MT\",\"780 MT\",\"1000 MT (1 बिलियन टन)\"],\"a\":3,\"ee\":\"The Ministry of Coal established a 1 Billion Tonnes (1000 MT) production target for CIL to achieve by FY 2025-26 to ensure energy security.\",\"eh\":\"कोयला मंत्रालय ने ऊर्जा सुरक्षा सुनिश्चित करने के लिए 2025-26 तक 1 बिलियन टन (1000 MT) का लक्ष्य निर्धारित किया है।\"},{\"n\":96,\"d\":\"\",\"se\":\"Who is the current Chairman-cum-Managing Director of Coal India Limited (as of recent appointments)?\",\"sh\":\"कोल इंडिया लिमिटेड (CIL) के वर्तमान अध्यक्ष-सह-प्रबंध निदेशक (CMD) कौन हैं?\",\"oe\":[\"Pramod Agrawal\",\"S. K. Srivastava\",\"P. M. Prasad\",\"A. K. Jha\"],\"oh\":[\"प्रमोद अग्रवाल\",\"एस. के. श्रीवास्तव\",\"पी. एम. प्रसाद\",\"ए. के. झा\"],\"a\":2,\"ee\":\"Shri P.M. Prasad assumed the charge of CMD, Coal India Limited, in July 2023.\",\"eh\":\"पी. एम. प्रसाद ने जुलाई 2023 में CMD का पदभार संभाला था।\"},{\"n\":98,\"d\":\"\",\"se\":\"What is the approximate percentage share of SECL in CIL's total coal production?\",\"sh\":\"CIL के कुल कोयला उत्पादन में SECL का लगभग प्रतिशत हिस्सा कितना है?\",\"oe\":[\"10%\",\"15%\",\"20%\",\"25%\"],\"oh\":[\"10%\",\"15%\",\"20%\",\"25%\"],\"a\":3,\"ee\":\"SECL is the largest coal-producing subsidiary, historically contributing around 24-25% of Coal India's total production.\",\"eh\":\"SECL सबसे अधिक कोयला उत्पादन करने वाली सहायक कंपनी है, जो CIL के कुल उत्पादन का लगभग 24-25% हिस्सा देती है।\"},{\"n\":99,\"d\":\"\",\"se\":\"The Narmada River flows through which of these states?\",\"sh\":\"नर्मदा नदी इनमें से किन राज्यों से होकर बहती है?\",\"oe\":[\"Madhya Pradesh, Maharashtra, and Gujarat\",\"Madhya Pradesh and Chhattisgarh\",\"Madhya Pradesh, Rajasthan, and Gujarat\",\"Only Gujarat\"],\"oh\":[\"मध्य प्रदेश, महाराष्ट्र, और गुजरात\",\"मध्य प्रदेश और छत्तीसगढ़\",\"मध्य प्रदेश, राजस्थान, और गुजरात\",\"केवल गुजरात\"],\"a\":0,\"ee\":\"Originating in Amarkantak (MP), the Narmada flows westwards through MP, forms a border between Maharashtra and MP, and flows into Gujarat. It does not flow through Chhattisgarh.\",\"eh\":\"अमरकंटक (MP) से निकलकर यह मध्य प्रदेश, महाराष्ट्र सीमा और गुजरात से होकर बहती है। यह छत्तीसगढ़ से नहीं गुजरती।\"},{\"n\":100,\"d\":\"\",\"se\":\"Which subsidiary of Coal India Limited is headquartered in Nagpur?\",\"sh\":\"कोल इंडिया लिमिटेड की किस अनुषंगी (Subsidiary) कंपनी का मुख्यालय नागपुर में है?\",\"oe\":[\"SECL\",\"WCL\",\"NCL\",\"MCL\"],\"oh\":[\"SECL\",\"WCL (Western Coalfields Limited)\",\"NCL\",\"MCL\"],\"a\":1,\"ee\":\"Western Coalfields Limited (WCL) is headquartered in Nagpur, Maharashtra.\",\"eh\":\"वेस्टर्न कोलफील्ड्स लिमिटेड (WCL) का मुख्यालय नागपुर, महाराष्ट्र में है।\"}],\"sub\":\"36 questions · 29 bilingual\"},{\"id\":\"hp2\",\"num\":2,\"name\":\"High Probability Paper 2\",\"q\":[{\"n\":1,\"d\":\"\",\"se\":\"Image-based: The diagram shows a fibre optic connector with a push-pull coupling and a 2.5 mm ferrule. Which connector type is this?\",\"sh\":\"चित्र-आधारित: चित्र में 2.5 mm फेरूल (ferrule) और पुश-पुल (push-pull) लॉकिंग वाला एक फाइबर ऑप्टिक कनेक्टर दिखाया गया है। यह किस प्रकार का कनेक्टर है?\",\"oe\":[\"ST\",\"SC\",\"LC\",\"FC\"],\"oh\":[\"ST\",\"SC\",\"LC\",\"FC\"],\"a\":1,\"ee\":\"SC (Subscriber Connector/Standard Connector) has a push-pull locking mechanism and a 2.5 mm ferrule. ST uses a bayonet twist-lock, and LC is a small form-factor with a 1.25 mm ferrule.\",\"eh\":\"SC (सब्सक्राइबर कनेक्टर) में पुश-पुल लॉकिंग तंत्र और 2.5 मिमी फेरूल होता है। LC का आकार छोटा (1.25 मिमी) होता है।\"},{\"n\":2,\"d\":\"\",\"se\":\"Which operating system is open-source and widely used in telecom servers?\",\"sh\":\"टेलीकॉम सर्वर में व्यापक रूप से उपयोग किया जाने वाला ओपन-सोर्स ऑपरेटिंग सिस्टम (OS) कौन सा है?\",\"oe\":[\"Windows 10\",\"macOS\",\"Linux\",\"Unix\"],\"oh\":[\"Windows 10\",\"macOS\",\"Linux\",\"Unix\"],\"a\":2,\"ee\":\"Linux is an open-source operating system that dominates server and telecom infrastructure environments due to its stability and security.\",\"eh\":\"Linux एक ओपन-सोर्स OS है जो अपनी स्थिरता और सुरक्षा के कारण सर्वर वातावरण में हावी है।\"},{\"n\":3,\"d\":\"\",\"se\":\"What is the primary function of an inverter in a power backup system?\",\"sh\":\"पावर बैकअप सिस्टम में इन्वर्टर (Inverter) का मुख्य कार्य क्या है?\",\"oe\":[\"Converts AC to DC\",\"Converts DC to AC\",\"Steps up voltage only\",\"Steps down voltage only\"],\"oh\":[\"AC को DC में बदलना\",\"DC को AC में बदलना\",\"केवल वोल्टेज बढ़ाना\",\"केवल वोल्टेज कम करना\"],\"a\":1,\"ee\":\"An inverter converts Direct Current (DC) from a battery into Alternating Current (AC) to run standard electrical appliances.\",\"eh\":\"इन्वर्टर बैटरी से मिलने वाले डायरेक्ट करंट (DC) को अल्टरनेटिंग करंट (AC) में बदलता है।\"},{\"n\":4,\"d\":\"\",\"se\":\"In pipe earthing, the earth electrode (pipe) is typically made of:\",\"sh\":\"पाइप अर्थिंग (Pipe Earthing) में, अर्थ इलेक्ट्रोड (पाइप) आमतौर पर किसका बना होता है?\",\"oe\":[\"Copper\",\"Galvanised Iron (GI)\",\"Aluminium\",\"Brass\"],\"oh\":[\"तांबा (Copper)\",\"गैल्वेनाइज्ड आयरन (GI)\",\"एल्युमिनियम\",\"पीतल (Brass)\"],\"a\":1,\"ee\":\"GI pipe is commonly used for pipe earthing due to its corrosion resistance, mechanical strength, and cost-effectiveness. Copper is typically used for plate earthing.\",\"eh\":\"संक्षारण (corrosion) प्रतिरोध और मजबूती के कारण GI पाइप का उपयोग किया जाता है।\"},{\"n\":5,\"d\":\"\",\"se\":\"Which instrument is specifically used to measure the earth pit resistance?\",\"sh\":\"अर्थ पिट (Earth pit) के प्रतिरोध को मापने के लिए विशेष रूप से किस उपकरण का उपयोग किया जाता है?\",\"oe\":[\"Megger\",\"Earth Tester\",\"Multimeter\",\"Tong Tester\"],\"oh\":[\"मेगर (Megger)\",\"अर्थ टेस्टर (Earth Tester)\",\"मल्टीमीटर\",\"टोंग टेस्टर\"],\"a\":1,\"ee\":\"An Earth Tester (using the fall-of-potential method) is designed to measure the resistance of an earth electrode in the soil. A Megger measures insulation resistance.\",\"eh\":\"अर्थ टेस्टर का उपयोग पृथ्वी (मिट्टी) के प्रतिरोध को मापने के लिए किया जाता है, जबकि मेगर इंसुलेशन मापता है।\"},{\"n\":6,\"d\":\"\",\"se\":\"What is the typical diameter of a copper drop wire used for last-mile telephone connections?\",\"sh\":\"टेलीफोन कनेक्शन (अंतिम छोर) के लिए उपयोग किए जाने वाले ड्रॉप वायर (Drop wire) का सामान्य व्यास (diameter) क्या होता है?\",\"oe\":[\"0.4 mm\",\"0.5 mm\",\"0.6 mm\",\"0.8 mm\"],\"oh\":[\"0.4 मिमी\",\"0.5 मिमी\",\"0.6 मिमी\",\"0.8 मिमी\"],\"a\":2,\"ee\":\"Standard telecom drop wire (used from the distribution point to the subscriber's premises) typically uses 0.6 mm (or sometimes 0.9 mm) copper conductors.\",\"eh\":\"दूरसंचार ड्रॉप वायर में आमतौर पर 0.6 मिमी के तांबे के कंडक्टर का उपयोग किया जाता है।\"},{\"n\":7,\"d\":\"\",\"se\":\"In a DC-DC converter (used in SMPS), the switching frequency is typically in the range of:\",\"sh\":\"SMPS में उपयोग होने वाले DC-DC कन्वर्टर की स्विचिंग फ्रीक्वेंसी आमतौर पर किस रेंज में होती है?\",\"oe\":[\"50 Hz\",\"100 Hz\",\"20 kHz to 1 MHz\",\"1 GHz\"],\"oh\":[\"50 Hz\",\"100 Hz\",\"20 kHz से 1 MHz\",\"1 GHz\"],\"a\":2,\"ee\":\"SMPS DC-DC converters operate at high frequencies (above human hearing range) to drastically reduce the size of transformers and capacitors.\",\"eh\":\"ट्रांसफार्मर के आकार को छोटा करने के लिए उच्च आवृत्ति (मानव श्रवण सीमा से ऊपर) का उपयोग किया जाता है।\"},{\"n\":8,\"d\":\"\",\"se\":\"Image-based: A 4-pair UTP cable is arranged in the following colour sequence left-to-right: White-Orange, Orange, White-Green, Blue, White-Blue, Green, White-Brown, Brown. Which wiring standard is this?\",\"sh\":\"चित्र-आधारित: एक 4-पेयर UTP केबल का रंग क्रम (बाएं से दाएं) इस प्रकार है: सफेद-नारंगी, नारंगी, सफेद-हरा, नीला, सफेद-नीला, हरा, सफेद-भूरा, भूरा। यह कौन सा वायरिंग मानक है?\",\"oe\":[\"T568A\",\"T568B\",\"10Base-T\",\"100Base-FX\"],\"oh\":[\"T568A\",\"T568B\",\"10Base-T\",\"100Base-FX\"],\"a\":1,\"ee\":\"T568B pinout is: 1=W-O, 2=O, 3=W-G, 4=Blue, 5=W-Blue, 6=Green, 7=W-Brown, 8=Brown. T568A starts with White-Green.\",\"eh\":\"यह T568B पिनआउट का मानक रंग कोड है।\"},{\"n\":9,\"d\":\"\",\"se\":\"Which tool is used to attach RJ-45 connectors onto the ends of UTP cables?\",\"sh\":\"UTP केबल के सिरों पर RJ-45 कनेक्टर लगाने के लिए किस टूल का उपयोग किया जाता है?\",\"oe\":[\"Soldering iron\",\"Crimping tool\",\"Wire stripper\",\"Punch-down tool\"],\"oh\":[\"सोल्डरिंग आयरन\",\"क्रिम्पिंग टूल (Crimping tool)\",\"वायर स्ट्रिपर\",\"पंच-डाउन टूल\"],\"a\":1,\"ee\":\"A crimping tool pushes the metal contacts of the RJ-45 connector into the wire conductors and secures the cable jacket.\",\"eh\":\"\"},{\"n\":10,\"d\":\"\",\"se\":\"What is the main advantage of using a UPS with a &quot;Pure Sine Wave&quot; output?\",\"sh\":\"&quot;प्योर साइन वेव&quot; (Pure Sine Wave) आउटपुट वाले UPS का उपयोग करने का मुख्य ल
